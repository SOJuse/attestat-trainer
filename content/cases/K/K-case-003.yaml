id: K-case-003
topic: disciplinarnaya-i-materialnaya-otvetstvennost
title: Выговор учителю за опоздание
intro: >-
  В государственной школе Москвы учитель химии работает шестой год, взысканий у него не было. В школе есть
  выборный орган первичной профсоюзной организации (профком) и комиссия по трудовым спорам. 15 октября учитель
  без уважительной причины опоздал на первый урок на 25 минут: проспал. Директор затребовал у него письменное
  объяснение и 22 октября приказом объявил выговор, в тот же день учитель расписался в ознакомлении.
steps:
  - change: ''
    type: input
    difficulty: 1
    question: >-
      Учитель считает выговор слишком строгим и 1 ноября подал заявление в комиссию по трудовым спорам.
      Председатель комиссии предлагает назначить заседание на конец месяца. В течение какого срока со дня
      подачи заявления комиссия обязана рассмотреть спор? Ответ в календарных днях.
    answer: 10
    unit: календарных дней
    explanation: >-
      Взыскание можно обжаловать в государственную инспекцию труда и (или) в органы по рассмотрению
      индивидуальных трудовых споров (часть седьмая статьи 193), а такие споры рассматривают комиссии
      по трудовым спорам и суды (статья 382). Комиссия обязана рассмотреть спор в течение десяти календарных
      дней со дня подачи заявления (статья 387). Заседание в конце месяца опоздает: если спор не рассмотрен
      в десятидневный срок, учитель вправе перенести его в суд (статья 390).
    refs:
      - doc: tk-rf
        anchor: st-193
        quote: >-
          Дисциплинарное взыскание может быть обжаловано работником в государственную инспекцию труда и (или)
          органы по рассмотрению индивидуальных трудовых споров.
      - doc: tk-rf
        anchor: st-382
        quote: >-
          Индивидуальные трудовые споры рассматриваются комиссиями по трудовым спорам и судами, если иное
          не установлено настоящим Кодексом.
      - doc: tk-rf
        anchor: st-387
        quote: >-
          Комиссия по трудовым спорам обязана рассмотреть индивидуальный трудовой спор в течение десяти
          календарных дней со дня подачи работником заявления.
      - doc: tk-rf
        anchor: st-390
        quote: >-
          В случае, если индивидуальный трудовой спор не рассмотрен комиссией по трудовым спорам в десятидневный
          срок, работник имеет право перенести его рассмотрение в суд.
  - change: >-
      Не дожидаясь заседания комиссии, учитель 3 ноября подал жалобу на выговор в государственную инспекцию
      труда, в суд он не обращался. Председатель комиссии говорит директору, что инспекция должна подождать,
      пока комиссия не решит спор.
    type: single
    difficulty: 2
    question: Как вправе поступить государственный инспектор труда? Выберите один вариант.
    options:
      - text: Рассмотреть жалобу и при очевидном нарушении выдать школе обязательное для исполнения предписание
        correct: true
        why: >-
          Инспектор может выдать обязательное предписание и по вопросу, который ещё рассматривает комиссия
          по трудовым спорам. Исключение закон делает для исков, принятых судом, и вопросов, по которым есть
          решение суда.
      - text: Отложить жалобу до решения комиссии, потому что один спор не рассматривают два органа сразу
        correct: false
        why: >-
          Статья 357 прямо допускает предписание по вопросу, который находится на рассмотрении комиссии,
          поэтому ждать её решения инспектор не обязан.
      - text: Рассмотреть жалобу и при очевидном нарушении выдать предписание, обязательное только после решения суда
        correct: false
        why: >-
          Закон называет такое предписание подлежащим обязательному исполнению и не ставит это в зависимость
          от суда. Школа лишь вправе обжаловать его в суд в течение десяти дней со дня получения.
      - text: Вернуть жалобу, потому что выговор обжалуют либо в комиссию, либо в инспекцию труда
        correct: false
        why: >-
          Часть седьмая статьи 193 говорит об инспекции «и (или)» органах по трудовым спорам, значит,
          обратиться можно в оба органа.
    explanation: >-
      Часть седьмая статьи 193 позволяет обжаловать взыскание в государственную инспекцию труда и (или)
      в органы по рассмотрению индивидуальных трудовых споров, поэтому учитель вправе обратиться и в комиссию,
      и в инспекцию. Если вопрос уже рассматривает комиссия, инспектор при выявлении очевидного нарушения вправе
      выдать работодателю предписание, обязательное для исполнения (статья 357). Исключение сделано для исков,
      принятых к рассмотрению судом, и вопросов, по которым есть решение суда. Школа может обжаловать такое
      предписание в суд в течение десяти дней со дня его получения.
    refs:
      - doc: tk-rf
        anchor: st-193
        quote: >-
          Дисциплинарное взыскание может быть обжаловано работником в государственную инспекцию труда и (или)
          органы по рассмотрению индивидуальных трудовых споров.
      - doc: tk-rf
        anchor: st-382
        quote: >-
          Индивидуальные трудовые споры рассматриваются комиссиями по трудовым спорам и судами, если иное
          не установлено настоящим Кодексом.
      - doc: tk-rf
        anchor: st-357
        quote: >-
          по вопросу, находящемуся на рассмотрении соответствующего органа по рассмотрению индивидуального
          или коллективного трудового спора (за исключением исков, принятых к рассмотрению судом, или вопросов,
          по которым имеется решение суда)
      - doc: tk-rf
        anchor: st-357
        quote: >-
          государственный инспектор труда при выявлении очевидного нарушения трудового законодательства
          или иных нормативных правовых актов, содержащих нормы трудового права, имеет право выдать
          работодателю предписание, подлежащее обязательному исполнению
      - doc: tk-rf
        anchor: st-357
        quote: >-
          Данное предписание может быть обжаловано работодателем в суд в течение десяти дней со дня его
          получения работодателем или его представителем.
  - change: >-
      Комиссия отказала учителю, инспектор очевидного нарушения не нашёл. В апреле заместитель директора
      по учебной работе, которому учитель непосредственно подчиняется, и профком письменно попросили директора
      снять выговор досрочно: с октября учитель ни разу не опоздал.
    type: multiple
    difficulty: 2
    question: Что верно о досрочном снятии выговора? Отметьте все верные варианты.
    options:
      - text: Директор вправе снять выговор, хотя комиссия признала его законным
        correct: true
        why: >-
          Статья 194 разрешает снять взыскание до истечения года со дня его применения и не делает
          исключения для взысканий, которые проверяла комиссия.
      - text: Завуч может ходатайствовать о снятии как непосредственный руководитель учителя
        correct: true
        why: >-
          Ходатайство непосредственного руководителя работника прямо названо среди оснований досрочного
          снятия взыскания.
      - text: Директор вправе отказать, ходатайства не обязывают его снимать выговор
        correct: true
        why: >-
          Закон говорит, что работодатель имеет право снять взыскание, а не обязан это сделать, поэтому
          решение остаётся за директором.
      - text: Директор вправе снять выговор досрочно не раньше чем через полгода после приказа
        correct: false
        why: >-
          Такого срока в статье 194 нет: снять взыскание можно в любой момент до истечения года
          со дня его применения.
      - text: Ходатайство профкома директор обязан удовлетворить, ведь это представительный орган работников
        correct: false
        why: >-
          Ходатайство представительного органа работников названо как повод, по которому работодатель
          вправе снять взыскание. Обязанности снять его норма не устанавливает.
    explanation: >-
      Часть вторая статьи 194 разрешает работодателю до истечения года со дня применения взыскания снять его
      по собственной инициативе, по просьбе самого работника, по ходатайству его непосредственного руководителя
      или представительного органа работников. Это право, а не обязанность: директор может согласиться
      с ходатайствами завуча и профкома или отказать. Других условий, например минимального срока или согласия
      комиссии, норма не ставит, поэтому решение комиссии по спору снятию не мешает.
    refs:
      - doc: tk-rf
        anchor: st-194
        quote: >-
          Работодатель до истечения года со дня применения дисциплинарного взыскания имеет право снять его
          с работника по собственной инициативе, просьбе самого работника, ходатайству его непосредственного
          руководителя или представительного органа работников.
  - change: >-
      Директор в досрочном снятии отказал и снимать выговор не собирается. В мае он с юристом
      заранее разбирает, как поступить, если осенью учитель снова нарушит дисциплину. Каждый случай
      рассматривается отдельно: кроме октябрьского опоздания и нарушения, названного в случае,
      других нарушений у учителя нет, и директор узнаёт о нарушении в тот же день.
    type: matching
    difficulty: 3
    question: Сопоставьте случай и самое строгое взыскание, которое закон допускает в этом случае.
    pairs:
      - left: 15 сентября учитель без уважительной причины опоздал на урок на 20 минут
        right: Увольнение за неоднократное неисполнение трудовых обязанностей
      - left: 15 ноября учитель без уважительной причины опоздал на урок на 20 минут
        right: Выговор
      - left: 15 ноября учитель без уважительной причины не вышел на работу и пропустил весь рабочий день
        right: Увольнение за прогул
      - left: >-
          15 сентября учитель опоздал на урок на 20 минут, потому что по распоряжению завуча отводил
          заболевшего ученика к медсестре
        right: 'Никакое: дисциплинарного проступка нет'
    explanation: >-
      По пункту 5 части первой статьи 81 увольняют за неоднократное неисполнение обязанностей без уважительных
      причин, если у работника есть дисциплинарное взыскание. Выговор объявлен 22 октября прошлого года:
      15 сентября он ещё действует, а к 15 ноября прошёл год, и учитель считается не имеющим взыскания
      (часть первая статьи 194). Поэтому за ноябрьское опоздание остаются замечание или выговор, а за прогул,
      то есть отсутствие весь рабочий день, можно уволить и без прежнего взыскания (подпункт «а» пункта 6).
      Опоздание по распоряжению завуча не проступок, потому что нет вины работника (статья 192). Выбирая меру,
      директор учитывает тяжесть проступка и обстоятельства, при которых он совершён.
    refs:
      - doc: tk-rf
        anchor: st-81
        quote: >-
          неоднократного неисполнения работником без уважительных причин трудовых обязанностей, если он имеет
          дисциплинарное взыскание
      - doc: tk-rf
        anchor: st-194
        quote: >-
          Если в течение года со дня применения дисциплинарного взыскания работник не будет подвергнут новому
          дисциплинарному взысканию, то он считается не имеющим дисциплинарного взыскания.
      - doc: tk-rf
        anchor: st-81
        quote: >-
          прогула, то есть отсутствия на рабочем месте без уважительных причин в течение всего рабочего дня
          (смены) независимо от его (ее) продолжительности
      - doc: tk-rf
        anchor: st-192
        quote: >-
          работодатель имеет право применить следующие дисциплинарные взыскания: 1) замечание; 2) выговор;
          3) увольнение по соответствующим основаниям.
      - doc: tk-rf
        anchor: st-192
        quote: >-
          К дисциплинарным взысканиям, в частности, относится увольнение работника по основаниям,
          предусмотренным пунктами 5, 6, 9 или 10 части первой статьи 81
      - doc: tk-rf
        anchor: st-192
        quote: >-
          неисполнение или ненадлежащее исполнение работником по его вине возложенных на него трудовых
          обязанностей
      - doc: tk-rf
        anchor: st-192
        quote: >-
          При наложении дисциплинарного взыскания должны учитываться тяжесть совершенного проступка
          и обстоятельства, при которых он был совершен.
    trap:
      kind: wording
      note: >-
        Опоздания 15 сентября и 15 ноября одинаковые, но выговор объявлен 22 октября прошлого года: в сентябре
        он ещё действует, а в ноябре год со дня его применения уже прошёл.
