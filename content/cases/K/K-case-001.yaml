id: K-case-001
topic: bolnichnyj-materinstvo-i-garantii
title: Воспитатель в отпуске по уходу за ребёнком
intro: >-
  В школе есть дошкольные группы. Воспитатель одной из них после отпуска по беременности и родам
  ушла в отпуск по уходу за ребёнком до трёх лет. На время её отсутствия школа приняла другого
  воспитателя по срочному трудовому договору, заключённому на время исполнения обязанностей
  отсутствующего работника.
steps:
  - change: ''
    type: input
    difficulty: 1
    question: >-
      Ребёнку год и два месяца. Воспитатель хочет вернуться на работу на полставки и не потерять
      пособие по уходу за ребёнком. Если она выйдет на полставки сейчас, до какого возраста ребёнка
      за ней сохранится право на пособие? Ответ в месяцах.
    answer: 18
    unit: месяцев
    explanation: >-
      Ежемесячное пособие по уходу за ребёнком платят до полутора лет ребёнка, то есть до 18 месяцев
      (часть 1 статьи 11.1 закона № 255-ФЗ). Если женщина раньше выходит из отпуска на работу, в том числе
      на неполное время, право на пособие за ней сохраняется (часть третья статьи 256 ТК РФ). Ребёнку год
      и два месяца, значит, пособие ей будут платить ещё четыре месяца.
    refs:
      - doc: tk-rf
        anchor: st-256
        quote: >-
          выходят на работу (в том числе на условиях неполного рабочего времени, работы на дому
          или дистанционной работы) из отпуска по уходу за ребенком до достижения им возраста полутора лет
      - doc: fz-255
        anchor: st-11-1
        quote: со дня предоставления отпуска по уходу за ребенком до достижения ребенком возраста полутора лет
  - change: >-
      Воспитатель решила пока не выходить. Когда ребёнку исполнилось два года, учредитель предложил
      сократить её ставку: работу всё равно выполняет временный воспитатель. Воспитатель замужем,
      других детей у неё нет.
    type: single
    difficulty: 2
    question: Можно ли уволить её по сокращению штата? Выберите один вариант.
    options:
      - text: Нельзя, пока ребёнку не исполнится три года
        correct: true
        why: >-
          Часть четвёртая статьи 261 запрещает увольнять по инициативе работодателя женщину
          с ребёнком до трёх лет, и сокращение штата не входит в исключения.
      - text: Можно, если за два месяца предупредить её под роспись
        correct: false
        why: >-
          Предупреждение за два месяца нужно при обычном сокращении. Женщину с ребёнком до трёх лет
          по этому основанию увольнять запрещено.
      - text: Можно, но только после её выхода из отпуска
        correct: false
        why: Запрет связан с возрастом ребёнка, а не с отпуском, и действует после выхода на работу тоже.
      - text: Можно, если согласен выборный орган профсоюза
        correct: false
        why: Согласие профсоюза запрет не снимает, такого исключения в норме нет.
      - text: Нельзя без её письменного согласия на сокращение
        correct: false
        why: >-
          Сокращение остаётся увольнением по инициативе работодателя, и согласие работницы
          этот запрет не снимает.
    explanation: >-
      Часть четвёртая статьи 261 не допускает расторжения договора по инициативе работодателя
      с женщиной, у которой ребёнок младше трёх лет. Исключения перечислены: ликвидация организации
      (пункт 1 части первой статьи 81), основания по пунктам с 5 по 8, 10 и 11 той же части и пункт 2
      статьи 336. Сокращение штата, пункт 2 части первой статьи 81, в этот перечень не входит.
      То, что работу пока выполняет временный воспитатель, значения не имеет.
    refs:
      - doc: tk-rf
        anchor: st-261
        quote: Расторжение трудового договора с женщиной, имеющей ребенка в возрасте до трех лет
      - doc: tk-rf
        anchor: st-261
        quote: >-
          по инициативе работодателя не допускается (за исключением увольнения по основаниям,
          предусмотренным пунктами 1, 5 - 8, 10 или 11 части первой статьи 81 или пунктом 2 статьи 336
          настоящего Кодекса)
      - doc: tk-rf
        anchor: st-81
        quote: сокращения численности или штата работников организации, индивидуального предпринимателя
  - change: >-
      Сокращение не состоялось. Когда ребёнку исполнилось два года и три месяца, воспитатель написала
      заявление, что прерывает отпуск и выходит на работу с 1 марта. Временный воспитатель к этому
      времени беременна и принесла медицинскую справку.
    type: multiple
    difficulty: 3
    question: Как директору поступить с временным воспитателем? Отметьте все верные варианты.
    options:
      - text: Предложить ей все вакансии в данной местности, подходящие ей по здоровью
        correct: true
        why: >-
          Часть третья статьи 261 обязывает предлагать беременной все такие вакансии, которые
          есть у работодателя в данной местности.
      - text: Предлагать ей и нижестоящие, и нижеоплачиваемые должности
        correct: true
        why: >-
          Норма прямо называет не только работу по квалификации, но и вакантную нижестоящую
          должность или нижеоплачиваемую работу.
      - text: Если перевод невозможен, уволить в связи с истечением срока договора
        correct: true
        why: >-
          Для договора на время отсутствующего работника часть третья статьи 261 допускает такое
          увольнение, если перевести беременную нельзя или она не согласна.
      - text: По её заявлению обязательно продлить договор до конца беременности
        correct: false
        why: >-
          Обязательное продление из части второй статьи 261 не действует для договора на время
          отсутствующего работника: для него часть третья предусматривает перевод или увольнение.
      - text: Уволить её в день выхода воспитателя, ничего ей не предлагая
        correct: false
        why: >-
          Договор и правда прекращается с выходом основной работницы, но беременной сначала
          нужно предложить перевод.
      - text: Не увольнять её, ведь беременных по инициативе работодателя не увольняют
        correct: false
        why: >-
          Истечение срока договора не относится к увольнению по инициативе работодателя, и часть третья
          статьи 261 такое увольнение прямо допускает.
    explanation: >-
      Договор на время отсутствующего работника прекращается с выходом этого работника на работу
      (часть третья статьи 79). Если временная работница в этот момент беременна, действует часть третья
      статьи 261: уволить её по истечении срока можно, только если невозможно с её письменного согласия
      перевести её до окончания беременности на другую работу. Поэтому директор обязан предложить ей все
      подходящие по здоровью вакансии в данной местности, включая нижестоящие и нижеоплачиваемые.
      Продлевать договор до конца беременности, как при обычном срочном договоре, он не обязан.
    refs:
      - doc: tk-rf
        anchor: st-261
        quote: >-
          Допускается увольнение женщины в связи с истечением срока трудового договора в период ее
          беременности, если трудовой договор был заключен на время исполнения обязанностей
          отсутствующего работника
      - doc: tk-rf
        anchor: st-261
        quote: >-
          невозможно с письменного согласия женщины перевести ее до окончания беременности на другую
          имеющуюся у работодателя работу (как вакантную должность или работу, соответствующую
          квалификации женщины, так и вакантную нижестоящую должность или нижеоплачиваемую работу)
      - doc: tk-rf
        anchor: st-261
        quote: >-
          При этом работодатель обязан предлагать ей все отвечающие указанным требованиям вакансии,
          имеющиеся у него в данной местности.
      - doc: tk-rf
        anchor: st-79
        quote: >-
          Трудовой договор, заключенный на время исполнения обязанностей отсутствующего работника,
          прекращается с выходом этого работника на работу.
    trap:
      kind: wording
      note: >-
        Легко пропустить, что договор заключён на время отсутствующего работника: правило о продлении
        до конца беременности к нему не применяется.
  - change: >-
      Воспитатель вышла на работу 1 марта. В апреле поликлиника перенесла ей периодический медосмотр,
      и неделю она была отстранена от работы не по своей вине. Летом она по семейным обстоятельствам
      взяла отпуск без сохранения заработной платы на 20 календарных дней.
    type: matching
    difficulty: 2
    question: >-
      Кадровик считает её стаж, дающий право на ежегодный основной оплачиваемый отпуск. Сопоставьте
      период и то, как он учитывается в этом стаже.
    pairs:
      - left: Отпуск по уходу за ребёнком
        right: Не включается
      - left: Отпуск без сохранения заработной платы на 20 календарных дней
        right: Включается, но не больше 14 календарных дней
      - left: Неделя отстранения из-за перенесённого медосмотра
        right: Включается полностью
    explanation: >-
      Статья 121 перечисляет, что входит в стаж для ежегодного основного отпуска. Период отстранения
      работника, не прошедшего медосмотр не по своей вине, включается полностью. Отпуск без сохранения
      заработной платы по просьбе работника включается, но не больше 14 календарных дней за рабочий год.
      Время отпуска по уходу за ребёнком в этот стаж не входит, хотя в трудовой стаж оно засчитывается
      по статье 256.
    refs:
      - doc: tk-rf
        anchor: st-121
        quote: >-
          период отстранения от работы работника, не прошедшего обязательный медицинский осмотр
          не по своей вине
      - doc: tk-rf
        anchor: st-121
        quote: >-
          время предоставляемых по просьбе работника отпусков без сохранения заработной платы,
          не превышающее 14 календарных дней в течение рабочего года
      - doc: tk-rf
        anchor: st-121
        quote: время отпусков по уходу за ребенком до достижения им установленного законом возраста
    trap:
      kind: wording
      note: Отпуск по уходу засчитывается в трудовой стаж, но вопрос о стаже для ежегодного отпуска.
