id: K-case-002
topic: uvolnenie
title: Сокращение ставки педагога дополнительного образования
intro: >-
  Государственная школа закрывает шахматный кружок, и директор решил сократить одну из трёх ставок
  педагога дополнительного образования. Все трое работают в школе по основному месту работы. В школе
  есть первичная профсоюзная организация. Коллективный договор особых правил и гарантий при сокращении
  штата не устанавливает.
steps:
  - change: ''
    type: single
    difficulty: 1
    question: >-
      Квалификация и результаты работы у всех троих одинаковые. На полном содержании Анны Петровны двое
      нетрудоспособных родителей, детей у неё нет. Борис Олегович пришёл в школу два года назад и живёт
      с женой, у которой нет своего заработка. Вера Николаевна работает в школе пятнадцать лет, её муж
      работает инженером, сыну 12 лет. Других обстоятельств, важных для сокращения, ни у кого нет.
      Кого из них директор вправе уволить по сокращению штата? Выберите один вариант.
    options:
      - text: Веру Николаевну
        correct: true
        why: >-
          У неё один ребёнок, а не двое иждивенцев, и в семье есть другой работник с заработком. Поэтому
          при равной квалификации предпочтения у неё нет.
      - text: Бориса Олеговича
        correct: false
        why: >-
          Стаж статья 179 не учитывает. А в семье Бориса Олеговича нет других работников с самостоятельным
          заработком, и это даёт ему предпочтение.
      - text: Анну Петровну
        correct: false
        why: >-
          Семейным статья 179 называет работника с двумя или более иждивенцами, дети для этого не нужны.
          Двое нетрудоспособных родителей на её полном содержании дают ей предпочтение.
      - text: Любого из троих по выбору директора
        correct: false
        why: >-
          При равной квалификации часть вторая статьи 179 сама называет, кому отдаётся предпочтение,
          так что директор выбирает не свободно.
    explanation: >-
      Часть первая статьи 179 оставляет на работе тех, у кого выше производительность труда и квалификация.
      Здесь они у всех троих равны, поэтому решает часть вторая: предпочтение получают, среди прочих,
      семейные работники с двумя или более иждивенцами и те, в чьей семье нет других работников
      с самостоятельным заработком. Анна Петровна содержит двоих нетрудоспособных родителей, жена Бориса
      Олеговича своего заработка не имеет. У Веры Николаевны таких обстоятельств нет, а стаж статья 179
      среди оснований для предпочтения не называет.
    refs:
      - doc: tk-rf
        anchor: st-179
        quote: >-
          При сокращении численности или штата работников преимущественное право на оставление на работе
          предоставляется работникам с более высокой производительностью труда и квалификацией.
      - doc: tk-rf
        anchor: st-179
        quote: >-
          При равной производительности труда и квалификации предпочтение в оставлении на работе отдается:
          семейным - при наличии двух или более иждивенцев (нетрудоспособных членов семьи, находящихся
          на полном содержании работника
      - doc: tk-rf
        anchor: st-179
        quote: лицам, в семье которых нет других работников с самостоятельным заработком
  - change: >-
      Директор выбрал Веру Николаевну. 1 октября её персонально и под роспись предупредили, что 2 декабря
      она будет уволена по сокращению штата. Свободных должностей в школе в тот день не было, но за время
      предупреждения они появились. По медицинскому заключению Вере Николаевне противопоказана работа
      с подъёмом тяжестей.
    type: multiple
    difficulty: 2
    question: Какие из этих вакансий директор обязан ей предложить до увольнения? Отметьте все верные варианты.
    options:
      - text: Полставки педагога дополнительного образования, освободившиеся в конце октября
        correct: true
        why: >-
          Это работа по её квалификации, хоть и с меньшей оплатой. Вакансия появилась до увольнения,
          а уволить можно, только если перевести работника на имеющуюся работу невозможно.
      - text: Ставку гардеробщика, освободившуюся в середине октября
        correct: true
        why: >-
          Предлагать нужно и нижестоящие должности, которые работник может выполнять по здоровью.
          То, что ставка освободилась уже после предупреждения, обязанности не снимает.
      - text: Ставку педагога дополнительного образования в соседней школе того же учредителя, свободную с октября
        correct: false
        why: >-
          Соседняя школа сама нанимает своих работников, а норма говорит о вакансиях, которые есть
          у самого работодателя.
      - text: Ставку рабочего по обслуживанию здания с подъёмом тяжестей, освободившуюся в октябре
        correct: false
        why: >-
          Предлагается работа, которую работник может выполнять с учётом состояния здоровья, а подъём
          тяжестей ей противопоказан.
    explanation: >-
      Часть первая статьи 180 обязывает работодателя при сокращении предлагать другую имеющуюся работу
      по правилам части третьей статьи 81. Уволить можно, если перевести работника с его письменного
      согласия на имеющуюся работу невозможно, поэтому вакансии, появившиеся за время предупреждения,
      тоже нужно предложить. Предлагаются и работа по квалификации, и нижестоящие или нижеоплачиваемые
      должности, если работник может выполнять их по здоровью. Вакансии другой школы, даже с тем же
      учредителем, к вакансиям самого работодателя не относятся.
    refs:
      - doc: tk-rf
        anchor: st-180
        quote: >-
          При проведении мероприятий по сокращению численности или штата работников организации
          работодатель обязан предложить работнику другую имеющуюся работу (вакантную должность)
          в соответствии с частью третьей статьи 81 настоящего Кодекса.
      - doc: tk-rf
        anchor: st-81
        quote: >-
          Увольнение по основанию, предусмотренному пунктом 2 или 3 части первой настоящей статьи,
          допускается, если невозможно перевести работника с его письменного согласия на другую
          имеющуюся у работодателя работу
      - doc: tk-rf
        anchor: st-81
        quote: так и вакантную нижестоящую должность или нижеоплачиваемую работу
      - doc: tk-rf
        anchor: st-81
        quote: которую работник может выполнять с учетом его состояния здоровья
      - doc: tk-rf
        anchor: st-81
        quote: >-
          При этом работодатель обязан предлагать работнику все отвечающие указанным требованиям вакансии,
          имеющиеся у него в данной местности.
  - change: >-
      Вера Николаевна письменно отказалась от всех предложенных вакансий. Она член профсоюза, но в выборный
      орган первичной профсоюзной организации (профком) не входит. В начале ноября директор направил
      в профком проект приказа об её увольнении и копии документов. На четвёртый рабочий день профком
      письменно ответил, что с увольнением не согласен. На следующий день провели дополнительные
      консультации, общего согласия не достигли и составили протокол.
    type: input
    difficulty: 2
    question: >-
      Сколько рабочих дней со дня направления проекта приказа должно пройти, прежде чем директор вправе
      принять окончательное решение об увольнении? Ответ в рабочих днях.
    answer: 10
    unit: рабочих дней
    explanation: >-
      Члена профсоюза увольняют по сокращению штата с учётом мотивированного мнения выборного органа
      первичной профсоюзной организации (часть вторая статьи 82, статья 373). Профком ответил в семидневный
      срок и выразил несогласие, консультации прошли в течение трёх рабочих дней. Если общего согласия нет,
      работодатель вправе принять окончательное решение по истечении десяти рабочих дней со дня направления
      проекта приказа. Срок считается от направления проекта, поэтому быстрый ответ профкома и ранние
      консультации его не сокращают.
    refs:
      - doc: tk-rf
        anchor: st-82
        quote: >-
          Увольнение работников, являющихся членами профсоюза, по основаниям, предусмотренным пунктами 2, 3
          или 5 части первой статьи 81 настоящего Кодекса производится с учетом мотивированного мнения
          выборного органа первичной профсоюзной организации в соответствии со статьей 373 настоящего Кодекса.
      - doc: tk-rf
        anchor: st-373
        quote: >-
          При недостижении общего согласия по результатам консультаций работодатель по истечении десяти
          рабочих дней со дня направления в выборный орган первичной профсоюзной организации проекта приказа
          и копий документов имеет право принять окончательное решение
      - doc: tk-rf
        anchor: st-373
        quote: >-
          Выборный орган первичной профсоюзной организации в течение семи рабочих дней со дня получения
          проекта приказа и копий документов рассматривает этот вопрос и направляет работодателю свое
          мотивированное мнение в письменной форме.
      - doc: tk-rf
        anchor: st-373
        quote: >-
          в течение трех рабочих дней проводит с работодателем или его представителем дополнительные
          консультации, результаты которых оформляются протоколом
    trap:
      kind: wording
      note: >-
        Профком ответил и консультации прошли быстро, но десять рабочих дней считаются со дня направления
        проекта приказа, а не со дня ответа или консультаций.
  - change: >-
      Директор принял окончательное решение. Вскоре Вера Николаевна нашла работу в другой школе. Она дала
      письменное согласие на расторжение договора по сокращению штата до истечения срока предупреждения,
      и директор уволил её за неделю до даты, указанной в уведомлении. На следующий день она вышла
      на новую работу.
    type: matching
    difficulty: 3
    question: Сопоставьте выплату и то, сколько Вере Николаевне по ней положено.
    pairs:
      - left: Выходное пособие
        right: Средний месячный заработок
      - left: Дополнительная компенсация
        right: Средний заработок за оставшуюся неделю
      - left: Выплата за второй месяц со дня увольнения
        right: Ничего, ведь она сразу вышла на новую работу
    explanation: >-
      Часть третья статьи 180 позволяет с письменного согласия работника расторгнуть договор до истечения
      срока предупреждения. Тогда работнику платят дополнительную компенсацию: средний заработок,
      исчисленный пропорционально времени, оставшемуся до конца срока предупреждения, здесь за неделю.
      Основание увольнения остаётся прежним, сокращение штата, поэтому выходное пособие в размере среднего
      месячного заработка по части первой статьи 178 тоже положено. Средний заработок за второй месяц
      со дня увольнения работодатель обязан выплатить, если период трудоустройства превышает один месяц,
      а Вера Николаевна вышла на новую работу на следующий день.
    refs:
      - doc: tk-rf
        anchor: st-180
        quote: >-
          Работодатель с письменного согласия работника имеет право расторгнуть с ним трудовой договор
          до истечения срока, указанного в части второй настоящей статьи
      - doc: tk-rf
        anchor: st-180
        quote: >-
          выплатив ему дополнительную компенсацию в размере среднего заработка работника, исчисленного
          пропорционально времени, оставшемуся до истечения срока предупреждения об увольнении
      - doc: tk-rf
        anchor: st-178
        quote: >-
          либо сокращением численности или штата работников организации (пункт 2 части первой статьи 81
          настоящего Кодекса) увольняемому работнику выплачивается выходное пособие в размере среднего
          месячного заработка
      - doc: tk-rf
        anchor: st-178
        quote: В случае, если длительность периода трудоустройства работника
      - doc: tk-rf
        anchor: st-178
        quote: >-
          превышает один месяц, работодатель обязан выплатить ему средний месячный заработок за второй месяц
          со дня увольнения
    trap:
      kind: wording
      note: >-
        Работница сама попросила уйти раньше и сразу нашла работу, но основание увольнения прежнее,
        сокращение штата: выходное пособие ей положено, а новая работа отменяет только выплату за второй месяц.
