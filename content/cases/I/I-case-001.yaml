id: I-case-001
topic: operator-pd-zashchita-i-utechki
title: Список учеников в открытом доступе
intro: >-
  В четверг в 9:00 заместитель директора школы обнаружил, что файл со списком учеников, их адресами
  и телефонами родителей несколько дней лежал в открытом доступе на школьном облачном диске и его скачивали
  посторонние. Доступ сразу закрыли. Школа как оператор должна уведомить уполномоченный орган по защите
  прав субъектов персональных данных.
steps:
  - change: ''
    type: input
    difficulty: 1
    question: >-
      В течение скольких часов с момента выявления инцидента школа должна направить в этот орган первое
      уведомление о случившемся? Ответ в часах.
    answer: 24
    unit: часа
    explanation: >-
      Пункт 1 части 3.1 статьи 21 закона о персональных данных обязывает оператора в течение двадцати четырёх
      часов с момента выявления инцидента уведомить уполномоченный орган о произошедшем, о предполагаемых
      причинах и вреде и о принятых мерах.
    refs:
      - doc: fz-152
        anchor: st-21
        quote: >-
          в течение двадцати четырех часов о произошедшем инциденте, о предполагаемых причинах, повлекших нарушение
          прав субъектов персональных данных, и предполагаемом вреде, нанесенном правам субъектов персональных
          данных
  - change: >-
      Заместитель директора готовит текст первого уведомления. Внутреннее расследование только началось,
      кто виноват в ошибке с настройками доступа, пока неизвестно.
    type: multiple
    difficulty: 2
    question: Что должно войти в первое уведомление? Отметьте все верные варианты.
    options:
      - text: Сообщение о самом инциденте и его предполагаемых причинах
        correct: true
        why: Произошедший инцидент и предполагаемые причины названы в пункте 1 части 3.1 статьи 21.
      - text: Сведения о мерах, которые школа приняла, чтобы устранить последствия
        correct: true
        why: Принятые меры по устранению последствий инцидента входят в первое уведомление.
      - text: Результаты внутреннего расследования
        correct: false
        why: О результатах внутреннего расследования сообщают позже, во втором уведомлении.
      - text: Сведения о лице, которое школа уполномочила взаимодействовать с органом по этому инциденту
        correct: true
        why: Сведения о таком уполномоченном лице оператор предоставляет вместе с первым уведомлением.
      - text: Сведения о работниках, чьи действия стали причиной инцидента
        correct: false
        why: Сведения о лицах, действия которых стали причиной инцидента, предоставляют вместе с результатами расследования.
    explanation: >-
      Часть 3.1 статьи 21 закона о персональных данных делит уведомление на два этапа. Сначала оператор
      сообщает об инциденте, его предполагаемых причинах и вреде, о принятых мерах и называет лицо для
      взаимодействия. Результаты внутреннего расследования и сведения о виновных он направляет вторым
      уведомлением.
    refs:
      - doc: fz-152
        anchor: st-21
        quote: >-
          о принятых мерах по устранению последствий соответствующего инцидента, а также предоставить сведения
          о лице, уполномоченном оператором на взаимодействие с уполномоченным органом по защите прав субъектов
          персональных данных
      - doc: fz-152
        anchor: st-21
        quote: >-
          о результатах внутреннего расследования выявленного инцидента, а также предоставить сведения о лицах,
          действия которых стали причиной выявленного инцидента (при наличии)
  - change: >-
      Оба уведомления отправлены вовремя. Через две недели уполномоченный орган прислал школе запрос
      с просьбой сообщить дополнительную информацию об обработке данных учеников. Школа не успевает собрать
      её в обычный срок и направляет органу мотивированное уведомление с причинами.
    type: input
    difficulty: 2
    question: >-
      На сколько рабочих дней самое большее можно продлить срок ответа на такой запрос? Ответ в рабочих днях.
    answer: 5
    unit: рабочих дней
    explanation: >-
      По части 4 статьи 20 закона о персональных данных оператор сообщает уполномоченному органу запрошенную
      информацию в течение десяти рабочих дней с даты получения запроса. Срок можно продлить не более чем
      на пять рабочих дней, если оператор направил мотивированное уведомление с причинами продления.
    refs:
      - doc: fz-152
        anchor: st-20
        quote: >-
          Указанный срок может быть продлен, но не более чем на пять рабочих дней в случае направления оператором
          в адрес уполномоченного органа по защите прав субъектов персональных данных мотивированного уведомления
