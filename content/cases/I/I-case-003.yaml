id: I-case-003
topic: publikacii-foto-i-reputaciya
title: Победитель конкурса на странице школы
intro: >-
  Восьмиклассник победил в городском конкурсе. Школа по своей инициативе хочет опубликовать на странице
  в социальной сети его фамилию, имя и класс. Закон этого от школы не требует, поэтому нужно согласие матери
  на обработку данных, разрешённых для распространения. Мать прислала заполненную форму согласия.
steps:
  - change: ''
    type: single
    difficulty: 2
    question: >-
      Из формы, которую заполнила мать, не следует, что она согласилась именно на распространение данных
      сына. Что школа вправе делать с этими данными? Выберите один вариант.
    options:
      - text: Обрабатывать их без права распространения
        correct: true
        why: >-
          Если из согласия не следует, что субъект согласился с распространением, оператор обрабатывает
          данные без права распространения.
      - text: Опубликовать их, потому что форма согласия подписана
        correct: false
        why: 'Подписи мало: из согласия должно следовать, что человек согласился с распространением.'
      - text: Опубликовать их и удалить, если мать возразит
        correct: false
        why: Распространять данные до получения ясного согласия на это нельзя.
      - text: Немедленно уничтожить их, потому что согласие недействительно целиком
        correct: false
        why: 'Закон не требует уничтожения: такие данные оператор обрабатывает, но без права распространения.'
    explanation: >-
      Часть 4 статьи 10.1 закона о персональных данных решает этот случай прямо: если из согласия не следует,
      что субъект согласился с распространением персональных данных, оператор, которому они предоставлены,
      обрабатывает их без права распространения. Публиковать фамилию, имя и класс восьмиклассника школа пока не может.
    refs:
      - doc: fz-152
        anchor: st-10-1
        quote: >-
          такие персональные данные обрабатываются оператором, которому они предоставлены субъектом персональных
          данных, без права распространения
  - change: >-
      Мать заполнила форму заново и ясно согласилась на публикацию. При этом она указала условие: посетители страницы могут только просматривать данные сына, копировать и пересылать их нельзя. Ответственный за сайт считает,
      что условия усложняют работу, и предлагает принимать согласия только без условий.
    type: single
    difficulty: 2
    question: Может ли школа отказать матери в установлении такого запрета? Выберите один вариант.
    options:
      - text: Может, форму согласия и её условия определяет оператор
        correct: false
        why: >-
          Право установить запреты и условия принадлежит субъекту, и отказывать ему в этом оператору
          запрещено.
      - text: Может, если предложит матери взамен другую форму согласия
        correct: false
        why: Другая форма запрета на отказ не отменяет.
      - text: Не может, отказ оператора в установлении запретов и условий не допускается
        correct: true
        why: >-
          Субъект вправе установить запреты на передачу данных неограниченному кругу лиц и условия обработки,
          а отказ оператора в установлении таких запретов и условий не допускается.
      - text: Может, если в форме согласия школы нет графы для условий
        correct: false
        why: >-
          Устройство формы права субъекта не отменяет: отказ в установлении запретов и условий не допускается.
    explanation: >-
      По части 9 статьи 10.1 закона о персональных данных субъект вправе установить в согласии запреты на передачу данных оператором неограниченному кругу лиц, а также запреты и условия обработки этих данных неограниченным кругом лиц. Отказ оператора
      в установлении таких запретов и условий не допускается. Школа принимает согласие вместе с запретом.
    refs:
      - doc: fz-152
        anchor: st-10-1
        quote: >-
          Отказ оператора в установлении субъектом персональных данных запретов и условий, предусмотренных
          настоящей статьей, не допускается.
  - change: >-
      Публикация вышла. Через месяц мать направила школе требование прекратить распространение данных сына:
      в нём есть её фамилия, имя, отчество, телефон и перечень данных.
    type: single
    difficulty: 2
    question: С какого момента прекращается действие её согласия на распространение? Выберите один вариант.
    options:
      - text: С момента, когда требование поступило в школу
        correct: true
        why: Действие согласия прекращается с момента поступления оператору требования о прекращении распространения.
      - text: Через тридцать дней после того, как требование поступило в школу
        correct: false
        why: Отсрочки в тридцать дней для такого требования статья 10.1 не содержит.
      - text: С начала следующего учебного года
        correct: false
        why: С учебным годом закон прекращение согласия не связывает.
      - text: С момента, когда суд подтвердит требование матери
        correct: false
        why: 'Решение суда не нужно: распространение прекращают в любое время по требованию субъекта.'
    explanation: >-
      Часть 12 статьи 10.1 закона о персональных данных обязывает прекратить распространение данных в любое
      время по требованию субъекта. По части 13 действие согласия на обработку данных, разрешённых для
      распространения, прекращается с момента поступления такого требования оператору.
    refs:
      - doc: fz-152
        anchor: st-10-1
        quote: >-
          прекращается с момента поступления оператору требования, указанного в части 12 настоящей статьи
