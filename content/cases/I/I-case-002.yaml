id: I-case-002
topic: obrashcheniya-osobye-sluchai-i-priem
title: Жалоба на школьную столовую
intro: >-
  Отец пятиклассника направил директору государственной школы письменную жалобу: по его словам, в столовой
  детям дают остывшую еду. Обращение зарегистрировано и рассмотрено, проект ответа по существу готов.
  Директор в эти дни в отпуске, его обязанности приказом возложены на заместителя.
steps:
  - change: ''
    type: single
    difficulty: 1
    question: Кто подписывает ответ на это обращение? Выберите один вариант.
    options:
      - text: Секретарь, который готовил проект ответа
        correct: false
        why: Подготовка проекта права подписи не даёт, подписывает руководитель, должностное или уполномоченное лицо.
      - text: Заместитель, на которого приказом возложены обязанности директора
        correct: true
        why: >-
          Ответ на обращение подписывается руководителем, должностным лицом либо уполномоченным на то лицом.
          Сейчас это заместитель, исполняющий обязанности директора.
      - text: Заведующий столовой, потому что жалоба касается его работы
        correct: false
        why: Закон не связывает подпись с тем, чьей работы касается жалоба.
      - text: Сам директор, ответ подождёт его выхода из отпуска
        correct: false
        why: Ждать директора не нужно. Ответ вправе подписать должностное или уполномоченное лицо, сейчас это заместитель.
    explanation: >-
      Часть 3 статьи 10 закона о порядке рассмотрения обращений граждан называет тех, кто подписывает ответ:
      руководитель органа, должностное лицо либо уполномоченное на то лицо. Пока директор в отпуске,
      подписывает заместитель, на которого возложены его обязанности.
    refs:
      - doc: fz-59
        anchor: st-10
        quote: >-
          Ответ на обращение подписывается руководителем государственного органа или органа местного самоуправления,
          должностным лицом либо уполномоченным на то лицом.
  - change: >-
      Ответ отправлен. За три месяца отец прислал ещё три письма с тем же вопросом, и на каждое школа
      ответила по существу. Сегодня пришло пятое письмо: вопрос тот же, но к нему приложен акт санитарной
      проверки столовой, которого раньше не было. Секретарь предлагает прекратить переписку.
    type: single
    difficulty: 3
    question: Можно ли прекратить переписку с отцом по этому письму? Выберите один вариант.
    options:
      - text: Можно, на этот вопрос ему уже неоднократно отвечали по существу
        correct: false
        why: >-
          Этого мало. Прекратить переписку можно, если в очередном обращении нет новых доводов
          или обстоятельств, а здесь они есть.
      - text: Можно, если уведомить его о прекращении переписки
        correct: false
        why: Уведомление нужно, когда переписку прекращают законно. Здесь для прекращения нет условия.
      - text: Нельзя, в письме приведено новое обстоятельство, и его нужно рассмотреть
        correct: true
        why: >-
          Решение о безосновательности обращения и прекращении переписки возможно, только если в обращении
          не приводятся новые доводы или обстоятельства. Акт проверки новое обстоятельство.
      - text: Нельзя, прекращать переписку с гражданином закон запрещает при любых условиях
        correct: false
        why: Закон такое право даёт, но при условиях, которые здесь не выполнены.
    explanation: >-
      Часть 5 статьи 11 закона о порядке рассмотрения обращений граждан разрешает признать очередное обращение
      безосновательным и прекратить переписку, если на вопрос неоднократно давали письменные ответы по существу
      и в обращении нет новых доводов или обстоятельств. Отец приложил акт проверки, которого раньше не было,
      поэтому письмо рассматривают по существу.
    refs:
      - doc: fz-59
        anchor: st-11
        quote: >-
          и при этом в обращении не приводятся новые доводы или обстоятельства
    trap:
      kind: wording
      note: >-
        Письмо пятое и вопрос тот же, но к нему приложен новый документ. Прекратить переписку можно,
        только когда новых доводов и обстоятельств нет.
  - change: >-
      Школа рассмотрела пятое письмо и ответила. Отец с ответом не согласен и спрашивает у секретаря,
      куда он может пожаловаться на решение школы по его обращению.
    type: single
    difficulty: 1
    question: Что говорит об этом закон об обращениях граждан? Выберите один вариант.
    options:
      - text: Решение по обращению можно обжаловать в административном и (или) судебном порядке
        correct: true
        why: >-
          Гражданин вправе обращаться с жалобой на принятое по обращению решение в административном и (или)
          судебном порядке.
      - text: Решение по обращению можно обжаловать только в суд
        correct: false
        why: Кроме судебного, закон называет административный порядок обжалования.
      - text: Сначала нужно пожаловаться учредителю школы, в суд можно идти после его ответа
        correct: false
        why: Очерёдности закон не вводит. Административный и судебный порядок названы через «и (или)», выбирает гражданин.
      - text: Жалобу на решение рассматривает та же школа в порядке повторного обращения
        correct: false
        why: >-
          Закон называет административный и судебный порядок обжалования. Повторное письмо в ту же школу
          к ним не относится.
    explanation: >-
      Пункт 4 статьи 5 закона о порядке рассмотрения обращений граждан даёт гражданину право обращаться
      с жалобой на принятое по обращению решение или на действие, бездействие в связи с его рассмотрением
      в административном и (или) судебном порядке.
    refs:
      - doc: fz-59
        anchor: st-5
        quote: >-
          обращаться с жалобой на принятое по обращению решение или на действие (бездействие) в связи
          с рассмотрением обращения в административном и (или) судебном порядке
