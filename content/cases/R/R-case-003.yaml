id: R-case-003
topic: imushchestvo
title: Недостача на складе
intro: >-
  При инвентаризации на складе школы не нашли часть спортивного инвентаря. За склад отвечает заведующий
  хозяйством, он работает в школе двадцать лет. Договора о полной материальной ответственности с ним нет,
  по разовым документам он этот инвентарь не получал.
steps:
  - change: ''
    type: multiple
    difficulty: 2
    question: >-
      Директор хочет сразу издать распоряжение о взыскании. Что верно о действиях школы до решения
      о возмещении ущерба? Отметьте все верные варианты.
    options:
      - text: Школа обязана провести проверку, чтобы установить размер ущерба и причины его возникновения
        correct: true
        why: До решения о возмещении ущерба работодатель обязан провести такую проверку.
      - text: Для проверки школа обязана создать комиссию с участием специалистов
        correct: false
        why: Создать комиссию работодатель имеет право. Обязанности создавать её закон не вводит.
      - text: Школа обязана истребовать у заведующего хозяйством письменное объяснение
        correct: true
        why: Истребование письменного объяснения для установления причины ущерба обязательно.
      - text: Если он откажется дать объяснение, взыскивать ущерб нельзя
        correct: false
        why: При отказе или уклонении от объяснения составляют акт, взысканию это не мешает.
      - text: Он вправе знакомиться со всеми материалами проверки
        correct: true
        why: Работник и его представитель имеют право знакомиться со всеми материалами проверки и обжаловать их.
    explanation: >-
      Статья 247 Трудового кодекса обязывает работодателя до решения о возмещении ущерба провести проверку
      и истребовать у работника письменное объяснение. Комиссию для проверки он создавать вправе, но не обязан.
      Если работник отказывается от объяснения, составляют акт. Работник может знакомиться с материалами
      проверки и обжаловать их.
    refs:
      - doc: tk-rf
        anchor: st-247
        quote: >-
          До принятия решения о возмещении ущерба конкретными работниками работодатель обязан провести проверку
          для установления размера причиненного ущерба и причин его возникновения.
      - doc: tk-rf
        anchor: st-247
        quote: >-
          Для проведения такой проверки работодатель имеет право создать комиссию с участием соответствующих
          специалистов.
      - doc: tk-rf
        anchor: st-247
        quote: >-
          В случае отказа или уклонения работника от предоставления указанного объяснения составляется
          соответствующий акт.
      - doc: tk-rf
        anchor: st-247
        quote: >-
          Работник и (или) его представитель имеют право знакомиться со всеми материалами проверки и обжаловать
          их в порядке, установленном настоящим Кодексом.
  - change: >-
      Проверка идёт. По данным бухгалтерского учёта пропавший инвентарь с учётом износа стоит меньше,
      чем такой же инвентарь стоил на рынке в день, когда возник ущерб.
    type: single
    difficulty: 2
    question: По какой стоимости определяют размер ущерба? Выберите один вариант.
    options:
      - text: По стоимости в бухгалтерском учёте с учётом износа, рыночные цены в расчёт не берут
        correct: false
        why: >-
          Бухгалтерская стоимость с учётом износа служит нижней границей. Считают по рыночным ценам на день
          причинения ущерба.
      - text: По цене, за которую школа сейчас купит новый инвентарь взамен пропавшего
        correct: false
        why: Закон берёт рыночные цены на день причинения ущерба, а не цену новой покупки сегодня.
      - text: По рыночным ценам на день причинения ущерба, но не ниже стоимости в учёте с учётом износа
        correct: true
        why: >-
          Размер ущерба определяют по фактическим потерям исходя из рыночных цен на день причинения ущерба,
          но не ниже стоимости имущества по данным бухгалтерского учёта с учётом износа.
      - text: По первоначальной стоимости инвентаря в учёте, без поправки на износ
        correct: false
        why: 'Износ закон учитывает прямо: нижняя граница названа как стоимость с учётом степени износа.'
    explanation: >-
      По статье 246 Трудового кодекса размер ущерба при утрате имущества определяют по фактическим потерям
      исходя из рыночных цен, действующих в данной местности на день причинения ущерба. Он не может быть ниже
      стоимости имущества по данным бухгалтерского учёта с учётом износа. Рыночная цена здесь выше, значит,
      берут её.
    refs:
      - doc: tk-rf
        anchor: st-246
        quote: >-
          определяется по фактическим потерям, исчисляемым исходя из рыночных цен, действующих в данной местности
          на день причинения ущерба, но не ниже стоимости имущества по данным бухгалтерского учета с учетом
          степени износа этого имущества
  - change: >-
      Проверка установила: инвентарь пропал из-за небрежности заведующего хозяйством, умысла не было.
      Директор, помня о его двадцати годах безупречной работы, хочет взыскать только половину суммы, которую
      с него можно взыскать. Учредитель право школы отказываться от взыскания не ограничивал.
    type: single
    difficulty: 2
    question: Может ли директор взыскать только часть ущерба? Выберите один вариант.
    options:
      - text: Не может, ущерб с виновного работника школа обязана взыскать полностью
        correct: false
        why: >-
          Такой обязанности закон не вводит. Работодатель вправе полностью или частично отказаться от взыскания.
      - text: Может, если на это согласится профсоюзный комитет школы
        correct: false
        why: Согласия профсоюза закон не требует, решение принимает работодатель.
      - text: Может, но для этого нужно решение суда
        correct: false
        why: Суд для отказа от взыскания не нужен, это право самого работодателя.
      - text: Может, работодатель вправе частично отказаться от взыскания с учётом обстоятельств
        correct: true
        why: >-
          Работодатель имеет право с учётом конкретных обстоятельств, при которых причинён ущерб, полностью
          или частично отказаться от его взыскания с виновного работника.
    explanation: >-
      Статья 240 Трудового кодекса даёт работодателю право с учётом конкретных обстоятельств полностью или
      частично отказаться от взыскания ущерба с виновного работника. Собственник имущества может это право
      ограничить, но здесь учредитель этого не делал. Поэтому директор вправе взыскать только часть.
    refs:
      - doc: tk-rf
        anchor: st-240
        quote: >-
          Работодатель имеет право с учетом конкретных обстоятельств, при которых был причинен ущерб, полностью
          или частично отказаться от его взыскания с виновного работника.
