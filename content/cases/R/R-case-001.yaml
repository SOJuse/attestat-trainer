id: R-case-001
topic: ispolnenie-kontrakta
title: Оборудование для пищеблока
intro: >-
  Государственная школа по итогам электронного аукциона заключила контракт на поставку и монтаж оборудования
  для пищеблока. Контракт разрешает школе односторонний отказ от исполнения по основаниям Гражданского кодекса.
  Срок поставки истёк 1 апреля, оборудование привезли 21 апреля.
steps:
  - change: ''
    type: single
    difficulty: 1
    question: >-
      Поставщик извинился за задержку и просит «не раздувать историю». Как школа должна поступить с просрочкой?
      Выберите один вариант.
    options:
      - text: Направить поставщику требование об уплате пени за просрочку
        correct: true
        why: >-
          При просрочке исполнения поставщиком обязательств заказчик направляет ему требование об уплате
          неустоек.
      - text: Решить по своему усмотрению, требовать пеню или нет
        correct: false
        why: >-
          Закон не оставляет это на усмотрение заказчика: при просрочке он направляет поставщику требование
          об уплате неустоек.
      - text: Вместо пени начислить штраф в процентах от цены контракта
        correct: false
        why: Штрафы начисляют за нарушения, кроме просрочки. За просрочку начисляют пеню.
      - text: Считать контракт расторгнутым, потому что срок поставки нарушен
        correct: false
        why: Просрочка сама контракт не прекращает, для расторжения нужны соглашение, суд или односторонний отказ.
    explanation: >-
      Часть 6 статьи 34 закона о контрактной системе говорит, что при просрочке исполнения поставщиком
      обязательств заказчик направляет ему требование об уплате неустоек. За просрочку это пеня, штрафы
      назначают за остальные нарушения (часть 8 той же статьи).
    refs:
      - doc: fz-44
        anchor: st-34
        quote: >-
          заказчик направляет поставщику (подрядчику, исполнителю) требование об уплате неустоек (штрафов, пеней)
      - doc: fz-44
        anchor: st-34
        quote: >-
          за исключением просрочки исполнения поставщиком (подрядчиком, исполнителем) обязательств (в том числе
          гарантийного обязательства), предусмотренных контрактом
  - change: >-
      При монтаже выяснилось, что две плиты не той модели, что в контракте. Это второе нарушение поставщиком
      условий контракта, и оба дают школе право на односторонний отказ. Директор принял решение об отказе,
      поставщик надлежаще уведомлён. На седьмой день после уведомления он заменил плиты.
    type: single
    difficulty: 3
    question: Должна ли школа отменить своё решение об одностороннем отказе? Выберите один вариант.
    options:
      - text: Должна, нарушение устранено за десять дней
        correct: false
        why: >-
          Так было бы при первом нарушении. При повторном нарушении, которое даёт право на отказ, правило
          об обязательной отмене не применяется.
      - text: Не должна, нарушение у поставщика повторное
        correct: true
        why: >-
          Обязанность отменить не вступившее в силу решение не действует в случае повторного нарушения условий
          контракта, которые служат основанием для одностороннего отказа.
      - text: Должна, если поставщик дополнительно уплатит пеню за первую просрочку
        correct: false
        why: Уплата пени на это правило не влияет, оно зависит от того, повторное нарушение или нет.
      - text: Не должна, решение об отказе нельзя отменить ни при каких условиях
        correct: false
        why: >-
          Отмена возможна и при первом нарушении обязательна, если нарушение устранено в десятидневный срок.
    explanation: >-
      Часть 14 статьи 95 закона о контрактной системе обязывает заказчика отменить не вступившее в силу решение
      об отказе, если нарушение устранено в течение десяти дней. Но та же часть делает исключение: правило
      не применяется при повторном нарушении условий контракта, которые дают право на односторонний отказ.
      Здесь нарушение второе, поэтому школа решение отменять не обязана.
    refs:
      - doc: fz-44
        anchor: st-95
        quote: >-
          Данное правило не применяется в случае повторного нарушения поставщиком (подрядчиком, исполнителем)
          условий контракта, которые в соответствии с гражданским законодательством являются основанием
          для одностороннего отказа заказчика от исполнения контракта.
    trap:
      kind: wording
      note: >-
        Плиты заменили на седьмой день, и кажется, что решение нужно отменить. Но нарушение у поставщика
        второе, а для повторного нарушения это правило не действует.
  - change: >-
      Решение школы вступило в силу, контракт расторгнут в связи с односторонним отказом. Поставщик звонит
      директору и просит «не портить ему репутацию».
    type: single
    difficulty: 2
    question: Что школа делает со сведениями о поставщике после расторжения? Выберите один вариант.
    options:
      - text: Сама вносит запись о нём в реестр недобросовестных поставщиков в течение двух рабочих дней
        correct: false
        why: >-
          Реестр ведёт не заказчик. Школа направляет обращение в федеральный орган, уполномоченный
          на контроль в сфере закупок.
      - text: Направляет в контрольный орган обращение о включении его в реестр
        correct: true
        why: >-
          Заказчик направляет в федеральный орган исполнительной власти, уполномоченный на контроль в сфере
          закупок, обращение о включении информации о поставщике в реестр.
      - text: Ничего не направляет, если поставщик уплатил всю начисленную неустойку
        correct: false
        why: Уплата неустойки обязанности направить обращение не отменяет, закон такого исключения не называет.
      - text: Направляет сведения в реестр после того, как расторжение подтвердит суд
        correct: false
        why: >-
          Решение суда для этого не требуется: в реестр включают и тех, чей контракт расторгнут из-за
          одностороннего отказа заказчика.
    explanation: >-
      В реестр недобросовестных поставщиков включают информацию о поставщиках, которые не исполнили или
      ненадлежаще исполнили обязательства по контрактам. По части 4 статьи 104 закона о контрактной системе
      заказчик направляет обращение о включении такой информации в федеральный орган, уполномоченный на контроль в сфере закупок. При одностороннем отказе часть 16 статьи 95 даёт на это два рабочих дня после вступления решения в силу. Проверяет факты и решает вопрос о включении уже этот орган.
    refs:
      - doc: fz-44
        anchor: st-104
        quote: >-
          направляет в федеральный орган исполнительной власти, уполномоченный на осуществление контроля в сфере
          закупок, обращение о включении информации об участнике закупки или о поставщике (подрядчике,
          исполнителе) в реестр недобросовестных поставщиков
      - doc: fz-44
        anchor: st-104
        quote: >-
          а также о поставщиках (подрядчиках, исполнителях), не исполнивших или ненадлежащим образом исполнивших
          обязательства, предусмотренные контрактами
      - doc: fz-44
        anchor: st-95
        quote: >-
          Заказчик не позднее двух рабочих дней, следующих за днем вступления в силу решения заказчика
          об одностороннем отказе от исполнения контракта
