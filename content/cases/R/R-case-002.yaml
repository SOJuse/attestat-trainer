id: R-case-002
topic: platnye-uslugi
title: Платный курс подготовки к школе
intro: >-
  Государственная школа открывает платный курс подготовки к школе для дошкольников. Занятия по договору
  должны начаться 1 октября и идти до мая. Запись ведёт администратор, договоры подписывает директор.
steps:
  - change: ''
    type: single
    difficulty: 1
    question: >-
      Мать будущего ученика до подписания договора просит показать сведения о школе и о самом курсе.
      Администратор отвечает, что подробности выдают после оплаты. Как должно быть по Правилам? Выберите один вариант.
    options:
      - text: Достоверную информацию о себе и об услугах школа обязана дать до заключения договора и пока он действует
        correct: true
        why: >-
          Исполнитель обязан до заключения договора и в период его действия представлять заказчику достоверную
          информацию о себе и об оказываемых платных образовательных услугах.
      - text: Информацию об услугах школа обязана дать после оплаты первого месяца занятий
        correct: false
        why: 'Правила называют момент раньше: до заключения договора.'
      - text: Информацию об услугах школа даёт по своему усмотрению, обязанности такой нет
        correct: false
        why: Это обязанность исполнителя, а не его право.
      - text: Информацию об услугах школа обязана дать по письменному запросу, который рассматривают тридцать дней
        correct: false
        why: Письменного запроса и срока его рассмотрения этот пункт Правил не устанавливает.
    explanation: >-
      Пункт 10 Правил оказания платных образовательных услуг обязывает исполнителя до заключения договора
      и в период его действия представлять заказчику достоверную информацию о себе и об услугах, чтобы тот
      мог сделать правильный выбор. Отложить это до оплаты нельзя.
    refs:
      - doc: pp-rf-1441
        anchor: pril-1-p-10
        quote: >-
          Исполнитель обязан до заключения договора и в период его действия представлять заказчику достоверную
          информацию о себе и об оказываемых платных образовательных услугах, обеспечивающую возможность
          их правильного выбора.
  - change: >-
      Договор подписан. Школа не успела найти педагога, и занятия начались не 1 октября, а 22 октября.
    type: multiple
    difficulty: 2
    question: Что заказчик вправе сделать по своему выбору из-за нарушения срока начала занятий? Отметьте все верные варианты.
    options:
      - text: Назначить школе новый срок, в который она должна приступить к занятиям
        correct: true
        why: Назначение нового срока названо в подпункте «а» пункта 20 Правил.
      - text: Потребовать уменьшить стоимость услуг
        correct: true
        why: Требование об уменьшении стоимости названо в подпункте «в» пункта 20 Правил.
      - text: Расторгнуть договор
        correct: true
        why: Расторжение договора названо в подпункте «г» пункта 20 Правил.
      - text: Потребовать, чтобы ребёнка учили по этой программе бесплатно до конца года
        correct: false
        why: >-
          Такого требования среди последствий нарушения сроков нет. Пункт 20 называет новый срок, поручение
          услуг третьим лицам, уменьшение стоимости и расторжение.
      - text: Поручить занятия третьим лицам за разумную цену и потребовать от школы возместить расходы
        correct: true
        why: Это право названо в подпункте «б» пункта 20 Правил.
    explanation: >-
      Если исполнитель нарушил сроки начала оказания услуг, пункт 20 Правил даёт заказчику четыре возможности
      на выбор: назначить новый срок, поручить услуги третьим лицам за разумную цену с возмещением расходов,
      потребовать уменьшения стоимости или расторгнуть договор. Бесплатного обучения до конца года среди них нет.
    refs:
      - doc: pp-rf-1441
        anchor: pril-1-p-20
        quote: >-
          поручить оказать платные образовательные услуги третьим лицам за разумную цену и потребовать
          от исполнителя возмещения понесенных расходов
      - doc: pp-rf-1441
        anchor: pril-1-p-20
        quote: >-
          назначить исполнителю новый срок, в течение которого исполнитель должен приступить к оказанию платных
          образовательных услуг
  - change: >-
      Заказчик оставил договор в силе. Зимой занятия трижды проводили не по программе: вместо подготовки
      к школе детям включали мультфильмы. После каждой претензии школа обещала это исправить, но недостаток
      выявлялся снова.
    type: single
    difficulty: 3
    question: Вправе ли заказчик отказаться от исполнения договора? Выберите один вариант.
    options:
      - text: Вправе, недостаток выявляется неоднократно и потому считается существенным
        correct: true
        why: >-
          Недостаток, который выявляется неоднократно, Правила относят к существенным. При существенном
          недостатке заказчик вправе отказаться от исполнения договора.
      - text: Вправе, но сначала должен дать школе ещё один срок на устранение недостатка
        correct: false
        why: >-
          Ожидание срока нужно для обычного недостатка. При существенном недостатке право на отказ
          от такого срока не зависит.
      - text: Не вправе, отказаться от договора можно по окончании учебного года
        correct: false
        why: Правила не привязывают отказ от договора к окончанию учебного года.
      - text: Не вправе, для отказа от договора нужно согласие школы
        correct: false
        why: Отказ от исполнения договора в этом случае право заказчика, согласия исполнителя оно не требует.
    explanation: >-
      Пункт 19 Правил даёт заказчику право отказаться от исполнения договора в двух случаях: когда недостатки
      не устранены в установленный договором срок и когда обнаружен существенный недостаток услуг. Существенным
      пункт 2 Правил называет в том числе недостаток, который выявляется неоднократно. Здесь он выявлен трижды.
    refs:
      - doc: pp-rf-1441
        anchor: pril-1-p-19
        quote: >-
          Заказчик также вправе отказаться от исполнения договора, если им обнаружен существенный недостаток
          оказанных платных образовательных услуг или иные существенные отступления от условий договора.
      - doc: pp-rf-1441
        anchor: pril-1-p-2
        quote: >-
          неустранимый недостаток или недостаток, который не может быть устранен без несоразмерных расходов
          или затрат времени, или выявляется неоднократно, или проявляется вновь после его устранения
