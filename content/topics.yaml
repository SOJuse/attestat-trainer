# Темы по модулям: по ним пишутся задания и строится карта слабых мест.
#
# Тема — управленческая ситуация директора, а не название закона. У каждой темы указаны
# нормы корпуса, на которые она опирается: документ и якоря разделов из его text.md.
# ready: true ставится модулю, когда по нему готовы все задания (см. проект, раздел 5.4).
#
# Темы составлены по текстам, которые есть в корпусе. Чего в корпусе нет, перечислено
