- id: I-card-001
  topic: soglasie-na-obrabotku-pd
  front: 'Кто даёт согласие на обработку персональных данных, если человек недееспособен?'
  back: 'Его законный представитель.'
  refs:
    - doc: fz-152
      anchor: st-9
      quote: 'В случае недееспособности субъекта персональных данных согласие на обработку его персональных данных дает законный представитель субъекта персональных данных.'
  revision: 1
- id: I-card-002
  topic: soglasie-na-obrabotku-pd
  front: 'Кто даёт согласие на обработку персональных данных умершего?'
  back: 'Его наследники, если сам он при жизни такого согласия не дал.'
  refs:
    - doc: fz-152
      anchor: st-9
      quote: 'согласие на обработку его персональных данных дают наследники субъекта персональных данных, если такое согласие не было дано субъектом персональных данных при его жизни'
  revision: 1
- id: I-card-003
  topic: soglasie-na-obrabotku-pd
  front: 'Причины, по которым школа обрабатывала сведения о здоровье, отпали. Когда нужно прекратить обработку?'
  back: 'Незамедлительно, если федеральный закон не устанавливает иное.'
  refs:
    - doc: fz-152
      anchor: st-10
      quote: 'должна быть незамедлительно прекращена, если устранены причины, вследствие которых осуществлялась обработка'
  revision: 1
- id: I-card-004
  topic: soglasie-na-obrabotku-pd
  front: 'Чему равнозначно согласие в форме электронного документа, подписанного электронной подписью по закону?'
  back: 'Письменному согласию на бумаге с собственноручной подписью.'
  refs:
    - doc: fz-152
      anchor: st-9
      quote: 'Равнозначным содержащему собственноручную подпись субъекта персональных данных согласию в письменной форме на бумажном носителе признается согласие в форме электронного документа, подписанного в соответствии с федеральным законом электронной подписью'
  revision: 1
- id: I-card-005
  topic: operator-pd-zashchita-i-utechki
  front: 'Согласие отозвано, и данные для целей обработки больше не нужны. В какой срок их уничтожить?'
  back: 'Не позднее тридцати дней с даты поступления отзыва, если договор или соглашение не предусматривают иное.'
  refs:
    - doc: fz-152
      anchor: st-21
      quote: 'в срок, не превышающий тридцати дней с даты поступления указанного отзыва'
  revision: 1
- id: I-card-006
  topic: operator-pd-zashchita-i-utechki
  front: 'Человек подтвердил, что его данные в школе неточны. В какой срок школа вносит изменения?'
  back: 'В срок не больше семи рабочих дней со дня, когда он представил подтверждающие сведения.'
  refs:
    - doc: fz-152
      anchor: st-20
      quote: 'В срок, не превышающий семи рабочих дней со дня предоставления субъектом персональных данных или его представителем сведений, подтверждающих, что персональные данные являются неполными, неточными или неактуальными'
  revision: 1
- id: I-card-007
  topic: operator-pd-zashchita-i-utechki
  front: 'Может ли школа брать плату за то, что даёт человеку ознакомиться с его персональными данными?'
  back: 'Нет, возможность ознакомления оператор предоставляет безвозмездно.'
  refs:
    - doc: fz-152
      anchor: st-20
      quote: 'Оператор обязан предоставить безвозмездно субъекту персональных данных или его представителю возможность ознакомления с персональными данными'
  revision: 1
- id: I-card-008
  topic: operator-pd-zashchita-i-utechki
  front: 'Кто определяет состав мер, которыми оператор обеспечивает выполнение закона о персональных данных?'
  back: 'Сам оператор, если федеральные законы не предусматривают иное.'
  refs:
    - doc: fz-152
      anchor: st-18-1
      quote: 'Оператор самостоятельно определяет состав и перечень мер, необходимых и достаточных для обеспечения выполнения обязанностей'
  revision: 1
- id: I-card-009
  topic: publikacii-foto-i-reputaciya
  front: 'Какими двумя способами оператору передают согласие на распространение персональных данных?'
  back: 'Непосредственно или через информационную систему уполномоченного органа по защите прав субъектов персональных данных.'
  refs:
    - doc: fz-152
      anchor: st-10-1
      quote: '2) с использованием информационной системы уполномоченного органа по защите прав субъектов персональных данных.'
  revision: 1
- id: I-card-010
  topic: publikacii-foto-i-reputaciya
  front: 'Каков срок исковой давности по требованиям о не соответствующих действительности сведениях, распространённых в средствах массовой информации?'
  back: 'Один год со дня опубликования сведений.'
  refs:
    - doc: gk-rf
      anchor: st-152
      quote: 'составляет один год со дня опубликования таких сведений в соответствующих средствах массовой информации'
  revision: 1
- id: I-card-011
  topic: publikacii-foto-i-reputaciya
  front: 'С чьего согласия можно использовать изображение гражданина после его смерти?'
  back: 'С согласия детей и пережившего супруга, а если их нет, с согласия родителей.'
  refs:
    - doc: gk-rf
      anchor: st-152-1
      quote: 'его изображение может использоваться только с согласия детей и пережившего супруга, а при их отсутствии - с согласия родителей'
  revision: 1
- id: I-card-012
  topic: oficialnyy-sayt
  front: 'О ком, кроме директора, школа размещает на сайте контактные телефоны и адреса электронной почты?'
  back: 'О его заместителях и руководителях филиалов, если филиалы есть.'
  refs:
    - doc: pp-rf-1802
      anchor: pril-1-p-10
      quote: 'При размещении информации о руководителе образовательной организации, его заместителях, руководителях филиалов образовательной организации (при их наличии) указываются в том числе:'
  revision: 1
- id: I-card-013
  topic: otkrytost-i-otchetnost
  front: 'Какой штраф грозит должностному лицу за неправомерный отказ предоставить информацию, которую положено давать по федеральному закону?'
  back: 'От пяти до десяти тысяч рублей.'
  refs:
    - doc: koap-rf
      anchor: st-5-39
      quote: 'влечет наложение административного штрафа на должностных лиц в размере от пяти тысяч до десяти тысяч рублей'
  revision: 1
- id: I-card-014
  topic: otkrytost-i-otchetnost
  front: 'Какую часть общественного совета по независимой оценке качества обновляют, когда формируют его на новый срок?'
  back: 'Не менее трети состава.'
  refs:
    - doc: fz-273
      anchor: st-95-2
      quote: 'осуществляется изменение не менее трети его состава'
  revision: 1
- id: I-card-015
  topic: obrashcheniya-registraciya-i-sroki
  front: 'Сколько стоит гражданину рассмотрение его обращения?'
  back: 'Нисколько, обращения рассматривают бесплатно.'
  refs:
    - doc: fz-59
      anchor: st-2
      quote: 'Рассмотрение обращений граждан осуществляется бесплатно'
  revision: 1
- id: I-card-016
  topic: obrashcheniya-registraciya-i-sroki
  front: 'Какой электронной подписью могут подписывать ответы на обращения, поданные через единый портал?'
  back: 'Усиленной неквалифицированной электронной подписью уполномоченного лица.'
  refs:
    - doc: pp-rf-2334
      anchor: pril-1-p-16
      quote: 'Ответы на обращения и сообщения могут подписываться усиленной неквалифицированной электронной подписью уполномоченного лица органа или организации'
  revision: 1
- id: I-card-017
  topic: obrashcheniya-registraciya-i-sroki
  front: 'У кого нельзя запрашивать документы и материалы при рассмотрении обращения?'
  back: 'У судов, органов дознания и органов предварительного следствия.'
  refs:
    - doc: fz-59
      anchor: st-10
      quote: 'за исключением судов, органов дознания и органов предварительного следствия'
  revision: 1
- id: I-card-018
  topic: obrashcheniya-osobye-sluchai-i-priem
  front: 'Ответить на обращение по существу нельзя, не раскрыв охраняемую законом тайну. Что делают?'
  back: 'Сообщают гражданину, что дать ответ по существу невозможно из-за недопустимости разглашения таких сведений.'
  refs:
    - doc: fz-59
      anchor: st-11
      quote: 'сообщается о невозможности дать ответ по существу поставленного в нем вопроса в связи с недопустимостью разглашения указанных сведений'
  revision: 1
- id: I-card-019
  topic: obrashcheniya-osobye-sluchai-i-priem
  front: 'Причины, по которым на обращение не дали ответ по существу, устранены. Что вправе сделать гражданин?'
  back: 'Вновь направить обращение.'
  refs:
    - doc: fz-59
      anchor: st-11
      quote: 'гражданин вправе вновь направить обращение в соответствующий государственный орган'
  revision: 1
- id: I-card-020
  topic: elektronnaya-podpis-i-edo
  front: 'Что нужно сделать с ключом квалифицированной электронной подписи, когда срок его действия истёк?'
  back: 'Незамедлительно уничтожить.'
  refs:
    - doc: fz-63
      anchor: st-10
      quote: 'обеспечивать незамедлительное уничтожение принадлежащих им ключей электронных подписей по истечении сроков действия данных ключей'
  revision: 1
- id: I-card-021
  topic: elektronnaya-podpis-i-edo
  front: 'Какие два вида электронной подписи называет закон и на какие подвиды делится второй?'
  back: 'Простая и усиленная. Усиленная бывает неквалифицированной и квалифицированной.'
  refs:
    - doc: fz-63
      anchor: st-5
      quote: 'являются простая электронная подпись и усиленная электронная подпись'
    - doc: fz-63
      anchor: st-5
      quote: 'Различаются усиленная неквалифицированная электронная подпись (далее - неквалифицированная электронная подпись) и усиленная квалифицированная электронная подпись'
  revision: 1
