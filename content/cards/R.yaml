- id: R-card-001
  topic: goszadanie-finansy
  front: 'На какой срок могут дисквалифицировать должностное лицо за нецелевое использование бюджетных средств?'
  back: 'От одного года до трёх лет.'
  refs:
    - doc: koap-rf
      anchor: st-15-14
      quote: 'или дисквалификацию на срок от одного года до трех лет'
  revision: 1
- id: R-card-002
  topic: goszadanie-finansy
  front: 'Какой штраф грозит юридическому лицу за нецелевое использование бюджетных средств?'
  back: 'От 5 до 25 процентов суммы, использованной не по целевому назначению.'
  refs:
    - doc: koap-rf
      anchor: st-15-14
      quote: 'на юридических лиц - от 5 до 25 процентов суммы средств, полученных из бюджета бюджетной системы Российской Федерации, использованных не по целевому назначению'
  revision: 1
- id: R-card-003
  topic: goszadanie-finansy
  front: 'Кто формирует и утверждает государственное задание для бюджетного учреждения?'
  back: 'Орган, который осуществляет функции и полномочия учредителя. Задание формируют по основным видам деятельности из устава.'
  refs:
    - doc: fz-7
      anchor: st-9-2
      quote: 'формирует и утверждает соответствующий орган, осуществляющий функции и полномочия учредителя'
  revision: 1
- id: R-card-004
  topic: goszadanie-finansy
  front: 'Через какие счета бюджетное учреждение проводит операции со своими средствами?'
  back: 'Через лицевые счета в территориальном органе Федерального казначейства или в финансовом органе субъекта (муниципального образования).'
  refs:
    - doc: fz-7
      anchor: st-9-2
      quote: 'через лицевые счета, открываемые в территориальном органе Федерального казначейства или финансовом органе субъекта Российской Федерации (муниципального образования)'
  revision: 1
- id: R-card-005
  topic: sdelki-polnomochiya
  front: 'Убытки некоммерческой организации причинили несколько заинтересованных лиц. Как они отвечают?'
  back: 'Солидарно.'
  refs:
    - doc: fz-7
      anchor: st-27
      quote: 'Если убытки причинены некоммерческой организации несколькими заинтересованными лицами, их ответственность перед некоммерческой организацией является солидарной.'
  revision: 1
- id: R-card-006
  topic: sdelki-polnomochiya
  front: 'Доверенность выдана сразу двум заместителям директора. Нужно ли им действовать вместе?'
  back: 'Нет: каждый обладает полномочиями из доверенности сам. Вместе они действуют, только если так записано в доверенности.'
  refs:
    - doc: gk-rf
      anchor: st-185
      quote: 'каждый из них обладает полномочиями, указанными в доверенности, если в доверенности не предусмотрено, что представители осуществляют их совместно'
  revision: 1
- id: R-card-007
  topic: imushchestvo
  front: 'На каком праве бюджетному учреждению предоставляют земельный участок для уставных задач?'
  back: 'На праве постоянного (бессрочного) пользования.'
  refs:
    - doc: fz-7
      anchor: st-9-2
      quote: 'Земельный участок, необходимый для выполнения бюджетным учреждением своих уставных задач, предоставляется ему на праве постоянного (бессрочного) пользования.'
  revision: 1
- id: R-card-008
  topic: imushchestvo
  front: 'С какого момента у учреждения возникает право оперативного управления закреплённым имуществом?'
  back: 'С момента передачи имущества, если закон, иной правовой акт или решение собственника не устанавливают иное.'
  refs:
    - doc: gk-rf
      anchor: st-299
      quote: 'возникает у этого предприятия или учреждения с момента передачи имущества, если иное не установлено законом и иными правовыми актами или решением собственника'
  revision: 1
- id: R-card-009
  topic: imushchestvo
  front: 'Куда направляют имущество образовательной организации при её ликвидации?'
  back: 'После расчётов с кредиторами на цели развития образования в соответствии с уставом.'
  refs:
    - doc: fz-273
      anchor: st-102
      quote: 'ее имущество после удовлетворения требований кредиторов направляется на цели развития образования в соответствии с уставом образовательной организации'
  revision: 1
- id: R-card-010
  topic: platnye-uslugi
  front: 'С какого возраста отчисление ученика как дисциплинарное взыскание позволяет школе расторгнуть договор о платных услугах в одностороннем порядке?'
  back: 'С 15 лет: взыскание должно быть применено к обучающемуся, достигшему этого возраста.'
  refs:
    - doc: pp-rf-1441
      anchor: pril-1-p-22
      quote: 'применение к обучающемуся, достигшему возраста 15 лет, отчисления как меры дисциплинарного взыскания'
  revision: 1
- id: R-card-011
  topic: platnye-uslugi
  front: 'На что школа может тратить доход от платных образовательных услуг?'
  back: 'На то, что соответствует её уставным целям.'
  refs:
    - doc: fz-273
      anchor: st-101
      quote: 'Доход от оказания платных образовательных услуг используется указанными организациями в соответствии с уставными целями.'
  revision: 1
- id: R-card-012
  topic: platnye-uslugi
  front: 'Кто утверждает примерные формы договоров об образовании по основным общеобразовательным и дополнительным общеобразовательным программам?'
  back: 'Министерство просвещения Российской Федерации.'
  refs:
    - doc: pp-rf-1441
      anchor: pril-1-p-15
      quote: 'дополнительным общеобразовательным программам утверждаются Министерством просвещения Российской Федерации'
  revision: 1
- id: R-card-013
  topic: zakupki-provedenie
  front: 'При каком совокупном годовом объёме закупок заказчик обязан создать контрактную службу?'
  back: 'Если объём превышает сто миллионов рублей. Отдельное подразделение для этого создавать не обязательно.'
  refs:
    - doc: fz-44
      anchor: st-38
      quote: 'Заказчики, совокупный годовой объем закупок которых превышает сто миллионов рублей, создают контрактные службы'
  revision: 1
- id: R-card-014
  topic: zakupki-provedenie
  front: 'Какой может быть наибольшая начальная цена контракта в закупке, где участвуют только субъекты малого предпринимательства и социально ориентированные некоммерческие организации?'
  back: 'Двадцать миллионов рублей.'
  refs:
    - doc: fz-44
      anchor: st-30
      quote: 'При этом начальная (максимальная) цена контракта не должна превышать двадцать миллионов рублей'
  revision: 1
- id: R-card-015
  topic: zakupki-provedenie
  front: 'Какой метод обоснования начальной (максимальной) цены контракта закон называет приоритетным?'
  back: 'Метод сопоставимых рыночных цен (анализа рынка).'
  refs:
    - doc: fz-44
      anchor: st-22
      quote: 'Метод сопоставимых рыночных цен (анализа рынка) является приоритетным для определения и обоснования начальной (максимальной) цены контракта'
  revision: 1
- id: R-card-016
  topic: zakupki-provedenie
  front: 'Школа заключает контракт с единственным поставщиком. До какого момента можно внести эту закупку в план-график?'
  back: 'Не позднее чем за один день до дня заключения контракта.'
  refs:
    - doc: fz-44
      anchor: st-16
      quote: 'не позднее чем за один день до дня заключения контракта'
  revision: 1
- id: R-card-017
  topic: ispolnenie-kontrakta
  front: 'Какую долю ключевой ставки Банка России составляет пеня за день просрочки поставщика по контракту?'
  back: 'Одну трёхсотую ключевой ставки, действующей на дату уплаты пени.'
  refs:
    - doc: fz-44
      anchor: st-34
      quote: 'устанавливается контрактом в размере одной трехсотой действующей на дату уплаты пени ключевой ставки Центрального банка Российской Федерации от цены контракта'
  revision: 1
- id: R-card-018
  topic: ispolnenie-kontrakta
  front: 'Каким пределом ограничена общая сумма штрафов, начисленных поставщику по контракту?'
  back: 'Она не может превышать цену контракта.'
  refs:
    - doc: pp-rf-1042
      anchor: pril-1-p-11
      quote: 'Общая сумма начисленных штрафов за неисполнение или ненадлежащее исполнение поставщиком (подрядчиком, исполнителем) обязательств, предусмотренных контрактом, не может превышать цену контракта.'
  revision: 1
- id: R-card-019
  topic: ispolnenie-kontrakta
  front: 'Через какой срок сведения о поставщике исключают из реестра недобросовестных поставщиков?'
  back: 'По истечении двух лет.'
  refs:
    - doc: fz-44
      anchor: st-104
      quote: 'исключается из реестра недобросовестных поставщиков по истечении двух лет с даты'
  revision: 1
- id: R-card-020
  topic: ispolnenie-kontrakta
  front: 'За какой срок контрольный орган проверяет обращение заказчика о включении поставщика в реестр недобросовестных поставщиков?'
  back: 'В течение пяти рабочих дней с даты поступления обращения.'
  refs:
    - doc: fz-44
      anchor: st-104
      quote: 'В течение пяти рабочих дней с даты поступления обращения, указанного в части 4 настоящей статьи'
  revision: 1
- id: R-card-021
  topic: pitanie
  front: 'От чего исполнитель по контракту на питание обязан отбирать и хранить суточную пробу?'
  back: 'От каждой партии продукции, приготовленной по меню основного питания.'
  refs:
    - doc: pp-rf-498
      anchor: pril-1-p-8
      quote: 'суточную пробу от каждой партии приготовленной в соответствии с меню основного (организованного) питания пищевой продукции'
  revision: 1
- id: R-card-022
  topic: pitanie
  front: 'Исполнитель заменяет одни продукты в школьном меню другими. Чего при этом нельзя делать по типовым условиям контракта?'
  back: 'Исключать из меню горячее питание.'
  refs:
    - doc: pp-rf-498
      anchor: pril-1-p-7
      quote: 'Не допускать исключения горячего питания из меню, в том числе при замене'
  revision: 1
- id: R-card-023
  topic: pozharnaya-bezopasnost
  front: 'Из каких трёх частей состоит система обеспечения пожарной безопасности объекта?'
  back: 'Система предотвращения пожара, система противопожарной защиты и комплекс организационно-технических мероприятий.'
  refs:
    - doc: fz-123
      anchor: st-5
      quote: 'включает в себя систему предотвращения пожара, систему противопожарной защиты, комплекс организационно-технических мероприятий по обеспечению пожарной безопасности'
  revision: 1
- id: R-card-024
  topic: pozharnaya-bezopasnost
  front: 'Когда эвакуация людей из здания при пожаре считается безопасной?'
  back: 'Когда время от обнаружения пожара до завершения эвакуации в безопасную зону не превышает необходимого времени эвакуации.'
  refs:
    - doc: fz-123
      anchor: st-53
      quote: 'если интервал времени от момента обнаружения пожара до завершения процесса эвакуации людей в безопасную зону не превышает необходимого времени эвакуации людей при пожаре'
  revision: 1
- id: R-card-025
  topic: pozharnaya-bezopasnost
  front: 'На каких объектах должны стоять системы пожарной сигнализации, оповещения и управления эвакуацией?'
  back: 'Там, где воздействие опасных факторов пожара может привести к травмам или гибели людей.'
  refs:
    - doc: fz-123
      anchor: st-54
      quote: 'должны быть установлены на объектах, где воздействие опасных факторов пожара может привести к травматизму и (или) гибели людей'
  revision: 1
- id: R-card-026
  topic: sanitarnoe-soderzhanie
  front: 'Чему закон об образовании требует обучать педагогов в рамках охраны здоровья обучающихся?'
  back: 'Навыкам оказания первой помощи.'
  refs:
    - doc: fz-273
      anchor: st-41
      quote: '11) обучение педагогических работников навыкам оказания первой помощи.'
  revision: 1
- id: R-card-027
  topic: remontnye-raboty
  front: 'Подрядчик ведёт ремонт в действующем здании вместе с субподрядчиками. Какой документ о совместных работах он обязан с ними разработать?'
  back: 'График выполнения совместных работ, обязательный для всех участников на этой территории.'
  refs:
    - doc: prikaz-883n
      anchor: pril-1-p-19
      quote: 'разработать график выполнения совместных работ, обеспечивающих безопасные условия труда, обязательный для участников строительного производства на данной территории'
      scan_page: 7
  revision: 1
- id: R-card-028
  topic: remontnye-raboty
  front: 'Что определяет наряд-допуск на работы повышенной опасности при ремонте?'
  back: 'Содержание, место, время и условия работ, меры безопасности, состав бригады и ответственных за безопасность.'
  refs:
    - doc: prikaz-883n
      anchor: pril-1-p-22
      quote: 'в соответствии с нарядом-допуском, определяющим содержание, место, время и условия производства работ, необходимые меры безопасности, состав бригады и лиц, ответственных за безопасность работ'
      scan_page: 8
  revision: 1
- id: R-card-029
  topic: oplata-truda
  front: 'За какой период считают среднемесячную зарплату директора для предельного соотношения с зарплатой работников?'
  back: 'За календарный год, с учётом всех источников финансового обеспечения.'
  refs:
    - doc: tk-rf
      anchor: st-145
      quote: 'формируемой за счет всех источников финансового обеспечения и рассчитываемой за календарный год'
  revision: 1
- id: R-card-030
  topic: oplata-truda
  front: 'Какую нижнюю границу зарплаты, кроме МРОТ, Трудовой кодекс особо называет для работников государственных и муниципальных учреждений?'
  back: 'Базовые оклады и базовые ставки по профессиональным квалификационным группам, если их установило Правительство.'
  refs:
    - doc: tk-rf
      anchor: st-144
      quote: 'не может быть ниже установленных Правительством Российской Федерации базовых окладов (базовых должностных окладов), базовых ставок заработной платы соответствующих профессиональных квалификационных групп'
  revision: 1
