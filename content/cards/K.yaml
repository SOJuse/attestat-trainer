- id: K-card-001
  topic: priem-na-rabotu
  front: Работника допустили к работе без письменного договора. В какой срок нужно оформить с ним договор?
  back: Не позднее трёх рабочих дней со дня фактического допуска к работе.
  refs:
    - doc: tk-rf
      anchor: st-67
      quote: >-
        работодатель обязан оформить с ним трудовой договор в письменной форме не позднее трех рабочих
        дней со дня фактического допущения работника к работе
  revision: 1

- id: K-card-002
  topic: perevody-sovmeshchenie-sovmestitelstvo
  front: За какой срок нужно предупредить работника, если досрочно отменяешь поручение о дополнительной работе?
  back: Письменно, не позднее чем за три рабочих дня. Так же предупреждает и работник, если отказывается от неё.
  refs:
    - doc: tk-rf
      anchor: st-60-2
      quote: >-
        Работник имеет право досрочно отказаться от выполнения дополнительной работы, а работодатель -
        досрочно отменить поручение о ее выполнении, предупредив об этом другую сторону в письменной форме
        не позднее чем за три рабочих дня.
  revision: 1

- id: K-card-003
  topic: rabochee-vremya-i-uchebnaya-nagruzka
  front: Какова наибольшая продолжительность рабочего времени педагогического работника в неделю?
  back: Не более 36 часов в неделю (сокращённая продолжительность).
  refs:
    - doc: tk-rf
      anchor: st-333
      quote: >-
        Для педагогических работников устанавливается сокращенная продолжительность рабочего времени
        не более 36 часов в неделю.
  revision: 1

- id: K-card-004
  topic: otpuska
  front: Не позднее какого срока утверждают график отпусков на следующий год?
  back: Не позднее чем за две недели до начала календарного года, с учётом мнения профсоюза.
  refs:
    - doc: tk-rf
      anchor: st-123
      quote: >-
        утверждаемым работодателем с учетом мнения выборного органа первичной профсоюзной организации
        не позднее чем за две недели до наступления календарного года
  revision: 1

- id: K-card-005
  topic: oplata-truda
  front: При какой задержке зарплаты работник вправе приостановить работу?
  back: При задержке более чем на 15 дней, письменно известив работодателя.
  refs:
    - doc: tk-rf
      anchor: st-142
      quote: >-
        В случае задержки выплаты заработной платы на срок более 15 дней работник имеет право, известив
        работодателя в письменной форме, приостановить работу на весь период до выплаты задержанной суммы.
  revision: 1

- id: K-card-006
  topic: disciplinarnaya-i-materialnaya-otvetstvennost
  front: В какие сроки можно применить дисциплинарное взыскание?
  back: >-
    Не позднее месяца со дня обнаружения проступка: болезнь работника, его отпуск и время на учёт мнения
    представительного органа работников в этот месяц не входят. И не позднее шести месяцев со дня совершения
    проступка, а по итогам ревизии, проверки финансово-хозяйственной деятельности или аудиторской проверки
    не позднее двух лет. За нарушение антикоррупционных запретов и обязанностей не позднее трёх лет
    со дня проступка.
  refs:
    - doc: tk-rf
      anchor: st-193
      quote: >-
        Дисциплинарное взыскание применяется не позднее одного месяца со дня обнаружения проступка, не считая
        времени болезни работника, пребывания его в отпуске, а также времени, необходимого на учет мнения
        представительного органа работников.
    - doc: tk-rf
      anchor: st-193
      quote: >-
        не может быть применено позднее шести месяцев со дня совершения проступка, а по результатам
        ревизии, проверки финансово-хозяйственной деятельности или аудиторской проверки - позднее двух лет
        со дня его совершения
    - doc: tk-rf
      anchor: st-193
      quote: >-
        Дисциплинарное взыскание за несоблюдение ограничений и запретов, неисполнение обязанностей,
        установленных законодательством Российской Федерации о противодействии коррупции, не может быть
        применено позднее трех лет со дня совершения проступка.
  revision: 1

- id: K-card-007
  topic: uvolnenie
  front: За какой срок работника предупреждают об увольнении по сокращению штата?
  back: Персонально и под роспись не менее чем за два месяца до увольнения.
  refs:
    - doc: tk-rf
      anchor: st-180
      quote: >-
        работники предупреждаются работодателем персонально и под роспись не менее чем за два месяца
        до увольнения
  revision: 1

- id: K-card-008
  topic: attestaciya-i-razvitie-pedagogov
  front: Как часто педагогов аттестуют на соответствие занимаемой должности?
  back: Один раз в пять лет. Аттестационную комиссию школа формирует сама.
  refs:
    - doc: fz-273
      anchor: st-49
      quote: >-
        Проведение аттестации педагогических работников в целях подтверждения соответствия педагогических
        работников занимаемым ими должностям осуществляется один раз в пять лет
  revision: 1

- id: K-card-009
  topic: attestaciya-i-razvitie-pedagogov
  front: Как часто педагог имеет право на дополнительное профессиональное образование по профилю работы?
  back: Не реже чем один раз в три года.
  refs:
    - doc: fz-273
      anchor: st-47
      quote: >-
        право на дополнительное профессиональное образование по профилю педагогической деятельности
        не реже чем один раз в три года
  revision: 1

- id: K-card-010
  topic: ohrana-truda
  front: В какой срок комиссия должна расследовать несчастный случай с работником при лёгком и при тяжёлом повреждении здоровья?
  back: При лёгком повреждении три календарных дня, при тяжёлом повреждении здоровья или смертельном исходе 15 календарных дней.
  refs:
    - doc: tk-rf
      anchor: st-229-1
      quote: >-
        Расследование несчастного случая (в том числе группового), в результате которого один или несколько
        пострадавших получили легкие повреждения здоровья, проводится комиссией в течение трех календарных дней.
    - doc: tk-rf
      anchor: st-229-1
      quote: >-
        в результате которого один или несколько пострадавших получили тяжелые повреждения здоровья,
        либо несчастного случая (в том числе группового) со смертельным исходом проводится комиссией
        в течение 15 календарных дней
  revision: 1

- id: K-card-011
  topic: priem-na-rabotu
  front: Работник не выдержал испытание. Не позднее какого срока его нужно предупредить о расторжении договора?
  back: >-
    Письменно, не позднее чем за три дня, с указанием причин, и расторгнуть договор до истечения срока
    испытания. Работник, которому работа не подошла, тоже предупреждает письменно за три дня.
  refs:
    - doc: tk-rf
      anchor: st-71
      quote: >-
        При неудовлетворительном результате испытания работодатель имеет право до истечения срока испытания
        расторгнуть трудовой договор с работником, предупредив его об этом в письменной форме не позднее
        чем за три дня с указанием причин
    - doc: tk-rf
      anchor: st-71
      quote: >-
        Если в период испытания работник придет к выводу, что предложенная ему работа не является для него
        подходящей, то он имеет право расторгнуть трудовой договор по собственному желанию, предупредив
        об этом работодателя в письменной форме за три дня
  revision: 1

- id: K-card-012
  topic: dopusk-k-pedagogicheskoj-deyatelnosti
  front: Кто проходит обязательный предварительный медицинский осмотр при заключении трудового договора?
  back: >-
    Все, кому нет восемнадцати лет, и те, для кого это предусмотрено законом. Среди них работники
    детских учреждений (статья 220).
  refs:
    - doc: tk-rf
      anchor: st-69
      quote: >-
        Обязательному предварительному медицинскому осмотру при заключении трудового договора подлежат лица,
        не достигшие возраста восемнадцати лет, а также иные лица в случаях, предусмотренных настоящим
        Кодексом и иными федеральными законами.
    - doc: tk-rf
      anchor: st-220
      quote: >-
        медицинских организаций и детских учреждений, а также некоторых других работодателей проходят
        указанные медицинские осмотры
  revision: 1

- id: K-card-013
  topic: dopusk-k-pedagogicheskoj-deyatelnosti
  front: >-
    У работающего учителя возникло ограничение на занятие педагогической деятельностью. При каком условии
    с ним прекращают трудовой договор?
  back: >-
    Если его нельзя перевести с письменного согласия на другую работу, которая есть у школы.
    Основание прекращения: пункт 13 части первой статьи 83.
  refs:
    - doc: tk-rf
      anchor: st-83
      quote: >-
        возникновение установленных настоящим Кодексом, иным федеральным законом и исключающих возможность
        исполнения работником обязанностей по трудовому договору ограничений на занятие определенными видами
        трудовой деятельности
    - doc: tk-rf
      anchor: st-83
      quote: >-
        Прекращение трудового договора по основаниям, предусмотренным пунктами 2, 8, 9, 10 или 13 части первой
        настоящей статьи, допускается, если невозможно перевести работника с его письменного согласия на другую
        имеющуюся у работодателя работу
  revision: 1

- id: K-card-014
  topic: dopusk-k-pedagogicheskoj-deyatelnosti
  front: Водителю школьного автобуса приостановили водительские права. При каком сроке приостановления его отстраняют
    от работы, а при каком трудовой договор прекращается?
  back: При приостановлении на срок до двух месяцев его отстраняют, на срок более двух месяцев договор прекращается
    по пункту 9 части первой статьи 83. И то и другое возможно, только если его нельзя с письменного согласия перевести
    на другую имеющуюся работу.
  refs:
  - doc: tk-rf
    anchor: st-76
    quote: в случае приостановления действия на срок до двух месяцев специального права работника (лицензии, права
      на управление транспортным средством, права на ношение оружия, другого специального права)
  - doc: tk-rf
    anchor: st-76
    quote: если это влечет за собой невозможность исполнения работником обязанностей по трудовому договору и если
      невозможно перевести работника с его письменного согласия на другую имеющуюся у работодателя работу
  - doc: tk-rf
    anchor: st-83
    quote: Прекращение трудового договора по основаниям, предусмотренным пунктами 2, 8, 9, 10 или 13 части первой
      настоящей статьи, допускается, если невозможно перевести работника с его письменного согласия на другую имеющуюся
      у работодателя работу
  - doc: tk-rf
    anchor: st-83
    quote: истечение срока действия, приостановление действия на срок более двух месяцев или лишение работника специального
      права (лицензии, права на управление транспортным средством, права на ношение оружия, другого специального
      права)
  - doc: tk-rf
    anchor: st-83
    quote: в соответствии с федеральными законами и иными нормативными правовыми актами Российской Федерации, если
      это влечет за собой невозможность исполнения работником обязанностей по трудовому договору
  revision: 1

- id: K-card-015
  topic: perevody-sovmeshchenie-sovmestitelstvo
  front: На какой срок можно временно перевести работника на другую работу по соглашению сторон?
  back: >-
    По письменному соглашению на срок до одного года, а для замещения временно отсутствующего работника,
    за которым сохраняется место работы, до выхода этого работника на работу.
  refs:
    - doc: tk-rf
      anchor: st-72-2
      quote: >-
        По соглашению сторон, заключаемому в письменной форме, работник может быть временно переведен
        на другую работу у того же работодателя на срок до одного года
    - doc: tk-rf
      anchor: st-72-2
      quote: >-
        когда такой перевод осуществляется для замещения временно отсутствующего работника, за которым
        в соответствии с законом сохраняется место работы, - до выхода этого работника на работу
  revision: 1

- id: K-card-016
  topic: rabochee-vremya-i-uchebnaya-nagruzka
  front: До какого возраста ребёнка работодатель обязан по просьбе родителя установить ему неполное рабочее время?
  back: >-
    Пока ребёнку не исполнилось 14 лет, а ребёнку-инвалиду 18 лет. Срок устанавливают удобный для работника,
    но не дольше, чем сохраняется это основание.
  refs:
    - doc: tk-rf
      anchor: st-93
      quote: >-
        Работодатель обязан устанавливать неполное рабочее время по просьбе беременной женщины, одного
        из родителей (опекуна, попечителя), имеющего ребенка в возрасте до четырнадцати лет (ребенка-инвалида
        в возрасте до восемнадцати лет)
    - doc: tk-rf
      anchor: st-93
      quote: >-
        неполное рабочее время устанавливается на удобный для работника срок, но не более чем на период
        наличия обстоятельств, явившихся основанием для обязательного установления неполного рабочего времени
  revision: 1

- id: K-card-017
  topic: otpuska
  front: Как часто педагог имеет право на длительный отпуск и на какой срок?
  back: Сроком до одного года, не реже чем через каждые 10 лет непрерывной педагогической работы.
  refs:
    - doc: tk-rf
      anchor: st-335
      quote: >-
        Педагогические работники организации, осуществляющей образовательную деятельность, не реже чем
        через каждые 10 лет непрерывной педагогической работы имеют право на длительный отпуск сроком
        до одного года
  revision: 1

- id: K-card-018
  topic: otpuska
  front: Когда у нового работника возникает право на отпуск за первый год работы?
  back: >-
    По истечении шести месяцев непрерывной работы у данного работодателя, а по соглашению сторон и раньше.
    Некоторым работникам, например тем, кому нет восемнадцати лет, отпуск по заявлению обязаны дать
    и до шести месяцев.
  refs:
    - doc: tk-rf
      anchor: st-122
      quote: >-
        Право на использование отпуска за первый год работы возникает у работника по истечении шести месяцев
        его непрерывной работы у данного работодателя. По соглашению сторон оплачиваемый отпуск работнику
        может быть предоставлен и до истечения шести месяцев.
    - doc: tk-rf
      anchor: st-122
      quote: >-
        До истечения шести месяцев непрерывной работы оплачиваемый отпуск по заявлению работника должен быть
        предоставлен:
    - doc: tk-rf
      anchor: st-122
      quote: работникам в возрасте до восемнадцати лет
  revision: 1

- id: K-card-019
  topic: oplata-truda
  front: Какую долю зарплаты работодатель может удержать при одной выплате?
  back: >-
    Все удержания вместе не более 20 процентов, а в случаях, предусмотренных федеральными законами,
    не более 50 процентов. Для алиментов на несовершеннолетних детей, возмещения вреда здоровью и некоторых
    других взысканий предел 70 процентов.
  refs:
    - doc: tk-rf
      anchor: st-138
      quote: >-
        Общий размер всех удержаний при каждой выплате заработной платы не может превышать 20 процентов,
        а в случаях, предусмотренных федеральными законами, - 50 процентов заработной платы, причитающейся
        работнику.
    - doc: tk-rf
      anchor: st-138
      quote: >-
        Ограничения, установленные настоящей статьей, не распространяются на удержания из заработной платы
        при отбывании исправительных работ, взыскании алиментов на несовершеннолетних детей, возмещении вреда,
        причиненного здоровью другого лица
    - doc: tk-rf
      anchor: st-138
      quote: Размер удержаний из заработной платы в этих случаях не может превышать 70 процентов.
  revision: 1

- id: K-card-020
  topic: oplata-truda
  front: Как часто нужно выплачивать зарплату и насколько поздно после окончания периода можно назначить день выплаты?
  back: >-
    Не реже чем каждые полмесяца. Конкретную дату устанавливают правила внутреннего трудового распорядка,
    коллективный или трудовой договор не позднее 15 календарных дней со дня окончания периода, за который
    зарплата начислена.
  refs:
    - doc: tk-rf
      anchor: st-136
      quote: >-
        Заработная плата выплачивается не реже чем каждые полмесяца. Конкретная дата выплаты заработной платы
        устанавливается правилами внутреннего трудового распорядка, коллективным договором или трудовым
        договором не позднее 15 календарных дней со дня окончания периода, за который она начислена.
  revision: 1

- id: K-card-021
  topic: disciplinarnaya-i-materialnaya-otvetstvennost
  front: >-
    Работник причинил школе ущерб на сумму меньше своего среднего месячного заработка. Как и в какой срок
    директор может взыскать эту сумму?
  back: >-
    Своим распоряжением, не позднее одного месяца со дня, когда окончательно установлен размер ущерба.
  refs:
    - doc: tk-rf
      anchor: st-248
      quote: >-
        Взыскание с виновного работника суммы причиненного ущерба, не превышающей среднего месячного заработка,
        производится по распоряжению работодателя. Распоряжение может быть сделано не позднее одного месяца
        со дня окончательного установления работодателем размера причиненного работником ущерба.
  revision: 1

- id: K-card-022
  topic: uvolnenie
  front: За какой срок работника предупреждают о прекращении срочного трудового договора в связи с истечением срока?
  back: >-
    Письменно, не менее чем за три календарных дня до увольнения. Если договор заключён на время исполнения
    обязанностей отсутствующего работника, это правило не применяется.
  refs:
    - doc: tk-rf
      anchor: st-79
      quote: >-
        О прекращении трудового договора в связи с истечением срока его действия работник должен быть
        предупрежден в письменной форме не менее чем за три календарных дня до увольнения
    - doc: tk-rf
      anchor: st-79
      quote: >-
        за исключением случаев, когда истекает срок действия срочного трудового договора, заключенного
        на время исполнения обязанностей отсутствующего работника
  revision: 1

- id: K-card-023
  topic: uvolnenie
  front: >-
    Работника, который состоит в профсоюзе, увольняют по сокращению штата. За какой срок профком должен дать
    мотивированное мнение и до какого срока после этого можно уволить?
  back: >-
    Профком (выборный орган первичной профсоюзной организации) даёт письменное мнение в течение семи рабочих
    дней со дня получения проекта приказа и документов, позже поданное не учитывается. Уволить можно
    не позднее одного месяца со дня получения мнения, не считая болезни, отпуска и других периодов
    отсутствия работника с сохранением места.
  refs:
    - doc: tk-rf
      anchor: st-373
      quote: >-
        Выборный орган первичной профсоюзной организации в течение семи рабочих дней со дня получения проекта
        приказа и копий документов рассматривает этот вопрос и направляет работодателю свое мотивированное
        мнение в письменной форме. Мнение, не представленное в семидневный срок, работодателем не учитывается.
    - doc: tk-rf
      anchor: st-373
      quote: >-
        Работодатель имеет право расторгнуть трудовой договор не позднее одного месяца со дня получения
        мотивированного мнения выборного органа первичной профсоюзной организации
    - doc: tk-rf
      anchor: st-373
      quote: >-
        В указанный период не засчитываются периоды временной нетрудоспособности работника, пребывания его
        в отпуске и другие периоды отсутствия работника, когда за ним сохраняется место работы (должность).
  revision: 1

- id: K-card-024
  topic: ohrana-truda
  front: Как часто проводят специальную оценку условий труда на рабочем месте и с какого дня считают этот срок?
  back: Не реже чем один раз в пять лет, если этим законом не установлено иное. Срок считают со дня внесения результатов
    в информационную систему учёта, а если в них есть государственная или иная охраняемая законом тайна, со дня
    утверждения отчёта. На рабочих местах с действующей декларацией соответствия условий труда повторная оценка
    не нужна, пока не наступят обстоятельства из части 5 статьи 11 закона.
  refs:
  - doc: fz-426
    anchor: st-8
    quote: Специальная оценка условий труда на рабочем месте проводится не реже чем один раз в пять лет, если иное
      не установлено настоящим Федеральным законом.
  - doc: fz-426
    anchor: st-8
    quote: Указанный срок исчисляется со дня внесения сведений о результатах проведения специальной оценки условий
      труда в информационную систему учета
  - doc: fz-426
    anchor: st-8
    quote: а в отношении результатов проведения специальной оценки условий труда, содержащих сведения, составляющие
      государственную или иную охраняемую законом тайну, со дня утверждения отчета о проведении специальной оценки
      условий труда
  - doc: fz-426
    anchor: st-8
    quote: в отношении которых действует декларация соответствия условий труда государственным нормативным требованиям
      охраны труда, повторное проведение специальной оценки условий труда не требуется до наступления обстоятельств,
      установленных частью 5 статьи 11 настоящего Федерального закона
  revision: 1

- id: K-card-025
  topic: bolnichnyj-materinstvo-i-garantii
  front: Какой продолжительности отпуск по беременности и родам?
  back: >-
    70 календарных дней до родов и 70 после. До родов 84 дня при многоплодной
    беременности, после родов 86 дней при осложнённых родах и 110 при рождении двух или более детей.
  refs:
    - doc: tk-rf
      anchor: st-255
      quote: >-
        продолжительностью 70 (в случае многоплодной беременности - 84) календарных дней до родов и 70
        (в случае осложненных родов - 86, при рождении двух или более детей - 110) календарных дней после родов
  revision: 1

- id: K-card-026
  topic: bolnichnyj-materinstvo-i-garantii
  front: Работник заболел сам. За какие дни больничного пособие платит школа как работодатель, а с какого дня фонд?
  back: >-
    За первые три дня временной нетрудоспособности платит работодатель, начиная с 4-го дня Фонд пенсионного
    и социального страхования. При уходе за больным членом семьи, карантине и других случаях из пунктов 2-5
    части 1 статьи 5 закона фонд платит с 1-го дня.
  refs:
    - doc: fz-255
      anchor: st-3
      quote: >-
        за первые три дня временной нетрудоспособности за счет средств страхователя, а за остальной период
        начиная с 4-го дня временной нетрудоспособности за счет средств бюджета Фонда пенсионного
        и социального страхования Российской Федерации
    - doc: fz-255
      anchor: st-3
      quote: >-
        Пособие по временной нетрудоспособности в случаях, предусмотренных пунктами 2 - 5 части 1 статьи 5
        настоящего Федерального закона, выплачивается застрахованным лицам за счет средств бюджета Фонда
        пенсионного и социального страхования Российской Федерации с 1-го дня временной нетрудоспособности
    - doc: fz-255
      anchor: st-5
      quote: >-
        2) необходимости осуществления ухода за больным членом семьи; 3) карантина застрахованного лица
  revision: 1

- id: K-card-027
  topic: bolnichnyj-materinstvo-i-garantii
  front: Сколько дополнительных оплачиваемых выходных дней положено для ухода за ребёнком-инвалидом?
  back: >-
    Четыре дня в месяц одному из родителей (опекуну, попечителю) по письменному заявлению, родители могут
    разделить их между собой. Один раз в календарном году можно взять подряд до 24 таких дней в пределах
    неиспользованных.
  refs:
    - doc: tk-rf
      anchor: st-262
      quote: >-
        Одному из родителей (опекуну, попечителю) для ухода за детьми-инвалидами по его письменному заявлению
        предоставляются четыре дополнительных оплачиваемых выходных дня в месяц, которые могут быть
        использованы одним из указанных лиц либо разделены ими между собой по их усмотрению
    - doc: tk-rf
      anchor: st-262
      quote: >-
        Однократно в течение календарного года допускается использование до двадцати четырех дополнительных
        оплачиваемых выходных дней подряд в пределах общего количества неиспользованных дополнительных
        оплачиваемых выходных дней
  revision: 1

- id: K-card-028
  topic: personalnye-dannye-i-kadrovye-dokumenty
  front: На каких работников школа ведёт трудовые книжки?
  back: >-
    На каждого, кто проработал в школе свыше пяти дней и для кого эта работа основная. Исключение:
    случаи, когда по закону трудовую книжку на работника не ведут.
  refs:
    - doc: tk-rf
      anchor: st-66
      quote: >-
        ведет трудовые книжки на каждого работника, проработавшего у него свыше пяти дней, в случае,
        когда работа у данного работодателя является для работника основной
  revision: 1

- id: K-card-029
  topic: personalnye-dannye-i-kadrovye-dokumenty
  front: Сколько хранятся документы по личному составу, законченные делопроизводством после 1 января 2003 года?
  back: >-
    50 лет, а законченные до 1 января 2003 года 75 лет. Иной срок может быть установлен перечнем архивных
    документов со сроками хранения.
  refs:
    - doc: fz-125
      anchor: st-22-1
      quote: >-
        Документы по личному составу, законченные делопроизводством после 1 января 2003 года, хранятся 50 лет.
    - doc: fz-125
      anchor: st-22-1
      quote: >-
        Документы по личному составу, законченные делопроизводством до 1 января 2003 года, хранятся 75 лет.
    - doc: fz-125
      anchor: st-22-1
      quote: >-
        не распространяются на документы по личному составу, в отношении которых действующими перечнями
        архивных документов с указанием сроков их хранения установлен иной срок хранения
  revision: 1

- id: K-card-030
  topic: personalnye-dannye-i-kadrovye-dokumenty
  front: >-
    Работник письменно запросил, какие его персональные данные обрабатывает школа, и хочет с ними
    ознакомиться. В какой срок ответить?
  back: >-
    В течение десяти рабочих дней с даты получения запроса. Срок можно продлить не более чем на пять рабочих
    дней, если направить работнику мотивированное уведомление о причинах продления.
  refs:
    - doc: fz-152
      anchor: st-20
      quote: >-
        предоставить возможность ознакомления с этими персональными данными при обращении субъекта
        персональных данных или его представителя либо в течение десяти рабочих дней с даты получения запроса
        субъекта персональных данных или его представителя
    - doc: fz-152
      anchor: st-20
      quote: >-
        Указанный срок может быть продлен, но не более чем на пять рабочих дней в случае направления оператором
        в адрес субъекта персональных данных мотивированного уведомления с указанием причин продления срока
        предоставления запрашиваемой информации
  revision: 1
