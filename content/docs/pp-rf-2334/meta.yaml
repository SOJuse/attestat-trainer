id: pp-rf-2334
title: Об утверждении Правил использования федеральной государственной информационной системы "Единый портал государственных
  и муниципальных услуг (функций)" для направления гражданами Российской Федерации, иностранными гражданами, лицами
  без гражданства, объединениями граждан, в том числе юридическими лицами, обращений и сообщений в государственные
  органы, органы местного самоуправления, государственные и муниципальные учреждения, иные организации, осуществляющие
  публично значимые функции, и их должностным лицам, а также для получения и обработки такими органами и организациями
  указанных обращений и сообщений и направления ответов на такие обращения и сообщения
