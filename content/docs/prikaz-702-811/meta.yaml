title: 'Об утверждении общих требований к организации и проведению в природной среде следующих мероприятий с участием
  детей, являющихся членами организованной группы несовершеннолетних туристов: прохождения туристских маршрутов,
  других маршрутов передвижения, походов, экспедиций, слетов и иных аналогичных мероприятий, а также указанных мероприятий
  с участием организованных групп детей, проводимых организациями, осуществляющими образовательную деятельность,
  и организациями отдыха детей и их оздоровления, и к порядку уведомления уполномоченных органов государственной
  власти о месте, сроках и длительности проведения таких мероприятий'
