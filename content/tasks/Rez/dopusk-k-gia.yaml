- id: Rez-dopusk-k-gia-001
  type: multiple
  difficulty: 2
  situation: >-
    В ноябре к директору пришла мать пятнадцатилетнего Миши. Миша учится в форме семейного образования,
    основного общего образования у него пока нет. Весной он хочет пройти ГИА за 9 класс экстерном
    в этой школе, программа основного общего образования у неё аккредитована.
  question: Что из этого верно для Миши? Отметьте все верные варианты.
  options:
    - text: Для допуска к ГИА нужны промежуточная аттестация без «двоек» и «зачет» за итоговое собеседование
      correct: true
      why: Порядок ГИА-9 называет для экстернов именно эти два условия допуска.
    - text: Промежуточную аттестацию и ГИА в этой школе он вправе пройти бесплатно
      correct: true
      why: >-
        Тем, у кого нет основного общего образования, закон разрешает пройти экстерном обе аттестации
        без платы.
    - text: Пока он проходит аттестацию, у него академические права учеников этой программы
      correct: true
      why: На время аттестации экстерн пользуется академическими правами обучающихся по соответствующей программе.
    - text: Итоговое собеседование он проходит по желанию, на допуск к ГИА оно не влияет
      correct: false
      why: «Зачет» за итоговое собеседование входит в условия допуска экстернов так же, как и учеников.
    - text: За промежуточную аттестацию школа вправе взять с него плату, а ГИА он проходит бесплатно
      correct: false
      why: Бесплатность в законе касается и промежуточной, и итоговой аттестации экстерна без основного общего образования.
  explanation: >-
    Часть 3 статьи 34 закона об образовании позволяет ребёнку на семейном образовании пройти экстерном
    промежуточную и государственную итоговую аттестацию в школе с аккредитованной программой. Если основного
    общего образования у него нет, обе аттестации бесплатны, а на время аттестации у него академические права
    учеников. Условия допуска экстерна к ГИА-9 даёт пункт 7 порядка: отметки на промежуточной аттестации
    не ниже удовлетворительных и «зачет» за итоговое собеседование по русскому языку.
  refs:
    - doc: fz-273
      anchor: st-34
      quote: >-
        Указанные лица, не имеющие основного общего или среднего общего образования, вправе пройти экстерном
        промежуточную и государственную итоговую аттестацию в организации, осуществляющей образовательную
        деятельность по соответствующей имеющей государственную аккредитацию основной общеобразовательной
        программе, бесплатно.
    - doc: fz-273
      anchor: st-34
      quote: >-
        При прохождении аттестации экстерны пользуются академическими правами обучающихся по соответствующей
        образовательной программе.
    - doc: prikaz-232-551
      anchor: pril-1-p-7
      quote: >-
        Экстерны допускаются к ГИА при условии получения на промежуточной аттестации отметок не ниже
        удовлетворительных, а также получения результата «зачет» за итоговое собеседование по русскому языку.
      scan_page: 4
