- id: Rez-attestaty-i-medali-001
  type: single
  difficulty: 1
  situation: >-
    Выпускник 11 класса получил на ГИА неудовлетворительный результат по обязательному предмету,
    и аттестат ему не выдали. В июле он пришёл в школу и попросил документ о том, что учился здесь.
  question: Какой документ школа ему выдаёт? Выберите один вариант.
  options:
    - text: Справку об обучении или о периоде обучения по образцу, который установила сама школа
      correct: true
      why: >-
        Закон выдаёт такую справку тем, кто получил на итоговой аттестации неудовлетворительные результаты,
        а её образец школа устанавливает самостоятельно.
    - text: Свидетельство об обучении по образцу, который утвердило Минпросвещения России
      correct: false
      why: >-
        Свидетельство об обучении положено лицам с нарушением интеллекта, учившимся по адаптированным
        программам. Этот выпускник к ним не относится.
    - text: Аттестат о среднем общем образовании с пометкой о том, что ГИА не пройдена
      correct: false
      why: >-
        Аттестат подтверждает среднее общее образование только у тех, кто успешно прошёл ГИА.
        Аттестата с такой пометкой закон не знает.
    - text: Никакого документа до пересдачи, потому что справку выдают только отчисленным
      correct: false
      why: >-
        В той же части закона рядом с отчисленными названы и те, кто получил на итоговой аттестации
        неудовлетворительные результаты, так что справка положена и ему.
  explanation: >-
    Дело решает часть 12 статьи 60 закона об образовании. Тому, кто не прошёл итоговую аттестацию
    или получил на ней неудовлетворительные результаты, выдаётся справка об обучении или о периоде обучения,
    и образец справки школа устанавливает сама. Аттестат выдают только после успешной ГИА, а свидетельство
    об обучении предназначено для выпускников с нарушением интеллекта, которые учились по адаптированным программам.
  refs:
    - doc: fz-273
      anchor: st-60
      quote: >-
        получившим на итоговой аттестации неудовлетворительные результаты, а также лицам, освоившим часть
        образовательной программы и (или) отчисленным из организации, осуществляющей образовательную деятельность,
        выдается справка об обучении или о периоде обучения по образцу, самостоятельно устанавливаемому организацией
    - doc: fz-273
      anchor: st-60
      quote: >-
        Документ об образовании, выдаваемый лицам, успешно прошедшим государственную итоговую аттестацию,
        подтверждает получение общего образования следующего уровня
    - doc: fz-273
      anchor: st-60
      quote: >-
        Лицам с ограниченными возможностями здоровья (с нарушением интеллекта), не имеющим основного общего
        и среднего общего образования и обучавшимся по адаптированным основным общеобразовательным программам,
        выдается свидетельство об обучении
  revision: 1
  checked: '2026-11-16'
