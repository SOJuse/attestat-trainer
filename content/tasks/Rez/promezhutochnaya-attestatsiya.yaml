- id: Rez-promezhutochnaya-attestatsiya-001
  type: input
  difficulty: 3
  situation: >-
    Восьмиклассница получила неудовлетворительную годовую отметку по физике на промежуточной аттестации.
    В сентябре, в срок, который назначила школа, она пересдавала физику учителю и снова получила «2».
    Она не болела, год с момента образования задолженности не истёк.
  question: Сколько ещё раз она вправе пройти промежуточную аттестацию по физике, чтобы ликвидировать задолженность? Ответ дайте числом.
  answer: 1
  unit: раз
  explanation: >-
    По части 5 статьи 58 закона об образовании ученик с академической задолженностью вправе пройти
    промежуточную аттестацию по предмету не более двух раз в пределах года с момента образования задолженности.
    Годовая аттестация, на которой задолженность возникла, в эти две попытки не входит. Одну попытку ученица
    использовала в сентябре, осталась одна, и проводить её будет комиссия, которую создаёт школа (часть 6).
  refs:
    - doc: fz-273
      anchor: st-58
      quote: >-
        Обучающиеся, имеющие академическую задолженность, вправе пройти промежуточную аттестацию
        по соответствующим учебному предмету, курсу, дисциплине (модулю) не более двух раз
    - doc: fz-273
      anchor: st-58
      quote: Для проведения промежуточной аттестации во второй раз образовательной организацией создается комиссия.
  trap:
    kind: wording
    note: >-
      Две попытки считаются после образования задолженности. Годовую аттестацию, на которой появилась «2»,
      считать не нужно, а сентябрьскую пересдачу нужно.
  revision: 1
  checked: '2026-11-16'
