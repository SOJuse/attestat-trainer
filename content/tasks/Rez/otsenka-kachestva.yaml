- id: Rez-otsenka-kachestva-001
  type: matching
  difficulty: 3
  situation: >-
    Учредитель попросил директора рассказать управляющему совету обо всех оценочных процедурах,
    через которые школа прошла за год. Заместитель директора готовит справку и путает, кто какую
    процедуру проводит. В черновике пять процедур.
  question: Сопоставьте процедуру с тем, кто её проводит, по чьему решению она проводится или кто задаёт её порядок.
  pairs:
    - left: Самообследование и внутренняя система оценки качества образования
      right: Сама школа своими силами
    - left: Независимая оценка качества условий образовательной деятельности
      right: Общественный совет при органе управления образованием
    - left: Независимая оценка качества подготовки обучающихся
      right: Организация, выполняющая такую оценку по инициативе участников отношений
    - left: Региональное сопоставительное исследование качества общего образования
      right: Орган власти субъекта РФ, который управляет образованием
    - left: Национальное сопоставительное исследование качества общего образования
      right: Правительство РФ, которое определяет перечень и порядок таких исследований
  explanation: >-
    Самообследование и работа внутренней системы оценки качества закон относит к компетенции самой школы
    (пункт 13 части 3 статьи 28). Независимую оценку качества условий проводят общественные советы
    по независимой оценке качества (часть 6 статьи 95.2). Независимую оценку качества подготовки обучающихся
    проводят юридические лица, которые выполняют такую оценку, по инициативе участников отношений в сфере
    образования (статьи 95 и 95.1). Региональные сопоставительные исследования проводятся по решению
    регионального органа управления образованием (часть 3.2 статьи 97). Перечень и порядок национальных
    исследований определяет Правительство РФ (часть 3.1 статьи 97).
