      anchor: pril-1-p-12
      quote: >-
        После ознакомления с представлением работодателя педагогический работник по желанию может представить
        в аттестационную комиссию организации дополнительные сведения, характеризующие его профессиональную деятельность
      scan_page: 6
    - doc: prikaz-196
