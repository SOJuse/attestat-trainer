- id: Rez-attestatsiya-pedagogov-001
  type: sequence
  difficulty: 2
  situation: >-
    Учитель химии работает в школе шесть лет, квалификационной категории у него нет. Директор включил его
    в распорядительный акт об аттестации на соответствие занимаемой должности и подготовил на него представление.
    Учитель хочет добавить к представлению сведения о победах своих учеников на олимпиадах.
  question: Расставьте дальнейшие шаги аттестации в том порядке, который установлен порядком аттестации педагогических работников.
  items:
    - Учителя знакомят под подпись с представлением работодателя
    - Учитель передаёт в аттестационную комиссию дополнительные сведения о своей работе
    - Комиссия на заседании с участием учителя рассматривает представление и сведения
    - Комиссия открытым голосованием в отсутствие учителя принимает решение
    - Секретарь комиссии составляет выписку из протокола
    - Работодатель знакомит учителя с выпиской из протокола под подпись
  explanation: >-
    Порядок аттестации педагогических работников задаёт очерёдность прямо. Дополнительные сведения педагог
    вправе передать в комиссию после того, как его ознакомили с представлением. Комиссия рассматривает
    представление и эти сведения на заседании с участием педагога, а решение принимает открытым голосованием
    в его отсутствие. Выписку из протокола с принятым решением составляет секретарь, и уже после этого
    работодатель знакомит с ней педагога под подпись.
  refs:
