- id: K-otpuska-001
  type: single
  difficulty: 1
  situation: >-
    Учительница биологии в июле находится в ежегодном оплачиваемом отпуске. Внезапно уволился заместитель
    директора, и директору нужен человек, который за две недели подготовит документы к началу учебного года.
    Он звонит учительнице, но она отказывается прерывать отпуск.
  question: Может ли директор отозвать её из отпуска? Выберите один вариант.
  options:
    - text: Нет, без согласия работника отзыв из отпуска не допускается
      correct: true
      why: >-
        Статья 125 разрешает отзыв из отпуска только с согласия работника, если Кодекс не предусматривает
        иного. Для подготовки документов исключений нет, а учительница отказалась.
    - text: Да, приказом, а неиспользованные дни она возьмёт в удобное время
      correct: false
      why: >-
        Правило о неиспользованных днях применяют, когда работник на отзыв согласился.
        Согласия оно не заменяет.
    - text: Да, если оплатить дни работы после отзыва в двойном размере
      correct: false
      why: >-
        Двойная оплата в статье 125 касается работников с вредными или опасными условиями труда, которых
        отзывают при катастрофе, аварии или стихийном бедствии. К учительнице это не относится, и доплата
        согласия не заменяет.
    - text: Да, если отзыв одобрит выборный орган профсоюза
      correct: false
      why: Норма об отзыве не связывает его с мнением профсоюза, решает согласие самого работника.
    - text: Нет, педагогов не отзывают из отпуска даже с их согласия
      correct: false
      why: >-
        С согласия работника отзыв возможен. Полный запрет на отзыв статья 125 устанавливает для работников
        до 18 лет и беременных женщин, педагогов среди них нет.
  explanation: >-
    Часть вторая статьи 125 допускает отзыв из отпуска только с согласия работника, за исключением случаев,
    предусмотренных Кодексом. Подготовка документов к таким случаям не относится, а учительница отказалась,
    поэтому отозвать её директор не может. Если бы она согласилась, неиспользованные дни ей предоставили бы
    по её выбору: в удобное время в текущем рабочем году или вместе с отпуском за следующий рабочий год.
  refs:
    - doc: tk-rf
      anchor: st-125
      quote: >-
        Отзыв работника из отпуска допускается только с его согласия, за исключением случаев,
        предусмотренных настоящим Кодексом.
    - doc: tk-rf
      anchor: st-125
      quote: >-
        Неиспользованная в связи с этим часть отпуска должна быть предоставлена по выбору работника
        в удобное для него время в течение текущего рабочего года или присоединена к отпуску за следующий
        рабочий год.
    - doc: tk-rf
      anchor: st-125
      quote: >-
        При этом часы работы на выполнение отозванным из отпуска работником своих трудовых обязанностей
        в отношении случаев, послуживших причиной его отзыва из отпуска, оплачиваются не менее чем
        в двойном размере.
    - doc: tk-rf
      anchor: st-125
      quote: Не допускается отзыв из отпуска работников в возрасте до восемнадцати лет и беременных женщин.
  revision: 1
  checked: '2026-11-17'

- id: K-otpuska-002
  type: single
  difficulty: 2
  situation: >-
    В декабре школа составляет график отпусков на следующий год. Заведующий хозяйством просит поставить ему
    отпуск на июль: у него трое детей, им 16, 11 и 7 лет. Директор хочет, чтобы летом, когда в школе идёт
    ремонт, завхоз был на месте, и ставит его отпуск на ноябрь. Завхоз возражает.
  question: Кто из них прав и почему? Выберите один вариант.
  options:
    - text: 'Завхоз: у него трое детей до 18 лет, и младшему нет 14'
      correct: true
      why: >-
        Статья 262.2 даёт работнику с тремя и более детьми до 18 лет право на отпуск в удобное для него
        время, пока младшему не исполнится 14. Оба условия у завхоза выполнены.
    - text: 'Директор: график утверждает работодатель, и он обязателен для работника'
      correct: false
      why: >-
        График обязателен, но статья 123 сама оговаривает, что отдельным категориям работников отпуск
        дают по их желанию в удобное для них время. Завхоз относится к ним по статье 262.2.
    - text: 'Директор: удобное время положено, пока всем детям меньше 14 лет'
      correct: false
      why: >-
        Возраст 14 лет норма связывает с младшим ребёнком, а остальным детям должно быть меньше 18.
        Старшему 16, условие выполнено.
    - text: 'Директор: летний ремонт относится к исключительным случаям переноса отпуска'
      correct: false
      why: >-
        Исключительный случай по статье 124 позволяет перенести отпуск на следующий рабочий год, и то
        с согласия работника. Права завхоза выбрать удобное время это не отменяет.
    - text: 'Завхоз: удобное время положено, пока младшему ребёнку нет 18 лет'
      correct: false
      why: >-
        Порог для младшего ребёнка в статье 262.2 равен 14 годам, а не 18. До 18 лет должно быть всем троим
        детям: право есть, пока у работника трое детей младше 18 и младшему нет 14.
  explanation: >-
    Статья 262.2 даёт работнику, у которого трое и более детей до 18 лет, право брать ежегодный оплачиваемый
    отпуск в удобное для него время, пока младшему не исполнится 14. У завхоза трое детей до 18 лет, младшему 7,
    поэтому в графике его отпуск нужно поставить на июль. Обязательность графика и летний ремонт этого
    не меняют: часть четвёртая статьи 123 прямо оговаривает работников, которым отпуск дают в удобное для них время.
  refs:
    - doc: tk-rf
      anchor: st-262-2
      quote: >-
        Работникам, имеющим трех и более детей в возрасте до восемнадцати лет, ежегодный оплачиваемый отпуск
        предоставляется по их желанию в удобное для них время до достижения младшим из детей возраста
        четырнадцати лет.
    - doc: tk-rf
      anchor: st-123
      quote: График отпусков обязателен как для работодателя, так и для работника.
    - doc: tk-rf
      anchor: st-123
      quote: >-
        Отдельным категориям работников в случаях, предусмотренных настоящим Кодексом и иными федеральными
        законами, ежегодный оплачиваемый отпуск предоставляется по их желанию в удобное для них время.
    - doc: tk-rf
      anchor: st-124
      quote: >-
        В исключительных случаях, когда предоставление отпуска работнику в текущем рабочем году может
        неблагоприятно отразиться на нормальном ходе работы организации, индивидуального предпринимателя,
        допускается с согласия работника перенесение отпуска на следующий рабочий год
  revision: 1
  checked: '2026-11-17'

- id: K-otpuska-003
  type: multiple
  difficulty: 3
  situation: >-
    В мае директору подали письменные заявления о замене части ежегодного оплачиваемого отпуска денежной
    компенсацией. У учителей школы отпуск 56 календарных дней, а учителю химии прошлогодний отпуск с его
    согласия целиком перенесли на этот рабочий год. Лаборанту 17 лет, его отпуск 31 календарный день.
    Системный администратор работает с ненормированным рабочим днём: у него 28 календарных дней основного
    отпуска и 3 дня дополнительного.
  question: Какие заявления директор вправе удовлетворить полностью? Отметьте все верные варианты.
  options:
    - text: Учитель истории просит заменить деньгами 28 дней отпуска
      correct: true
      why: Из 56 дней сверх 28 остаётся ровно 28, и всю эту часть можно заменить компенсацией.
    - text: Беременная учительница английского просит заменить деньгами 14 дней
      correct: false
      why: >-
        Беременным заменять компенсацией основной отпуск нельзя, а удлинённый отпуск педагога
        по Кодексу тоже основной.
    - text: Лаборант просит заменить деньгами 3 дня отпуска
      correct: false
      why: >-
        Работникам до 18 лет заменять компенсацией основной и дополнительные отпуска нельзя, даже
        в части сверх 28 дней.
    - text: Учитель физики просит заменить деньгами 35 дней отпуска
      correct: false
      why: >-
        Из отпуска в 56 дней заменить можно лишь часть сверх 28 дней, то есть не больше 28.
        Заявление на 35 дней целиком удовлетворить нельзя.
    - text: Системный администратор просит заменить деньгами 3 дня отпуска
      correct: true
      why: >-
        Дополнительный отпуск суммируется с основным, всего выходит 31 день, и 3 дня сверх 28 можно заменить.
        Ненормированный рабочий день среди запретов статьи 126 не назван.
    - text: Учитель химии просит заменить деньгами 56 дней отпуска
      correct: true
      why: >-
        Его отпуск перенесён на следующий рабочий год, поэтому заменить можно часть каждого отпуска сверх
        28 дней: 28 дней прошлогоднего и 28 дней текущего, всего 56.
  explanation: >-
    По статье 126 часть ежегодного оплачиваемого отпуска сверх 28 календарных дней можно по письменному
    заявлению заменить компенсацией. Если отпуск перенесён на следующий рабочий год, превышение над 28 днями
    считают по каждому отпуску, поэтому учитель химии может заменить 28 дней прошлогоднего и 28 дней текущего
    отпуска. Дополнительные отпуска суммируются с основным, так что 3 дня системного администратора как раз
    выходят за 28. А беременной учительнице и лаборанту часть третья статьи 126 прямо запрещает заменять
    компенсацией основной и дополнительные отпуска.
  refs:
    - doc: tk-rf
      anchor: st-126
      quote: >-
        Часть ежегодного оплачиваемого отпуска, превышающая 28 календарных дней, по письменному заявлению
        работника может быть заменена денежной компенсацией
    - doc: tk-rf
      anchor: st-126
      quote: >-
        При суммировании ежегодных оплачиваемых отпусков или перенесении ежегодного оплачиваемого отпуска
        на следующий рабочий год денежной компенсацией могут быть заменены часть каждого ежегодного
        оплачиваемого отпуска, превышающая 28 календарных дней
    - doc: tk-rf
      anchor: st-126
      quote: >-
        Не допускается замена денежной компенсацией ежегодного основного оплачиваемого отпуска и ежегодных
        дополнительных оплачиваемых отпусков беременным женщинам и работникам в возрасте до восемнадцати лет
    - doc: tk-rf
      anchor: st-120
      quote: >-
        При исчислении общей продолжительности ежегодного оплачиваемого отпуска дополнительные оплачиваемые
        отпуска суммируются с ежегодным основным оплачиваемым отпуском.
    - doc: tk-rf
      anchor: st-334
      quote: Педагогическим работникам предоставляется ежегодный основной удлиненный оплачиваемый отпуск
  trap:
    kind: wording
    note: >-
      Учитель химии просит больше 28 дней, но в условии сказано, что его прошлогодний отпуск перенесён
      на этот рабочий год: превышение над 28 днями считают по каждому из двух отпусков.
  revision: 1
  checked: '2026-11-17'

- id: K-otpuska-004
  type: input
  difficulty: 2
  situation: >-
    В общеобразовательной школе есть дошкольные группы. В одну из них приняли воспитателя. Детей
    с ограниченными возможностями здоровья и детей, нуждающихся в длительном лечении, в этой группе нет.
    Кадровик заполняет трудовой договор и вписывает продолжительность ежегодного основного удлинённого
    оплачиваемого отпуска.
  question: Какую продолжительность отпуска нужно указать? Ответ в календарных днях.
  answer: 42
  unit: календарных дня
  explanation: >-
    Продолжительность удлинённого отпуска педагогов устанавливает Правительство (статья 334 ТК), сейчас это
    постановление № 415. В его приложении для общеобразовательных организаций (раздел III) педагогам положено
    56 дней, но воспитатели групп для детей дошкольного возраста выделены в отдельный пункт: 42 дня.
    56 дней воспитателю полагались бы, если бы он работал с детьми с ограниченными возможностями здоровья
    или нуждающимися в длительном лечении.
  refs:
    - doc: tk-rf
      anchor: st-334
      quote: >-
        Педагогическим работникам предоставляется ежегодный основной удлиненный оплачиваемый отпуск,
        продолжительность которого устанавливается Правительством Российской Федерации.
    - doc: pp-rf-415
      anchor: pril-1
      quote: >-
        III. Общеобразовательные организации, профессиональные образовательные организации, образовательные
        организации высшего образования, организации дополнительного профессионального образования
    - doc: pp-rf-415
      anchor: pril-1
      quote: >-
        5. Воспитатели, музыкальные руководители, работающие в группах для детей дошкольного возраста,
        за исключением воспитателей и музыкальных руководителей, указанных в пункте 4 настоящего раздела | 42
    - doc: pp-rf-415
      anchor: pril-1
      quote: >-
        4. Воспитатели, музыкальные руководители, работающие с обучающимися дошкольного возраста
        с ограниченными возможностями здоровья и (или) нуждающимися в длительном лечении | 56
  revision: 1
  checked: '2026-11-17'

- id: K-otpuska-005
  type: sequence
  difficulty: 3
  situation: >-
    В июне в отдел кадров школы пришли пять письменных заявлений об отпуске. Гардеробщица, пенсионерка
    по старости, работает в школе с сентября 2015 года и в марте этого года уже брала 10 дней отпуска
    без сохранения заработной платы, положенного ей как пенсионерке. Остальные заявители в этом году таких
    отпусков не брали, и других оснований для отпуска ни у кого нет.
    Помощник воспитателя поступает на бакалавриат, секретарь учится на нём. Высшее образование оба получают
    впервые, программы имеют государственную аккредитацию, секретарь учится успешно.
  question: >-
    Расположите заявления по наибольшей продолжительности отпуска, которую школа обязана предоставить,
    от самой короткой к самой длинной.
  items:
    - Гардеробщица просит отпуск без сохранения заработной платы
    - Учитель физкультуры регистрирует брак и просит отпуск без сохранения заработной платы
    - Помощник воспитателя допущен к вступительным испытаниям и просит отпуск на это время
    - Секретарь, заочница первого курса, просит отпуск на промежуточную аттестацию
    - Вахтёр с инвалидностью просит отпуск без сохранения заработной платы
  explanation: >-
    Сроки задают две статьи. По статье 128 работодатель обязан дать отпуск без сохранения заработной платы
    при регистрации брака до пяти календарных дней, работающему пенсионеру по старости до 14 календарных дней
    в году, работающему инвалиду до 60 дней в году. Гардеробщица 10 дней из своих 14 уже использовала, поэтому
    сейчас ей положено не больше 4. По статье 173 допущенному к вступительным испытаниям дают 15 календарных
    дней без сохранения заработной платы, а заочнику первого курса на промежуточную аттестацию 40 календарных
    дней с сохранением среднего заработка. Учебные гарантии положены, когда образование этого уровня получают
    впервые (статья 177).
  refs:
    - doc: tk-rf
      anchor: st-128
      quote: >-
        Работодатель обязан на основании письменного заявления работника предоставить отпуск без сохранения
        заработной платы
    - doc: tk-rf
      anchor: st-128
      quote: работающим пенсионерам по старости (по возрасту) - до 14 календарных дней в году
    - doc: tk-rf
      anchor: st-128
      quote: >-
        работникам в случаях рождения ребенка, регистрации брака, смерти близких родственников - до пяти
        календарных дней
    - doc: tk-rf
      anchor: st-128
      quote: работающим инвалидам - до 60 календарных дней в году
    - doc: tk-rf
      anchor: st-173
      quote: >-
        Работодатель обязан предоставить отпуск без сохранения заработной платы: работникам, допущенным
        к вступительным испытаниям, - 15 календарных дней
    - doc: tk-rf
      anchor: st-173
      quote: >-
        прохождения промежуточной аттестации на первом и втором курсах соответственно - по 40 календарных дней
    - doc: tk-rf
      anchor: st-177
      quote: >-
        Гарантии и компенсации работникам, совмещающим работу с получением образования, предоставляются
        при получении образования соответствующего уровня впервые.
  trap:
    kind: wording
    note: >-
      Гардеробщице как пенсионерке положено до 14 дней в году, но 10 из них она уже взяла в марте,
      поэтому в июне школа обязана дать ей не больше 4 дней, меньше, чем при регистрации брака.
  revision: 1
  checked: '2026-11-17'
