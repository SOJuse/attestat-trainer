- id: K-ohrana-truda-001
  type: single
  difficulty: 1
  situation: >-
    Школа направила учителя истории на обязательный периодический медицинский осмотр в клинику,
    с которой у неё заключён договор. Осмотр занял весь его рабочий день, уроки за него провели коллеги.
    Учитель спрашивает, кто платит за осмотр и заплатят ли ему за этот день.
  question: Что ему ответить? Выберите один вариант.
  options:
    - text: Осмотр оплачивает школа, а этот день не оплачивается
      correct: false
      why: >-
        На время прохождения обязательного осмотра за работником сохраняется средний заработок,
        поэтому день оплачивается.
    - text: Осмотр оплачивает учитель, а за этот день сохраняется средний заработок
      correct: false
      why: Обязательные медосмотры проводятся за счёт собственных средств работодателя, а не работника.
    - text: Осмотр оплачивает учитель, а этот день не оплачивается
      correct: false
      why: >-
        Неверны обе части: платит за осмотр школа, и средний заработок на время осмотра
        за учителем сохраняется.
    - text: Осмотр оплачивает школа, а за этот день сохраняется средний заработок
      correct: true
      why: >-
        Обязательные медосмотры работодатель организует за свой счёт, а на время осмотра
        сохраняет за работником место работы и средний заработок.
  explanation: >-
    Статья 214 ТК относит к обязанностям работодателя организацию обязательных предварительных
    и периодических медицинских осмотров за счёт собственных средств. На время осмотра за работником
    сохраняются место работы (должность) и средний заработок. Учитель проходил обязательный осмотр
    по направлению школы, поэтому сам за него не платит, а день оплачивается по среднему заработку.
  refs:
    - doc: tk-rf
      anchor: st-214
      quote: >-
        организацию проведения за счет собственных средств обязательных предварительных (при поступлении
        на работу) и периодических (в течение трудовой деятельности) медицинских осмотров
    - doc: tk-rf
      anchor: st-214
      quote: >-
        с сохранением за работниками места работы (должности) и среднего заработка на время прохождения
        указанных медицинских осмотров
  revision: 1
  checked: '2026-11-17'

- id: K-ohrana-truda-002
  type: single
  difficulty: 3
  situation: >-
    Уборщица служебных помещений во время работы упала на школьной лестнице, сильно ушибла плечо
    и ушла на больничный.
    По медицинскому заключению повреждение здоровья лёгкое. Директор приказом создал комиссию по расследованию:
    сам директор как председатель, специалист по охране труда, председатель профкома школы и завхоз,
    на которого приказом возложено обеспечение соблюдения требований охраны труда в этом здании.
    Уполномоченного по охране труда в школе нет.
  question: Что в составе комиссии не соответствует закону? Выберите один вариант.
  options:
    - text: В комиссию включён завхоз, отвечающий за охрану труда
      correct: true
      why: >-
        Лиц, на которых непосредственно возложено обеспечение требований охраны труда на объекте,
        где произошёл несчастный случай, в комиссию не включают. Завхоз отвечает именно за это здание.
    - text: Комиссию возглавляет директор, а не инспектор труда
      correct: false
      why: >-
        Комиссию возглавляет работодатель или его представитель. Государственного инспектора труда
        включают в комиссию при тяжёлом или смертельном несчастном случае, а здесь повреждение лёгкое.
    - text: В комиссию включён председатель профкома школы
      correct: false
      why: Представители выборного органа первичной профсоюзной организации прямо названы в составе комиссии.
    - text: В комиссию не включён представитель Социального фонда
      correct: false
      why: >-
        Представителей страховщика включают при расследовании тяжёлых и смертельных несчастных случаев
        с застрахованными. При лёгком повреждении здоровья этого не требуется.
    - text: В комиссии четыре человека, а нужно нечётное число
      correct: false
      why: Статья 229 требует, чтобы в комиссии было не менее трёх человек. Четыре члена этому условию отвечают.
  explanation: >-
    Состав комиссии по расследованию задаёт статья 229 ТК. При лёгком повреждении здоровья комиссию
    не менее чем из трёх человек возглавляет работодатель, в неё входят специалист по охране труда
    и представители профсоюза. Инспектор труда и представители страховщика добавляются при тяжёлом
    или смертельном случае. Лица, на которых непосредственно возложено обеспечение требований охраны труда
    на объекте, где произошёл случай, в комиссию не включаются, а завхоз отвечает именно за это здание.
  refs:
    - doc: tk-rf
      anchor: st-229
      quote: >-
        Лица, на которых непосредственно возложено обеспечение соблюдения требований охраны труда на участке
        (объекте), где произошел несчастный случай, в состав комиссии не включаются.
    - doc: tk-rf
      anchor: st-229
      quote: >-
        Комиссию возглавляет работодатель (его представитель), а в случаях, предусмотренных настоящим Кодексом,
        - должностное лицо
    - doc: tk-rf
      anchor: st-229
      quote: >-
        в результате которого один или несколько пострадавших получили тяжелые повреждения здоровья,
        либо несчастного случая (в том числе группового) со смертельным исходом в состав комиссии также
        включаются государственный инспектор труда
    - doc: tk-rf
      anchor: st-229
      quote: >-
        представители работодателя, представители выборного органа первичной профсоюзной организации
        или иного уполномоченного представительного органа работников
    - doc: tk-rf
      anchor: st-229
      quote: >-
        а при расследовании указанных несчастных случаев с застрахованными - представители исполнительного
        органа страховщика по месту регистрации работодателя в качестве страхователя
    - doc: tk-rf
      anchor: st-229
      quote: >-
        Для расследования несчастного случая работодатель (его представитель) незамедлительно образует
        комиссию в составе не менее трех человек.
  trap:
    kind: wording
    note: >-
      Оговорку о том, что завхоз отвечает за охрану труда в этом здании, легко прочитать как довод
      в его пользу. Именно таких лиц норма из комиссии исключает.
  revision: 1
  checked: '2026-11-17'

- id: K-ohrana-truda-003
  type: multiple
  difficulty: 2
  situation: >-
    Лаборант кабинета химии должен приготовить растворы кислот к практической работе. Вытяжной шкаф
    сломался, а без исправной вытяжки пары концентрированных кислот опасны для здоровья, и инструкция
    по охране труда такую работу запрещает. Лаборант отказался готовить растворы, пока шкаф не починят.
    Ремонт займёт неделю.
  question: Как директору поступить на эту неделю? Отметьте все верные варианты.
  options:
    - text: Поручить лаборанту на время ремонта другую работу
      correct: true
      why: >-
        При отказе работника от работы из-за опасности для жизни и здоровья работодатель обязан
        предоставить ему другую работу на время устранения опасности.
    - text: Не наказывать лаборанта за отказ готовить растворы
      correct: true
      why: >-
        Отказ от работы при опасности, возникшей из-за нарушения требований охраны труда,
        не влечёт дисциплинарной ответственности.
    - text: Поручить приготовить растворы учителю химии вместо лаборанта
      correct: false
      why: >-
        Опасность грозит любому, кто будет работать без вытяжки. Работодатель обязан приостановить такие
        работы до устранения угрозы, а не передать их другому работнику.
    - text: Перевести лаборанта на другую должность до конца года
      correct: false
      why: Другую работу дают на время устранения опасности, то есть на неделю ремонта, а не до конца года.
    - text: Оформить лаборанту на неделю отпуск без сохранения зарплаты
      correct: false
      why: >-
        Норма требует дать работнику другую работу, а если это невозможно, оплатить время простоя
        до устранения опасности. Отпуск без сохранения зарплаты по решению директора ни то, ни другое не заменяет.
  explanation: >-
    Статья 216 ТК даёт работнику право отказаться от работы, если из-за нарушения требований охраны
    труда возникла опасность для его жизни и здоровья. По статье 216.1 такой отказ не влечёт
    дисциплинарной ответственности, а работодатель обязан дать работнику другую работу на время
    устранения опасности; если это невозможно, он оплачивает простой. Сами опасные работы работодатель
    приостанавливает до устранения угрозы (статья 214), поэтому перепоручить их другому нельзя.
  refs:
    - doc: tk-rf
      anchor: st-216
      quote: >-
        отказ от выполнения работ в случае возникновения опасности для его жизни и здоровья вследствие
        нарушения требований охраны труда до устранения такой опасности
    - doc: tk-rf
      anchor: st-216-1
      quote: работодатель обязан предоставить работнику другую работу на время устранения такой опасности
    - doc: tk-rf
      anchor: st-216-1
      quote: >-
        до устранения такой опасности либо от выполнения работ с вредными и (или) опасными условиями труда,
        не предусмотренных трудовым договором, не влечет за собой привлечения его к дисциплинарной ответственности
    - doc: tk-rf
      anchor: st-216-1
      quote: время простоя работника до устранения опасности для его жизни и здоровья оплачивается работодателем
    - doc: tk-rf
      anchor: st-214
      quote: >-
        приостановление при возникновении угрозы жизни и здоровью работников производства работ, а также
        эксплуатации оборудования, зданий или сооружений
  revision: 1
  checked: '2026-11-17'

- id: K-ohrana-truda-004
  type: multiple
  difficulty: 2
  situation: >-
    В течение недели директору одно за другим сообщают о происшествиях с работниками. По каждому он должен
    сразу решить, создавать ли комиссию и проводить ли расследование.
  question: Какие из этих случаев подлежат расследованию как несчастные случаи? Отметьте все верные варианты.
  options:
    - text: Учитель в обеденный перерыв упал на школьной лестнице, сломал руку и ушёл на больничный
      correct: true
      why: >-
        Травма получена в рабочее время на территории работодателя, перерывы норма включает прямо,
        и она повлекла временную нетрудоспособность.
    - text: Завхоз по распоряжению директора поехал на своей машине на склад, попал в аварию и ушёл на больничный
      correct: true
      why: >-
        Поездка на личной машине, которую используют в служебных целях по распоряжению работодателя,
        прямо названа в перечне.
    - text: Учитель ехал из дома в школу на своей машине, которую для работы не использует, попал в аварию и ушёл на больничный
      correct: false
      why: >-
        Дорога на работу на личной машине попадает в перечень, когда машину используют в служебных целях
        по распоряжению работодателя или по соглашению сторон. У этого учителя такого нет.
    - text: Учитель труда поцарапал руку в мастерской, медсестра обработала ссадину, и он продолжил уроки
      correct: false
      why: >-
        Ссадина, не повлёкшая временной нетрудоспособности, считается микроповреждением. Работодатель
        учитывает и рассматривает её причины, но как несчастный случай она не расследуется.
    - text: Секретарь по поручению директора пешком понесла документы в управу, подвернула ногу и ушла на больничный
      correct: true
      why: >-
        Следование к месту выполнения поручения по распоряжению работодателя, в том числе пешком,
        прямо названо в перечне.
  explanation: >-
    Статья 227 ТК требует расследовать как несчастные случаи травмы, повлёкшие перевод на другую работу,
    временную или стойкую утрату трудоспособности либо смерть, если они произошли в одной из названных
    ситуаций. Среди них рабочее время на территории работодателя с перерывами, поездка на личной машине
    в служебных целях по распоряжению работодателя и следование к месту выполнения поручения, в том числе
    пешком. Ссадина без нетрудоспособности по статье 226 считается микроповреждением: работодатель её учитывает
    и рассматривает, но не расследует как несчастный случай.
  refs:
    - doc: tk-rf
      anchor: st-227
      quote: >-
        повлекшие за собой необходимость перевода пострадавших на другую работу, временную или стойкую утрату
        ими трудоспособности либо смерть пострадавших
    - doc: tk-rf
      anchor: st-227
      quote: >-
        в течение рабочего времени на территории работодателя либо в ином месте выполнения работы,
        в том числе во время установленных перерывов
    - doc: tk-rf
      anchor: st-227
      quote: >-
        либо на личном транспортном средстве в случае использования личного транспортного средства
        в производственных (служебных) целях по распоряжению работодателя (его представителя) или по соглашению
        сторон трудового договора
    - doc: tk-rf
      anchor: st-227
      quote: >-
        а также при следовании по распоряжению работодателя (его представителя) к месту выполнения работы
        (поручения) и обратно, в том числе пешком
    - doc: tk-rf
      anchor: st-226
      quote: не повлекшие расстройства здоровья или наступление временной нетрудоспособности
    - doc: tk-rf
      anchor: st-226
      quote: >-
        работодатель самостоятельно осуществляет учет и рассмотрение обстоятельств и причин, приведших
        к возникновению микроповреждений (микротравм) работников
  revision: 1
  checked: '2026-11-17'

- id: K-ohrana-truda-005
  type: sequence
  difficulty: 2
  situation: >-
    С последней специальной оценки условий труда в школе прошло почти пять лет, и директор готовит
    плановую. Комиссию по её проведению он уже создал приказом и возглавил сам. Исследования и измерения
    на рабочих местах будет проводить сторонняя организация.
  question: Расставьте этапы специальной оценки в правильном порядке.
  items:
    - Школа заключает договор с организацией, проводящей специальную оценку
    - Организация сообщает школе идентификационный номер специальной оценки
    - Эксперт организации проводит исследования и измерения на рабочих местах
    - Члены комиссии подписывают отчёт, а председатель утверждает его
    - Работников знакомят с результатами на их рабочих местах под роспись
  explanation: >-
    Специальную оценку проводят совместно с организацией, которую работодатель привлекает
    по гражданско-правовому договору (статья 8 Федерального закона № 426-ФЗ). До начала работ, но не позднее пяти рабочих дней после заключения договора организация получает
    в информационной системе учёта идентификационный номер. Сообщить его работодателю она обязана до начала работ. Протоколы исследований и измерений входят в отчёт,
    который подписывают все члены комиссии и утверждает председатель (статья 15). С результатами работников
    знакомят под роспись не позднее 30 календарных дней со дня утверждения отчёта.
  refs:
    - doc: fz-426
      anchor: st-8
      quote: >-
        Специальная оценка условий труда проводится совместно работодателем и организацией или организациями,
        соответствующими требованиям статьи 19 настоящего Федерального закона и привлекаемыми работодателем
        на основании гражданско-правового договора.
    - doc: fz-426
      anchor: st-8
      quote: >-
        до начала выполнения работ по проведению специальной оценки условий труда, но не позднее чем через
        пять рабочих дней со дня заключения с работодателем гражданско-правового договора о проведении
        специальной оценки условий труда
    - doc: fz-426
      anchor: st-8
      quote: >-
        обязана сообщить указанный идентификационный номер работодателю до начала выполнения работ
        по проведению специальной оценки условий труда
    - doc: fz-426
      anchor: st-15
      quote: >-
        протоколы проведения исследований (испытаний) и измерений идентифицированных вредных и (или) опасных
        производственных факторов
    - doc: fz-426
      anchor: st-15
      quote: >-
        Отчет о проведении специальной оценки условий труда, составленный на бумажном носителе или в форме
        электронного документа, подписывается всеми членами комиссии и утверждается председателем комиссии
    - doc: fz-426
      anchor: st-15
      quote: >-
        Работодатель организует ознакомление работников с результатами проведения специальной оценки условий
        труда на их рабочих местах под роспись в срок не позднее чем тридцать календарных дней со дня
        утверждения отчета
  revision: 1
  checked: '2026-11-17'
