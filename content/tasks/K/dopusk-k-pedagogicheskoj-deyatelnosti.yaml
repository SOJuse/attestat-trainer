- id: K-dopusk-k-pedagogicheskoj-deyatelnosti-001
  type: single
  difficulty: 1
  situation: >-
    Учитель химии должен был пройти обязательный периодический медицинский осмотр до 1 октября,
    но так и не сходил к врачам, потому что было некогда. 2 октября он как обычно пришёл на уроки.
    Медицинского заключения у него нет.
  question: Что обязан сделать директор? Выберите один вариант.
  options:
    - text: Не допускать его к работе до прохождения осмотра
      correct: true
      why: >-
        Статья 76 обязывает отстранить работника, который не прошёл обязательный медосмотр,
        и не допускать его к работе, пока причина не устранена.
    - text: Допустить его к урокам и дать неделю на осмотр
      correct: false
      why: Отсрочки норма не даёт. Пока осмотр не пройден, работать учитель не может.
    - text: Допустить его к урокам, но не начислять зарплату
      correct: false
      why: >-
        Зарплату не начисляют за время отстранения, когда работник не работает.
        Пускать учителя на уроки без медосмотра нельзя.
    - text: Объявить ему замечание и оставить на уроках
      correct: false
      why: Взыскание не заменяет отстранения. Без медосмотра учитель к работе не допускается.
    - text: Расторгнуть с ним договор за пропуск осмотра
      correct: false
      why: Норма требует отстранить работника до прохождения осмотра, а не увольнять его.
  explanation: >-
    Статья 76 Трудового кодекса обязывает работодателя отстранить от работы работника, который
    не прошёл в установленном порядке обязательный медицинский осмотр. Отстраняют на весь период,
    пока причина не устранена, то есть до прохождения осмотра. Учитель пропустил осмотр по своей вине,
    поэтому за время отстранения зарплата ему не начисляется.
  refs:
    - doc: tk-rf
      anchor: st-76
      quote: не прошедшего в установленном порядке обязательный медицинский осмотр
    - doc: tk-rf
      anchor: st-76
      quote: >-
        Работодатель отстраняет от работы (не допускает к работе) работника на весь период времени
        до устранения обстоятельств, явившихся основанием для отстранения от работы или недопущения к работе
  revision: 1
  checked: '2026-11-16'

- id: K-dopusk-k-pedagogicheskoj-deyatelnosti-002
  type: single
  difficulty: 2
  situation: >-
    В дошкольной группе школы работает младший воспитатель. Из отдела полиции пришло письмо:
    в отношении неё возбуждено уголовное дело о преступлении против общественной безопасности,
    идёт следствие. Она вину отрицает и просит оставить её на работе.
  question: Как должен поступить директор? Выберите один вариант.
  options:
    - text: Отстранить её на всё время производства по делу
      correct: true
      why: >-
        Статья 351.1 требует отстранить работника до прекращения уголовного дела
        или до вступления приговора в силу.
    - text: Отстранить её до передачи дела в суд
      correct: false
      why: >-
        Отстранение не заканчивается вместе со следствием. Оно длится и пока дело рассматривает суд,
        до вступления приговора в силу.
    - text: Отстранить её на два месяца, потом допустить
      correct: false
      why: Норма не ограничивает отстранение двумя месяцами. Его срок зависит от хода уголовного дела.
    - text: 'Не отстранять: она не педагогический работник'
      correct: false
      why: >-
        Статья 351.1 касается всех работников сферы образования и воспитания несовершеннолетних,
        а не одних педагогов.
    - text: Не отстранять, пока её вину не установит суд
      correct: false
      why: >-
        Для отстранения достаточно сведений правоохранительных органов об уголовном преследовании.
        Приговора ждать не нужно.
  explanation: >-
    Статья 351.1 Трудового кодекса обязывает отстранить работника сферы образования и воспитания
    несовершеннолетних, как только правоохранительные органы сообщили, что он подвергается уголовному
    преследованию за преступления из абзацев третьего и четвёртого части второй статьи 331.
    Преступления против общественной безопасности в абзаце третьем названы. Правило касается не только
    педагогов, поэтому младшего воспитателя тоже отстраняют. Отстранение длится весь период производства
    по делу: до его прекращения или до вступления приговора в силу.
  refs:
    - doc: tk-rf
      anchor: st-351-1
      quote: >-
        работодатель обязан отстранить от работы (не допускать к работе) работника в сфере образования,
        воспитания, развития несовершеннолетних
    - doc: tk-rf
      anchor: st-351-1
      quote: >-
        при получении от правоохранительных органов сведений о том, что данный работник подвергается
        уголовному преследованию за преступления, указанные в абзацах третьем и четвертом части второй статьи 331
    - doc: tk-rf
      anchor: st-351-1
      quote: >-
        Работодатель отстраняет от работы (не допускает к работе) работника на весь период производства
        по уголовному делу до его прекращения либо до вступления в силу приговора суда
    - doc: tk-rf
      anchor: st-331
      quote: >-
        основ конституционного строя и безопасности государства, мира и безопасности человечества,
        а также против общественной безопасности, за исключением случаев, предусмотренных частью третьей
        настоящей статьи
  revision: 1
  checked: '2026-11-17'

- id: K-dopusk-k-pedagogicheskoj-deyatelnosti-003
  type: multiple
  difficulty: 2
  situation: >-
    Школа ищет учителя истории. Пятеро кандидатов подходят по образованию, прошли медосмотр
    и принесли справки о судимости и уголовном преследовании. Решения комиссии по делам несовершеннолетних о допуске
    к педагогической деятельности ни у кого из них нет.
  question: Кого из кандидатов директор вправе принять на работу? Отметьте все верные варианты.
  options:
    - text: Того, чьё дело о преступлении против жизни и здоровья прекращено по реабилитирующим основаниям
      correct: true
      why: >-
        Тех, чьё уголовное преследование прекращено по реабилитирующим основаниям, статья 331
        прямо выводит из запрета.
    - text: Того, чьё дело о преступлении против жизни и здоровья прекращено по нереабилитирующим основаниям
      correct: false
      why: >-
        Такое прекращение из запрета не выводит. Без решения комиссии по делам несовершеннолетних
        кандидата не допускают, а решения нет.
    - text: Того, у кого погашена судимость за клевету, преступление небольшой тяжести
      correct: true
      why: >-
        Клевета прямо исключена из перечня преступлений против чести и достоинства. Преступление
        это не тяжкое, так что абзац четвёртый тоже не мешает.
    - text: Того, у кого погашена судимость за преступление небольшой тяжести против семьи и несовершеннолетних
      correct: false
      why: >-
        Запрет касается и тех, кто имел судимость за такие преступления в прошлом. Погашение
        без решения комиссии его не снимает.
    - text: Того, у кого не погашена судимость за умышленное тяжкое преступление против собственности
      correct: false
      why: >-
        Преступлений против собственности в перечне абзаца третьего нет, но абзац четвёртый
        не допускает людей с непогашенной судимостью за иные умышленные тяжкие преступления.
  explanation: >-
    Абзац третий части второй статьи 331 Трудового кодекса не допускает к педагогической деятельности
    тех, кто имеет или имел судимость либо подвергался уголовному преследованию за перечисленные
    преступления, среди них преступления против жизни и здоровья и против семьи и несовершеннолетних.
    Погашение судимости здесь не помогает. Из запрета выведены те, чьё преследование прекращено
    по реабилитирующим основаниям, а клевета прямо исключена из перечня. Часть кандидатов могла бы
    допустить комиссия по делам несовершеннолетних, но её решения нет. Непогашенная судимость за иное
    умышленное тяжкое преступление закрывает допуск по абзацу четвёртому.
  refs:
    - doc: tk-rf
      anchor: st-331
      quote: >-
        имеющие или имевшие судимость, подвергавшиеся уголовному преследованию (за исключением лиц,
        уголовное преследование в отношении которых прекращено по реабилитирующим основаниям)
        за преступления против жизни и здоровья
    - doc: tk-rf
      anchor: st-331
      quote: >-
        чести и достоинства личности (за исключением незаконной госпитализации в медицинскую организацию,
        оказывающую психиатрическую помощь в стационарных условиях, и клеветы)
    - doc: tk-rf
      anchor: st-331
      quote: >-
        половой неприкосновенности и половой свободы личности, против семьи и несовершеннолетних,
        здоровья населения и общественной нравственности
    - doc: tk-rf
      anchor: st-331
      quote: >-
        имеющие неснятую или непогашенную судимость за иные умышленные тяжкие и особо тяжкие преступления
    - doc: tk-rf
      anchor: st-331
      quote: >-
        могут быть допущены к педагогической деятельности при наличии решения комиссии по делам
        несовершеннолетних и защите их прав
  revision: 1
  checked: '2026-11-17'

- id: K-dopusk-k-pedagogicheskoj-deyatelnosti-004
  type: multiple
  difficulty: 3
  situation: >-
    Директор подбирает учителей и рабочего по обслуживанию здания. У каждого кандидата в прошлом
    была судимость или уголовное дело. Все собираются обратиться в комиссию по делам несовершеннолетних
    и защите их прав, созданную Правительством Москвы, за решением о допуске к той работе, на которую
    претендуют. По образованию и здоровью все подходят.
  question: Кому из них решение комиссии может открыть допуск к этой работе? Отметьте все верные варианты.
  options:
    - text: Учителя, у которого погашена судимость за преступление небольшой тяжести против жизни и здоровья
      correct: true
      why: >-
        Судимость за преступление небольшой или средней тяжести против жизни и здоровья входит
        в случаи, когда комиссия может допустить человека к педагогической деятельности.
    - text: Рабочего, у которого погашена судимость за преступление средней тяжести против общественной безопасности
      correct: true
      why: >-
        Для работы в сфере образования вне педагогических должностей статья 351.1 даёт комиссии
        такое же право допуска.
    - text: Учителя, чьё дело о преступлении средней тяжести против семьи и несовершеннолетних прекращено по нереабилитирующим основаниям
      correct: true
      why: >-
        Часть третья статьи 331 прямо называет тех, чьё преследование за такие преступления
        прекращено по нереабилитирующим основаниям.
    - text: Учителя, у которого погашена судимость за тяжкое преступление против жизни и здоровья
      correct: false
      why: >-
        Комиссия допускает только при преступлениях небольшой и средней тяжести. Для тяжкого
        преступления её решение запрет не снимает.
    - text: Учителя, у которого погашена судимость за преступление небольшой тяжести против половой неприкосновенности
      correct: false
      why: >-
        Преступлений против половой неприкосновенности в перечне части третьей нет, хотя в общем
        запрете абзаца третьего они есть.
  explanation: >-
    Часть третья статьи 331 Трудового кодекса позволяет допустить к педагогической деятельности
    по решению комиссии по делам несовершеннолетних того, кто имел судимость за преступление небольшой
    или средней тяжести из названных групп, или того, чьё преследование по такому обвинению прекращено
    по нереабилитирующим основаниям. Тяжкие преступления и преступления против половой неприкосновенности
    в эту часть не входят, и решение комиссии таким кандидатам не помогает. Для работы в сфере
    образования вне педагогических должностей то же правило записано в части третьей статьи 351.1.
  refs:
    - doc: tk-rf
      anchor: st-331
      quote: >-
        Лица из числа указанных в абзаце третьем части второй настоящей статьи, имевшие судимость
        за совершение преступлений небольшой тяжести и преступлений средней тяжести против жизни
        и здоровья, свободы, чести и достоинства личности
    - doc: tk-rf
      anchor: st-331
      quote: >-
        и клеветы), семьи и несовершеннолетних, здоровья населения и общественной нравственности,
        основ конституционного строя и безопасности государства, мира и безопасности человечества,
        а также против общественной безопасности
    - doc: tk-rf
      anchor: st-331
      quote: >-
        половой неприкосновенности и половой свободы личности, против семьи и несовершеннолетних,
        здоровья населения и общественной нравственности
    - doc: tk-rf
      anchor: st-331
      quote: >-
        и лица, уголовное преследование в отношении которых по обвинению в совершении этих преступлений
        прекращено по нереабилитирующим основаниям, могут быть допущены к педагогической деятельности
    - doc: tk-rf
      anchor: st-351-1
      quote: >-
        могут быть допущены к трудовой деятельности в сфере образования, воспитания, развития
        несовершеннолетних
  trap:
    kind: wording
    note: >-
      Кажется, что комиссия может снять любой запрет. Но допуск по её решению возможен только
      при преступлениях небольшой и средней тяжести и не по всем группам из абзаца третьего:
      преступлений против половой неприкосновенности в части третьей нет.
  revision: 1
  checked: '2026-11-17'

- id: K-dopusk-k-pedagogicheskoj-deyatelnosti-005
  type: matching
  difficulty: 3
  situation: >-
    В школе есть дошкольные группы и кружки. В ноябре директор беседует со студентами, которые хотят
    подработать в школе. Все они учатся без задолженностей.
  question: Сопоставьте студента и работу, к которой его сейчас можно допустить.
  pairs:
    - left: >-
        Студент 4 курса вуза по направлению «Химия», прошёл промежуточную аттестацию за три года,
        включая педагогические дисциплины
      right: Уроки по предмету своего направления подготовки
    - left: Студент 3 курса вуза по направлению «Физика», прошёл промежуточную аттестацию за два года
      right: Только кружки, подходящие к его направлению подготовки
    - left: >-
        Студентка последнего курса колледжа по специальности из группы «Образование и педагогические науки»,
        ей 19 лет
      right: Работа в дошкольных группах и начальных классах
    - left: Студентка последнего курса того же колледжа по той же специальности, ей 17 лет
      right: Пока никакая педагогическая работа
  explanation: >-
    Статья 46 Закона об образовании допускает студентов к педагогической работе в разных пределах.
    Студента вуза непедагогического направления допускают к урокам по предметам, соответствующим
    направлению, если он прошёл промежуточную аттестацию не менее чем за три года обучения, в том числе
    по педагогическим дисциплинам (часть 3). Студенту вуза, прошедшему аттестацию за два года, доступны
    дополнительные общеобразовательные программы подходящей направленности (часть 4). Студентов колледжа
    по специальностям группы «Образование и педагогические науки» допускают в последний год обучения
    к дошкольному и начальному общему образованию, но только совершеннолетних (часть 3.1). Соответствие
    программы вуза предмету или кружку определяет работодатель.
  refs:
    - doc: fz-273
      anchor: st-46
      quote: >-
        Лица, обучающиеся по образовательным программам высшего образования по иным специальностям
        и направлениям подготовки и успешно прошедшие не менее чем за три года обучения промежуточную
        аттестацию, в том числе по учебным предметам, дисциплинам (модулям) в области педагогической деятельности
    - doc: fz-273
      anchor: st-46
      quote: >-
        допускаются к занятию педагогической деятельностью по соответствующим специальности или направлению
        подготовки высшего образования обучающегося учебным предметам начального общего, основного общего
        и среднего общего образования
    - doc: fz-273
      anchor: st-46
      quote: >-
        К занятию педагогической деятельностью по дополнительным общеобразовательным программам допускаются
        лица, обучающиеся по образовательным программам высшего образования по специальностям и направлениям
        подготовки, соответствующим направленности дополнительных общеобразовательных программ, и успешно
        прошедшие промежуточную аттестацию не менее чем за два года обучения
    - doc: fz-273
      anchor: st-46
      quote: >-
        Совершеннолетние лица, обучающиеся по образовательным программам среднего профессионального
        образования по специальностям, входящим в укрупненную группу специальностей "Образование
        и педагогические науки"
    - doc: fz-273
      anchor: st-46
      quote: >-
        в последний год обучения допускаются к занятию педагогической деятельностью по образовательным
        программам дошкольного образования и начального общего образования
  trap:
    kind: wording
    note: >-
      Физик учится уже на третьем курсе, но для уроков нужна аттестация не менее чем за три года обучения,
      а у него пройдено два. Студентка колледжа на последнем курсе, но в последний год обучения допускают
      только совершеннолетних.
