- id: K-oplata-truda-001
  type: matching
  difficulty: 2
  situation: >-
    По правилам внутреннего трудового распорядка школы зарплату платят 10-го и 25-го числа.
    В этом месяце 25-е выпадает на субботу. Учительница уходит в ежегодный отпуск с понедельника, 20-го.
    Двое работников увольняются 15-го по собственному желанию: лаборант в этот день отработал смену,
    а сторож 15-го был на больничном и пришёл за деньгами через неделю.
  question: Сопоставьте выплату и срок, в который школа должна её сделать.
  pairs:
    - left: Отпускные учительнице
      right: Не позднее чем за три дня до начала отпуска
    - left: Все суммы, причитающиеся лаборанту
      right: В день увольнения
    - left: Все суммы, причитающиеся сторожу
      right: Не позднее следующего дня после его требования о расчёте
    - left: Зарплата, которую по правилам платят 25-го
      right: Накануне, в пятницу 24-го
  explanation: >-
    Статья 136 требует оплатить отпуск не позднее чем за три дня до его начала, а если день выплаты
    зарплаты совпал с выходным, платить накануне. По статье 140 с увольняемым рассчитываются в день
    увольнения. Если работник в этот день не работал, деньги выплачивают не позднее следующего дня
    после того, как он потребовал расчёт.
  refs:
    - doc: tk-rf
      anchor: st-136
      quote: Оплата отпуска производится не позднее чем за три дня до его начала.
    - doc: tk-rf
      anchor: st-136
      quote: >-
        При совпадении дня выплаты с выходным или нерабочим праздничным днем выплата заработной платы
        производится накануне этого дня.
    - doc: tk-rf
      anchor: st-140
      quote: >-
        При прекращении трудового договора выплата всех сумм, причитающихся работнику от работодателя,
        производится в день увольнения работника. Если работник в день увольнения не работал,
        то соответствующие суммы должны быть выплачены не позднее следующего дня после предъявления
        уволенным работником требования о расчете.
  trap:
    kind: wording
    note: Лаборант и сторож увольняются в один день, но сторож в день увольнения не работал.
  revision: 1
  checked: '2026-11-16'

- id: K-oplata-truda-002
  type: single
  difficulty: 1
  situation: >-
    Рабочий по комплексному обслуживанию здания работает по пятидневке, суббота у него выходной.
    Директор с его письменного согласия привлёк его к работе в субботу: нужно было собрать и расставить
    новую мебель к началу четверти. Рабочий попросил дать ему за эту субботу другой день отдыха,
    и директор согласился.
  question: Как оплатить ему работу в субботу и день отдыха? Выберите один вариант.
  options:
    - text: Субботу оплатить не менее чем в двойном размере, день отдыха не оплачивать
      correct: false
      why: >-
        Не менее чем в двойном размере выходной оплачивают, когда работник не берёт за него день отдыха.
        Рабочий выбрал день отдыха, поэтому повышенной оплаты нет.
    - text: Субботу оплатить в одинарном размере, день отдыха не оплачивать
      correct: true
      why: >-
        Если по желанию работника ему дают другой день отдыха, работу в выходной оплачивают
        в одинарном размере, а сам день отдыха не оплачивают.
    - text: Субботу оплатить в одинарном размере, день отдыха тоже оплатить
      correct: false
      why: >-
        Одинарная оплата субботы здесь верна, но день отдыха, взятый за работу в выходной,
        не оплачивается.
    - text: Субботу оплатить не менее чем в двойном размере, день отдыха тоже оплатить
      correct: false
      why: >-
        Здесь соединены два варианта, которые закон не складывает: либо повышенная оплата выходного,
        либо одинарная оплата и неоплачиваемый день отдыха.
  explanation: >-
    Работу в выходной день оплачивают не менее чем в двойном размере. Но по части четвёртой статьи 153
    по желанию работника ему может быть предоставлен другой день отдыха. Тогда работу в выходной оплачивают
    в одинарном размере, а день отдыха не оплачивают. Рабочий попросил день отдыха и получил его,
    значит, суббота оплачивается в одинарном размере.
  refs:
    - doc: tk-rf
      anchor: st-153
      quote: >-
        По желанию работника, работавшего в выходной или нерабочий праздничный день, ему может быть
        предоставлен другой день отдыха. В этом случае работа в выходной или нерабочий праздничный день
        оплачивается в одинарном размере, а день отдыха оплате не подлежит.
    - doc: tk-rf
      anchor: st-153
      quote: Работа в выходной или нерабочий праздничный день оплачивается не менее чем в двойном размере
  revision: 1
  checked: '2026-11-17'

- id: K-oplata-truda-003
  type: single
  difficulty: 2
  situation: >-
    Директор подготовил новое положение об оплате труда работников школы и направил проект с обоснованием
    в профком, который представляет большинство работников. Коллективный договор особого порядка принятия
    локальных актов не устанавливает. Через четыре рабочих дня профком прислал письменное мотивированное
    мнение: с проектом он не согласен и предлагает иначе распределить стимулирующие выплаты.
    Директор с этими предложениями не согласен.
  question: Что директор обязан сделать, прежде чем принять положение в своей редакции? Выберите один вариант.
  options:
    - text: 'Ничего: мнение получено в пятидневный срок, и положение можно принимать сразу'
      correct: false
      why: >-
        Пятидневный срок соблюдён, но получить мнение мало. Если директор с ним не согласен, он обязан в течение трёх дней
        провести с профкомом дополнительные консультации.
    - text: Передать разногласия в трудовую инспекцию и ждать месяц, пока она их проверит
      correct: false
      why: >-
        Месячный срок проверки относится к жалобе профкома на уже принятый акт. Решения инспекции
        до принятия положения закон не требует.
    - text: Провести консультации в течение трёх дней, а разногласия оформить протоколом
      correct: true
      why: >-
        При несогласии с мотивированным мнением профкома статья 372 требует дополнительных консультаций
        в течение трёх дней. Оставшиеся разногласия оформляют протоколом, после чего акт можно принять.
    - text: Добиться письменного согласия профкома, потому что без него положение не принимают
      correct: false
      why: >-
        Здесь положение принимают с учётом мнения профкома, а не с его согласия. Если консультации
        к согласию не привели, разногласия оформляют протоколом, и директор вправе принять акт.
  explanation: >-
    Локальные акты, которые устанавливают систему оплаты труда, работодатель принимает с учётом мнения
    представительного органа работников (часть четвёртая статьи 135). Порядок учёта мнения профкома
    задаёт статья 372: если профком с проектом не согласен, работодатель может принять его предложения
    либо обязан в течение трёх дней провести дополнительные консультации. Если согласия не достигли,
    разногласия оформляют протоколом, и после этого директор вправе принять положение. Профком может
    обжаловать его в трудовую инспекцию или в суд.
  refs:
    - doc: tk-rf
      anchor: st-135
      quote: >-
        Локальные нормативные акты, устанавливающие системы оплаты труда, принимаются работодателем
        с учетом мнения представительного органа работников.
    - doc: tk-rf
      anchor: st-372
      quote: >-
        работодатель может согласиться с ним либо обязан в течение трех дней после получения мотивированного
        мнения провести дополнительные консультации с выборным органом первичной профсоюзной организации
        работников
    - doc: tk-rf
      anchor: st-372
      quote: >-
        При недостижении согласия возникшие разногласия оформляются протоколом, после чего работодатель
        имеет право принять локальный нормативный акт, который может быть обжалован выборным органом
        первичной профсоюзной организации в соответствующую государственную инспекцию труда или в суд.
  revision: 1
  checked: '2026-11-17'

- id: K-oplata-truda-004
  type: multiple
  difficulty: 2
  situation: >-
    Учредитель с опозданием перечислил школе субсидию, и зарплату за первую половину месяца
    не выплатили в срок. Когда задержка превысила 15 дней, три учителя письменно известили директора
    и приостановили работу. Ещё через неделю деньги поступили. В понедельник директор вручил учителям
    письменные уведомления о том, что школа готова выплатить долг в день их выхода на работу.
  question: Что из этого верно? Отметьте все верные варианты.
  options:
    - text: Проценты за задержку не начисляют, потому что субсидию задержал учредитель
      correct: false
      why: >-
        Обязанность платить денежную компенсацию за задержку возникает независимо от вины работодателя,
        поэтому причина задержки значения не имеет.
    - text: За дни приостановления работы учителям сохраняется средний заработок
      correct: true
      why: >-
        Пока работник законно приостановил работу из-за задержки зарплаты, закон сохраняет
        за ним средний заработок.
    - text: Проценты за задержку начисляют с первого дня приостановления работы
      correct: false
      why: >-
        Отсчёт компенсации не связан с приостановлением работы. Её считают с первого дня просрочки,
        то есть со дня после установленного дня выплаты.
    - text: Проценты за задержку начисляют со дня, следующего за установленным днём выплаты
      correct: true
      why: >-
        Компенсацию начисляют за каждый день задержки, начиная со дня, следующего за днём,
        в который зарплату должны были выплатить.
    - text: Учителя обязаны выйти на работу в понедельник, в день вручения уведомления
      correct: false
      why: >-
        После письменного уведомления о готовности выплатить долг работник обязан выйти
        не позднее следующего рабочего дня, то есть не позднее вторника.
  explanation: >-
    При задержке зарплаты больше чем на 15 дней учитель вправе, письменно известив работодателя,
    приостановить работу (статья 142). На это время за ним сохраняется средний заработок, а выйти
    на работу он обязан не позднее следующего рабочего дня после письменного уведомления о готовности
    выплатить долг. Саму задержанную зарплату по статье 236 выплачивают с процентами за каждый день
    задержки, начиная со дня, следующего за установленным днём выплаты. Эта обязанность возникает
    независимо от вины работодателя, поэтому опоздание субсидии от процентов не освобождает.
  refs:
    - doc: tk-rf
      anchor: st-142
      quote: На период приостановления работы за работником сохраняется средний заработок.
    - doc: tk-rf
      anchor: st-142
      quote: >-
        обязан выйти на работу не позднее следующего рабочего дня после получения письменного уведомления
        от работодателя о готовности произвести выплату задержанной заработной платы в день выхода работника
        на работу
    - doc: tk-rf
      anchor: st-236
      quote: >-
        за каждый день задержки начиная со дня, следующего за днем, в который эти суммы должны были
        быть выплачены
    - doc: tk-rf
      anchor: st-236
      quote: >-
        Обязанность по выплате указанной денежной компенсации возникает независимо от наличия вины
        работодателя.
  revision: 1
  checked: '2026-11-17'

- id: K-oplata-truda-005
  type: multiple
  difficulty: 3
  situation: >-
    При сверке расчётов бухгалтерия школы нашла переплаты нескольким работникам. Директор хочет
    вернуть деньги, но работники возвращать их добровольно отказываются.
  question: В каких случаях закон допускает взыскать переплату с работника? Отметьте все верные варианты.
  options:
    - text: Бухгалтер неверно поняла положение об оплате и начислила учителю не положенную надбавку
      correct: false
      why: >-
        Это не счётная ошибка и не неправомерные действия работника, а ошибка в применении правил оплаты.
        Такая переплата с работника не взыскивается.
    - text: Бухгалтер ошиблась при сложении часов замен и начислила учителю лишние часы
      correct: true
      why: >-
        Ошибка в сложении относится к счётным, а при счётной ошибке закон разрешает взыскать
        излишне выплаченную зарплату.
    - text: Учредитель при проверке признал завышенной премию, которую директор назначил учителю
      correct: false
      why: >-
        Завышенная премия не подходит ни под одно исключение: здесь нет ни счётной ошибки,
        ни установленных судом неправомерных действий работника.
    - text: Суд установил, что учитель получал надбавку за учёную степень по поддельному диплому
      correct: true
      why: >-
        Переплата возникла из-за неправомерных действий самого работника, и их установил суд.
        Это один из случаев, когда взыскание допускается.
    - text: Бухгалтерия не получила приказ о снятии доплаты и ещё два месяца платила её лаборанту
      correct: false
      why: >-
        Лаборант ничего неправомерного не делал, а сбой с передачей приказа не счётная ошибка.
        Поэтому переплату с него взыскать нельзя.
  explanation: >-
    Часть четвёртая статьи 137 запрещает взыскивать с работника излишне выплаченную зарплату, даже если
    её переплатили из-за неправильного применения трудового законодательства. Исключений три: счётная
    ошибка, признанная органом по рассмотрению трудовых споров вина работника в невыполнении норм труда
    или простое и неправомерные действия работника, установленные судом. Ошибка в сложении часов счётная,
    а подделку диплома установил суд, поэтому эти переплаты взыскать можно. Неверное понимание положения,
    завышенная премия и запоздавший приказ ни к одному исключению не относятся.
  refs:
    - doc: tk-rf
      anchor: st-137
      quote: >-
        Заработная плата, излишне выплаченная работнику (в том числе при неправильном применении трудового
        законодательства или иных нормативных правовых актов, содержащих нормы трудового права), не может
        быть с него взыскана, за исключением случаев: счетной ошибки;
    - doc: tk-rf
      anchor: st-137
      quote: >-
        если заработная плата была излишне выплачена работнику в связи с его неправомерными действиями,
        установленными судом
  trap:
    kind: wording
    note: >-
      Переплата по недосмотру школы есть в трёх вариантах, но взыскать её позволяет только счётная ошибка.
      Неверное понимание положения и не дошедший до бухгалтерии приказ к ней не относятся.
  revision: 1
  checked: '2026-11-17'
