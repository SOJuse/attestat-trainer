- id: K-priem-na-rabotu-001
  type: input
  difficulty: 3
  situation: >-
    Школа берёт учителя физики по совместительству вести подготовку к экзаменам во втором полугодии.
    С ним заключают срочный трудовой договор с 1 февраля по 31 мая. Кандидату 40 лет, он давно
    работает в колледже. Директор хочет включить в договор условие об испытании.
  question: Какой наибольший срок испытания можно установить? Ответ в неделях.
  answer: 2
  unit: недели
  explanation: >-
    Общий предел испытания по статье 70 составляет три месяца. Но договор здесь заключается на четыре
    месяца, а при договоре на срок от двух до шести месяцев испытание не может превышать двух недель.
    Кандидат не относится к тем, кому испытание не устанавливается: договор длиннее двух месяцев,
    и он не выпускник, впервые поступающий на работу по специальности.
  refs:
    - doc: tk-rf
      anchor: st-70
      quote: >-
        При заключении трудового договора на срок от двух до шести месяцев испытание не может превышать
        двух недель.
  trap:
    kind: wording
    note: Договор срочный, на четыре месяца, поэтому общий предел в три месяца здесь не применяется.
  revision: 1
  checked: '2026-11-16'

- id: K-priem-na-rabotu-002
  type: single
  difficulty: 1
  situation: >-
    Школа принимает нового учителя музыки. Трудовой договор с ним подпишут 25 августа, к работе он
    приступит 1 сентября. Специалист по кадрам предлагает в день подписания только оформить договор,
    а с правилами внутреннего трудового распорядка и коллективным договором познакомить учителя
    под роспись, когда он выйдет на работу.
  question: Когда школа должна ознакомить учителя под роспись с этими документами? Выберите один вариант.
  options:
    - text: До подписания трудового договора
      correct: true
      why: >-
        Статья 68 требует ознакомить работника с правилами распорядка и коллективным договором
        при приёме на работу, до подписания договора.
    - text: В первый рабочий день учителя
      correct: false
      why: >-
        Так предлагает специалист по кадрам, но к первому рабочему дню договор уже будет подписан,
        а знакомить с документами нужно раньше.
    - text: В течение трёх рабочих дней после подписания договора
      correct: false
      why: >-
        Три рабочих дня даются на письменное оформление договора, если работника уже фактически
        допустили к работе. К ознакомлению с локальными актами этот срок не относится.
    - text: После издания приказа о приёме на работу
      correct: false
      why: >-
        Приказ издают на основании уже заключённого договора, и издавать его школа вправе, но не обязана.
        Ознакомление закон связывает с подписанием договора, а не с приказом.
  explanation: >-
    Часть третья статьи 68 обязывает работодателя при приёме на работу, до подписания трудового договора,
    ознакомить работника под роспись с правилами внутреннего трудового распорядка, другими локальными
    актами, связанными с его работой, и коллективным договором. Значит, 25 августа учителя сначала
    знакомят с документами, а потом подписывают с ним договор. Дата выхода на работу и приказ о приёме
    этот порядок не меняют.
  refs:
    - doc: tk-rf
      anchor: st-68
      quote: >-
        При приеме на работу (до подписания трудового договора) работодатель обязан ознакомить работника
        под роспись с правилами внутреннего трудового распорядка, иными локальными нормативными актами,
        непосредственно связанными с трудовой деятельностью работника, коллективным договором.
    - doc: tk-rf
      anchor: st-68
      quote: >-
        Работодатель вправе издать на основании заключенного трудового договора приказ (распоряжение)
        о приеме на работу.
    - doc: tk-rf
      anchor: st-67
      quote: >-
        При фактическом допущении работника к работе работодатель обязан оформить с ним трудовой договор
        в письменной форме не позднее трех рабочих дней со дня фактического допущения работника к работе
  revision: 1
  checked: '2026-11-17'

- id: K-priem-na-rabotu-003
  type: single
  difficulty: 2
  situation: >-
    3 июня директор отправил учителю химии из соседней школы письмо с приглашением перейти к нему
    на работу в порядке перевода. Учитель уволился с прежнего места в порядке перевода 30 июня
    и 21 июля пришёл заключать трудовой договор. За это время директор нашёл другого кандидата
    и хочет химику отказать. Препятствий для работы с детьми у химика нет.
  question: Может ли директор отказать ему в заключении трудового договора? Выберите один вариант.
  options:
    - text: Нельзя, со дня его увольнения ещё не прошёл месяц
      correct: true
      why: >-
        Тому, кого письменно пригласили на работу в порядке перевода, нельзя отказать в течение месяца
        со дня увольнения с прежнего места. С 30 июня месяц ещё не истёк.
    - text: Можно, со дня письменного приглашения прошло больше месяца
      correct: false
      why: >-
        Месяц отсчитывают не от письма с приглашением, а от увольнения с прежнего места работы,
        то есть от 30 июня.
    - text: Можно, если по его требованию письменно сообщить причину
      correct: false
      why: >-
        Обязанность письменно назвать причину отказа по требованию кандидата не делает законным отказ,
        который закон запрещает.
    - text: Нельзя, письменное приглашение уже считается трудовым договором
      correct: false
      why: >-
        Трудовой договор вступает в силу со дня подписания или фактического допуска к работе.
        Письмо с приглашением договором не становится, запрет отказа вытекает из другой нормы.
  explanation: >-
    Часть четвёртая статьи 64 запрещает отказывать в заключении трудового договора работнику, которого
    письменно пригласили на работу в порядке перевода от другого работодателя, в течение одного месяца
    со дня его увольнения с прежнего места работы. Здесь оба условия выполнены: приглашение было
    письменным, а с увольнения 30 июня прошло меньше месяца. Дата самого письма для отсчёта значения
    не имеет, поэтому отказать химику директор не вправе.
  refs:
    - doc: tk-rf
      anchor: st-64
      quote: >-
        Запрещается отказывать в заключении трудового договора работникам, приглашенным в письменной форме
        на работу в порядке перевода от другого работодателя, в течение одного месяца со дня увольнения
        с прежнего места работы.
    - doc: tk-rf
      anchor: st-64
      quote: >-
        По письменному требованию лица, которому отказано в заключении трудового договора, работодатель
        обязан сообщить причину отказа в письменной форме
    - doc: tk-rf
      anchor: st-61
      quote: Трудовой договор вступает в силу со дня его подписания работником и работодателем
  revision: 1
  checked: '2026-11-17'

- id: K-priem-na-rabotu-004
  type: multiple
  difficulty: 2
  situation: >-
    Школа принимает учителя физкультуры. Ему 21 год, он гражданин России, в июне окончил педагогический
    колледж и раньше нигде не работал. В армии он не служил, от призыва не освобождён. Специалист
    по кадрам составляет для него список документов.
  question: >-
    Что из этого школа вправе потребовать у него при заключении трудового договора? Отметьте все верные
    варианты.
  options:
    - text: Диплом об окончании колледжа
      correct: true
      why: >-
        Работа учителя требует специальной подготовки, а для такой работы статья 65 прямо называет
        документ об образовании и о квалификации.
    - text: Документы воинского учёта
      correct: true
      why: >-
        Их предъявляют военнообязанные и лица, подлежащие призыву. Молодой человек 21 года, который
        не служил и не освобождён от призыва, к ним относится.
    - text: Трудовую книжку или сведения о трудовой деятельности
      correct: false
      why: >-
        Их не предъявляет тот, кто заключает трудовой договор впервые, а учитель раньше нигде
        не работал.
    - text: Характеристику из колледжа
      correct: false
      why: >-
        Характеристики в перечне статьи 65 нет. Требовать документы сверх предусмотренных законами,
        указами Президента и постановлениями Правительства запрещено.
  explanation: >-
    Статья 65 перечисляет документы, которые предъявляет поступающий на работу, и для части из них
    называет условия. Документ об образовании нужен, потому что работа учителя требует специальной
    подготовки, документы воинского учёта нужны, потому что молодой человек подлежит призыву.
    Трудовую книжку и сведения о трудовой деятельности не предъявляют, когда трудовой договор
    заключается впервые. Требовать документы сверх предусмотренных законами и актами Президента
    и Правительства нельзя.
  refs:
    - doc: tk-rf
      anchor: st-65
      quote: >-
        документ об образовании и (или) о квалификации или наличии специальных знаний - при поступлении
        на работу, требующую специальных знаний или специальной подготовки
    - doc: tk-rf
      anchor: st-65
      quote: документы воинского учета - для военнообязанных и лиц, подлежащих призыву на военную службу
    - doc: tk-rf
      anchor: st-65
      quote: >-
        трудовую книжку и (или) сведения о трудовой деятельности (статья 66.1 настоящего Кодекса),
        за исключением случаев, если трудовой договор заключается впервые
    - doc: tk-rf
      anchor: st-65
      quote: >-
        Запрещается требовать от лица, поступающего на работу, документы помимо предусмотренных настоящим
        Кодексом, иными федеральными законами, указами Президента Российской Федерации и постановлениями
        Правительства Российской Федерации.
  revision: 1
  checked: '2026-11-17'

- id: K-priem-na-rabotu-005
  type: multiple
  difficulty: 3
  situation: >-
    Заведующий хозяйством школы без ведома директора пустил знакомого поработать дворником и пообещал,
    что договор оформят позже. Принимать людей на работу директор ему не поручал. Через две недели
    директор узнал об этом и отказался заключать с дворником трудовой договор.
  question: Что из этого верно? Отметьте все верные варианты.
  options:
    - text: Школа должна оплатить дворнику отработанное время
      correct: true
      why: >-
        Даже если работодатель отказался признать такие отношения трудовыми, фактически отработанное
        время он обязан оплатить.
    - text: Заведующего хозяйством могут привлечь к материальной ответственности
      correct: true
      why: >-
        Работник, который без полномочий допустил человека к работе, отвечает сам, и статья 67.1
        прямо упоминает материальную ответственность.
    - text: Заведующему хозяйством грозит административный штраф
      correct: true
      why: >-
        Часть 3 статьи 5.27 КоАП наказывает штрафом допуск к работе неуполномоченным лицом, если
        работодатель отказался признать отношения трудовыми. Директор как раз отказался.
    - text: Трудовой договор считается заключённым с первого дня работы дворника
      correct: false
      why: >-
        Договор без письменного оформления считается заключённым, если к работе допустили с ведома
        или по поручению работодателя или его уполномоченного представителя. Здесь допустил человек
        без полномочий, а директор признать отношения отказался.
    - text: Директор обязан оформить договор в течение трёх рабочих дней
      correct: false
      why: >-
        Этот срок действует, когда допуск к работе считается заключением договора. Здесь дворника допустил неуполномоченный человек без ведома директора, и работодатель вправе отказаться признать отношения трудовыми.
  explanation: >-
    Обычно работник, которого допустили к работе без письменного договора, считается принятым,
    и договор нужно оформить за три рабочих дня. Но так бывает, только если работник приступил к работе с ведома или по поручению работодателя или его уполномоченного представителя. Здесь заведующий хозяйством допустил дворника без полномочий и без ведома директора, поэтому работодатель может отказаться признать отношения трудовыми. Тогда школа оплачивает дворнику
    фактически отработанное время, а заведующий хозяйством отвечает сам: по статье 67.1 ТК, в том числе
    материально, и по части 3 статьи 5.27 КоАП.
  refs:
    - doc: tk-rf
      anchor: st-67-1
      quote: >-
        работодатель, в интересах которого была выполнена работа, обязан оплатить такому физическому
        лицу фактически отработанное им время (выполненную работу)
    - doc: tk-rf
      anchor: st-67-1
      quote: >-
        Работник, осуществивший фактическое допущение к работе, не будучи уполномоченным на это
        работодателем, привлекается к ответственности, в том числе материальной
    - doc: koap-rf
      anchor: st-5-27
      quote: >-
        Фактическое допущение к работе лицом, не уполномоченным на это работодателем, в случае, если
        работодатель или его уполномоченный на это представитель отказывается признать отношения
    - doc: koap-rf
      anchor: st-5-27
      quote: >-
        влечет наложение административного штрафа на граждан в размере от трех тысяч до пяти тысяч
        рублей; на должностных лиц
    - doc: tk-rf
      anchor: st-67
      quote: >-
        Трудовой договор, не оформленный в письменной форме, считается заключенным, если работник
        приступил к работе с ведома или по поручению работодателя или его уполномоченного на это
        представителя.
    - doc: tk-rf
      anchor: st-67
      quote: >-
        При фактическом допущении работника к работе работодатель обязан оформить с ним трудовой договор
        в письменной форме не позднее трех рабочих дней
  trap:
    kind: wording
    note: >-
      Дворника допустил к работе человек без полномочий, и директор об этом не знал, поэтому договор
      не возникает и правило о трёх рабочих днях здесь не действует. Если бы дворник приступил к работе
      с ведома директора, договор считался бы заключённым.
  revision: 1
  checked: '2026-11-17'
