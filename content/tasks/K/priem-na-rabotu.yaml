- id: K-priem-na-rabotu-001
  type: input
  difficulty: 3
  situation: >-
    Школа берёт учителя физики по совместительству вести подготовку к экзаменам во втором полугодии.
    С ним заключают срочный трудовой договор с 1 февраля по 31 мая. Кандидату 40 лет, он давно
    работает в колледже. Директор хочет включить в договор условие об испытании.
  question: Какой наибольший срок испытания можно установить? Ответ в неделях.
  answer: 2
  unit: недели
  explanation: >-
    Общий предел испытания по статье 70 составляет три месяца. Но договор здесь заключается на четыре
    месяца, а при договоре на срок от двух до шести месяцев испытание не может превышать двух недель.
    Кандидат не относится к тем, кому испытание не устанавливается: договор длиннее двух месяцев,
    и он не выпускник, впервые поступающий на работу по специальности.
  refs:
    - doc: tk-rf
      anchor: st-70
      quote: >-
        При заключении трудового договора на срок от двух до шести месяцев испытание не может превышать
        двух недель.
  trap:
    kind: wording
    note: Договор срочный, на четыре месяца, поэтому общий предел в три месяца здесь не применяется.
