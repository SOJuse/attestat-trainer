- id: K-rabochee-vremya-i-uchebnaya-nagruzka-001
  type: single
  difficulty: 1
  situation: >-
    В январе из-за сильного мороза школа на два дня отменила занятия для учеников начальных классов,
    остальные классы учатся по расписанию. Учителя начальных классов в эти дни уроков не ведут.
    Главный бухгалтер спрашивает директора, как оформить эти два дня для учителей.
  question: Как следует поступить директору? Выберите один вариант.
  options:
    - text: Считать эти дни рабочими и привлечь учителей к работе как в каникулы
      correct: true
      why: >-
        Пункт 36 относит отмену занятий по климатическим основаниям к рабочему времени педагогов,
        а пункт 37 велит привлекать их в эти дни к работе на условиях каникулярного времени.
    - text: Объявить простой и оплатить учителям эти дни в размере двух третей ставки
      correct: false
      why: >-
        Это не простой: пункт 36 называет дни отмены занятий рабочим временем, и учителя работают
        в них на условиях каникулярного времени с оплатой по трудовому договору и локальным актам.
    - text: Оформить учителям на эти дни отпуск без сохранения заработной платы
      correct: false
      why: Отпуск не нужен, потому что учителя в эти дни работают, это их рабочее время.
    - text: Считать эти дни выходными, а пропущенные уроки провести в каникулы
      correct: false
      why: Отмена занятий не делает дни выходными для учителей, пункт 36 прямо называет их рабочим временем.
  explanation: >-
    Особенности режима рабочего времени педагогов относят периоды отмены занятий по санитарно-эпидемиологическим,
    климатическим и другим основаниям к рабочему времени, причём и тогда, когда занятия отменены только
    в отдельных классах. В эти дни педагогов привлекают к работе в том порядке и на тех условиях, что и в каникулы.
    Каникулярное время, не совпадающее с отпуском, оплачивается в размере, предусмотренном трудовым договором
    и локальными нормативными актами школы.
  refs:
    - doc: prikaz-268
      anchor: pril-1-p-36
      quote: >-
        Периоды отмены (приостановки) занятий (деятельности организации по реализации образовательной
        программы, присмотру и уходу за детьми) для обучающихся в отдельных классах (группах) либо в целом
        по организации по санитарно-эпидемиологическим, климатическим и другим основаниям являются рабочим
        временем педагогических и иных работников.
      scan_page: 13
    - doc: prikaz-268
      anchor: pril-1-p-37
      quote: >-
        В периоды, указанные в пункте 36 Особенностей, педагогические работники и иные работники привлекаются
        к выполнению работ в порядке и на условиях, предусмотренных для режима рабочего времени работников
        организации в каникулярное время.
      scan_page: 13
    - doc: prikaz-268
      anchor: pril-1-p-26
      quote: >-
        являются для них рабочим временем с оплатой труда в размере, предусмотренном трудовым договором
        и локальными нормативными актами организации
      scan_page: 11
  revision: 1
  checked: '2026-11-17'

- id: K-rabochee-vremya-i-uchebnaya-nagruzka-002
  type: single
  difficulty: 2
  situation: >-
    В сентябре учителю математики установили учебную нагрузку 24 часа в неделю, этот объём записан
    в его трудовом договоре. В конце ноября часть учеников уехала, и школа решила с 1 декабря объединить
    два седьмых класса в один. У учителя освобождается пять часов в неделю. Учитель против снижения
    нагрузки и подписывать соглашение об этом не хочет.
  question: Может ли директор снизить ему нагрузку в этом учебном году? Выберите один вариант.
  options:
    - text: Может, но не раньше чем через два месяца после письменного уведомления
      correct: true
      why: >-
        Пункт 5 разрешает снижать нагрузку учителя в течение года при сокращении количества классов,
        а пункт 8 требует письменно сообщить о снижении и его причинах не позднее чем за два месяца.
    - text: Может с 1 декабря, издав приказ и ознакомив с ним учителя под подпись
      correct: false
      why: >-
        Снижение без согласия возможно, но о нём нужно письменно уведомить не позднее чем за два месяца.
        Приказ, который действует уже с 1 декабря, этот срок нарушает.
    - text: Не может, пока учитель не подпишет соглашение об изменении нагрузки
      correct: false
      why: >-
        Соглашение сторон нужно по общему правилу пункта 7, но снижение из-за сокращения количества классов
        названо в нём исключением.
    - text: Может, но не раньше 1 сентября следующего учебного года
      correct: false
      why: Ждать сентября не нужно, пункт 5 допускает такое снижение уже в текущем учебном году.
  explanation: >-
    Нагрузку, установленную на начало учебного года, работодатель по своей инициативе в течение года менять
    не может. Исключение есть для учителей и других педагогов с нормой 18 часов за ставку: их нагрузку можно
    снизить, если уменьшилось количество часов по учебному плану, обучающихся, групп или классов. Объединение
    двух седьмых классов сокращает количество классов, поэтому согласие учителя не требуется. Но о снижении
    и его причинах работодатель обязан письменно уведомить учителя не позднее чем за два месяца.
  refs:
    - doc: prikaz-269
      anchor: pril-2-p-5
      quote: >-
        Объем учебной нагрузки педагогических работников, установленный на начало учебного года, не может
        быть изменен в текущем учебном году по инициативе работодателя
      scan_page: 8
    - doc: prikaz-269
      anchor: pril-2-p-5
      quote: >-
        указанных в пункте 11 приложения № 1 к настоящему приказу, в сторону её снижения, связанного
        с уменьшением количества часов по учебным планам, учебным графикам, сокращением количества
        обучающихся, занимающихся, групп, сокращением количества классов
      scan_page: 9
    - doc: prikaz-269
      anchor: pril-1-p-11
      quote: >-
        Норма часов учебной (преподавательской) работы 18 часов в неделю за ставку заработной платы
        устанавливается: учителям организаций, осуществляющих образовательную деятельность по образовательным
        программам начального общего образования, основного общего образования и среднего общего образования
      scan_page: 5
    - doc: prikaz-269
      anchor: pril-2-p-7
      quote: >-
        допускается только по соглашению сторон трудового договора, заключаемого в письменной форме,
        за исключением изменения объема учебной нагрузки педагогических работников в сторону его снижения,
        предусмотренного пунктами 5 и 6 Порядка
      scan_page: 9
    - doc: prikaz-269
      anchor: pril-2-p-8
      quote: >-
        Об изменениях объема учебной нагрузки (увеличение или снижение), а также о причинах, вызвавших
        необходимость таких изменений, работодатель обязан уведомить педагогических работников в письменной
        форме не позднее чем за два месяца до осуществления предполагаемых изменений
      scan_page: 9
  revision: 1
  checked: '2026-11-17'

- id: K-rabochee-vremya-i-uchebnaya-nagruzka-003
  type: multiple
  difficulty: 2
  situation: >-
    В конце августа директор распределяет поручения на новый учебный год. Учительнице химии,
    которая работает в школе первый год, он хочет поручить сразу несколько дел. Учительница спрашивает,
    что из этого входит в её работу за ставку, а на что нужно её письменное согласие и отдельная доплата.
  question: >-
    Какие из этих поручений даются учительнице только с её письменного согласия и за дополнительную оплату?
    Отметьте все верные варианты.
  options:
    - text: Классное руководство в 8 «Б» классе
      correct: true
      why: Классное руководство прямо названо в пункте 16 среди дополнительных работ за дополнительную оплату.
    - text: Проверка письменных работ учеников
      correct: true
      why: >-
        Проверку письменных работ пункт 16 тоже относит к дополнительной работе, которая выполняется
        с письменного согласия педагога за дополнительную оплату.
    - text: Руководство методическим объединением учителей естественных наук
      correct: true
      why: Руководство методическим объединением стоит в перечне дополнительной работы пункта 16 отдельной строкой.
    - text: Участие в работе методического объединения учителей естественных наук
      correct: false
      why: >-
        Участие в работе методических объединений пункт 14 относит к должностным обязанностям педагога,
        а в перечне дополнительной работы стоит руководство объединением.
    - text: Ведение электронного журнала и дневников своих классов
      correct: false
      why: Ведение журнала и дневников в электронной или бумажной форме входит в должностные обязанности по пункту 14.
    - text: Кратковременные дежурства на переменах по графику школы
      correct: false
      why: >-
        Периодические кратковременные дежурства во время образовательного процесса пункт 14 включает
        в должностные обязанности, то есть в работу за ставку.
  explanation: >-
    Особенности режима рабочего времени педагогов разводят два перечня. Пункт 14 называет работы, которые
    входят в должностные обязанности учителя: ведение журнала и дневников, участие в педагогических советах
    и методических объединениях, родительские собрания, периодические кратковременные дежурства. Пункт 16
    перечисляет дополнительную работу, которая выполняется с письменного согласия за дополнительную оплату:
    классное руководство, проверку письменных работ, заведование кабинетом, руководство методическим объединением.
  refs:
    - doc: prikaz-268
      anchor: pril-1-p-16
      quote: >-
        К видам дополнительной работы, непосредственно связанной с образовательной деятельностью,
        осуществляемой с письменного согласия педагогических работников за дополнительную оплату, относятся
      scan_page: 8
    - doc: prikaz-268
      anchor: pril-1-p-16
      quote: >-
        б) классное руководство; в) проверка письменных работ; г) заведование учебными кабинетами,
        лабораториями, мастерскими, учебно-опытными участками; д) руководство методическими объединениями
      scan_page: 8
    - doc: prikaz-268
      anchor: pril-1-p-14
      quote: >-
        К видам работ, непосредственно входящих в должностные обязанности педагогических работников
        в соответствии с квалификационными характеристиками относятся
      scan_page: 7
    - doc: prikaz-268
      anchor: pril-1-p-14
      quote: >-
        выполнение обязанностей, связанных с участием в работе педагогических советов, методических советов
        (объединений), работой по проведению родительских собраний
      scan_page: 7
    - doc: prikaz-268
      anchor: pril-1-p-14
      quote: ведение журнала и дневников обучающихся в электронной (либо в бумажной) форме
      scan_page: 7
    - doc: prikaz-268
      anchor: pril-1-p-14
      quote: >-
        периодические кратковременные дежурства в организации в период осуществления образовательного процесса
      scan_page: 7
  revision: 1
  checked: '2026-11-17'

- id: K-rabochee-vremya-i-uchebnaya-nagruzka-004
  type: multiple
  difficulty: 3
  situation: >-
    1 октября заболела учительница истории, её уроки с 1 по 31 октября вёл учитель обществознания,
    в ноябре она вернулась. Учительница литературы болеет с начала учебного года, её уроки со 2 сентября
    без перерыва ведёт учительница русского языка, и выхода коллеги пока не ждут. Сегодня 25 ноября,
    директор оформляет оплату замещений.
  question: Как школа должна оформить и оплатить эти замещения? Отметьте все верные варианты.
  options:
    - text: Учителю обществознания часы замещения оплачивают дополнительно, по часам
      correct: true
      why: Замещение длилось один месяц, а замещение не дольше двух месяцев оплачивается дополнительно по часам.
    - text: Учительнице русского языка нагрузку уточняют со 2 сентября, со дня начала замещения
      correct: true
      why: >-
        Замещение идёт непрерывно больше двух месяцев, и в таком случае объём нагрузки уточняется
        со дня начала замещения.
    - text: С учительницей русского языка заключают дополнительное соглашение к трудовому договору
      correct: true
      why: Пункт 20 называет способ уточнения нагрузки прямо, это дополнительное соглашение к трудовому договору.
    - text: Учительнице русского языка нагрузку уточняют со 2 ноября, когда замещение превысило два месяца
      correct: false
      why: >-
        Превышение двух месяцев лишь включает правило пункта 20, а нагрузку по нему уточняют со дня начала
        замещения, то есть со 2 сентября.
    - text: С учителем обществознания заключают дополнительное соглашение и пересчитывают месячную оплату
      correct: false
      why: >-
        Дополнительное соглашение и перерасчёт нужны при непрерывном замещении свыше двух месяцев,
        а месячное замещение оплачивают по часам.
    - text: Учительнице русского языка часы замещения оплачивают по часам, пока коллега не вернётся
      correct: false
      why: Почасовая оплата годится для замещения не дольше двух месяцев, здесь этот срок уже пройден.
  explanation: >-
    Порядок определения учебной нагрузки различает два случая. Замещение отсутствующего учителя, которое
    продолжалось не более двух месяцев, оплачивается дополнительно по часам: так оплачивают учителя
    обществознания. Если замещение идёт непрерывно свыше двух месяцев, нагрузку замещающего учителя уточняют
    дополнительным соглашением и пересчитывают месячную оплату, причём со дня начала замещения, а не с того
    дня, когда истекли два месяца.
  refs:
    - doc: prikaz-269
      anchor: pril-2-p-19
      quote: >-
        Учебная нагрузка учителей и преподавателей, выполненная ими в порядке замещения временно отсутствующих
        по болезни и другим причинам других учителей и преподавателей, продолжавшегося не более двух месяцев,
        оплачивается дополнительно на условиях почасовой оплаты.
      scan_page: 12
    - doc: prikaz-269
      anchor: pril-2-p-20
      quote: >-
        если замещение отсутствующих учителей и преподавателей продолжается непрерывно свыше двух месяцев,
        то объем учебной нагрузки учителей и преподавателей, осуществляющих такое замещение, уточняется
        со дня его начала
      scan_page: 12
    - doc: prikaz-269
      anchor: pril-2-p-20
      quote: >-
        путем заключения дополнительного соглашения к трудовому договору и производится перерасчет месячной
        оплаты их труда с учетом увеличенного объема учебной нагрузки
      scan_page: 12
  trap:
    kind: wording
    note: >-
      Увеличенную нагрузку учитывают со дня начала замещения, а не с того дня, когда замещение перевалило
      за два месяца.
  revision: 1
  checked: '2026-11-17'

- id: K-rabochee-vremya-i-uchebnaya-nagruzka-005
  type: input
  difficulty: 2
  situation: >-
    В государственной школе мужчина 45 лет работает на полную ставку рабочим по комплексному обслуживанию
    здания и там же по внутреннему совместительству на полставки дворником. Коллективный договор школы
    разрешает сверхурочную работу до 240 часов в год. Директор хочет при необходимости привлекать этого
    работника к сверхурочной работе с его письменного согласия.
  question: Сколько часов сверхурочной работы в год ему можно поручить самое большее? Ответ дайте в часах.
  answer: 120
  unit: часов
  explanation: >-
    По статье 99 сверхурочная работа не должна превышать 120 часов в год, а коллективный договор может
    поднять этот предел до 240 часов. Но для работников государственных и муниципальных учреждений, которые
    работают по внутреннему совместительству больше одной четвёртой месячной нормы, кодекс отдельно установил
    предел 120 часов в год. Полставки по совместительству больше четверти нормы, поэтому для этого работника
    предел 120 часов.
  refs:
    - doc: tk-rf
      anchor: st-99
      quote: >-
        Продолжительность сверхурочной работы не должна превышать для каждого работника 4 часов в день
        и 120 часов в год, за исключением случаев, предусмотренных настоящим Кодексом.
    - doc: tk-rf
      anchor: st-99
      quote: >-
        Продолжительность сверхурочной работы для каждого работника может быть увеличена до 240 часов в год,
        если это предусмотрено коллективным договором и (или) отраслевым (межотраслевым) соглашением,
        распространяющимся на данного работодателя.
    - doc: tk-rf
      anchor: st-99
      quote: >-
        Продолжительность сверхурочной работы не должна превышать 120 часов в год для следующих категорий
        работников: 1) работники государственных и муниципальных учреждений, продолжительность работы которых
        по внутреннему совместительству превышает одну четвертую месячной нормы рабочего времени
  revision: 1
  checked: '2026-11-17'
