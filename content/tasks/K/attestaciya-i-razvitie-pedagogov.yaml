- id: K-attestaciya-i-razvitie-pedagogov-001
  type: single
  difficulty: 1
  situation: >-
    Учительница математики переехала из Тульской области в Москву. В 2025 году в Тульской области ей
    установили высшую квалификационную категорию по должности учителя. Московская школа принимает её
    на ту же должность учителя математики. Бухгалтер спрашивает директора, как быть с её категорией.
  question: Как директору поступить? Выберите один вариант.
  options:
    - text: Категория за ней сохраняется и учитывается при оплате труда в школе
      correct: true
      why: >-
        Пункт 44 порядка аттестации сохраняет первую и высшую категории при переходе в другую организацию,
        в том числе в другом субъекте, и называет их основанием для дифференциации оплаты труда.
    - text: Категория действовала в Тульской области, в Москве её нужно устанавливать заново
      correct: false
      why: >-
        Переход в организацию другого субъекта Российской Федерации прямо назван в пункте 44 среди случаев,
        когда категория сохраняется.
    - text: Категория сохраняется, если её подтвердит аттестационная комиссия школы
      correct: false
      why: Пункт 44 не ставит сохранение категории в зависимость от решения комиссии новой школы.
    - text: Категорию начнут учитывать после аттестации на соответствие занимаемой должности
      correct: false
      why: >-
        Пункт 44 сохраняет категорию при переходе сразу и не требует для этого никакой новой аттестации.
    - text: Категория сохраняется до конца учебного года, затем нужна новая аттестация
      correct: false
      why: Пункт 44 не ограничивает сохранение категории после перехода концом учебного года.
  explanation: >-
    По пункту 44 порядка аттестации первая и высшая категории сохраняются при переходе в другую организацию,
    в том числе в другом субъекте Российской Федерации, и служат основанием для дифференциации оплаты труда.
    Подтверждения или новой аттестации для этого пункт не требует. Поэтому московская школа учитывает высшую
    категорию учительницы при оплате труда.
  refs:
    - doc: prikaz-196
      anchor: pril-1-p-44
      quote: >-
        Квалификационные категории (первая, высшая), установленные педагогическим работникам, сохраняются
        при переходе в другую организацию, в том числе расположенную в другом субъекте Российской Федерации,
        а также являются основанием для дифференциации оплаты труда педагогических работников.
      scan_page: 15
  revision: 1
  checked: '2026-11-17'

- id: K-attestaciya-i-razvitie-pedagogov-002
  type: single
  difficulty: 2
  situation: >-
    Аттестационная комиссия школы признала учителя информатики не соответствующим занимаемой должности.
    Директор решил расторгнуть с ним трудовой договор по этому основанию. Единственная вакансия в школе:
    должность лаборанта с меньшей зарплатой, и по состоянию здоровья учитель может на ней работать.
    В профсоюзе учитель не состоит.
  question: Как директор должен действовать? Выберите один вариант.
  options:
    - text: Уволить его, ведь вакансии предлагают при сокращении штата, а не после аттестации
      correct: false
      why: >-
        Статья 81 требует искать перевод при увольнении и по пункту 2 (сокращение), и по пункту 3
        (несоответствие должности по результатам аттестации).
    - text: Предложить ему перевод на должность лаборанта и уволить, если он не согласится
      correct: true
      why: >-
        Увольнение по результатам аттестации допускается, если работника нельзя перевести с его письменного
        согласия на другую имеющуюся работу, в том числе нижестоящую или нижеоплачиваемую. Должность лаборанта
        подходит учителю по здоровью, значит, её надо предложить.
    - text: Перевести его на должность лаборанта приказом, не спрашивая согласия учителя
      correct: false
      why: Статья 81 говорит здесь о переводе с письменного согласия работника, а не по приказу работодателя.
    - text: Уволить его, если увольнение рекомендовала аттестационная комиссия
      correct: false
      why: >-
        Статья 81 не ставит увольнение в зависимость от рекомендации комиссии. Нужны результат аттестации
        и невозможность перевода, поэтому должность лаборанта сначала надо предложить.
    - text: Не увольнять, пока через год повторная аттестация не даст тот же результат
      correct: false
      why: >-
        Статья 81 связывает увольнение с результатами проведённой аттестации и невозможностью перевода.
        Повторной аттестации она не требует.
  explanation: >-
    Пункт 3 части первой статьи 81 ТК РФ позволяет уволить работника за несоответствие должности вследствие
    недостаточной квалификации, подтверждённой результатами аттестации. Но часть третья той же статьи допускает
    такое увольнение, если работника нельзя перевести с его письменного согласия на другую имеющуюся работу,
    включая нижестоящую или нижеоплачиваемую, которую он может выполнять по состоянию здоровья. Поэтому директор
    сначала предлагает учителю должность лаборанта и увольняет его, если тот на перевод не согласится.
  refs:
    - doc: tk-rf
      anchor: st-81
      quote: >-
        несоответствия работника занимаемой должности или выполняемой работе вследствие недостаточной
        квалификации, подтвержденной результатами аттестации
    - doc: tk-rf
      anchor: st-81
      quote: >-
        Увольнение по основанию, предусмотренному пунктом 2 или 3 части первой настоящей статьи, допускается,
        если невозможно перевести работника с его письменного согласия на другую имеющуюся у работодателя работу
    - doc: tk-rf
      anchor: st-81
      quote: >-
        как вакантную должность или работу, соответствующую квалификации работника, так и вакантную нижестоящую
        должность или нижеоплачиваемую работу), которую работник может выполнять с учетом его состояния здоровья
  revision: 1
  checked: '2026-11-17'

- id: K-attestaciya-i-razvitie-pedagogov-003
  type: multiple
  difficulty: 2
  situation: >-
    Завуч подготовил черновик распорядительного акта об аттестации педагогов на соответствие занимаемой
    должности в этом учебном году. Директор проверяет список. Ни у кого в нём, кроме учителя музыки,
    квалификационной категории нет.
  question: Кого из них нельзя включать в список аттестуемых? Отметьте все верные варианты.
  options:
    - text: 'Учитель физики: в школе первый год, до этого 12 лет преподавал физику в другой школе'
      correct: true
      why: >-
        Подпункт «б» пункта 22 считает стаж в занимаемой должности в той организации, где проводится
        аттестация. В этой школе он работает первый год и до конца учебного года двух лет не наберёт,
        а прежний стаж не в счёт.
    - text: 'Учительница начальных классов: в школе девять лет, полгода назад вышла из отпуска по уходу за ребёнком'
      correct: true
      why: >-
        После отпуска по уходу за ребёнком аттестация возможна не ранее чем через два года после выхода.
        Полгода назад вышла, значит, время ещё не пришло.
    - text: 'Учитель музыки: в школе десять лет, в прошлом году получил первую квалификационную категорию'
      correct: true
      why: Педагоги, имеющие квалификационные категории, аттестацию на соответствие должности не проходят.
    - text: 'Учительница русского языка: в школе семь лет, весной три месяца подряд была на больничном'
      correct: false
      why: >-
        Из-за болезни от аттестации освобождает отсутствие на работе более четырёх месяцев. Три месяца
        под это правило не подпадают.
    - text: 'Учитель истории: в школе шесть лет, сам входит в аттестационную комиссию школы'
      correct: false
      why: >-
        Член комиссии аттестацию проходит, он только не голосует по своей кандидатуре (пункт 16 порядка).
  explanation: >-
    Пункт 22 порядка аттестации называет, кто не проходит аттестацию на соответствие занимаемой должности.
    Среди них педагоги с квалификационными категориями, проработавшие в должности менее двух лет в той
    организации, где проводится аттестация, работники в отпуске по уходу за ребёнком и отсутствовавшие
    из-за болезни более четырёх месяцев. Вышедших из отпуска по уходу за ребёнком можно аттестовать
    не ранее чем через два года после выхода. Членство в аттестационной комиссии от аттестации не освобождает.
  refs:
    - doc: prikaz-196
      anchor: pril-1-p-22
      quote: >-
        проработавшие в занимаемой должности менее двух лет в организации, в которой проводится аттестация
      scan_page: 8
    - doc: prikaz-196
      anchor: pril-1-p-22
      quote: >-
        лица, находящиеся в отпуске по уходу за ребенком до достижения им возраста трех лет
      scan_page: 8
    - doc: prikaz-196
      anchor: pril-1-p-22
      quote: >-
        Аттестация педагогических работников, предусмотренных подпунктами «г» и «д» настоящего пункта,
        возможна не ранее чем через два года после их выхода из указанных отпусков.
      scan_page: 8
    - doc: prikaz-196
      anchor: pril-1-p-22
      quote: >-
        Аттестацию в целях подтверждения соответствия занимаемой должности не проходят следующие педагогические
        работники: а) педагогические работники, имеющие квалификационные категории
      scan_page: 8
    - doc: prikaz-196
      anchor: pril-1-p-22
      quote: отсутствовавшие на рабочем месте более четырех месяцев в связи с заболеванием
      scan_page: 8
    - doc: prikaz-196
      anchor: pril-1-p-16
      quote: >-
        При прохождении аттестации педагогический работник, являющийся членом аттестационной комиссии
        организации, не участвует в голосовании по своей кандидатуре.
      scan_page: 7
  revision: 1
  checked: '2026-11-17'

- id: K-attestaciya-i-razvitie-pedagogov-004
  type: multiple
  difficulty: 3
  situation: >-
    Директор готовит учителя истории к должности заместителя директора и направляет его на профессиональную
    переподготовку по программе управления образовательными организациями. Учёба очная, с отрывом от работы,
    идёт шесть недель. Проходит она в государственном педагогическом университете, который находится
    в Москве, как и сама школа.
  question: Что верно в этой ситуации? Отметьте все верные варианты.
  options:
    - text: На такую программу работодатель может направить педагога
      correct: true
      why: >-
        Закон об образовании прямо называет переподготовку для новой квалификации в области управления
        образовательными организациями среди программ, по которым педагог учится по направлению работодателя.
    - text: На время учёбы за учителем сохраняется его должность
      correct: true
      why: >-
        При направлении на дополнительное профессиональное образование с отрывом от работы за работником
        сохраняется место работы (должность).
    - text: На время учёбы учителю сохраняется средняя заработная плата
      correct: true
      why: Статья 187 ТК РФ сохраняет за ним среднюю заработную плату по основному месту работы.
    - text: Школа оплачивает ему расходы по правилам служебной командировки
      correct: false
      why: >-
        Командировочные расходы оплачивают, когда работника направляют учиться в другую местность.
        Университет находится в том же городе, что и школа.
    - text: Программа не годится, педагога направляют учиться по профилю его предмета
      correct: false
      why: >-
        По профилю педагогической деятельности идёт повышение квалификации. Переподготовка возможна
        и в области управления образовательными организациями.
    - text: На время учёбы учителю оформляют отпуск без сохранения заработной платы
      correct: false
      why: >-
        Это противоречит статье 187 ТК РФ: на время учёбы с отрывом от работы за работником сохраняются
        место работы и средняя заработная плата.
  explanation: >-
    Часть 5.1 статьи 47 закона об образовании допускает дополнительное профессиональное образование педагога
    по направлению работодателя не только по профилю его работы, но и в виде переподготовки для новой
    квалификации в области управления образовательными организациями. Статья 187 ТК РФ при направлении
    на такое обучение с отрывом от работы сохраняет за работником место работы (должность) и среднюю
    заработную плату. Командировочные расходы она добавляет при направлении в другую местность, а здесь
    университет и школа в одном городе.
  refs:
    - doc: fz-273
      anchor: st-47
      quote: >-
        Дополнительное профессиональное образование педагогических работников по направлению работодателя
        осуществляется по программам повышения квалификации по профилю педагогической деятельности
        или по программам профессиональной переподготовки для приобретения новой квалификации в области
        педагогической деятельности или управления образовательными организациями.
    - doc: tk-rf
      anchor: st-187
      quote: >-
        с отрывом от работы за ним сохраняются место работы (должность) и средняя заработная плата
        по основному месту работы
    - doc: tk-rf
      anchor: st-187
      quote: >-
        Работникам, направляемым на профессиональное обучение или дополнительное профессиональное образование,
        на прохождение независимой оценки квалификации с отрывом от работы в другую местность, производится
        оплата командировочных расходов
  trap:
    kind: wording
    note: >-
      Учёба идёт в том же городе, где работает учитель. Командировочные расходы статья 187 связывает
      с направлением в другую местность.
  revision: 1
  checked: '2026-11-17'

- id: K-attestaciya-i-razvitie-pedagogov-005
  type: sequence
  difficulty: 2
  situation: >-
    Учительница математики с высшей квалификационной категорией третий год руководит методическим объединением
    учителей математики школы. Эта работа не входит в её должностные обязанности. Она решила пройти аттестацию
    на квалификационную категорию «педагог-методист» и просит директора о поддержке. В школе есть первичная
    профсоюзная организация.
  question: Расставьте шаги в том порядке, который установлен порядком аттестации педагогических работников.
  items:
    - Педагогический совет рассматривает её методическую работу и принимает решение
    - Решение педагогического совета согласуют с выборным органом первичной профсоюзной организации
    - Директор оформляет ходатайство работодателя в аттестационную комиссию
    - Учительница подаёт в аттестационную комиссию заявление и прикладывает к нему ходатайство
    - Аттестационная комиссия принимает решение установить категорию «педагог-методист»
    - Уполномоченный орган власти издаёт распорядительный акт об установлении категории
    - Школа вносит запись о категории в трудовую книжку и (или) сведения о трудовой деятельности
  explanation: >-
    К аттестации на категорию «педагог-методист» допускаются педагоги с высшей категорией, так что учительница
    может её пройти. Ходатайство работодателя формируется на основе решения педагогического совета, согласованного
    с выборным органом первичной профсоюзной организации, и прикладывается к заявлению в аттестационную комиссию.
    После решения комиссии уполномоченный орган власти издаёт распорядительный акт об установлении
    категории, и уже на основании этого акта работодатель вносит запись в трудовую книжку и (или) в сведения
    о трудовой деятельности.
  refs:
    - doc: prikaz-196
      anchor: pril-1-p-45
      quote: >-
        К указанной аттестации допускаются педагогические работники, имеющие высшую квалификационную категорию.
      scan_page: 15
    - doc: prikaz-196
      anchor: pril-1-p-48
      quote: >-
        Ходатайство работодателя формируется на основе решения педагогического совета образовательной организации
        (иного коллегиального органа управления образовательной организации), на котором рассматривалась
        деятельность педагогического работника, осуществляющего методическую работу или наставничество,
        согласованного с выборным органом соответствующей первичной профсоюзной организации
      scan_page: 16
    - doc: prikaz-196
      anchor: pril-1-p-48
      quote: К заявлению в аттестационную комиссию прилагается ходатайство работодателя в аттестационную комиссию
      scan_page: 16
    - doc: prikaz-196
      anchor: pril-1-p-56
      quote: >-
        На основании решений аттестационных комиссий органы, указанные в пункте 25 настоящего Порядка, издают
        соответствующие распорядительные акты об установлении квалификационной категории «педагог-методист»
      scan_page: 19
    - doc: prikaz-196
      anchor: pril-1-p-56
      quote: >-
        На основании указанных распорядительных актов работодатели вносят соответствующие записи в трудовые
        книжки педагогических работников и (или) в сведения об их трудовой деятельности.
      scan_page: 19
  revision: 1
  checked: '2026-11-17'
