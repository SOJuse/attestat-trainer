- id: K-disciplinarnaya-i-materialnaya-otvetstvennost-001
  type: sequence
  difficulty: 2
  situation: >-
    Завхоз не обеспечил к 1 сентября исправное освещение в двух кабинетах, хотя это входит
    в его обязанности и срок был установлен приказом. Директор решил объявить ему выговор.
    Письменное объяснение завхоз так и не представил, а когда приказ был готов, отказался в нём расписаться.
  question: Расставьте действия директора в правильном порядке.
  items:
    - Затребовать у завхоза письменное объяснение
    - По истечении двух рабочих дней составить акт о непредставлении объяснения
    - Издать приказ об объявлении выговора
    - В течение трёх рабочих дней со дня издания объявить приказ под роспись
    - Составить акт об отказе ознакомиться с приказом под роспись
  explanation: >-
    Порядок задаёт статья 193. До взыскания работодатель требует письменное объяснение; если через
    два рабочих дня его нет, составляется акт, и молчание работника не мешает наказать его.
    Приказ издаётся не позднее месяца со дня обнаружения проступка и объявляется работнику под роспись
    в течение трёх рабочих дней со дня издания. Отказ расписаться фиксируют отдельным актом.
  refs:
    - doc: tk-rf
      anchor: st-193
      quote: >-
        До применения дисциплинарного взыскания работодатель должен затребовать от работника письменное
        объяснение. Если по истечении двух рабочих дней указанное объяснение работником не предоставлено,
        то составляется соответствующий акт.
    - doc: tk-rf
      anchor: st-193
      quote: >-
        Приказ (распоряжение) работодателя о применении дисциплинарного взыскания объявляется работнику
        под роспись в течение трех рабочих дней со дня его издания
    - doc: tk-rf
      anchor: st-193
      quote: >-
        Если работник отказывается ознакомиться с указанным приказом (распоряжением) под роспись,
        то составляется соответствующий акт.
  revision: 1
  checked: '2026-11-16'

- id: K-disciplinarnaya-i-materialnaya-otvetstvennost-002
  type: single
  difficulty: 1
  situation: >-
    Учитель технологии без уважительной причины не пришёл на два своих урока. В правилах внутреннего
    трудового распорядка школы, принятых много лет назад, среди взысканий записаны замечание, выговор,
    строгий выговор и штраф до 10% оклада. Директор решает, как наказать учителя.
  question: Какое взыскание директор вправе применить к учителю? Выберите один вариант.
  options:
    - text: Объявить строгий выговор
      correct: false
      why: >-
        Строгого выговора нет в перечне статьи 192. Правила распорядка школы его не узаконивают: это локальный
        акт, а не федеральный закон, устав или положение о дисциплине.
    - text: Удержать штраф в размере 10% оклада
      correct: false
      why: >-
        Штрафа среди взысканий Трудового кодекса нет, а применять взыскания, не предусмотренные федеральными
        законами, уставами и положениями о дисциплине, запрещено. Запись в правилах школы этого не меняет.
    - text: Объявить выговор
      correct: true
      why: >-
        Выговор назван в статье 192. Учитель без уважительной причины не провёл уроки, то есть по своей вине
        не исполнил трудовые обязанности, а это дисциплинарный проступок.
    - text: Перевести на месяц на должность с меньшим окладом
      correct: false
      why: Перевода на другую должность нет среди дисциплинарных взысканий, поэтому наказывать им нельзя.
  explanation: >-
    Статья 192 Трудового кодекса называет три дисциплинарных взыскания: замечание, выговор и увольнение
    по соответствующим основаниям. Другие взыскания для отдельных категорий работников могут ввести только
    федеральные законы, уставы и положения о дисциплине, а уставы и положения тоже устанавливаются федеральными
    законами. Правила внутреннего трудового распорядка школы к ним не относятся, это локальный нормативный акт.
    Поэтому строгий выговор и штраф из этих правил применять нельзя, а выговор можно.
  refs:
    - doc: tk-rf
      anchor: st-192
      quote: >-
        работодатель имеет право применить следующие дисциплинарные взыскания: 1) замечание; 2) выговор;
        3) увольнение по соответствующим основаниям.
    - doc: tk-rf
      anchor: st-192
      quote: >-
        Не допускается применение дисциплинарных взысканий, не предусмотренных федеральными законами, уставами
        и положениями о дисциплине.
    - doc: tk-rf
      anchor: st-189
      quote: Правила внутреннего трудового распорядка - локальный нормативный акт
    - doc: tk-rf
      anchor: st-189
      quote: >-
        Для отдельных категорий работников действуют уставы и положения о дисциплине, устанавливаемые
        федеральными законами.
  revision: 1
  checked: '2026-11-17'

- id: K-disciplinarnaya-i-materialnaya-otvetstvennost-003
  type: single
  difficulty: 2
  situation: >-
    С заведующим хозяйством школы заключён договор о полной индивидуальной материальной ответственности.
    В сентябре и октябре он подавал директору служебные записки: замок на двери склада сломан, дверь
    не запирается. Замок так и не заменили. В ноябре посторонний ночью вошёл на склад через эту дверь
    и вынес имущество. Проверка установила недостачу на 300 000 рублей, это больше среднего месячного
    заработка завхоза.
  question: В каком размере завхоз отвечает за недостачу? Выберите один вариант.
  options:
    - text: В полном размере, потому что с ним заключён договор о полной ответственности
      correct: false
      why: >-
        Договор даёт основание для полной ответственности за недостачу вверенных ценностей, но статья 239
        не делает для него исключения: если ущерб возник по указанной в ней причине, ответственности нет.
    - text: Не отвечает, потому что школа не обеспечила условия для хранения имущества
      correct: true
      why: >-
        Завхоз письменно предупреждал о сломанном замке, школа его не заменила, и вор вошёл именно через эту
        дверь. Ущерб возник из-за неисполнения работодателем обязанности по условиям хранения, а это исключает
        ответственность работника.
    - text: В пределах среднего месячного заработка, потому что часть вины на школе
      correct: false
      why: >-
        Статья 239 не делит ущерб между школой и работником. В названных в ней случаях ответственность
        работника исключается, а не уменьшается.
    - text: В полном размере, потому что ущерб причинён преступлением
      correct: false
      why: >-
        Полная ответственность за преступление наступает, когда ущерб причинён преступными действиями самого
        работника, установленными приговором суда. Склад обокрал посторонний.
  explanation: >-
    Договор о полной материальной ответственности позволяет взыскать с работника недостачу вверенных ему
    ценностей целиком (пункт 2 части первой статьи 243 ТК). Но статья 239 исключает материальную ответственность
    работника, если ущерб возник из-за того, что работодатель не исполнил обязанность обеспечить надлежащие
    условия хранения вверенного имущества. Завхоз дважды письменно сообщал о сломанном замке, замок не заменили,
    и кража случилась через эту дверь. Поэтому за недостачу завхоз не отвечает.
  refs:
    - doc: tk-rf
      anchor: st-239
      quote: >-
        Материальная ответственность работника исключается в случаях возникновения ущерба вследствие непреодолимой
        силы, нормального хозяйственного риска, крайней необходимости или необходимой обороны либо неисполнения
        работодателем обязанности по обеспечению надлежащих условий для хранения имущества, вверенного работнику.
    - doc: tk-rf
      anchor: st-243
      quote: >-
        недостачи ценностей, вверенных ему на основании специального письменного договора или полученных им
        по разовому документу
    - doc: tk-rf
      anchor: st-243
      quote: причинения ущерба в результате преступных действий работника, установленных приговором суда
  revision: 1
  checked: '2026-11-17'

- id: K-disciplinarnaya-i-materialnaya-otvetstvennost-004
  type: multiple
  difficulty: 3
  situation: >-
    Директор разбирает случаи ущерба за полугодие. В каждом проверка установила размер ущерба, и он больше
    среднего месячного заработка виновного работника. Никто не причинил ущерб умышленно и не был в состоянии
    опьянения.
  question: Кто из работников отвечает за ущерб в полном размере? Отметьте все верные варианты.
  options:
    - text: >-
        Учитель химии по неосторожности разбил на уроке микроскоп; договора о полной материальной
        ответственности с ним нет
      correct: false
      why: >-
        Ущерб причинён по неосторожности при исполнении обязанностей, и ни один случай полной ответственности
        сюда не подходит. Учитель отвечает в пределах своего среднего месячного заработка.
    - text: >-
        Заместитель директора по АХР по неосторожности повредил проектор; в его трудовом договоре есть условие
        о полной материальной ответственности
      correct: true
      why: >-
        С заместителями руководителя и главным бухгалтером полную материальную ответственность можно установить
        трудовым договором. Такое условие в договоре есть, значит, заместитель возмещает весь ущерб.
    - text: >-
        Рабочий, которому 17 лет, потерял выданные ему инструменты; с ним заключили договор о полной
        материальной ответственности
      correct: false
      why: >-
        Такие договоры заключают только с работниками, которым исполнилось 18 лет. Работник младше 18 лет
        отвечает полностью лишь за умышленный ущерб, ущерб в состоянии опьянения, от преступления или
        административного правонарушения, а здесь ничего этого нет.
    - text: >-
        Учитель взял школьный фотоаппарат на выходные для семейной поездки и там разбил его
      correct: true
      why: >-
        Фотоаппарат разбит в личной поездке, то есть не при исполнении трудовых обязанностей. За такой ущерб
        работник отвечает в полном размере и без всякого договора.
    - text: >-
        Водитель школьного автобуса проехал на красный свет и разбил автобус; ГИБДД привлекла его за это
        к административной ответственности
      correct: true
      why: >-
        Ущерб причинён в результате административного правонарушения, и его установил государственный орган.
        Это один из случаев полной ответственности.
  explanation: >-
    Обычно работник отвечает в пределах своего среднего месячного заработка (статья 241 ТК), а полностью только
    в случаях, которые назвал закон. Статья 243 относит к ним ущерб от административного правонарушения,
    установленного государственным органом, и ущерб не при исполнении трудовых обязанностей, а с заместителем
    руководителя полную ответственность можно установить трудовым договором. Договоры о полной материальной
    ответственности заключают только с работниками от 18 лет (статья 244), а работник младше 18 лет отвечает
    полностью лишь в случаях, перечисленных в части третьей статьи 242.
  refs:
    - doc: tk-rf
      anchor: st-241
      quote: >-
        За причиненный ущерб работник несет материальную ответственность в пределах своего среднего месячного
        заработка, если иное не предусмотрено настоящим Кодексом или иными федеральными законами.
    - doc: tk-rf
      anchor: st-242
      quote: >-
        Материальная ответственность в полном размере причиненного ущерба может возлагаться на работника лишь
        в случаях, предусмотренных настоящим Кодексом или иными федеральными законами.
    - doc: tk-rf
      anchor: st-243
      quote: >-
        Материальная ответственность в полном размере причиненного работодателю ущерба может быть установлена
        трудовым договором, заключаемым с заместителями руководителя организации, главным бухгалтером.
    - doc: tk-rf
      anchor: st-243
      quote: причинения ущерба не при исполнении работником трудовых обязанностей
    - doc: tk-rf
      anchor: st-243
      quote: >-
        причинения ущерба в результате административного правонарушения, если таковое установлено
        соответствующим государственным органом
    - doc: tk-rf
      anchor: st-244
      quote: >-
        могут заключаться с работниками, достигшими возраста восемнадцати лет и непосредственно обслуживающими
        или использующими денежные, товарные ценности или иное имущество
    - doc: tk-rf
      anchor: st-242
      quote: >-
        Работники в возрасте до восемнадцати лет несут полную материальную ответственность лишь за умышленное
        причинение ущерба, за ущерб, причиненный в состоянии алкогольного, наркотического или иного токсического
        опьянения, а также за ущерб, причиненный в результате совершения преступления или административного
        правонарушения.
  trap:
    kind: wording
    note: >-
      У семнадцатилетнего рабочего договор о полной ответственности есть, но заключать его с ним было нельзя.
      У заместителя директора отдельного договора нет, но условие о полной ответственности записано в его
      трудовом договоре, и этого достаточно.
  revision: 1
  checked: '2026-11-17'

- id: K-disciplinarnaya-i-materialnaya-otvetstvennost-005
  type: matching
  difficulty: 3
  situation: >-
    За одну неделю к директору пришли четыре сигнала о работниках школы. Работников в школе представляет
    профсоюзный комитет (профком). Директор разбирается, что ему делать с каждым сигналом.
  question: Сопоставьте сигнал и то, что из него следует для директора по закону.
  pairs:
    - left: >-
        Родители шестиклассника письменно просят наказать учителя, который, по их словам, унижает их сына
        на уроках
      right: Обязан рассмотреть обращение с участием заявителей
    - left: >-
        Профком письменно сообщил, что заместитель директора вызывает учителей на работу в выходные без их
        согласия. Проверка подтвердила это нарушение трудового законодательства
      right: Обязан применить взыскание
    - left: >-
        Учителю объявили замечание за сорванный урок. Завуч считает это слишком мягким и просит за тот же урок
        объявить выговор
      right: Не вправе применить взыскание
    - left: >-
        Учителю месяц назад объявили замечание за опоздание. Вчера он без уважительной причины не провёл урок,
        и завуч просит объявить выговор
      right: Вправе применить взыскание
  explanation: >-
    Родители вправе обратиться к руководству школы с просьбой о взыскании для работника, который нарушает права
    ученика, и такое обращение рассматривают обязательно и с их участием (часть 1 статьи 45 закона об образовании).
    Если профком сообщил о нарушении трудового законодательства заместителем директора и факт подтвердился,
    директор обязан применить к заместителю взыскание (статья 195 ТК), а меру выбирает с учётом тяжести проступка.
    За один проступок применяют только одно взыскание, поэтому за урок, за который уже объявлено замечание,
    выговор не объявить. Урок, не проведённый без уважительной причины, это новый проступок, и за него директор
    вправе, но не обязан наказать учителя.
  refs:
    - doc: fz-273
      anchor: st-45
      quote: >-
        направлять в органы управления организацией, осуществляющей образовательную деятельность, обращения
        о применении к работникам указанных организаций, нарушающим и (или) ущемляющим права обучающихся,
        родителей (законных представителей) несовершеннолетних обучающихся, дисциплинарных взысканий
    - doc: fz-273
      anchor: st-45
      quote: >-
        Такие обращения подлежат обязательному рассмотрению указанными органами с привлечением обучающихся,
        родителей (законных представителей) несовершеннолетних обучающихся
    - doc: tk-rf
      anchor: st-195
      quote: >-
        Работодатель обязан рассмотреть заявление представительного органа работников о нарушении руководителем
        организации, руководителем структурного подразделения организации, их заместителями трудового
        законодательства
    - doc: tk-rf
      anchor: st-195
      quote: >-
        В случае, когда факт нарушения подтвердился, работодатель обязан применить к руководителю организации,
        руководителю структурного подразделения организации, их заместителям дисциплинарное взыскание вплоть
        до увольнения.
    - doc: tk-rf
      anchor: st-192
      quote: >-
        При наложении дисциплинарного взыскания должны учитываться тяжесть совершенного проступка
        и обстоятельства, при которых он был совершен.
    - doc: tk-rf
      anchor: st-193
      quote: За каждый дисциплинарный проступок может быть применено только одно дисциплинарное взыскание.
    - doc: tk-rf
      anchor: st-192
      quote: >-
        неисполнение или ненадлежащее исполнение работником по его вине возложенных на него трудовых обязанностей,
        работодатель имеет право применить следующие дисциплинарные взыскания
  trap:
    kind: wording
    note: >-
      Замечание уже есть у обоих учителей, но новый проступок совершил только второй. О заместителе закон
      говорит «обязан», об учителе «вправе».
  revision: 1
  checked: '2026-11-17'
