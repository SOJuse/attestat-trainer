- id: K-personalnye-dannye-i-kadrovye-dokumenty-001
  type: single
  difficulty: 1
  situation: >-
    Учителю физики приказом объявили выговор за неоднократные опоздания на уроки. Школа ведёт его
    бумажную трудовую книжку. Специалист по кадрам спрашивает директора, как отразить выговор
    в трудовой книжке.
  question: Как поступить со сведениями о выговоре? Выберите один вариант.
  options:
    - text: Не вносить сейчас, а внести при увольнении учителя
      correct: false
      why: >-
        При увольнении записывают само увольнение и его основание. Сведения о выговоре в книжку
        не вносят и в этот момент.
    - text: Внести запись о выговоре со ссылкой на приказ
      correct: false
      why: >-
        Ссылка на приказ ничего не меняет: запрет касается самих сведений о взыскании, а не того,
        как их оформить.
    - text: Внести запись, если выговор не снимут в течение года
      correct: false
      why: >-
        Срок действия взыскания здесь ни при чём. Выговор не записывают в трудовую книжку ни сразу,
        ни позже.
    - text: Не вносить сведения о выговоре в трудовую книжку
      correct: true
      why: >-
        Сведения о взысканиях в трудовую книжку не вносят. Исключение сделано для увольнения
        как взыскания, а выговор им не является.
  explanation: >-
    Часть четвёртая статьи 66 ТК РФ называет, что вносят в трудовую книжку: сведения о работнике,
    выполняемой работе, переводах, увольнении с основанием и о награждениях. О взысканиях сказано
    отдельно: их не вносят, кроме случая, когда дисциплинарным взысканием стало увольнение.
    Выговор оформлен приказом, но в трудовую книжку учителя его не записывают.
  refs:
    - doc: tk-rf
      anchor: st-66
      quote: >-
        Сведения о взысканиях в трудовую книжку не вносятся, за исключением случаев, когда
        дисциплинарным взысканием является увольнение.
  revision: 1
  checked: '2026-11-17'

- id: K-personalnye-dannye-i-kadrovye-dokumenty-002
  type: single
  difficulty: 2
  situation: >-
    Учитель истории работает в школе полгода. Директор думает перевести его на должность заместителя
    директора и хочет попросить у директора школы, где учитель работал раньше, отзыв о его работе.
    Сам учитель об этом пока не знает.
  question: Что нужно сделать, чтобы получить такой отзыв законно? Выберите один вариант.
  options:
    - text: Заранее уведомить учителя и получить его письменное согласие
      correct: true
      why: >-
        Отзыв прежнего директора можно получить только у третьей стороны. В этом случае работника
        уведомляют заранее и получают от него письменное согласие.
    - text: Запросить отзыв без согласия, раз он нужен для продвижения учителя
      correct: false
      why: >-
        Продвижение по службе входит в цели, ради которых обрабатывают данные работника, но цель
        не отменяет правила о третьей стороне: нужны уведомление и письменное согласие.
    - text: Получить согласие учителя в любой форме, хотя бы устно
      correct: false
      why: >-
        Устного согласия мало. Для получения данных работника у третьей стороны ТК требует
        согласия в письменной форме.
    - text: Запросить отзыв, а учителю сообщить, когда придёт ответ
      correct: false
      why: >-
        Работника уведомляют заранее, до запроса. Сообщение после получения отзыва не заменяет
        ни уведомления, ни письменного согласия.
    - text: Не запрашивать отзыв, сведения о работнике берут у него самого
      correct: false
      why: >-
        Это общее правило, но закон допускает получение данных у третьей стороны, если их можно
        получить только там. Отзыв прежнего директора у самого учителя не получить.
  explanation: >-
    По пункту 3 статьи 86 ТК РФ все данные работника получают у него самого. Если сведения можно
    получить только у третьей стороны, как отзыв прежнего директора, работника уведомляют об этом
    заранее и получают его письменное согласие. Работодатель также сообщает работнику цели, источники
    и способы получения сведений и последствия отказа дать согласие. Цель запроса, даже законная,
    этих условий не снимает.
  refs:
    - doc: tk-rf
      anchor: st-86
      quote: все персональные данные работника следует получать у него самого
    - doc: tk-rf
      anchor: st-86
      quote: >-
        Если персональные данные работника возможно получить только у третьей стороны, то работник
        должен быть уведомлен об этом заранее и от него должно быть получено письменное согласие.
    - doc: tk-rf
      anchor: st-86
      quote: содействия работникам в трудоустройстве, получении образования и продвижении по службе
  revision: 1
  checked: '2026-11-17'

- id: K-personalnye-dannye-i-kadrovye-dokumenty-003
  type: multiple
  difficulty: 2
  situation: >-
    Личные дела работников школа хранит на бумаге в шкафу в приёмной директора. Две недели назад ключ от
    шкафа потеряли, и с тех пор он стоит незапертым; специалист по кадрам, которой приказом поручено
    хранить личные дела, никому об этом не сказала. Родитель, ожидавший приёма, открыл шкаф,
    сфотографировал страницу с паспортными данными учительницы и выложил снимок в родительский чат.
  question: Что из этого верно? Отметьте все верные варианты.
  options:
    - text: Школу могут оштрафовать, раз она не обеспечила сохранность личных дел
      correct: true
      why: >-
        КоАП наказывает оператора, который не обеспечил сохранность бумажных носителей с данными,
        если из-за этого посторонний получил к ним доступ.
    - text: Специалиста по кадрам, отвечавшую за хранение, можно наказать дисциплинарно
      correct: true
      why: >-
        Виновные в нарушении правил обработки данных работника отвечают по ТК, в том числе
        дисциплинарно.
    - text: Учительница вправе обжаловать в суд бездействие школы при защите её данных
      correct: true
      why: >-
        Работник может обжаловать в суд любые неправомерные действия или бездействие работодателя
        при обработке и защите его данных.
    - text: Для штрафа по КоАП нужно, чтобы раскрыли данные не меньше тысячи человек
      correct: false
      why: >-
        Порог в тысячу человек взят из частей о неправомерной передаче данных. За несохранность
        бумажных носителей штрафуют без порога по числу людей.
    - text: Школа не отвечает, потому что снимок сделал и выложил посторонний
      correct: false
      why: >-
        Оператора наказывают как раз за то, что посторонний смог добраться до бумажных носителей
        с данными и скопировать их.
  explanation: >-
    Бумажные личные дела служат материальными носителями персональных данных, и школа как оператор
    обязана хранить их так, чтобы исключить посторонний доступ. Часть 6 статьи 13.11 КоАП РФ наказывает
    за невыполнение этой обязанности, если оно повлекло неправомерный доступ или копирование данных,
    и порога по числу людей в ней нет. Статья 90 ТК РФ называет ответственность виновных лиц, в том
    числе дисциплинарную, а статья 89 даёт работнику право обжаловать в суд бездействие работодателя.
  refs:
    - doc: koap-rf
      anchor: st-13-11
      quote: >-
        Невыполнение оператором при обработке персональных данных без использования средств
        автоматизации обязанности по соблюдению условий
    - doc: koap-rf
      anchor: st-13-11
      quote: >-
        сохранность персональных данных при хранении материальных носителей персональных данных
        и исключающих несанкционированный к ним доступ, если это повлекло неправомерный или случайный
        доступ к персональным данным
    - doc: koap-rf
      anchor: st-13-11
      quote: >-
        Действия (бездействие) оператора, повлекшие неправомерную передачу (предоставление,
        распространение, доступ) информации, включающей персональные данные от одной тысячи до десяти
        тысяч субъектов персональных данных
    - doc: tk-rf
      anchor: st-90
      quote: >-
        Лица, виновные в нарушении положений законодательства Российской Федерации в области
        персональных данных при обработке персональных данных работника, привлекаются к дисциплинарной
        и материальной ответственности
    - doc: tk-rf
      anchor: st-89
      quote: >-
        обжалование в суд любых неправомерных действий или бездействия работодателя при обработке
        и защите его персональных данных
  revision: 1
  checked: '2026-11-17'

- id: K-personalnye-dannye-i-kadrovye-dokumenty-004
  type: multiple
  difficulty: 3
  situation: >-
    Школа решила поздравлять учителей с днём рождения на главной странице своего сайта, указывая
    фамилию, имя, отчество и полную дату рождения. При приёме на работу каждый учитель подписал согласие
    на обработку персональных данных, где есть пункт «разрешаю размещать мои данные на сайте школы».
    Для надёжности школа разослала учителям новую форму согласия на распространение данных.
    Учитель химии форму не вернул и ничего не ответил.
  question: Что из этого верно? Отметьте все верные варианты.
  options:
    - text: Пункта о сайте в согласии, подписанном при приёме, достаточно для публикации
      correct: false
      why: >-
        Согласие на распространение оформляют отдельно от иных согласий на обработку данных.
        Пункт внутри общего согласия его не заменяет.
    - text: Поздравление учителя химии с датой рождения на сайте размещать нельзя
      correct: true
      why: >-
        Отдельного согласия учитель химии не дал, а молчание или бездействие согласием
        на распространение не считается.
    - text: Учитель вправе разрешить публикацию имени, а дату рождения запретить
      correct: true
      why: >-
        Школа обязана дать учителю возможность самому определить перечень данных, которые он
        разрешает распространять.
    - text: Отозвать разрешение учитель сможет не раньше, чем истечёт срок согласия
      correct: false
      why: >-
        Распространение прекращают в любое время по требованию человека, срок согласия
        этому не мешает.
    - text: Отдельное согласие не нужно, поскольку школа подведомственна органу власти
      correct: false
      why: >-
        Исключение для подведомственных организаций касается обработки ради функций, полномочий
        и обязанностей, возложенных законодательством. Поздравлять учителей на сайте закон школу
        не обязывает.
  explanation: >-
    Публикация на открытом сайте раскрывает данные неопределённому кругу лиц, то есть означает
    их распространение, а без согласия человека распространять данные нельзя, если иное
    не предусмотрено федеральным законом (статья 7 закона о персональных данных). Согласие
    на распространение по статье 10.1 оформляют отдельно от иных согласий, поэтому пункт в согласии
    при приёме не годится, а молчание учителя химии согласием не считается. В новом согласии учитель сам определяет перечень данных
    для распространения и может в любое время потребовать прекратить их распространение.
    Часть 15 статьи 10.1 освобождает от этих правил обработку ради функций, возложенных законодательством,
    а поздравления к ним не относятся.
  refs:
    - doc: fz-152
      anchor: st-3
      quote: >-
        распространение персональных данных - действия, направленные на раскрытие персональных данных
        неопределенному кругу лиц
    - doc: fz-152
      anchor: st-7
      quote: >-
        обязаны не раскрывать третьим лицам и не распространять персональные данные без согласия
        субъекта персональных данных, если иное не предусмотрено федеральным законом
    - doc: fz-152
      anchor: st-10-1
      quote: >-
        Согласие на обработку персональных данных, разрешенных субъектом персональных данных для
        распространения, оформляется отдельно от иных согласий субъекта персональных данных на обработку
        его персональных данных.
    - doc: fz-152
      anchor: st-10-1
      quote: >-
        Молчание или бездействие субъекта персональных данных ни при каких обстоятельствах не может
        считаться согласием на обработку персональных данных, разрешенных субъектом персональных данных
        для распространения.
    - doc: fz-152
      anchor: st-10-1
      quote: >-
        Оператор обязан обеспечить субъекту персональных данных возможность определить перечень
        персональных данных по каждой категории персональных данных
    - doc: fz-152
      anchor: st-10-1
      quote: >-
        Передача (распространение, предоставление, доступ) персональных данных, разрешенных субъектом
        персональных данных для распространения, должна быть прекращена в любое время по требованию
        субъекта персональных данных.
    - doc: fz-152
      anchor: st-10-1
      quote: >-
        Требования настоящей статьи не применяются в случае обработки персональных данных в целях
        выполнения возложенных законодательством Российской Федерации на государственные органы,
        муниципальные органы, а также на подведомственные таким органам организации функций, полномочий
        и обязанностей.
  trap:
    kind: wording
    note: >-
      Часть 15 статьи 10.1 легко прочитать как освобождение любой подведомственной организации.
      Она касается только обработки ради функций, полномочий и обязанностей, возложенных законодательством.
  revision: 1
  checked: '2026-11-17'

- id: K-personalnye-dannye-i-kadrovye-dokumenty-005
  type: matching
  difficulty: 2
  situation: >-
    За одну неделю в школу пришло пять обращений, связанных с учителем математики. Согласия
    на передачу своих данных кому-либо учитель школе не давал.
  question: Сопоставьте обращение и то, как школа должна на него ответить.
  pairs:
    - left: Банк, где учитель оформляет кредит, звонит в бухгалтерию и просит назвать его зарплату
      right: Отказать, пока работник не даст письменного согласия
    - left: Учитель потерял сознание на уроке, и врачи скорой помощи для госпитализации просят его дату рождения
      right: Сообщить сведения, не дожидаясь письменного согласия работника
    - left: Профком готовит мнение по проекту приказа об увольнении учителя и просит всё его личное дело
      right: Передать лишь те сведения, которые нужны для выполнения его функций
    - left: Учитель письменно просит копию приказа о приёме и справку о зарплате
      right: Выдать бесплатно, заверив надлежащим образом, не позднее трёх рабочих дней
    - left: В сведениях о трудовой деятельности на портале госуслуг учитель не нашёл своего перевода с должности
        воспитателя группы продлённого дня на должность учителя, оформленного полгода назад
      right: Исправить сведения по письменному заявлению работника и снова передать их в Фонд
  explanation: >-
    Статья 88 ТК РФ запрещает сообщать данные работника третьей стороне без его письменного согласия,
    поэтому банку школа откажет. Исключение сделано для случаев, когда это нужно, чтобы предупредить
    угрозу жизни и здоровью работника, так что врачам скорой данные сообщают сразу. Представителям
    работников, в том числе профкому, передают только те данные, которые нужны им для выполнения их
    функций. Самому работнику копии документов о работе по письменному заявлению выдают бесплатно
    и заверенными не позднее трёх рабочих дней (статья 62), а неполные сведения о трудовой деятельности
    работодатель по его письменному заявлению исправляет и снова представляет в Фонд пенсионного
    и социального страхования (статья 66.1).
  refs:
    - doc: tk-rf
      anchor: st-88
      quote: >-
        не сообщать персональные данные работника третьей стороне без письменного согласия работника,
        за исключением случаев, когда это необходимо в целях предупреждения угрозы жизни и здоровью
        работника
    - doc: tk-rf
      anchor: st-88
      quote: >-
        передавать персональные данные работника представителям работников в порядке, установленном
        настоящим Кодексом и иными федеральными законами, и ограничивать эту информацию только теми
        персональными данными работника, которые необходимы для выполнения указанными представителями
        их функций
    - doc: tk-rf
      anchor: st-62
      quote: >-
        По письменному заявлению работника работодатель обязан не позднее трех рабочих дней со дня
        подачи этого заявления выдать работнику
    - doc: tk-rf
      anchor: st-62
      quote: >-
        Копии документов, связанных с работой, должны быть заверены надлежащим образом и предоставляться
        работнику безвозмездно.
    - doc: tk-rf
      anchor: st-66-1
      quote: >-
        работодатель по письменному заявлению работника обязан исправить или дополнить сведения
        о трудовой деятельности и представить их
  revision: 1
  checked: '2026-11-17'
