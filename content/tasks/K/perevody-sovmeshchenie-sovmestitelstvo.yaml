- id: K-perevody-sovmeshchenie-sovmestitelstvo-001
  type: single
  difficulty: 1
  situation: >-
    Директор московской государственной школы уволился в середине учебного года. Учредитель предложил
    директору соседней государственной школы руководить и этой школой, оформив его по совместительству.
    Тот согласен, а разрешение на работу по совместительству учредитель готов дать сразу.
  question: Можно ли так оформить руководство школой? Выберите один вариант.
  options:
    - text: "Можно: директору достаточно разрешения учредителя на работу по совместительству"
      correct: false
      why: >-
        Разрешение нужно руководителю, чтобы работать по совместительству у другого работодателя,
        но запрет занимать по совместительству должность директора государственной школы оно не снимает.
    - text: "Нельзя: обязанности директора государственной школы не исполняют по совместительству"
      correct: true
      why: >-
        Часть 5 статьи 51 Закона об образовании прямо запрещает исполнять по совместительству
        обязанности руководителя государственной или муниципальной образовательной организации.
    - text: Можно, если во второй школе он будет работать не больше четырёх часов в день
      correct: false
      why: >-
        Предел в четыре часа в день ограничивает время работы совместителя и не делает допустимым
        совместительство на должности, где оно запрещено.
    - text: Можно на время, пока учредитель подбирает школе постоянного директора
      correct: false
      why: >-
        Запрет не связан со сроком: обязанности руководителя государственной школы нельзя исполнять
        по совместительству ни временно, ни постоянно.
    - text: "Нельзя: директору школы совместительство у другого работодателя запрещено"
      correct: false
      why: >-
        Работать по совместительству у другого работодателя руководитель может, если получит разрешение.
        Запрет закона об образовании касается должности руководителя государственной школы.
  explanation: >-
    Часть 5 статьи 51 Закона об образовании запрещает исполнять по совместительству должностные обязанности
    руководителя государственной или муниципальной образовательной организации. Исключение сделано только
    для руководителя филиала, где обучение идёт исключительно в форме практической подготовки, а это не тот случай.
    Разрешение на совместительство по статье 276 Трудового кодекса и предел в четыре часа в день по статье 284
    этот запрет не снимают.
  refs:
    - doc: fz-273
      anchor: st-51
      quote: >-
        Должностные обязанности руководителя государственной или муниципальной образовательной организации,
        филиала государственной или муниципальной образовательной организации, за исключением филиала,
        в котором организуется осуществление образовательной деятельности исключительно в форме практической
        подготовки обучающихся, не могут исполняться по совместительству.
    - doc: tk-rf
      anchor: st-276
      quote: >-
        Руководитель организации может работать по совместительству у другого работодателя только
        с разрешения уполномоченного органа юридического лица либо собственника имущества организации,
        либо уполномоченного собственником лица (органа).
    - doc: tk-rf
      anchor: st-284
      quote: >-
        Продолжительность рабочего времени при работе по совместительству не должна превышать четырех часов
        в день.
  revision: 1
  checked: '2026-11-17'

- id: K-perevody-sovmeshchenie-sovmestitelstvo-002
  type: single
  difficulty: 2
  situation: >-
    Учительницу по письменному соглашению временно перевели на свободную должность методиста на один год,
    с 1 сентября по 31 августа. Срок прошёл, но прежнюю работу ей не предоставили, сама она её не потребовала
    и продолжает работать методистом. В ноябре директор решил вернуть её к урокам, а методистом взять
    другого человека.
  question: Может ли директор своим приказом вернуть её на должность учителя? Выберите один вариант.
  options:
    - text: "Да: срок перевода истёк, и должность учителя всё это время сохранялась за ней"
      correct: false
      why: >-
        После окончания срока она продолжила работать методистом и не потребовала прежнюю работу,
        поэтому условие о временном характере перевода утратило силу.
    - text: Да, если письменно предупредить её о возврате не позднее чем за два месяца
      correct: false
      why: >-
        Предупредив за два месяца, работодатель может сам изменить условия договора, только если их нельзя сохранить из-за изменения организационных или технологических условий труда. Трудовую функцию так менять нельзя даже тогда, а возврат к урокам меняет именно её.
    - text: "Нет: перевод стал постоянным, и для возврата к урокам нужно её письменное согласие"
      correct: true
      why: >-
        Перевод считается постоянным, а возврат на должность учителя теперь новый перевод,
        для которого нужно письменное согласие работника.
    - text: "Нет: перевод продлился ещё на год, и вернуть её можно будет в конце августа"
      correct: false
      why: >-
        Сам по себе временный перевод на новый срок не продлевается. Если по окончании срока прежнюю работу
        работнику не предоставили, а он её не потребовал и продолжает работать, перевод считается постоянным.
  explanation: >-
    По части первой статьи 72.2 Трудового кодекса, если после окончания срока временного перевода прежняя
    работа не предоставлена, а работник её не потребовал и продолжает работать, перевод считается постоянным.
    Учительница теперь постоянно работает методистом. Вернуть её к урокам значит снова перевести на другую
    работу, а перевод допускается только с письменного согласия работника. Порядок статьи 74 с предупреждением
    за два месяца к изменению трудовой функции не применяется.
  refs:
    - doc: tk-rf
      anchor: st-72-2
      quote: >-
        Если по окончании срока перевода прежняя работа работнику не предоставлена, а он не потребовал
        ее предоставления и продолжает работать, то условие соглашения о временном характере перевода
        утрачивает силу и перевод считается постоянным.
    - doc: tk-rf
      anchor: st-72-1
      quote: >-
        Перевод на другую работу допускается только с письменного согласия работника, за исключением
        случаев, предусмотренных частями второй и третьей статьи 72.2 настоящего Кодекса.
    - doc: tk-rf
      anchor: st-74
      quote: >-
        допускается их изменение по инициативе работодателя, за исключением изменения трудовой функции
        работника
  revision: 1
  checked: '2026-11-17'

- id: K-perevody-sovmeshchenie-sovmestitelstvo-003
  type: multiple
  difficulty: 3
  situation: >-
    Заместитель директора школы по административно-хозяйственной работе принёс медицинское заключение:
    ему нужен временный перевод на другую работу на два месяца. В школе есть свободная должность, которая
    подходит ему по состоянию здоровья. От перевода он письменно отказался.
  question: Что из этого верно? Отметьте все верные варианты.
  options:
    - text: Директор вправе прекратить с ним трудовой договор из-за отказа от перевода
      correct: true
      why: >-
        Для заместителя руководителя отказ от перевода по медицинскому заключению ведёт к прекращению
        договора, даже если перевод нужен на короткий срок.
    - text: Директор вправе с его письменного согласия не увольнять его, а отстранить от работы
      correct: true
      why: >-
        Вместо увольнения работодатель может с письменного согласия заместителя отстранить его
        на срок, который определят стороны.
    - text: Директор обязан отстранить его от работы на два месяца с сохранением должности
      correct: false
      why: >-
        Такая обязанность установлена общим правилом для перевода на срок до четырёх месяцев,
        а для заместителя руководителя действует особое правило.
    - text: Директор вправе перевести его на свободную должность без его согласия
      correct: false
      why: >-
        Перевод по медицинскому заключению делается с письменного согласия работника,
        а заместитель от перевода отказался.
  explanation: >-
    Часть четвёртая статьи 73 Трудового кодекса устанавливает отдельное правило для руководителя организации,
    его заместителей и главного бухгалтера: если им нужен временный или постоянный перевод по медицинскому
    заключению, а они от него отказываются, трудовой договор прекращается. Работодатель вправе с их письменного
    согласия не прекращать договор, а отстранить их от работы на срок по соглашению сторон. Обязанность
    отстранить на весь срок при переводе до четырёх месяцев из части второй здесь не действует. Перевести
    без согласия нельзя: часть первая требует письменного согласия работника.
  refs:
    - doc: tk-rf
      anchor: st-73
      quote: >-
        Трудовой договор с руководителем организации, его заместителями и главным бухгалтером, руководителем
        филиала, представительства или иного обособленного структурного подразделения, его заместителями
        и главным бухгалтером, нуждающимися в соответствии с медицинским заключением во временном или
        в постоянном переводе на другую работу
    - doc: tk-rf
      anchor: st-73
      quote: >-
        при отказе от перевода либо отсутствии у работодателя соответствующей работы прекращается
        в соответствии с пунктом 8 части первой статьи 77 настоящего Кодекса
    - doc: tk-rf
      anchor: st-73
      quote: >-
        Работодатель имеет право с письменного согласия указанных работников не прекращать с ними трудовой
        договор, а отстранить их от работы на срок, определяемый соглашением сторон.
    - doc: tk-rf
      anchor: st-73
      quote: >-
        на срок до четырех месяцев, отказывается от перевода либо соответствующая работа у работодателя
        отсутствует, то работодатель обязан на весь указанный в медицинском заключении срок отстранить
        работника от работы с сохранением места работы (должности)
    - doc: tk-rf
      anchor: st-73
      quote: >-
        с его письменного согласия работодатель обязан перевести на другую имеющуюся у работодателя работу,
        не противопоказанную работнику по состоянию здоровья
  trap:
    kind: wording
    note: >-
      Перевод нужен меньше чем на четыре месяца, но работник заместитель директора. Для него правило
      об обязательном отстранении не действует.
  revision: 1
  checked: '2026-11-17'

- id: K-perevody-sovmeshchenie-sovmestitelstvo-004
  type: input
  difficulty: 2
  situation: >-
    Учитель информатики работает в школе по внешнему совместительству, трудовой договор с ним заключён
    на неопределённый срок. Директор нашёл учителя информатики, для которого работа в школе станет основной,
    и хочет взять его на место совместителя.
  question: >-
    Не менее чем за сколько недель до прекращения договора директор должен письменно предупредить
    совместителя? Ответ в неделях.
  answer: 2
  unit: недели
  explanation: >-
    Статья 288 Трудового кодекса даёт отдельное основание прекратить договор с совместителем, заключённый
    на неопределённый срок: приём работника, для которого эта работа будет основной. Совместителя
    предупреждают письменно не менее чем за две недели до прекращения договора. В условии договор
    бессрочный, а новый учитель придёт на основную работу, поэтому основание подходит.
  refs:
    - doc: tk-rf
      anchor: st-288
      quote: >-
        заключенный на неопределенный срок с лицом, работающим по совместительству, может быть прекращен
        в случае приема на работу работника, для которого эта работа будет являться основной, о чем
        работодатель в письменной форме предупреждает указанное лицо не менее чем за две недели
  revision: 1
  checked: '2026-11-17'

- id: K-perevody-sovmeshchenie-sovmestitelstvo-005
  type: matching
  difficulty: 3
  situation: >-
    Директор проверяет, как в школе оформлена дополнительная работа сотрудников. Нашлось пять случаев,
    и в документах по каждому нужно правильно назвать, что это за работа.
  question: Сопоставьте случай и то, как оформляется такая работа.
  pairs:
    - left: Лаборант в свой рабочий день за доплату ведёт ещё и делопроизводство, ставка делопроизводителя свободна
      right: Совмещение должностей
    - left: Уборщице за доплату в пределах её рабочего дня добавили уборку спортзала, который раньше убирала уволившаяся коллега
      right: Расширение зон обслуживания
    - left: Бухгалтер, не бросая собственный участок, в рабочий день за доплату ведёт дела главного бухгалтера, пока тот болеет
      right: Исполнение обязанностей временно отсутствующего работника без освобождения от своей работы
    - left: Секретарь, пока завхоз в отпуске по беременности и родам, по письменному соглашению оставила делопроизводство и ведёт хозяйство школы вместо неё
      right: Временный перевод на другую работу
    - left: Учитель физкультуры по второму трудовому договору вечерами, после своего рабочего дня, работает в этой же школе сторожем
      right: Внутреннее совместительство
  explanation: >-
    Статья 60.2 Трудового кодекса называет дополнительную работу, которую поручают в течение рабочего дня
    наряду со своей: по другой должности это совмещение, по такой же это расширение зон обслуживания или
    увеличение объёма работ, а за временно отсутствующего работника можно поручить и ту и другую. Секретарь
    свою работу оставила, то есть сменила трудовую функцию: это временный перевод до выхода завхоза.
    Отдельный трудовой договор у того же работодателя в свободное от основной работы время по статье 60.1
    называется внутренним совместительством.
  refs:
    - doc: tk-rf
      anchor: st-60-2
      quote: >-
        Поручаемая работнику дополнительная работа по другой профессии (должности) может осуществляться
        путем совмещения профессий (должностей).
    - doc: tk-rf
      anchor: st-60-2
      quote: >-
        Поручаемая работнику дополнительная работа по такой же профессии (должности) может осуществляться
        путем расширения зон обслуживания, увеличения объема работ.
    - doc: tk-rf
      anchor: st-60-2
      quote: >-
        Для исполнения обязанностей временно отсутствующего работника без освобождения от работы, определенной
        трудовым договором, работнику может быть поручена дополнительная работа как по другой, так и по такой же
        профессии (должности).
    - doc: tk-rf
      anchor: st-72-1
      quote: >-
        Перевод на другую работу - постоянное или временное изменение трудовой функции работника
    - doc: tk-rf
      anchor: st-72-2
      quote: >-
        такой перевод осуществляется для замещения временно отсутствующего работника, за которым в соответствии
        с законом сохраняется место работы, - до выхода этого работника на работу
    - doc: tk-rf
      anchor: st-60-1
      quote: >-
        Работник имеет право заключать трудовые договоры о выполнении в свободное от основной работы время
        другой регулярной оплачиваемой работы у того же работодателя (внутреннее совместительство)
  trap:
    kind: wording
    note: >-
      Лаборант и бухгалтер оба берут чужую работу в свой рабочий день, но временно отсутствующий коллега есть только у бухгалтера. Секретарь, в отличие от бухгалтера, свою работу оставила.
  revision: 1
  checked: '2026-11-17'
