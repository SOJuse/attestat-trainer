- id: K-bolnichnyj-materinstvo-i-garantii-001
  type: multiple
  difficulty: 2
  situation: >-
    Школа везёт команду на олимпиаду в другой город, поездка приходится на субботу и воскресенье.
    Сопровождать детей директор хочет поручить двум учительницам. Первая беременна.
    У второй сыну два года, медицинских запретов у неё нет.
  question: Что из этого верно? Отметьте все верные варианты.
  options:
    - text: Беременную учительницу направить нельзя, даже с её согласия
      correct: true
      why: >-
        Для беременных часть первая статьи 259 прямо запрещает командировки и работу в выходные,
        согласие этот запрет не снимает.
    - text: Вторую учительницу можно направить только с её письменного согласия
      correct: true
      why: >-
        Женщин с детьми до трёх лет направляют в командировку и привлекают к работе в выходные
        только с письменного согласия и при отсутствии медицинского запрета.
    - text: Вторую учительницу нужно письменно ознакомить с правом отказаться
      correct: true
      why: >-
        Часть вторая статьи 259 обязывает в письменной форме ознакомить таких работниц с правом
        отказаться от командировки и от работы в выходные.
    - text: Беременную учительницу можно направить с её письменного согласия
      correct: false
      why: Письменное согласие спрашивают у матерей детей до трёх лет. Беременных направлять запрещено.
    - text: Вторую учительницу направить нельзя, даже с её согласия
      correct: false
      why: >-
        Безусловный запрет касается только беременных. Мать ребёнка до трёх лет можно направить,
        если она письменно согласна.
    - text: Со второй учительницей нужно согласовать только работу в выходные
      correct: false
      why: >-
        Поездка с командой в другой город по распоряжению директора считается служебной командировкой
        (статья 166). Письменное согласие нужно и на командировку, и на работу в выходные дни.
  explanation: >-
    Поездка с командой на олимпиаду в другой город по распоряжению директора считается служебной
    командировкой (статья 166), и приходится она на выходные. Статья 259 различает два случая. Беременных женщин запрещено направлять в командировки и привлекать
    к работе в выходные, их согласие ничего не меняет. Женщину с ребёнком до трёх лет можно направить
    только с её письменного согласия и если это не запрещено ей по медицинскому заключению. Кроме того,
    её нужно письменно ознакомить с правом отказаться.
  refs:
    - doc: tk-rf
      anchor: st-166
      quote: >-
        поездка работника по распоряжению работодателя на определенный срок для выполнения служебного
        поручения вне места постоянной работы
    - doc: tk-rf
      anchor: st-259
      quote: >-
        Запрещаются направление в служебные командировки, привлечение к сверхурочной работе, работе
        в ночное время, выходные и нерабочие праздничные дни беременных женщин.
    - doc: tk-rf
      anchor: st-259
      quote: >-
        Направление в служебные командировки, привлечение к сверхурочной работе, работе в ночное время,
        выходные и нерабочие праздничные дни женщин, имеющих детей в возрасте до трех лет, допускаются
        только с их письменного согласия
    - doc: tk-rf
      anchor: st-259
      quote: >-
        должны быть ознакомлены в письменной форме со своим правом отказаться от направления
        в служебную командировку
  revision: 1
  checked: '2026-11-16'

- id: K-bolnichnyj-materinstvo-i-garantii-002
  type: single
  difficulty: 1
  situation: >-
    Делопроизводителю школы установили II группу инвалидности. Она работает по 40 часов в неделю
    и принесла справку об инвалидности в отдел кадров. Об изменении режима работы она не просила.
  question: Какую продолжительность рабочего времени школа должна ей теперь установить? Выберите один вариант.
  options:
    - text: Не более 35 часов в неделю
      correct: true
      why: >-
        Работникам с I или II группой инвалидности статья 92 устанавливает сокращённое время
        не более 35 часов в неделю.
    - text: Не более 36 часов в неделю
      correct: false
      why: >-
        Предел в 36 часов статья 92 связывает с вредными условиями труда 3 или 4 степени и опасными
        условиями, а не с инвалидностью.
    - text: Не более 24 часов в неделю
      correct: false
      why: Предел в 24 часа в неделю установлен для работников младше шестнадцати лет.
    - text: Не более 40 часов в неделю
      correct: false
      why: >-
        Прежние 40 часов оставить нельзя: при II группе инвалидности рабочее время сокращается,
        и норма не ставит это в зависимость от просьбы работника.
  explanation: >-
    Часть первая статьи 92 перечисляет, кому устанавливается сокращённое рабочее время. Среди них работники
    с I или II группой инвалидности: им положено не более 35 часов в неделю. У делопроизводителя
    II группа, поэтому школа должна сократить ей рабочую неделю. Норма не связывает это с заявлением работника,
    так что ждать просьбы не нужно.
  refs:
    - doc: tk-rf
      anchor: st-92
      quote: для работников, являющихся инвалидами I или II группы, - не более 35 часов в неделю
    - doc: tk-rf
      anchor: st-92
      quote: >-
        отнесены к вредным условиям труда 3 или 4 степени или опасным условиям труда, - не более 36 часов
        в неделю
    - doc: tk-rf
      anchor: st-92
      quote: для работников в возрасте до шестнадцати лет - не более 24 часов в неделю
  revision: 1
  checked: '2026-11-17'

- id: K-bolnichnyj-materinstvo-i-garantii-003
  type: single
  difficulty: 2
  situation: >-
    Учитель музыки с 2019 года работает в детской школе искусств, это его основное место работы. С 2022 года
    он ещё ведёт уроки в общеобразовательной школе по внешнему совместительству. Других мест работы у него
    за эти годы не было. В ноябре 2026 года он заболел гриппом и восемь дней был на больничном.
  question: Как будет оплачен его больничный? Выберите один вариант.
  options:
    - text: 'По обоим местам работы: первые три дня оплатит каждый работодатель, с четвёртого дня Социальный фонд'
      correct: true
      why: >-
        Он работает у двух работодателей и у них же работал в 2024 и 2025 годах, поэтому пособие назначают
        по каждому из них. Первые три дня болезни оплачивает каждый работодатель, остальные дни оплачивает фонд.
    - text: 'По основному месту работы: первые три дня оплатит школа искусств, с четвёртого дня Социальный фонд'
      correct: false
      why: >-
        Часть 2 статьи 13 не различает основное место работы и совместительство: пособие назначают
        по каждому работодателю, у которого человек работает сейчас и работал в два предыдущих года.
    - text: 'По одному месту работы на его выбор: первые три дня оплатит этот работодатель, остальные Социальный фонд'
      correct: false
      why: >-
        Выбрать одного работодателя можно, если в два предыдущих года человек работал у других
        работодателей. Учитель в эти годы работал у тех же двух.
    - text: 'По обоим местам работы: все дни больничного, включая первые три, оплатит каждый работодатель'
      correct: false
      why: >-
        Из средств работодателя оплачивают первые три дня болезни, а начиная с четвёртого дня пособие
        платят из бюджета фонда.
    - text: 'По обоим местам работы: все дни больничного, включая первые три, оплатит Социальный фонд'
      correct: false
      why: >-
        Когда работник болеет сам, первые три дня оплачивает работодатель. Фонд платит пособие
        начиная с четвёртого дня.
  explanation: >-
    Если человек работает у нескольких работодателей и в два предыдущих календарных года работал у них же,
    пособие по временной нетрудоспособности назначают по каждому из них (часть 2 статьи 13 закона № 255-ФЗ).
    Первые три дня болезни оплачивает каждый из этих работодателей (часть 2 статьи 14.1), а начиная
    с четвёртого дня пособие платят из бюджета Фонда пенсионного и социального страхования (пункт 1 части 2
    статьи 3). Учитель с 2022 года работает в обеих школах,
    так что и в 2024, и в 2025 году он был занят у тех же двух работодателей. Поэтому больничный ему оплатят
    по обоим местам работы.
  refs:
    - doc: fz-255
      anchor: st-13
      quote: >-
        на момент наступления страхового случая занято у нескольких страхователей и в двух предшествующих
        календарных годах было занято у тех же страхователей, пособия по временной нетрудоспособности,
        по беременности и родам назначаются и выплачиваются ему страховщиком по каждому из страхователей
    - doc: fz-255
      anchor: st-13
      quote: >-
        а в двух предшествующих календарных годах было занято у других страхователей (другого страхователя),
        пособия по временной нетрудоспособности, по беременности и родам, ежемесячное пособие по уходу
        за ребенком назначаются и выплачиваются ему страховщиком по одному из страхователей
    - doc: fz-255
      anchor: st-14-1
      quote: >-
        Если застрахованное лицо на момент наступления страхового случая занято у нескольких страхователей,
        пособие по временной нетрудоспособности за первые три дня временной нетрудоспособности назначается
        и выплачивается ему каждым из страхователей
    - doc: fz-255
      anchor: st-3
      quote: >-
        за первые три дня временной нетрудоспособности за счет средств страхователя, а за остальной период
        начиная с 4-го дня временной нетрудоспособности за счет средств бюджета Фонда пенсионного
        и социального страхования Российской Федерации
  revision: 1
  checked: '2026-11-17'

- id: K-bolnichnyj-materinstvo-i-garantii-004
  type: multiple
  difficulty: 3
  situation: >-
    Лаборант кабинета химии работает в школе с 1 сентября. В ноябре она сообщила директору, что беременна
    и ждёт одного ребёнка. Отпуск по беременности и родам у неё начнётся в конце января. Пока она, как
    и раньше, готовит реактивы к урокам.
  question: Что из этого верно? Отметьте все верные варианты.
  options:
    - text: Перед отпуском по беременности и родам ей дадут ежегодный оплачиваемый отпуск, если она попросит
      correct: true
      why: >-
        Статья 260 даёт женщине ежегодный оплачиваемый отпуск перед отпуском по беременности и родам
        по её желанию и независимо от стажа работы у этого работодателя.
    - text: Ежегодный оплачиваемый отпуск ей дадут не раньше, чем она проработает в школе шесть месяцев
      correct: false
      why: >-
        Для ежегодного отпуска перед отпуском по беременности и родам статья 260 стаж работы у этого
        работодателя не учитывает.
    - text: Если роды наступят раньше срока, неиспользованные дни отпуска до родов добавят к отпуску после родов
      correct: true
      why: >-
        Отпуск по беременности и родам считают суммарно и дают полностью, сколько бы дней из него
        ни пришлось на время до родов.
    - text: За время обязательного диспансерного обследования за ней сохранят средний заработок
      correct: true
      why: Часть третья статьи 254 сохраняет беременным средний заработок по месту работы на время такого обследования.
    - text: Перевести её на работу без реактивов школа обязана по её заявлению, медицинское заключение не нужно
      correct: false
      why: >-
        Беременную переводят на работу без неблагоприятных производственных факторов по её заявлению
        и в соответствии с медицинским заключением. Заявления без заключения недостаточно.
    - text: До родов её отпуск по беременности и родам продлится 84 календарных дня
      correct: false
      why: 84 дня до родов дают при многоплодной беременности. Она ждёт одного ребёнка, ей положено 70 дней.
  explanation: >-
    Статья 260 позволяет женщине по её желанию взять ежегодный оплачиваемый отпуск перед отпуском по беременности
    и родам, стаж у работодателя при этом значения не имеет. Отпуск по беременности и родам при одном ребёнке
    рассчитан на 70 календарных дней до родов. Он считается суммарно и даётся полностью, даже если до родов
    фактически прошло меньше дней
    (статья 255). На время обязательного диспансерного обследования за беременной сохраняется средний заработок,
    а перевод на работу без неблагоприятных факторов делают по её заявлению и по медицинскому заключению (статья 254).
  refs:
    - doc: tk-rf
      anchor: st-260
      quote: >-
        Перед отпуском по беременности и родам или непосредственно после него либо по окончании отпуска
        по уходу за ребенком женщине по ее желанию предоставляется ежегодный оплачиваемый отпуск независимо
        от стажа работы у данного работодателя.
    - doc: tk-rf
      anchor: st-255
      quote: >-
        Отпуск по беременности и родам исчисляется суммарно и предоставляется женщине полностью независимо
        от числа дней, фактически использованных ею до родов.
    - doc: tk-rf
      anchor: st-255
      quote: >-
        продолжительностью 70 (в случае многоплодной беременности - 84) календарных дней до родов
    - doc: tk-rf
      anchor: st-254
      quote: >-
        При прохождении обязательного диспансерного обследования в медицинских организациях за беременными
        женщинами сохраняется средний заработок по месту работы.
    - doc: tk-rf
      anchor: st-254
      quote: >-
        Беременным женщинам в соответствии с медицинским заключением и по их заявлению снижаются нормы
        выработки, нормы обслуживания либо эти женщины переводятся на другую работу, исключающую воздействие
        неблагоприятных производственных факторов
  trap:
    kind: wording
    note: >-
      Лаборант работает в школе меньше шести месяцев, и это подталкивает отказать ей в ежегодном отпуске.
      Но перед отпуском по беременности и родам стаж у работодателя значения не имеет.
  revision: 1
  checked: '2026-11-17'

- id: K-bolnichnyj-materinstvo-i-garantii-005
  type: input
  difficulty: 3
  situation: >-
    Учитель географии со страховым стажем 12 лет уволился из школы по собственному желанию 31 октября.
    На новую работу он пока не устроился. 14 ноября он заболел ангиной и неделю был на больничном.
  question: В каком размере ему положено пособие по временной нетрудоспособности? Ответ в процентах среднего заработка.
  answer: 60
  unit: '%'
  explanation: >-
    Пособие по временной нетрудоспособности платят и тому, кто заболел в течение 30 календарных дней после
    прекращения работы (часть 2 статьи 5 закона № 255-ФЗ). Учитель заболел через две недели после увольнения,
    поэтому право на пособие у него есть. Размер в этом случае от стажа не зависит: по части 2 статьи 7 пособие
    составляет 60 процентов среднего заработка. Шкала по стажу из части 1 той же статьи, где при стаже 8 лет
    и более положено 100 процентов, этот случай прямо исключает.
  refs:
    - doc: fz-255
      anchor: st-5
      quote: >-
        а также в случаях, когда заболевание или травма наступили в течение 30 календарных дней со дня
        прекращения указанной работы или деятельности
    - doc: fz-255
      anchor: st-7
      quote: >-
        выплачивается застрахованным лицам в размере 60 процентов среднего заработка в случае заболевания
        или травмы, наступивших в течение 30 календарных дней после прекращения работы по трудовому договору
    - doc: fz-255
      anchor: st-7
      quote: >-
        Пособие по временной нетрудоспособности при утрате трудоспособности вследствие заболевания или травмы,
        за исключением случаев, указанных в части 2 настоящей статьи
  trap:
    kind: wording
    note: Стаж 12 лет подталкивает ответить 100 процентов, но заболел учитель уже после увольнения.
  revision: 1
  checked: '2026-11-17'
