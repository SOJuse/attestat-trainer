- id: K-uvolnenie-001
  type: single
  difficulty: 1
  situation: >-
    Директор государственной школы работает по срочному трудовому договору на пять лет, который с ним
    заключил учредитель. Прошло три года. Директору предложили другую работу, и он решил досрочно
    уволиться по своей инициативе.
  question: За какой срок директор должен письменно предупредить учредителя? Выберите один вариант.
  options:
    - text: Не позднее чем за две недели
      correct: false
      why: >-
        Две недели статья 80 даёт как общее правило и сама оговаривает, что кодекс может установить
        иной срок. Для руководителя организации иной срок установлен в статье 280.
    - text: Не позднее чем за один месяц
      correct: true
      why: >-
        Статья 280 позволяет руководителю организации досрочно расторгнуть договор, предупредив
        работодателя письменно не позднее чем за месяц.
    - text: Не позднее чем за два месяца
      correct: false
      why: >-
        За два месяца работодатель предупреждает работников о сокращении штата. К уходу руководителя
        по собственной инициативе этот срок не относится.
    - text: Не позднее чем за три календарных дня
      correct: false
      why: >-
        Этот срок относится к истечению срочного договора, а здесь договор расторгается досрочно
        и по инициативе директора.
  explanation: >-
    По общему правилу статьи 80 работник предупреждает работодателя за две недели, если кодекс или
    другой федеральный закон не установил иной срок. Для руководителя организации иной срок есть:
    по статье 280 он вправе досрочно расторгнуть трудовой договор, письменно предупредив работодателя
    не позднее чем за один месяц. Директор школы руководит организацией, поэтому предупреждает
    учредителя за месяц.
  refs:
    - doc: tk-rf
      anchor: st-280
      quote: >-
        Руководитель организации имеет право досрочно расторгнуть трудовой договор, предупредив об этом
        работодателя (собственника имущества организации, его представителя) в письменной форме
        не позднее чем за один месяц.
    - doc: tk-rf
      anchor: st-80
      quote: >-
        предупредив об этом работодателя в письменной форме не позднее чем за две недели, если иной срок
        не установлен настоящим Кодексом или иным федеральным законом
    - doc: tk-rf
      anchor: st-180
      quote: >-
        работники предупреждаются работодателем персонально и под роспись не менее чем за два месяца
        до увольнения
    - doc: tk-rf
      anchor: st-79
      quote: >-
        О прекращении трудового договора в связи с истечением срока его действия работник должен быть
        предупрежден в письменной форме не менее чем за три календарных дня до увольнения
  revision: 1
  checked: '2026-11-17'

- id: K-uvolnenie-002
  type: single
  difficulty: 2
  situation: >-
    Учитель истории подал заявление с просьбой уволить его по собственному желанию по истечении двух недель.
    В тот же день директор по телефону договорился с учительницей соседней школы, что она перейдёт на это место
    переводом, но письменного приглашения ей не направлял. Через неделю учитель передумал и письменно отозвал
    своё заявление.
  question: Как должен поступить директор? Выберите один вариант.
  options:
    - text: Уволить учителя, ведь на его место уже нашли замену
      correct: false
      why: >-
        Отзыв не останавливает увольнение, если на место работника в письменной форме приглашён другой
        работник, которому нельзя отказать в договоре. Устная договорённость этим приглашением не считается.
    - text: Уволить учителя, если директор не согласен на отзыв
      correct: false
      why: >-
        До истечения срока предупреждения работник вправе отозвать заявление в любое время, согласие
        директора для этого не требуется.
    - text: Оставить учителя на работе по прежнему договору
      correct: true
      why: >-
        Учитель отозвал заявление до истечения срока предупреждения, а другого работника на его место
        письменно не приглашали.
    - text: Оставить учителя, заключив с ним новый трудовой договор
      correct: false
      why: >-
        Раз увольнение не производится, прежний трудовой договор продолжает действовать, и новый
        заключать незачем.
  explanation: >-
    Часть четвёртая статьи 80 позволяет работнику в любое время до истечения срока предупреждения отозвать
    заявление, и тогда увольнение не производится. Отзыв не действует, если на место работника в письменной
    форме приглашён другой работник, которому по закону не может быть отказано в заключении договора.
    Директор договорился с учительницей устно, письменного приглашения не было, поэтому учитель
    продолжает работать по прежнему договору.
  refs:
    - doc: tk-rf
      anchor: st-80
      quote: >-
        До истечения срока предупреждения об увольнении работник имеет право в любое время отозвать
        свое заявление.
    - doc: tk-rf
      anchor: st-80
      quote: >-
        Увольнение в этом случае не производится, если на его место не приглашен в письменной форме
        другой работник
  trap:
    kind: wording
    note: Замену директор нашёл, но договорился с ней устно, а норма говорит о приглашении в письменной форме.
  revision: 1
  checked: '2026-11-17'

- id: K-uvolnenie-003
  type: multiple
  difficulty: 2
  situation: >-
    Директор разбирает служебные записки о четырёх учителях, все факты подтвердила проверка, последние
    проступки совершены и выявлены на этой неделе. Учитель технологии, чтобы наказать ученика за сорванный
    урок, один раз ударил его линейкой по рукам. Учитель географии грубо нарушил устав школы, хотя восемь
    месяцев назад уже допустил такое же нарушение и получил за него замечание. Учитель химии грубо нарушил
    устав, а первое такое нарушение допустил полтора года назад и получил за него замечание. Учитель музыки
    грубо нарушил устав впервые.
  question: >-
    Кого из них директор вправе уволить по дополнительным основаниям, которые Трудовой кодекс установил
    для педагогических работников? Отметьте все верные варианты.
  options:
    - text: Учителя технологии
      correct: true
      why: >-
        Методы воспитания, связанные с физическим насилием над учеником, дают основание для увольнения,
        даже если их применили один раз.
    - text: Учителя географии
      correct: true
      why: Это повторное грубое нарушение устава, и между нарушениями прошло меньше года.
    - text: Учителя химии
      correct: false
      why: >-
        Нарушение повторное, но первое было полтора года назад, а основание требует повторности
        в течение одного года.
    - text: Учителя музыки
      correct: false
      why: Первого грубого нарушения устава для этого основания недостаточно, нужно повторное.
  explanation: >-
    Статья 336 добавляет для педагогов основания увольнения сверх общих. По пункту 1 увольняют за повторное
    в течение одного года грубое нарушение устава, поэтому не подходят ни первое нарушение, ни повторное
    через полтора года. По пункту 2 достаточно применить, в том числе однократно, методы воспитания,
    связанные с физическим или психическим насилием над личностью обучающегося.
  refs:
    - doc: tk-rf
      anchor: st-336
      quote: повторное в течение одного года грубое нарушение устава организации, осуществляющей образовательную деятельность
    - doc: tk-rf
      anchor: st-336
      quote: >-
        применение, в том числе однократное, методов воспитания, связанных с физическим и (или) психическим
        насилием над личностью обучающегося, воспитанника
  revision: 1
  checked: '2026-11-17'

- id: K-uvolnenie-004
  type: multiple
  difficulty: 3
  situation: >-
    Учитель информатики с 3 марта на больничном, когда он выйдет, пока неизвестно. Директор прикидывает,
    при каких обстоятельствах трудовой договор с ним может прекратиться, пока учитель болеет.
  question: В каких случаях увольнение учителя в период болезни законно? Отметьте все верные варианты.
  options:
    - text: Он до болезни подал заявление по собственному желанию, и срок предупреждения истекает на больничном
      correct: true
      why: >-
        Запрет увольнять на больничном касается увольнения по инициативе работодателя, а здесь договор
        расторгается по инициативе работника.
    - text: Он сам предложил расторгнуть договор по соглашению сторон, и директор подписал соглашение
      correct: true
      why: >-
        По соглашению сторон договор можно расторгнуть в любое время, и это не увольнение по инициативе
        работодателя.
    - text: Его срочный договор, заключённый до 31 мая, истекает, пока он на больничном
      correct: true
      why: >-
        Истечение срока трудового договора закон называет отдельным основанием прекращения,
        это не инициатива работодателя.
    - text: Учредитель ликвидирует школу, и дата увольнения всех работников приходится на его болезнь
      correct: true
      why: Ликвидация организации прямо названа исключением из запрета увольнять в период нетрудоспособности.
    - text: До болезни он без уважительных причин пропустил рабочий день, и директор решил уволить его за прогул
      correct: false
      why: >-
        Увольнение за прогул происходит по инициативе работодателя, поэтому на время больничного
        оно запрещено.
    - text: Аттестация показала, что он не соответствует должности, а подходящих вакансий в школе нет
      correct: false
      why: >-
        Несоответствие должности тоже основание по инициативе работодателя. Отсутствие вакансий запрет
        на время болезни не снимает.
  explanation: >-
    Часть шестая статьи 81 запрещает увольнять работника в период временной нетрудоспособности и отпуска
    по инициативе работодателя, а ликвидацию организации из этого запрета исключает. Статья 77 называет
    инициативу работодателя отдельным основанием, наряду с соглашением сторон, истечением срока договора
    и инициативой работника. Поэтому по этим трём основаниям договор прекращается и во время больничного,
    а увольнять учителя на больничном за прогул или по итогам аттестации нельзя.
  refs:
    - doc: tk-rf
      anchor: st-81
      quote: >-
        Не допускается увольнение работника по инициативе работодателя (за исключением случая ликвидации
        организации либо прекращения деятельности индивидуальным предпринимателем) в период его временной
        нетрудоспособности и в период пребывания в отпуске.
    - doc: tk-rf
      anchor: st-77
      quote: соглашение сторон (статья 78 настоящего Кодекса)
    - doc: tk-rf
      anchor: st-77
      quote: истечение срока трудового договора (статья 79 настоящего Кодекса)
    - doc: tk-rf
      anchor: st-77
      quote: расторжение трудового договора по инициативе работника (статья 80 настоящего Кодекса)
    - doc: tk-rf
      anchor: st-77
      quote: расторжение трудового договора по инициативе работодателя (статьи 71 и 81 настоящего Кодекса)
    - doc: tk-rf
      anchor: st-78
      quote: Трудовой договор может быть в любое время расторгнут по соглашению сторон трудового договора.
    - doc: tk-rf
      anchor: st-79
      quote: Срочный трудовой договор прекращается с истечением срока его действия.
  trap:
    kind: wording
    note: >-
      Запрет увольнять на больничном действует не для любого увольнения, а только по инициативе
      работодателя, и даже для него есть исключение.
  revision: 1
  checked: '2026-11-17'

- id: K-uvolnenie-005
  type: sequence
  difficulty: 2
  situation: >-
    20 февраля учителю объявили выговор, с которым он не согласен. 10 марта его уволили за прогул, в тот же
    день вручили копию приказа и выдали трудовую книжку. Компенсацию за неиспользованный отпуск, которую
    должны были выплатить в день увольнения, ему так и не выплатили. Учитель хочет обратиться в суд
    по всем трём вопросам.
  question: >-
    Расставьте требования учителя в том порядке, в каком истекают сроки обращения с ними в суд,
    начиная с самого раннего.
  items:
    - Восстановить его на работе
    - Отменить выговор
    - Взыскать компенсацию за неиспользованный отпуск
  explanation: >-
    Статья 392 устанавливает разные сроки. По спору об увольнении это один месяц со дня вручения копии
    приказа или выдачи трудовой книжки, он отсчитывается от 10 марта и закончится в апреле. По остальным
    спорам, в том числе о выговоре, срок три месяца со дня, когда работник узнал о нарушении своего права:
    от 20 февраля он закончится только в мае. За суммами, не выплаченными при увольнении, можно обратиться
    в течение одного года со дня, когда их должны были выплатить.
  refs:
    - doc: tk-rf
      anchor: st-392
      quote: >-
        а по спорам об увольнении - в течение одного месяца со дня вручения ему копии приказа об увольнении
        либо со дня выдачи трудовой книжки
    - doc: tk-rf
      anchor: st-392
      quote: >-
        Работник имеет право обратиться в суд за разрешением индивидуального трудового спора в течение трех
        месяцев со дня, когда он узнал или должен был узнать о нарушении своего права
    - doc: tk-rf
      anchor: st-392
      quote: >-
        в течение одного года со дня установленного срока выплаты указанных сумм, в том числе в случае
        невыплаты или неполной выплаты заработной платы и других выплат, причитающихся работнику при увольнении
  revision: 1
  checked: '2026-11-17'
