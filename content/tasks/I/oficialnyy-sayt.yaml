- id: I-oficialnyy-sayt-001
  type: input
  difficulty: 1
  situation: >-
    Школа утвердила новое положение о режиме занятий. Ответственный за сайт спрашивает директора, сколько
    времени есть на то, чтобы разместить документ на официальном сайте.
  question: >-
    В течение скольких рабочих дней со дня создания документа школа должна обновить сведения на сайте?
    Ответ в рабочих днях.
  answer: 10
  unit: рабочих дней
  explanation: >-
    По пункту 16 Правил размещения информации на официальном сайте образовательная организация обновляет
    сведения не позднее 10 рабочих дней со дня их создания, получения или внесения в них изменений.
  refs:
    - doc: pp-rf-1802
      anchor: pril-1-p-16
      quote: >-
        не позднее 10 рабочих дней со дня их создания, получения или внесения в них соответствующих изменений
  revision: 1
  checked: '2026-11-19'

- id: I-oficialnyy-sayt-002
  type: multiple
  difficulty: 2
  situation: >-
    Ответственный за сайт школы заполняет раздел о педагогическом составе и составил список полей для
    каждого учителя. Директор сверяет список с Правилами размещения информации на официальном сайте.
  question: Какие сведения о педагоге Правила называют для размещения на сайте? Отметьте все верные варианты.
  options:
    - text: Преподаваемые учебные предметы
      correct: true
      why: Преподаваемые учебные предметы, курсы, дисциплины названы в подпункте «в» пункта 11 Правил.
    - text: Адрес места жительства
      correct: false
      why: >-
        Адреса места жительства в пункте 11 Правил нет, а пункт 19 требует соблюдать законодательство
        о персональных данных.
    - text: Сведения о повышении квалификации за последние три года
      correct: true
      why: Сведения о повышении квалификации за последние 3 года названы в подпункте «ж» пункта 11 Правил.
    - text: Размер заработной платы
      correct: false
      why: Размер заработной платы педагога пункт 11 Правил не называет.
    - text: Занимаемая должность
      correct: true
      why: Занимаемая должность названа в подпункте «б» пункта 11 Правил.
  explanation: >-
    Пункт 11 Правил перечисляет сведения о персональном составе педагогических работников: фамилия, имя,
    отчество, должность, преподаваемые предметы, уровень образования, учёная степень и звание, повышение
    квалификации за последние три года, профессиональная переподготовка, опыт работы. Адреса места жительства
    и зарплаты в перечне нет, а пункт 19 требует соблюдать законодательство о персональных данных.
  refs:
    - doc: pp-rf-1802
      anchor: pril-1-p-11
      quote: в) преподаваемые учебные предметы, курсы, дисциплины (модули);
    - doc: pp-rf-1802
      anchor: pril-1-p-11
      quote: ж) сведения о повышении квалификации (за последние 3 года);
    - doc: pp-rf-1802
      anchor: pril-1-p-19
      quote: >-
        При размещении информации на официальном сайте и ее обновлении обеспечивается соблюдение требований
        законодательства Российской Федерации о персональных данных.
  revision: 1
  checked: '2026-11-19'

- id: I-oficialnyy-sayt-003
  type: single
  difficulty: 3
  situation: >-
    Орган государственного контроля в сфере образования выдал школе предписание, его копия размещена на сайте.
    Школа устранила нарушения и направила отчёт. Подтверждения от органа пока нет, предписание никто
    не оспаривал. Завуч предлагает убрать копию с сайта: «мы же всё исправили».
  question: Можно ли убрать копию предписания с сайта? Выберите один вариант.
  options:
    - text: Нельзя, пока орган контроля не подтвердит исполнение предписания
      correct: true
      why: >-
        Копии предписаний размещаются до подтверждения органом исполнения предписания или признания
        его недействительным.
    - text: Можно, школа устранила нарушения и отчиталась
      correct: false
      why: >-
        Отчёта школы недостаточно. Копию держат на сайте, пока орган не подтвердит исполнение предписания.
    - text: Можно через десять рабочих дней после отправки отчёта
      correct: false
      why: Такого срока Правила не устанавливают, они связывают размещение с подтверждением исполнения.
    - text: Нельзя, копия должна оставаться на сайте до конца учебного года
      correct: false
      why: С учебным годом срок не связан. Копию убирают после подтверждения исполнения или признания предписания недействительным.
  explanation: >-
    Пункт 15 Правил размещения информации на официальном сайте требует держать копии предписаний органов
    государственного контроля в сфере образования на сайте до тех пор, пока эти органы не подтвердят исполнение
    предписания или оно не будет признано недействительным. Пока подтверждения нет, убирать копию нельзя.
  refs:
    - doc: pp-rf-1802
      anchor: pril-1-p-15
      quote: >-
        размещаются на официальном сайте образовательной организации до подтверждения указанными органами
        исполнения предписания или признания его недействительным в установленном законом порядке
  trap:
    kind: wording
    note: >-
      Школа нарушения устранила и отчиталась, но срок размещения зависит не от этого, а от подтверждения органа контроля.
  revision: 1
  checked: '2026-11-19'

- id: I-oficialnyy-sayt-004
  type: multiple
  difficulty: 2
  situation: >-
    Школа заказывает новый официальный сайт. Подрядчик прислал список того, что будут обеспечивать его
    технологические и программные средства. Директор сверяет список с Правилами размещения информации
    на официальном сайте образовательной организации.
  question: Что из списка Правила требуют обеспечить? Отметьте все верные варианты.
  options:
    - text: Доступ к информации без программ, за установку которых с пользователя берут плату
      correct: true
      why: >-
        Средства сайта должны обеспечивать доступ к информации без программного обеспечения, установка
        которого требует соглашения с правообладателем со взиманием платы с пользователя.
    - text: Защиту информации от уничтожения, модификации и блокирования доступа к ней
      correct: true
      why: Это требование названо в подпункте «б» пункта 20 Правил.
    - text: Вход в разделы с документами школы после регистрации пользователя
      correct: false
      why: Регистрации пользователей пункт 20 Правил не требует.
    - text: Возможность копирования информации на резервный носитель для её восстановления
      correct: true
      why: Это требование названо в подпункте «в» пункта 20 Правил.
    - text: Защиту размещённых текстов от копирования пользователями
      correct: false
      why: Такого требования в пункте 20 нет. Копирование там названо в другом смысле, как резервное, для восстановления информации.
  explanation: >-
    Пункт 20 Правил называет три требования к технологическим и программным средствам сайта. Они должны
    обеспечивать доступ к информации без платного для пользователя программного обеспечения, защиту информации
    от уничтожения, модификации и блокирования, а также возможность копирования на резервный носитель.
  refs:
    - doc: pp-rf-1802
      anchor: pril-1-p-20
      quote: >-
        доступ к размещенной на официальном сайте информации без использования программного обеспечения,
        установка которого на технические средства пользователя информации требует заключения лицензионного или иного соглашения с правообладателем программного обеспечения, предусматривающего взимание с пользователя информации платы
    - doc: pp-rf-1802
      anchor: pril-1-p-20
      quote: >-
        защиту информации от уничтожения, модификации и блокирования доступа к ней, а также иных неправомерных
        действий в отношении нее
    - doc: pp-rf-1802
      anchor: pril-1-p-20
      quote: возможность копирования информации на резервный носитель, обеспечивающий ее восстановление
  revision: 1
  checked: '2026-11-19'

- id: I-oficialnyy-sayt-005
  type: single
  difficulty: 2
  situation: >-
    Школа сама разработала и утвердила положение о школьной форме. Для сайта секретарь отсканировал
    бумажный экземпляр с подписью директора и печатью и хочет выложить этот скан.
  question: В какой форме Правила требуют размещать такой документ? Выберите один вариант.
  options:
    - text: Как скан бумажного документа с подписью и печатью
      correct: false
      why: >-
        Для документов, которые школа сама разрабатывает и утверждает, Правила называют электронный документ
        с простой электронной подписью.
    - text: Как электронный документ, подписанный простой электронной подписью
      correct: true
      why: >-
        Документы, самостоятельно разрабатываемые и утверждаемые образовательной организацией, размещают
        в форме электронных документов, подписанных простой электронной подписью.
    - text: Как электронный документ, подписанный усиленной квалифицированной электронной подписью
      correct: false
      why: Правила называют простую электронную подпись, усиленной квалифицированной они не требуют.
    - text: Как текст на странице сайта без подписи
      correct: false
      why: Для собственных документов школы Правила требуют электронный документ с простой электронной подписью.
  explanation: >-
    По пункту 18 Правил информацию размещают в текстовой и табличной формах, в форме копий документов
    и электронных документов, подписанных простой электронной подписью. Последнее относится к документам,
    которые образовательная организация сама разрабатывает и утверждает. Положение о школьной форме
    как раз такой документ.
  refs:
    - doc: pp-rf-1802
      anchor: pril-1-p-18
      quote: >-
        электронных документов, подписанных простой электронной подписью в соответствии с Федеральным законом "Об электронной подписи" (в части документов, самостоятельно разрабатываемых и утверждаемых образовательной организацией)
  revision: 1
  checked: '2026-11-19'
