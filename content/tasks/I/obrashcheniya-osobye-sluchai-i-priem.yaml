- id: I-obrashcheniya-osobye-sluchai-i-priem-001
  type: matching
  difficulty: 2
  situation: >-
    За одну неделю в школу пришли четыре письменных обращения, все их зарегистрировали.
    Секретарь просит директора решить, что делать с каждым.
  question: Сопоставьте обращение и то, как с ним следует поступить по закону.
  pairs:
    - left: Письмо без фамилии автора и обратного адреса, в нём сказано, что учитель физкультуры ударил ученика
      right: Ответ не давать, письмо направить в государственный орган по его компетенции
    - left: Письмо с фамилией и адресом, но с нецензурной бранью в адрес директора
      right: Вправе оставить без ответа по существу и сообщить автору о недопустимости злоупотребления правом
    - left: Рукописное письмо, текст разобрать нельзя, а фамилия и адрес автора читаются
      right: Ответ не давать и в течение семи дней со дня регистрации сообщить об этом автору
    - left: >-
        Пятое письмо директору от того же родителя с тем же вопросом и без новых доводов; на прежние
        четыре директор ответил письменно по существу
      right: Вправе признать обращение безосновательным, прекратить переписку по этому вопросу и уведомить автора
  explanation: >-
    Статья 11 закона об обращениях граждан задаёт порядок для таких писем. На письмо без фамилии или
    почтового адреса ответ не дают, но если в нём есть сведения о противоправном деянии и о том, кто его
    совершил, письмо направляют в государственный орган по компетенции. На нечитаемое письмо ответ тоже
    не дают, а автору сообщают об этом в течение семи дней со дня регистрации, если читаются его фамилия
    и адрес. Письмо с нецензурной бранью можно оставить без ответа по существу, сообщив автору о недопустимости
    злоупотребления правом. Если автору уже не раз письменно отвечали по существу, а в новом письме
    нет новых доводов, директор вправе признать обращение безосновательным и прекратить переписку,
    об этом решении автора уведомляют.
  refs:
    - doc: fz-59
      anchor: st-11
      quote: >-
        Если в указанном обращении содержатся сведения о подготавливаемом, совершаемом или совершенном
        противоправном деянии, а также о лице, его подготавливающем, совершающем или совершившем, обращение
        подлежит направлению в государственный орган в соответствии с его компетенцией.
    - doc: fz-59
      anchor: st-11
      quote: >-
        о чем в течение семи дней со дня регистрации обращения сообщается гражданину, направившему обращение,
        если его фамилия и почтовый адрес поддаются прочтению
    - doc: fz-59
      anchor: st-11
      quote: >-
        вправе оставить обращение без ответа по существу поставленных в нем вопросов и сообщить гражданину,
        направившему обращение, о недопустимости злоупотребления правом
    - doc: fz-59
      anchor: st-11
      quote: >-
        вправе принять решение о безосновательности очередного обращения и прекращении переписки с гражданином
        по данному вопросу
  trap:
    kind: wording
    note: >-
      Анонимное письмо обычно оставляют без ответа, но сведения о противоправном деянии меняют дело: письмо
      направляют в государственный орган. А сообщить автору нечитаемого письма можно, только если читаются
      его фамилия и адрес.
  revision: 1
  checked: '2026-11-16'

- id: I-obrashcheniya-osobye-sluchai-i-priem-002
  type: multiple
  difficulty: 2
  situation: >-
    Мать ученика написала директору государственной школы жалобу на классного руководителя и подробно
    описала в ней обстоятельства своей семьи. Часть вопросов из жалобы решает не школа, а орган опеки.
    Директор обсуждает с заместителем, что можно делать с этим письмом.
  question: Что из этого соответствует закону об обращениях граждан? Отметьте все верные варианты.
  options:
    - text: Зачитать письмо целиком на педагогическом совете, чтобы все сделали выводы
      correct: false
      why: >-
        Сведения из обращения и сведения о частной жизни гражданина нельзя разглашать без его согласия,
        а согласия мать не давала.
    - text: Направить письмо в орган опеки в той части, которую решает он
      correct: true
      why: >-
        Направление письменного обращения в орган, в компетенцию которого входит решение поставленных
        вопросов, разглашением не считается.
    - text: Не раскрывать посторонним сведения о частной жизни матери без её согласия
      correct: true
      why: Разглашение сведений, касающихся частной жизни гражданина, без его согласия не допускается.
    - text: Не допускать, чтобы мать или её сына преследовали из-за жалобы
      correct: true
      why: Преследовать гражданина за обращение с критикой или в защиту прав запрещено. Давление на сына из-за жалобы и есть преследование матери.
    - text: Разместить ответ на жалобу на сайте школы, чтобы его увидели другие родители
      correct: false
      why: На сайте размещают ответ на обращение, которое затрагивает интересы неопределённого круга лиц, и без разглашения сведений из него. Жалоба матери личная.
  explanation: >-
    Статья 6 закона о порядке рассмотрения обращений граждан запрещает преследовать гражданина за обращение
    и разглашать без его согласия сведения из обращения и сведения о его частной жизни. Разглашением
    не считается направление обращения тому, кто должен его рассматривать по компетенции.
  refs:
    - doc: fz-59
      anchor: st-6
      quote: >-
        При рассмотрении обращения не допускается разглашение сведений, содержащихся в обращении, а также
        сведений, касающихся частной жизни гражданина, без его согласия.
    - doc: fz-59
      anchor: st-6
      quote: >-
        Не является разглашением сведений, содержащихся в обращении, направление письменного обращения
        в государственный орган, орган местного самоуправления или должностному лицу, в компетенцию которых
        входит решение поставленных в обращении вопросов.
    - doc: fz-59
      anchor: st-6
      quote: >-
        Запрещается преследование гражданина в связи с его обращением в государственный орган, орган местного
        самоуправления или к должностному лицу с критикой деятельности указанных органов или должностного лица
    - doc: fz-59
      anchor: st-10
      quote: >-
        которые затрагивают интересы неопределенного круга лиц, в частности на обращение, в котором обжалуется
        судебное решение
  revision: 1
  checked: '2026-11-19'

- id: I-obrashcheniya-osobye-sluchai-i-priem-003
  type: multiple
  difficulty: 2
  situation: >-
    Директор государственной школы ведёт личный приём граждан по вторникам. Новый секретарь спрашивает,
    как оформлять приём по закону об обращениях граждан.
  question: Какие правила личного приёма верны? Отметьте все верные варианты.
  options:
    - text: На приёме гражданин предъявляет документ, удостоверяющий личность
      correct: true
      why: Так сказано в части 2 статьи 13 закона.
    - text: Содержание устного обращения заносят в карточку личного приёма
      correct: true
      why: Содержание устного обращения заносится в карточку личного приёма гражданина.
    - text: Письменное обращение, принятое на приёме, регистрировать не нужно, раз гражданина уже выслушали
      correct: false
      why: >-
        Письменное обращение, принятое в ходе личного приёма, подлежит регистрации и рассмотрению в общем
        порядке.
    - text: Если факты очевидны и проверки не требуют, с согласия гражданина ответ можно дать устно на приёме
      correct: true
      why: >-
        В таком случае ответ с согласия гражданина может быть дан устно в ходе приёма, о чём делают запись
        в карточке.
    - text: На любое устное обращение, принятое на приёме, дают письменный ответ
      correct: false
      why: Не на любое. Если факты очевидны, проверки не требуют и гражданин согласен, ответ дают устно. В остальных случаях дают письменный ответ.
  explanation: >-
    Статья 13 закона о порядке рассмотрения обращений граждан требует от гражданина документ, удостоверяющий
    личность, а от принимающего карточку личного приёма с содержанием устного обращения. Если факты очевидны
    и не требуют проверки, ответ с согласия гражданина дают устно и отмечают это в карточке. Письменное
    обращение, принятое на приёме, регистрируют и рассматривают в общем порядке.
  refs:
    - doc: fz-59
      anchor: st-13
      quote: При личном приеме гражданин предъявляет документ, удостоверяющий его личность.
    - doc: fz-59
      anchor: st-13
      quote: Содержание устного обращения заносится в карточку личного приема гражданина

    - doc: fz-59
      anchor: st-13
      quote: >-
        ответ на обращение с согласия гражданина может быть дан устно в ходе личного приема, о чем делается
        запись в карточке личного приема гражданина
    - doc: fz-59
      anchor: st-13
      quote: >-
        Письменное обращение, принятое в ходе личного приема, подлежит регистрации и рассмотрению в порядке,
        установленном настоящим Федеральным законом.
  revision: 1
  checked: '2026-11-19'

- id: I-obrashcheniya-osobye-sluchai-i-priem-004
  type: single
  difficulty: 3
  situation: >-
    Отец ученика подал в государственную школу жалобу на конфликт в классе. Школа провела проверку, ответ отцу ещё не направлен. Он просит показать ему материалы проверки. Среди них есть объяснительная учителя, в которой описано
    состояние здоровья другого ребёнка. Сведений, составляющих охраняемую законом тайну, в остальных
    материалах нет.
  question: Как школа должна ответить на просьбу? Выберите один вариант.
  options:
    - text: Показать материалы, кроме объяснительной со сведениями о здоровье другого ребёнка
      correct: true
      why: >-
        Гражданин вправе знакомиться с материалами по своему обращению, если это не затрагивает права, свободы
        и законные интересы других лиц. Сведения о здоровье чужого ребёнка их затрагивают.
    - text: Отказать, материалы проверки относятся к внутренним документам школы
      correct: false
      why: >-
        Гражданин имеет право знакомиться с документами и материалами, которые касаются рассмотрения
        его обращения.
    - text: Показать все материалы без изъятий, ведь проверку вели по его жалобе
      correct: false
      why: >-
        Право знакомиться с материалами ограничено: оно действует, если это не затрагивает права, свободы
        и законные интересы других лиц.
    - text: Показать материалы, когда на это согласится учитель, написавший объяснительную
      correct: false
      why: Согласия учителя закон не требует, а сведения о чужом ребёнке оно бы не открыло.
  explanation: >-
    Пункт 2 статьи 5 закона о порядке рассмотрения обращений граждан даёт гражданину право знакомиться
    с документами и материалами, касающимися рассмотрения его обращения. Условие: это не затрагивает права,
    свободы и законные интересы других лиц и в материалах нет охраняемой законом тайны. Поэтому отцу
    показывают материалы без объяснительной со сведениями о здоровье другого ребёнка.
  refs:
    - doc: fz-59
      anchor: st-5
      quote: >-
        знакомиться с документами и материалами, касающимися рассмотрения обращения, если это не затрагивает
        права, свободы и законные интересы других лиц
  trap:
    kind: wording
    note: >-
      Проверку вели по его жалобе, но часть материалов касается другого ребёнка. Право знакомиться с материалами на них не распространяется.
  revision: 1
  checked: '2026-11-19'

- id: I-obrashcheniya-osobye-sluchai-i-priem-005
  type: single
  difficulty: 2
  situation: >-
    Мать ученицы месяц назад получила от директора государственной школы письменный ответ по существу
    на вопрос о переводе дочери в параллельный класс. Сегодня она пришла на личный приём с тем же вопросом
    и без новых обстоятельств.
  question: Как директор вправе поступить на приёме? Выберите один вариант.
  options:
    - text: Отказать в приёме и не впускать её в кабинет
      correct: false
      why: Закон говорит об отказе в дальнейшем рассмотрении обращения в ходе приёма, а не о недопуске на приём.
    - text: Отказать в дальнейшем рассмотрении, потому что ответ по существу ей уже дан
      correct: true
      why: >-
        В ходе личного приёма гражданину может быть отказано в дальнейшем рассмотрении обращения, если ему
        ранее был дан ответ по существу поставленных вопросов.
    - text: Заново рассмотреть вопрос и в течение тридцати дней дать новый письменный ответ, отказать нельзя
      correct: false
      why: 'Обязанности рассматривать вопрос заново нет: закон позволяет отказать в дальнейшем рассмотрении.'
    - text: Передать вопрос на рассмотрение учредителю школы
      correct: false
      why: Вопрос относится к компетенции школы, и ответ по нему уже дан, оснований для переадресации нет.
  explanation: >-
    Часть 6 статьи 13 закона о порядке рассмотрения обращений граждан позволяет в ходе личного приёма отказать
    гражданину в дальнейшем рассмотрении обращения, если ему ранее был дан ответ по существу поставленных
    вопросов. Мать такой ответ получила, новых обстоятельств нет, поэтому директор вправе отказать.
  refs:
    - doc: fz-59
      anchor: st-13
      quote: >-
        В ходе личного приема гражданину может быть отказано в дальнейшем рассмотрении обращения, если ему
        ранее был дан ответ по существу поставленных в обращении вопросов.
  revision: 1
  checked: '2026-11-19'
