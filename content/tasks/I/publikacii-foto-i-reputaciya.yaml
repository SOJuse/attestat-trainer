- id: I-publikacii-foto-i-reputaciya-001
  type: single
  difficulty: 1
  situation: >-
    При зачислении родители подписывают одно общее согласие на обработку персональных данных ребёнка.
    Заместитель директора предлагает дописать в него строку: «а также на размещение фамилии, имени и класса
    ребёнка на сайте школы в открытом доступе». Школа действует здесь не по обязанности из закона, а по
    своему желанию рассказать о победителях олимпиад.
  question: Можно ли оформить согласие на распространение так? Выберите один вариант.
  options:
    - text: Можно, если строка выделена в общем согласии жирным шрифтом
      correct: false
      why: Выделение шрифтом отдельным согласием строку не делает.
    - text: Можно, общее согласие охватывает любые действия с данными, включая распространение
      correct: false
      why: Для данных, разрешённых для распространения, закон требует отдельного согласия.
    - text: Нельзя, данные учеников распространять запрещено при любом согласии
      correct: false
      why: 'Запрета нет: с отдельным согласием распространение допустимо.'
    - text: Нельзя, согласие на распространение оформляют отдельно от иных согласий
      correct: true
      why: >-
        Согласие на обработку персональных данных, разрешённых субъектом для распространения, оформляется
        отдельно от иных согласий субъекта.
  explanation: >-
    Часть 1 статьи 10.1 закона о персональных данных требует оформлять согласие на обработку данных,
    разрешённых для распространения, отдельно от других согласий. Строка в общем согласии этому требованию
    не отвечает, как бы она ни была выделена.
  refs:
    - doc: fz-152
      anchor: st-10-1
      quote: >-
        Согласие на обработку персональных данных, разрешенных субъектом персональных данных для распространения,
        оформляется отдельно от иных согласий субъекта персональных данных на обработку его персональных данных.
  revision: 1
  checked: '2026-11-19'

- id: I-publikacii-foto-i-reputaciya-002
  type: single
  difficulty: 2
  situation: >-
    Школа хочет опубликовать на своей странице в социальной сети список победителей олимпиады с фамилиями.
    Классный руководитель написал родителям в чат: «Кто против публикации, сообщите до пятницы. Не ответили,
    значит, согласны». К пятнице двое родителей отказались, пятеро согласились письменно по форме, остальные
    промолчали.
  question: Чьи данные школа вправе опубликовать на основании согласия? Выберите один вариант.
  options:
    - text: Только тех пятерых, чьи родители дали согласие
      correct: true
      why: >-
        Молчание или бездействие ни при каких обстоятельствах не считается согласием на обработку данных,
        разрешённых для распространения. Согласие есть только у пятерых.
    - text: Всех учеников, кроме двоих, чьи родители отказались
      correct: false
      why: >-
        Молчание остальных родителей согласием не считается, поэтому публиковать данные их детей на этом
        основании нельзя.
    - text: Всех учеников, потому что родителей предупредили заранее
      correct: false
      why: Предупреждение согласия не заменяет, а двое родителей прямо отказались.
    - text: Никого, потому что двое родителей отказались
      correct: false
      why: Отказ двоих не отменяет согласия, которое дали другие пятеро.
  explanation: >-
    Часть 8 статьи 10.1 закона о персональных данных прямо говорит: молчание или бездействие субъекта
    ни при каких обстоятельствах не считается согласием на обработку данных, разрешённых для распространения.
    Поэтому правило «не ответили, значит, согласны» не работает, и публиковать можно данные тех, чьи родители
    согласие дали.
  refs:
    - doc: fz-152
      anchor: st-10-1
      quote: >-
        Молчание или бездействие субъекта персональных данных ни при каких обстоятельствах не может считаться
        согласием на обработку персональных данных, разрешенных субъектом персональных данных для распространения.
  revision: 1
  checked: '2026-11-19'

- id: I-publikacii-foto-i-reputaciya-003
  type: multiple
  difficulty: 3
  situation: >-
    Школа готовит буклет к юбилею и подбирает снимки. Редактор спрашивает директора, какие изображения
    по статье 152.1 Гражданского кодекса можно использовать без согласия тех, кто на них изображён.
  question: Для каких снимков согласие изображённых не требуется? Отметьте все верные варианты.
  options:
    - text: Общий план зрительного зала на школьном концерте, где никто не выделен
      correct: true
      why: >-
        Изображение получено на публичном мероприятии и никто из зрителей не служит основным объектом
        использования.
    - text: Крупный портрет одной ученицы, снятый на том же концерте, для обложки буклета
      correct: false
      why: >-
        Исключение для публичных мероприятий не действует, когда изображение человека становится основным
        объектом использования.
    - text: Снимок учителя, который позировал фотографу школы за плату
      correct: true
      why: Согласие не требуется, если гражданин позировал за плату.
    - text: Снимок пятиклассников на уроке в кабинете, сделанный учителем на телефон
      correct: false
      why: >-
        Урок в кабинете не публичное мероприятие и не место, открытое для свободного посещения.
        Ни одно из исключений сюда не подходит.
  explanation: >-
    Статья 152.1 Гражданского кодекса разрешает обнародовать и использовать изображение гражданина только
    с его согласия. Согласие не нужно, если снимали в местах, открытых для свободного посещения, или
    на публичных мероприятиях и человек не стал основным объектом использования, а также если он позировал
    за плату. Портрет на обложке и снимок с урока под эти исключения не подпадают.
  refs:
    - doc: gk-rf
      anchor: st-152-1
      quote: >-
        за исключением случаев, когда такое изображение является основным объектом использования
    - doc: gk-rf
      anchor: st-152-1
      quote: >-
        изображение гражданина получено при съемке, которая проводится в местах, открытых для свободного
        посещения, или на публичных мероприятиях
    - doc: gk-rf
      anchor: st-152-1
      quote: 3) гражданин позировал за плату.
  trap:
    kind: wording
    note: >-
      Портрет ученицы снят на публичном мероприятии, как и общий план. Но на обложке она становится основным
      объектом использования, и исключение перестаёт действовать.
  revision: 1
  checked: '2026-11-19'

- id: I-publikacii-foto-i-reputaciya-004
  type: input
  difficulty: 2
  situation: >-
    Мать ученика дала школе отдельное согласие на распространение его фамилии и класса на сайте школы и запретила публиковать их в социальных сетях. Школа всё равно разместила список участников кружка на своей странице в социальной сети. Мать направила директору требование прекратить распространение данных сына: в требовании есть её контакты и перечень данных.
  question: >-
    В течение скольких рабочих дней с момента получения такого требования школа обязана прекратить
    распространение? Ответ в рабочих днях.
  answer: 3
  unit: рабочих дня
  explanation: >-
    По части 14 статьи 10.1 закона о персональных данных при несоблюдении правил этой статьи субъект вправе потребовать прекратить распространение своих данных, ранее разрешённых им для распространения, от любого лица, которое их обрабатывает. Школа нарушила запрет, установленный в согласии. Это лицо
    обязано прекратить передачу, распространение, предоставление и доступ в течение трёх рабочих дней
    с момента получения требования.
  refs:
    - doc: fz-152
      anchor: st-10-1
      quote: >-
        Данное лицо обязано прекратить передачу (распространение, предоставление, доступ) персональных данных
        в течение трех рабочих дней с момента получения требования субъекта
  revision: 1
  checked: '2026-11-19'

- id: I-publikacii-foto-i-reputaciya-005
  type: multiple
  difficulty: 3
  situation: >-
    Школа выдала бывшему учителю характеристику для нового работодателя. В ней написано, что учитель
    «систематически срывал уроки». Учитель считает, что это неправда и порочит его деловую репутацию,
    и обратился в суд. Юрист школы объясняет директору, как статья 152 Гражданского кодекса решает такие споры.
  question: Какие объяснения юриста верны? Отметьте все верные варианты.
  options:
    - text: Доказать, что сведения соответствуют действительности, должна школа
      correct: true
      why: >-
        Гражданин вправе требовать опровержения, если распространивший сведения не докажет, что они
        соответствуют действительности. Доказывает тот, кто распространил.
    - text: Доказать, что сведения ложны, должен учитель, иначе суд ему откажет
      correct: false
      why: >-
        Для порочащих сведений бремя лежит на распространившем: он доказывает, что сведения соответствуют
        действительности.
    - text: Если суд встанет на сторону учителя, характеристика подлежит замене или отзыву
      correct: true
      why: Документ, исходящий от организации и содержащий порочащие сведения, подлежит замене или отзыву.
    - text: Учитель вправе требовать ещё и возмещения убытков и компенсации морального вреда
      correct: true
      why: >-
        Наряду с опровержением гражданин вправе требовать возмещения убытков и компенсации морального вреда,
        причинённых распространением таких сведений.
    - text: Школе достаточно устно извиниться, документ при этом остаётся в силе
      correct: false
      why: Извинений статья 152 не называет, а документ с порочащими сведениями подлежит замене или отзыву.
  explanation: >-
    По пункту 1 статьи 152 Гражданского кодекса опровержения порочащих сведений можно требовать по суду,
    если распространивший их не докажет, что они соответствуют действительности. Документ организации
    с такими сведениями подлежит замене или отзыву (пункт 3). Кроме того, гражданин вправе требовать
    возмещения убытков и компенсации морального вреда (пункт 9).
  refs:
    - doc: gk-rf
      anchor: st-152
      quote: >-
        если распространивший такие сведения не докажет, что они соответствуют действительности
    - doc: gk-rf
      anchor: st-152
      quote: >-
        Если сведения, порочащие честь, достоинство или деловую репутацию гражданина, содержатся в документе,
        исходящем от организации, такой документ подлежит замене или отзыву.
    - doc: gk-rf
      anchor: st-152
      quote: >-
        вправе требовать возмещения убытков и компенсации морального вреда, причиненных распространением
        таких сведений
  trap:
    kind: wording
    note: >-
      В суд идёт учитель, и кажется, что доказывать должен он. Но соответствие порочащих сведений
      действительности доказывает тот, кто их распространил.
  revision: 1
  checked: '2026-11-19'