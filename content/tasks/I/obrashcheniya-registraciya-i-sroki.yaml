- id: I-obrashcheniya-registraciya-i-sroki-001
  type: sequence
  difficulty: 2
  situation: >-
    В школу по почте пришло письмо от отца пятиклассника. Он жалуется, что учитель часто задерживает
    класс после уроков, и просит отремонтировать тротуар у школьных ворот. Ещё он сообщает, что подрядчик,
    который ремонтирует спортзал, держит на объекте иностранных рабочих без разрешения на работу. Жалобу
    на учителя рассматривает школа, а ремонт тротуара решает управа района. Директор допускает, что проверка жалобы займёт больше
    обычного и срок придётся продлить.
  question: Расположите крайние сроки этих действий от самого раннего к самому позднему.
  items:
    - Зарегистрировать письмо
    - Переслать письмо в территориальный орган МВД и высшему должностному лицу субъекта РФ
    - Направить копию письма в управу района
    - Ответить отцу по существу жалобы, если срок рассмотрения не продлевали
    - Ответить отцу по существу жалобы, если директор продлил срок и уведомил его об этом
  explanation: >-
    Закон об обращениях граждан выстраивает сроки по цепочке. Письмо регистрируют в течение трёх дней
    с момента поступления. Письмо со сведениями о возможных нарушениях миграционного законодательства
    пересылают в территориальный орган МВД и высшему должностному лицу субъекта РФ в течение пяти дней
    со дня регистрации. Если часть вопросов решает другой орган, копию письма направляют туда в течение
    семи дней со дня регистрации. Ответ по существу дают в течение 30 дней со дня регистрации, а продлить
    этот срок можно не более чем на 30 дней, уведомив автора. Продление допускается в исключительных случаях
    или если школа запросила документы в другом органе.
