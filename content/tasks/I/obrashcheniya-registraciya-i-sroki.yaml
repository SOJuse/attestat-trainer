- id: I-obrashcheniya-registraciya-i-sroki-001
  type: sequence
  difficulty: 2
  situation: >-
    В школу по почте пришло письмо от отца пятиклассника. Он жалуется, что учитель часто задерживает
    класс после уроков, и просит отремонтировать тротуар у школьных ворот. Ещё он сообщает, что подрядчик,
    который ремонтирует спортзал, держит на объекте иностранных рабочих без разрешения на работу. Жалобу
    на учителя рассматривает школа, а ремонт тротуара решает управа района. Директор допускает, что проверка жалобы займёт больше
    обычного и срок придётся продлить.
  question: Расположите крайние сроки этих действий от самого раннего к самому позднему.
  items:
    - Зарегистрировать письмо
    - Переслать письмо в территориальный орган МВД и высшему должностному лицу субъекта РФ
    - Направить копию письма в управу района
    - Ответить отцу по существу жалобы, если срок рассмотрения не продлевали
    - Ответить отцу по существу жалобы, если директор продлил срок и уведомил его об этом
  explanation: >-
    Закон об обращениях граждан выстраивает сроки по цепочке. Письмо регистрируют в течение трёх дней
    с момента поступления. Письмо со сведениями о возможных нарушениях миграционного законодательства
    пересылают в территориальный орган МВД и высшему должностному лицу субъекта РФ в течение пяти дней
    со дня регистрации. Если часть вопросов решает другой орган, копию письма направляют туда в течение
    семи дней со дня регистрации. Ответ по существу дают в течение 30 дней со дня регистрации, а продлить
    этот срок можно не более чем на 30 дней, уведомив автора. Продление допускается в исключительных случаях
    или если школа запросила документы в другом органе.
  refs:
    - doc: fz-59
      anchor: st-8
      quote: >-
        Письменное обращение подлежит обязательной регистрации в течение трех дней с момента поступления
        в государственный орган, орган местного самоуправления или должностному лицу.
    - doc: fz-59
      anchor: st-8
      quote: >-
        направляется в течение пяти дней со дня регистрации в территориальный орган федерального органа
        исполнительной власти в сфере внутренних дел и высшему должностному лицу субъекта Российской Федерации
    - doc: fz-59
      anchor: st-8
      quote: >-
        копия обращения в течение семи дней со дня регистрации направляется в соответствующие государственные
        органы, органы местного самоуправления или соответствующим должностным лицам
    - doc: fz-59
      anchor: st-12
      quote: рассматривается в течение 30 дней со дня регистрации письменного обращения
    - doc: fz-59
      anchor: st-12
      quote: >-
        вправе продлить срок рассмотрения обращения не более чем на 30 дней, уведомив о продлении срока
        его рассмотрения гражданина, направившего обращение
  revision: 1
  checked: '2026-11-16'

- id: I-obrashcheniya-registraciya-i-sroki-002
  type: single
  difficulty: 2
  situation: >-
    Директору государственной школы пришла письменная жалоба матери ученика на действия заместителя директора
    по воспитательной работе: тот, по её словам, грубо разговаривал с сыном. Директор занят и хочет отписать
    жалобу этому же заместителю: «разберись и ответь сам».
  question: Можно ли так поступить? Выберите один вариант.
  options:
    - text: Можно, заместитель лучше всех знает обстоятельства
      correct: false
      why: >-
        Знание обстоятельств запрет не снимает: жалобу нельзя направлять на рассмотрение тому, чьи действия
        обжалуются.
    - text: Можно, если ответ потом подпишет директор
      correct: false
      why: Подпись директора не меняет того, что жалобу рассматривал человек, на которого жалуются.
    - text: Нельзя, жалобу запрещено направлять на рассмотрение тому, чьи действия обжалуются
      correct: true
      why: >-
        Запрещается направлять жалобу на рассмотрение должностному лицу, решение или действие которого
        обжалуется.
    - text: Нельзя, жалобы на заместителей директора государственной школы рассматривает только её учредитель
      correct: false
      why: >-
        Такого правила в законе нет. Директор может рассмотреть жалобу сам или поручить её другому работнику.
  explanation: >-
    Часть 6 статьи 8 закона о порядке рассмотрения обращений граждан запрещает направлять жалобу
    на рассмотрение тому органу или должностному лицу, чьи решения или действия обжалуются. Жалоба подана
    на заместителя, поэтому рассматривать её должен директор или другой работник по его поручению.
  refs:
    - doc: fz-59
      anchor: st-8
      quote: >-
        Запрещается направлять жалобу на рассмотрение в государственный орган, орган местного самоуправления
        или должностному лицу, решение или действие (бездействие) которых обжалуется.
  revision: 1
  checked: '2026-11-19'

- id: I-obrashcheniya-registraciya-i-sroki-003
  type: single
  difficulty: 1
  situation: >-
    Отец ученика в субботу вечером подал обращение в школу через единый портал государственных услуг.
    Секретарь увидела его в понедельник и собирается поставить в журнале дату регистрации понедельником.
  question: Когда такое обращение считается зарегистрированным? Выберите один вариант.
  options:
    - text: В первый рабочий день после подачи
      correct: false
      why: 'Правила не переносят регистрацию на рабочий день: она происходит автоматически в момент подачи.'
    - text: В день, когда секретарь внесёт запись в журнал школы
      correct: false
      why: Запись в журнале школы регистрацию не определяет, её выполняет сам портал.
    - text: В течение трёх дней с момента поступления, как для бумажного письма
      correct: false
      why: >-
        Трёхдневный срок установлен для регистрации письменного обращения. Для поданных через портал
        Правила называют автоматическую регистрацию в момент подачи.
    - text: В момент подачи, портал регистрирует его автоматически
      correct: true
      why: >-
        Обращения, поданные с использованием единого портала, регистрируются автоматически в момент подачи,
        что подтверждается регистрационным номером портала.
  explanation: >-
    Пункт 7 Правил использования единого портала для направления обращений устанавливает, что такие
    обращения и сообщения регистрируются автоматически в момент их подачи. Подтверждением служит
    регистрационный номер, который присваивает портал. Поэтому сроки считают от субботы, а не от понедельника.
  refs:
    - doc: pp-rf-2334
      anchor: pril-1-p-7
      quote: >-
        регистрируются автоматически в момент их подачи посредством единого портала. Регистрация подтверждается
        присваиваемым единым порталом регистрационным номером.
  revision: 1
  checked: '2026-11-19'

- id: I-obrashcheniya-registraciya-i-sroki-004
  type: input
  difficulty: 2
  situation: >-
    Государственная школа рассматривает обращение родителя о состоянии пешеходного перехода у школы.
    Чтобы ответить, директор запросил документы в управе района. Управа тянет с ответом, и директор
    хочет напомнить ей о сроке из закона об обращениях граждан.
  question: >-
    В течение скольких дней орган обязан предоставить документы и материалы по такому запросу?
    Ответ в днях.
  answer: 15
  unit: дней
  explanation: >-
    По части 2 статьи 10 закона о порядке рассмотрения обращений граждан государственный орган, орган
    местного самоуправления или должностное лицо по запросу того, кто рассматривает обращение, обязаны
    в течение 15 дней предоставить нужные документы и материалы. Исключение: сведения, составляющие
    охраняемую законом тайну.
  refs:
    - doc: fz-59
      anchor: st-10
      quote: >-
        обязаны в течение 15 дней предоставлять документы и материалы, необходимые для рассмотрения обращения
  revision: 1
  checked: '2026-11-19'

- id: I-obrashcheniya-registraciya-i-sroki-005
  type: multiple
  difficulty: 2
  situation: >-
    Секретарь школы разбирает почту и откладывает бумажное письмо от жителя соседнего дома: «оформлено
    неправильно». Директор просит сверить письмо с требованиями закона к письменному обращению.
  question: Что гражданин обязан указать в письменном обращении? Отметьте все верные варианты.
  options:
    - text: Свои фамилию, имя и отчество, если оно есть
      correct: true
      why: Гражданин в обязательном порядке указывает свои фамилию, имя, отчество (последнее при наличии).
    - text: Почтовый адрес, по которому нужно направить ответ
      correct: true
      why: Почтовый адрес для ответа и уведомления о переадресации назван среди обязательных сведений.
    - text: Серию и номер паспорта
      correct: false
      why: Паспортных данных статья 7 закона не требует.
    - text: Личную подпись и дату
      correct: true
      why: Гражданин излагает суть обращения, ставит личную подпись и дату.
    - text: Копии документов, которые подтверждают его доводы
      correct: false
      why: Документы или их копии гражданин прилагает в случае необходимости, обязанности такой нет.
  explanation: >-
    Часть 1 статьи 7 закона о порядке рассмотрения обращений граждан требует указать в письменном обращении
    адресата, свои фамилию, имя и отчество, почтовый адрес для ответа, изложить суть, поставить личную
    подпись и дату. Документы в подтверждение доводов прилагают по необходимости, а паспортные данные
    закон не упоминает.
  refs:
    - doc: fz-59
      anchor: st-7
      quote: >-
        а также свои фамилию, имя, отчество (последнее - при наличии), почтовый адрес, по которому должны быть
        направлены ответ, уведомление о переадресации обращения
    - doc: fz-59
      anchor: st-7
      quote: излагает суть предложения, заявления или жалобы, ставит личную подпись и дату
    - doc: fz-59
      anchor: st-7
      quote: >-
        В случае необходимости в подтверждение своих доводов гражданин прилагает к обращению в письменной форме
        документы и материалы либо их копии.
  revision: 1
  checked: '2026-11-19'
