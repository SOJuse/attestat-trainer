- id: I-soglasie-na-obrabotku-pd-001
  type: single
  difficulty: 1
  situation: >-
    Школа хочет заменить пропуска учеников начальных классов турникетами с распознаванием лица.
    Камера сравнивает лицо ребёнка с фотографией в базе и так определяет, кто проходит.
    Фотографии для базы классные руководители собирают у родителей.
  question: Что нужно школе, чтобы законно обрабатывать эти данные? Выберите один вариант.
  options:
    - text: Согласие родителя, оформленное в письменной форме
      correct: true
      why: >-
        Фотография, по которой система устанавливает личность ребёнка, относится к биометрическим
        персональным данным, а их обрабатывают только с согласия в письменной форме.
    - text: Согласие родителя в любой форме, позволяющей подтвердить его получение
      correct: false
      why: >-
        Любая подтверждаемая форма годится для обычных персональных данных. Для биометрических
        закон отдельно требует письменной формы.
    - text: Пункт о распознавании лиц в договоре об образовании с родителями
      correct: false
      why: >-
        Исполнения договора нет среди случаев, когда биометрию обрабатывают без согласия.
        К тому же согласие оформляют отдельно от других документов, которые подписывает человек.
    - text: Уведомление родителей о новой системе через электронный журнал
      correct: false
      why: >-
        Уведомление не заменяет согласия. Родитель должен сам дать согласие, и именно в письменной форме.
  explanation: >-
    Статья 11 закона о персональных данных называет биометрическими сведения о физиологических
    особенностях человека, по которым оператор устанавливает личность. Турникет узнаёт ученика по лицу,
    значит, школа обрабатывает биометрию. Такие данные обрабатывают только с согласия в письменной форме,
    кроме случаев из части 2 статьи 11, а договора об образовании и уведомления среди них нет.
    За ребёнка согласие даёт родитель как его представитель.
  refs:
    - doc: fz-152
      anchor: st-11
      quote: >-
        Сведения, которые характеризуют физиологические и биологические особенности человека, на основании
        которых можно установить его личность (биометрические персональные данные) и которые используются
        оператором для установления личности субъекта персональных данных
    - doc: fz-152
      anchor: st-11
      quote: >-
        могут обрабатываться только при наличии согласия в письменной форме субъекта персональных данных,
        за исключением случаев, предусмотренных частью 2 настоящей статьи
    - doc: fz-152
      anchor: st-9
      quote: >-
        Согласие на обработку персональных данных должно быть оформлено отдельно от иных информации
        и (или) документов, которые подтверждает и (или) подписывает субъект персональных данных
  revision: 1
  checked: '2026-11-16'

- id: I-soglasie-na-obrabotku-pd-002
  type: single
  difficulty: 3
  situation: >-
    Отец семиклассника письменно отозвал оба согласия, которые давал школе: на обработку персональных данных сына и отдельное согласие на распространение его фотографий на сайте. Кроме того, школа ведёт его личное дело и учёт успеваемости,
    как того требует закон об образовании.
  question: Как школа должна поступить после отзыва согласия? Выберите один вариант.
  options:
    - text: Прекратить всю обработку данных ученика, включая личное дело, учёт успеваемости и публикации
      correct: false
      why: >-
        Отзыв согласия не лишает школу оснований, которые даёт закон. Обработку, нужную для выполнения
        возложенных законом обязанностей, она вправе продолжить.
    - text: Продолжить обработку, которая основана на законе, а ту, что шла по согласию, прекратить
      correct: true
      why: >-
        После отзыва согласия оператор вправе продолжить обработку без согласия при наличии других оснований,
        например когда она нужна для выполнения обязанностей, возложенных на него законом.
    - text: Продолжить всю обработку как раньше, отзыв согласия школу ни к чему не обязывает
      correct: false
      why: >-
        Согласие может быть отозвано, и обработка, которая держалась только на нём, теряет основание.
    - text: Продолжить всю обработку до конца учебного года, а затем прекратить
      correct: false
      why: Отсрочки до конца учебного года закон не предусматривает.
  explanation: >-
    По части 2 статьи 9 закона о персональных данных согласие можно отозвать. После отзыва оператор вправе
    продолжить обработку без согласия, если у него есть иные основания из статьи 6, в том числе когда обработка
    нужна для выполнения обязанностей, возложенных на оператора законом. Личное дело и учёт успеваемости
    школа ведёт по закону. Фотографии она публиковала по отдельному согласию на распространение, и оно отозвано.
  refs:
    - doc: fz-152
      anchor: st-9
      quote: >-
        В случае отзыва субъектом персональных данных согласия на обработку персональных данных оператор вправе
        продолжить обработку персональных данных без согласия субъекта персональных данных при наличии оснований
    - doc: fz-152
      anchor: st-6
      quote: >-
        для осуществления и выполнения возложенных законодательством Российской Федерации на оператора функций,
        полномочий и обязанностей
  trap:
    kind: wording
    note: >-
      Согласие отозвано, но у части обработки есть другое основание, закон. Прекращать нужно не всё, а то, что держалось только на согласии.
  revision: 1
  checked: '2026-11-19'

- id: I-soglasie-na-obrabotku-pd-003
  type: single
  difficulty: 1
  situation: >-
    Мать ученицы пожаловалась, что школа передала данные дочери организатору платной экскурсии без её согласия.
    Секретарь уверяет, что согласие мать подписывала, но найти его не может и предлагает ответить:
    «Докажите, что согласия не было».
  question: Кто должен доказывать, что согласие было получено? Выберите один вариант.
  options:
    - text: Мать ученицы, которая подала жалобу
      correct: false
      why: Закон возлагает эту обязанность на оператора, а не на того, кто жалуется.
    - text: Организатор экскурсии, который получил данные
      correct: false
      why: Согласие получала школа как оператор, ей и подтверждать, что оно было.
    - text: Школа, которая передала данные
      correct: true
      why: >-
        Обязанность предоставить доказательство получения согласия субъекта персональных данных возлагается
        на оператора.
    - text: Орган по защите прав субъектов персональных данных, который проверяет жалобу
      correct: false
      why: Проверяющий орган оценивает доказательства, а представить их обязан оператор.
  explanation: >-
    Часть 3 статьи 9 закона о персональных данных возлагает на оператора обязанность предоставить
    доказательство того, что согласие получено, или того, что есть иное законное основание обработки.
    Если школа не может показать согласие, считать его полученным нельзя.
  refs:
    - doc: fz-152
      anchor: st-9
      quote: >-
        Обязанность предоставить доказательство получения согласия субъекта персональных данных на обработку
        его персональных данных
    - doc: fz-152
      anchor: st-9
      quote: части 2 статьи 11 настоящего Федерального закона, возлагается на оператора
  revision: 1
  checked: '2026-11-19'

- id: I-soglasie-na-obrabotku-pd-004
  type: multiple
  difficulty: 2
  situation: >-
    Для записи в бесплатный школьный кружок завуч подготовил анкету. Кроме имени ребёнка и телефона родителей,
    в ней спрашивают место работы и доход обоих родителей: «вдруг пригодится». Анкеты завуч хочет хранить бессрочно.
  question: Какие принципы обработки персональных данных здесь нарушаются? Отметьте все верные варианты.
  options:
    - text: Данные не должны быть избыточными по отношению к заявленным целям обработки
      correct: true
      why: >-
        Сведения о работе и доходах родителей для записи в кружок не нужны, а закон запрещает избыточные данные.
    - text: Данные хранят не дольше, чем этого требуют цели обработки
      correct: true
      why: Бессрочное хранение анкет после окончания занятий в кружке этому принципу противоречит.
    - text: Нельзя объединять базы, данные в которых обрабатывают в несовместимых между собой целях
      correct: false
      why: Такой принцип в законе есть, но объединять базы завуч не собирается. Здесь он не нарушен.
    - text: Данные должны быть точными, а когда нужно, и актуальными
      correct: false
      why: Принцип в законе есть, но из условия не видно, что данные в анкете неточны или устарели.
    - text: Обработка должна ограничиваться конкретными, заранее определёнными целями
      correct: true
      why: Сбор сведений «вдруг пригодится» не имеет конкретной, заранее определённой цели.
  explanation: >-
    Статья 5 закона о персональных данных требует, чтобы обработка ограничивалась конкретными, заранее
    определёнными целями, а данные не были избыточными. Хранить их можно не дольше, чем нужно для этих целей. Анкета завуча нарушает все три правила. Запрет объединять базы с несовместимыми целями и требование точности данных в статье тоже есть, но в этой ситуации они не затронуты.
  refs:
    - doc: fz-152
      anchor: st-5
      quote: >-
        Обработка персональных данных должна ограничиваться достижением конкретных, заранее определенных
        и законных целей.
    - doc: fz-152
      anchor: st-5
      quote: >-
        Не допускается объединение баз данных, содержащих персональные данные, обработка которых осуществляется
        в целях, несовместимых между собой.
    - doc: fz-152
      anchor: st-5
      quote: >-
        Обрабатываемые персональные данные не должны быть избыточными по отношению к заявленным целям
        их обработки
    - doc: fz-152
      anchor: st-5
      quote: >-
        не дольше, чем этого требуют цели обработки персональных данных
    - doc: fz-152
      anchor: st-5
      quote: должны быть обеспечены точность персональных данных, их достаточность, а в необходимых случаях и актуальность
  revision: 1
  checked: '2026-11-19'

- id: I-soglasie-na-obrabotku-pd-005
  type: multiple
  difficulty: 3
  situation: >-
    Классный руководитель хочет составить для учителей таблицу: у кого из учеников какие хронические
    заболевания и какой они национальности. Родители устно сказали, что не возражают. Отдельно сведения
    о здоровье детей ведёт школьный врач поликлиники, который осматривает учеников.
  question: Что из этого верно? Отметьте все верные варианты.
  options:
    - text: Сведения о состоянии здоровья учеников относятся к специальным категориям персональных данных
      correct: true
      why: Состояние здоровья прямо названо в части 1 статьи 10 закона.
    - text: Сведения о национальности учеников к специальным категориям не относятся
      correct: false
      why: Национальная принадлежность названа в том же перечне специальных категорий.
    - text: Для таблицы классному руководителю достаточно устного согласия родителей
      correct: false
      why: Специальные категории обрабатывают с согласия в письменной форме, устного мало.
    - text: С письменного согласия родителей обработка таких сведений допускается
      correct: true
      why: Согласие в письменной форме названо первым из случаев, когда обработка специальных категорий допустима.
    - text: Врач, обязанный хранить врачебную тайну, вправе вести сведения о здоровье в медико-профилактических целях
      correct: true
      why: >-
        Закон допускает такую обработку, если её ведёт лицо, профессионально занимающееся медицинской
        деятельностью и обязанное сохранять врачебную тайну.
  explanation: >-
    Статья 10 закона о персональных данных запрещает обрабатывать сведения о национальной принадлежности
    и состоянии здоровья, кроме прямо названных случаев. Один из них: письменное согласие. Другой: обработка
    в медико-профилактических целях медицинским работником, обязанным хранить врачебную тайну. Учитель под
    второй случай не подпадает, а устное согласие первому не отвечает.
  refs:
    - doc: fz-152
      anchor: st-10
      quote: >-
        Обработка специальных категорий персональных данных, касающихся расовой, национальной принадлежности,
        политических взглядов, религиозных или философских убеждений, состояния здоровья, интимной жизни,
        не допускается
    - doc: fz-152
      anchor: st-10
      quote: субъект персональных данных дал согласие в письменной форме на обработку своих персональных данных
    - doc: fz-152
      anchor: st-10
      quote: >-
        при условии, что обработка персональных данных осуществляется лицом, профессионально занимающимся
        медицинской деятельностью и обязанным в соответствии с законодательством Российской Федерации сохранять
        врачебную тайну
  trap:
    kind: wording
    note: >-
      Родители согласны, но устно. Для специальных категорий закон требует согласия в письменной форме.
  revision: 1
  checked: '2026-11-19'
