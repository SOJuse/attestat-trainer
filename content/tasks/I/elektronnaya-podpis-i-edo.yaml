- id: I-elektronnaya-podpis-i-edo-001
  type: multiple
  difficulty: 2
  situation: >-
    Школа вводит электронный кадровый документооборот через свою информационную систему.
    Локальный акт приняли с учётом мнения профкома, каждого работника уведомили о переходе и о праве
    дать согласие. Учитель математики работает в школе с 2012 года и на уведомление не ответил.
    Учитель истории в сентябре 2026 года впервые в жизни устроился на работу, сразу после вуза.
  question: Какие выводы верны? Отметьте все верные варианты.
  options:
    - text: Учителя математики считают отказавшимся, но он вправе дать согласие позже
      correct: true
      why: >-
        Закон приравнивает отсутствие согласия к отказу и при этом сохраняет за работником право
        согласиться в будущем.
    - text: Согласие учителя истории на электронный документооборот не требуется
      correct: true
      why: >-
        Он принят после 31 декабря 2021 года и на эту дату не имел трудового стажа. От таких работников
        согласие не требуется.
    - text: Бумажные документы о работе школа вправе выдавать учителю математики за плату
      correct: false
      why: >-
        Тем, кто не дал согласия, школа обязана выдавать документы о работе на бумаге безвозмездно.
    - text: Электронную подпись учитель истории оформляет и оплачивает сам
      correct: false
      why: Расходы на получение работником электронной подписи и на её использование несёт работодатель.
    - text: Если учитель математики согласится, школа должна оформить ему новую подпись вместо его личной квалифицированной
      correct: false
      why: >-
        Работник вправе пользоваться и усиленной квалифицированной подписью, которую раньше получил сам.
  explanation: >-
    Электронный документооборот вводят локальным актом, но работника переводят на него только
    с письменного согласия (статья 22.2 ТК РФ). Молчание учителя математики считается отказом: документы
    ему бесплатно выдают на бумаге, а согласиться он может и позже. Учителю истории согласие не нужно, потому что
    сошлись оба условия: принят после 31 декабря 2021 года и на эту дату не имел стажа. Подпись работнику
    оплачивает работодатель, а свою ранее полученную квалифицированную подпись работник использовать вправе.
  refs:
    - doc: tk-rf
      anchor: st-22-2
      quote: >-
        Отсутствие согласия работника на взаимодействие с работодателем посредством электронного
        документооборота признается отказом работника от такого взаимодействия. При этом за работником
        сохраняется право дать указанное согласие в последующем.
    - doc: tk-rf
      anchor: st-22-2
      quote: >-
        Согласие на взаимодействие с работодателем посредством электронного документооборота не требуется
        от лиц, которые приняты (принимаются) на работу после 31 декабря 2021 года и у которых по состоянию
        на 31 декабря 2021 года отсутствует трудовой стаж.
    - doc: tk-rf
      anchor: st-22-2
      quote: >-
        Работодатель несет расходы на получение работником электронной подписи (в случае ее отсутствия)
        и ее использование.
    - doc: tk-rf
      anchor: st-22-2
      quote: >-
        Работодатель обязан безвозмездно предоставлять работникам, которые в соответствии с частями пятой
        и шестой настоящей статьи не дали согласия на взаимодействие с работодателем посредством электронного
        документооборота, документы, связанные с их работой у данного работодателя, на бумажном носителе
    - doc: tk-rf
      anchor: st-22-2
      quote: >-
        Работник или лицо, поступающее на работу, вправе использовать ранее полученную самостоятельно
        усиленную квалифицированную электронную подпись.
