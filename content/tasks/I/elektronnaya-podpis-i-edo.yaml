- id: I-elektronnaya-podpis-i-edo-001
  type: multiple
  difficulty: 2
  situation: >-
    Школа вводит электронный кадровый документооборот через свою информационную систему.
    Локальный акт приняли с учётом мнения профкома, каждого работника уведомили о переходе и о праве
    дать согласие. Учитель математики работает в школе с 2012 года и на уведомление не ответил.
    Учитель истории в сентябре 2026 года впервые в жизни устроился на работу, сразу после вуза.
  question: Какие выводы верны? Отметьте все верные варианты.
  options:
    - text: Учителя математики считают отказавшимся, но он вправе дать согласие позже
      correct: true
      why: >-
        Закон приравнивает отсутствие согласия к отказу и при этом сохраняет за работником право
        согласиться в будущем.
    - text: Согласие учителя истории на электронный документооборот не требуется
      correct: true
      why: >-
        Он принят после 31 декабря 2021 года и на эту дату не имел трудового стажа. От таких работников
        согласие не требуется.
    - text: Бумажные документы о работе школа вправе выдавать учителю математики за плату
      correct: false
      why: >-
        Тем, кто не дал согласия, школа обязана выдавать документы о работе на бумаге безвозмездно.
    - text: Электронную подпись учитель истории оформляет и оплачивает сам
      correct: false
      why: Расходы на получение работником электронной подписи и на её использование несёт работодатель.
    - text: Если учитель математики согласится, школа должна оформить ему новую подпись вместо его личной квалифицированной
      correct: false
      why: >-
        Работник вправе пользоваться и усиленной квалифицированной подписью, которую раньше получил сам.
  explanation: >-
    Электронный документооборот вводят локальным актом, но работника переводят на него только
    с письменного согласия (статья 22.2 ТК РФ). Молчание учителя математики считается отказом: документы
    ему бесплатно выдают на бумаге, а согласиться он может и позже. Учителю истории согласие не нужно, потому что
    сошлись оба условия: принят после 31 декабря 2021 года и на эту дату не имел стажа. Подпись работнику
    оплачивает работодатель, а свою ранее полученную квалифицированную подпись работник использовать вправе.
  refs:
    - doc: tk-rf
      anchor: st-22-2
      quote: >-
        Отсутствие согласия работника на взаимодействие с работодателем посредством электронного
        документооборота признается отказом работника от такого взаимодействия. При этом за работником
        сохраняется право дать указанное согласие в последующем.
    - doc: tk-rf
      anchor: st-22-2
      quote: >-
        Согласие на взаимодействие с работодателем посредством электронного документооборота не требуется
        от лиц, которые приняты (принимаются) на работу после 31 декабря 2021 года и у которых по состоянию
        на 31 декабря 2021 года отсутствует трудовой стаж.
    - doc: tk-rf
      anchor: st-22-2
      quote: >-
        Работодатель несет расходы на получение работником электронной подписи (в случае ее отсутствия)
        и ее использование.
    - doc: tk-rf
      anchor: st-22-2
      quote: >-
        Работодатель обязан безвозмездно предоставлять работникам, которые в соответствии с частями пятой
        и шестой настоящей статьи не дали согласия на взаимодействие с работодателем посредством электронного
        документооборота, документы, связанные с их работой у данного работодателя, на бумажном носителе
    - doc: tk-rf
      anchor: st-22-2
      quote: >-
        Работник или лицо, поступающее на работу, вправе использовать ранее полученную самостоятельно
        усиленную квалифицированную электронную подпись.
  revision: 1
  checked: '2026-11-16'

- id: I-elektronnaya-podpis-i-edo-002
  type: matching
  difficulty: 2
  situation: >-
    Школа выбирает, какой электронной подписью подписывать разные документы. Заместитель директора
    составляет для коллег короткую справку о видах подписи по закону об электронной подписи.
  question: Сопоставьте вид электронной подписи и то, что о нём говорит закон.
  pairs:
    - left: Простая электронная подпись
      right: Кодом, паролем или иным средством подтверждает, что подпись сформировало определённое лицо
    - left: Усиленная неквалифицированная электронная подпись
      right: Получена криптографическим преобразованием и позволяет обнаружить изменения в документе после подписания, хотя сертификат для неё могут и не создавать
    - left: Усиленная квалифицированная электронная подпись
      right: Делает электронный документ равнозначным бумажному с собственноручной подписью в любых правоотношениях, кроме случаев, когда закон требует бумагу
  explanation: >-
    Статья 5 закона об электронной подписи определяет простую подпись через коды и пароли, а неквалифицированную
    через криптографическое преобразование и возможность обнаружить изменения документа. Сертификат для
    неквалифицированной подписи может не создаваться. По статье 6 документ с квалифицированной подписью
    равнозначен бумажному с собственноручной подписью в любых правоотношениях, если закон не требует
    исключительно бумажного документа.
  refs:
    - doc: fz-63
      anchor: st-5
      quote: >-
        Простой электронной подписью является электронная подпись, которая посредством использования кодов,
        паролей или иных средств подтверждает факт формирования электронной подписи определенным лицом.
    - doc: fz-63
      anchor: st-5
      quote: позволяет обнаружить факт внесения изменений в электронный документ после момента его подписания
    - doc: fz-63
      anchor: st-5
      quote: >-
        При использовании неквалифицированной электронной подписи сертификат ключа проверки электронной подписи
        может не создаваться
    - doc: fz-63
      anchor: st-6
      quote: >-
        Информация в электронной форме, подписанная квалифицированной электронной подписью, признается
        электронным документом, равнозначным документу на бумажном носителе, подписанному собственноручной
        подписью, и может применяться в любых правоотношениях
  revision: 1
  checked: '2026-11-19'

- id: I-elektronnaya-podpis-i-edo-003
  type: input
  difficulty: 1
  situation: >-
    Директор школы пользуется усиленной квалифицированной электронной подписью. Во вторник утром он узнал,
    что носитель с ключом подписи побывал в чужих руках и конфиденциальность ключа нарушена.
  question: >-
    В течение какого наибольшего числа рабочих дней со дня получения такой информации он должен уведомить
    удостоверяющий центр, выдавший сертификат? Ответ в рабочих днях.
  answer: 1
  unit: рабочего дня
  explanation: >-
    Пункт 2 части 1 статьи 10 закона об электронной подписи обязывает уведомить удостоверяющий центр
    и других участников электронного взаимодействия о нарушении конфиденциальности ключа в течение не более
    чем одного рабочего дня со дня получения информации о нарушении. Пользоваться таким ключом после этого нельзя.
  refs:
    - doc: fz-63
      anchor: st-10
      quote: >-
        о нарушении конфиденциальности ключа электронной подписи в течение не более чем одного рабочего дня
        со дня получения информации о таком нарушении
  revision: 1
  checked: '2026-11-19'

- id: I-elektronnaya-podpis-i-edo-004
  type: single
  difficulty: 3
  situation: >-
    Школа направила поставщику акт в виде электронного документа, подписанного усиленной квалифицированной
    электронной подписью директора. По обычаю такие акты на бумаге заверяют печатью. Поставщик просит
    дополнительно прислать скан акта с оттиском печати, иначе он считает документ неоформленным.
  question: Прав ли поставщик? Выберите один вариант.
  options:
    - text: Прав, электронная подпись заменяет собственноручную подпись, но не печать
      correct: false
      why: >-
        Закон говорит обратное: такой электронный документ равнозначен бумажному, который подписан
        собственноручно и заверен печатью.
    - text: Не прав, такой электронный документ равнозначен бумажному с подписью и печатью
      correct: true
      why: >-
        Документ с квалифицированной подписью равнозначен бумажному с собственноручной подписью. Если такие документы заверяют печатью, он равнозначен и бумажному с подписью и печатью.
    - text: Прав, если печать школы упомянута в её уставе
      correct: false
      why: Наличие печати по уставу не меняет правила о равнозначности электронного документа.
    - text: Не прав, печать на документах школы закон вообще запрещает
      correct: false
      why: Запрета на печать нет. Дело в том, что электронный документ с квалифицированной подписью приравнен к бумажному с подписью и печатью.
  explanation: >-
    По части 1 статьи 6 закона об электронной подписи документ с квалифицированной подписью равнозначен бумажному с собственноручной подписью. Часть 3 рассчитана именно на такой случай: если документ
    по закону или обычаю делового оборота заверяют печатью, электронный документ с усиленной электронной
    подписью, равнозначный бумажному, признаётся равнозначным бумажному документу с собственноручной
    подписью и печатью. Скан с оттиском не нужен.
  refs:
    - doc: fz-63
      anchor: st-6
      quote: >-
        Информация в электронной форме, подписанная квалифицированной электронной подписью, признается электронным
        документом, равнозначным документу на бумажном носителе, подписанному собственноручной подписью
    - doc: fz-63
      anchor: st-6
      quote: >-
        электронный документ, подписанный усиленной электронной подписью и признаваемый равнозначным документу
        на бумажном носителе, подписанному собственноручной подписью, признается равнозначным документу
        на бумажном носителе, подписанному собственноручной подписью и заверенному печатью
  trap:
    kind: wording
    note: >-
      Привычка говорит, что печать ничем не заменить. Закон прямо приравнивает такой электронный документ к бумажному с подписью и печатью.
  revision: 1
  checked: '2026-11-19'

- id: I-elektronnaya-podpis-i-edo-005
  type: single
  difficulty: 2
  situation: >-
    Бухгалтерия школы сформировала пакет из двенадцати связанных между собой электронных документов для
    отправки учредителю. Директор подписал весь пакет одной усиленной квалифицированной электронной подписью.
    Специалист учредителя сомневается: подписан ли каждый документ в отдельности.
  question: Как закон отвечает на этот вопрос? Выберите один вариант.
  options:
    - text: Подписан только первый документ пакета, остальные нужно подписать отдельно
      correct: false
      why: Закон распространяет подпись пакета на каждый входящий в него документ.
    - text: Пакет считается подписанным, но входящие в него документы по отдельности юридической силы не имеют
      correct: false
      why: Наоборот, каждый документ пакета считается подписанным.
    - text: Каждый документ пакета считается подписанным подписью того вида, которой подписан пакет
      correct: true
      why: >-
        При подписании пакета электронных документов каждый документ в нём считается подписанным электронной
        подписью того вида, которой подписан пакет.
    - text: Каждый документ пакета считается подписанным простой электронной подписью
      correct: false
      why: Вид подписи у документов тот же, что у пакета. Здесь это усиленная квалифицированная подпись.
  explanation: >-
    Часть 4 статьи 6 закона об электронной подписи разрешает подписать одной подписью несколько связанных
    между собой электронных документов. Каждый документ такого пакета считается подписанным подписью того
    вида, которой подписан пакет. Поэтому все двенадцать документов подписаны квалифицированной подписью
    директора.
  refs:
    - doc: fz-63
      anchor: st-6
      quote: >-
        При подписании электронной подписью пакета электронных документов каждый из электронных документов,
        входящих в этот пакет, считается подписанным электронной подписью того вида, которой подписан пакет
        электронных документов.
  revision: 1
  checked: '2026-11-19'
