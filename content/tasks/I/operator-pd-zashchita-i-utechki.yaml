- id: I-operator-pd-zashchita-i-utechki-001
  type: input
  difficulty: 3
  situation: >-
    В понедельник в 10:00 учитель информатики обнаружил, что таблица с фамилиями, датами рождения
    и адресами учеников из-за ошибки в настройках была открыта всем по ссылке и её уже скачивали посторонние.
    Доступ закрыли в тот же час. В тот же день школа сообщила в уполномоченный орган по защите прав
    субъектов персональных данных об инциденте, его причинах и принятых мерах. Комиссия начала внутреннее
    расследование.
  question: >-
    Сколько часов с момента выявления инцидента даёт закон, чтобы сообщить в этот орган о результатах
    внутреннего расследования? Ответьте числом часов.
  answer: 72
  unit: часа
  explanation: >-
    По части 3.1 статьи 21 закона о персональных данных при неправомерной или случайной передаче
    (предоставлении, распространении, доступе) персональных данных, которая нарушила права субъектов,
    оператор уведомляет уполномоченный орган дважды. Сведения об инциденте, его предполагаемых причинах
    и вреде и о принятых мерах направляют в течение 24 часов, а о результатах внутреннего расследования
    и о лицах, чьи действия привели к инциденту (если такие есть), в течение 72 часов. Оба срока считают с момента выявления инцидента, а не с окончания расследования.
  refs:
    - doc: fz-152
      anchor: st-21
      quote: >-
        оператор обязан с момента выявления такого инцидента оператором, уполномоченным органом по защите
        прав субъектов персональных данных или иным заинтересованным лицом уведомить уполномоченный орган
        по защите прав субъектов персональных данных
    - doc: fz-152
      anchor: st-21
      quote: в течение семидесяти двух часов о результатах внутреннего расследования выявленного инцидента
  trap:
    kind: wording
    note: >-
      Срок 24 часа относится к первому уведомлению, которое школа уже отправила. Вопрос о втором,
      о результатах расследования.
  revision: 1
  checked: '2026-11-16'

- id: I-operator-pd-zashchita-i-utechki-002
  type: input
  difficulty: 1
  situation: >-
    Мать ученика направила в школу письменный запрос: она хочет знать, какие персональные данные её сына
    школа обрабатывает и с какой целью. Секретарь зарегистрировал запрос и спрашивает директора о сроке ответа.
    Продлевать срок школа не собирается.
  question: >-
    В течение скольких рабочих дней с момента получения запроса школа должна предоставить эти сведения?
    Ответ в рабочих днях.
  answer: 10
  unit: рабочих дней
  explanation: >-
    По части 3 статьи 14 закона о персональных данных сведения об обработке предоставляют субъекту или его
    представителю в течение десяти рабочих дней с момента обращения или получения запроса. Срок можно продлить,
    направив мотивированное уведомление, но школа этим правом не пользуется.
  refs:
    - doc: fz-152
      anchor: st-14
      quote: >-
        предоставляются субъекту персональных данных или его представителю оператором в течение десяти рабочих
        дней с момента обращения либо получения оператором запроса субъекта персональных данных или его
        представителя
  revision: 1
  checked: '2026-11-19'

- id: I-operator-pd-zashchita-i-utechki-003
  type: single
  difficulty: 2
  situation: >-
    Школа поручила фотостудии снимать выпускные альбомы и передала ей список учеников. 3 марта выяснилось,
    что студия использует этот список для рассылки рекламы своих услуг. Договор такого не разрешает, согласия
    родителей на рекламу нет.
  question: В какой срок школа обязана обеспечить прекращение такой обработки? Выберите один вариант.
  options:
    - text: В срок не больше трёх рабочих дней с даты, когда это выявили
      correct: true
      why: >-
        Оператор обязан прекратить неправомерную обработку или обеспечить её прекращение лицом, действующим
        по его поручению, в срок, не превышающий трёх рабочих дней с даты выявления.
    - text: В срок не больше десяти рабочих дней с даты, когда это выявили
      correct: false
      why: >-
        Десять рабочих дней закон отводит на уничтожение данных, если обеспечить правомерность обработки
        невозможно. На прекращение обработки срок короче.
    - text: В срок не больше тридцати дней с даты, когда это выявили
      correct: false
      why: Тридцать дней относятся к отзыву согласия, а не к выявленной неправомерной обработке.
    - text: В течение семидесяти двух часов с момента, когда это выявили
      correct: false
      why: В часах закон считает сроки уведомления об утечках, а не срок прекращения неправомерной обработки.
  explanation: >-
    Часть 3 статьи 21 закона о персональных данных обязывает оператора, выявившего неправомерную обработку,
    прекратить её или обеспечить её прекращение лицом, которое действует по его поручению, в срок не больше
    трёх рабочих дней. Студия обрабатывает данные по поручению школы, значит, школа отвечает за то, чтобы
    рассылка прекратилась в этот срок.
  refs:
    - doc: fz-152
      anchor: st-21
      quote: >-
        оператор в срок, не превышающий трех рабочих дней с даты этого выявления, обязан прекратить неправомерную
        обработку персональных данных или обеспечить прекращение неправомерной обработки персональных данных
        лицом, действующим по поручению оператора
  revision: 1
  checked: '2026-11-19'

- id: I-operator-pd-zashchita-i-utechki-004
  type: multiple
  difficulty: 2
  situation: >-
    Новый директор проверяет, как школа выполняет обязанности оператора персональных данных. Заместитель
    докладывает, что сделано и как это устроено.
  question: Какие утверждения заместителя соответствуют закону? Отметьте все верные варианты.
  options:
    - text: Школа как юридическое лицо назначает ответственного за организацию обработки персональных данных
      correct: true
      why: Оператор, являющийся юридическим лицом, назначает такое лицо.
    - text: Ответственный за организацию обработки получает указания от органа по защите прав субъектов и подотчётен ему
      correct: false
      why: >-
        Он получает указания непосредственно от исполнительного органа организации-оператора и подотчётен ему,
        то есть директору школы.
    - text: К политике школы в отношении обработки персональных данных должен быть неограниченный доступ
      correct: true
      why: >-
        Оператор обязан опубликовать документ, определяющий его политику в отношении обработки персональных
        данных, или иным образом обеспечить к нему неограниченный доступ.
    - text: Политика школы в отношении обработки персональных данных относится к документам для служебного пользования
      correct: false
      why: 'Закон требует обратного: неограниченного доступа к этому документу.'
    - text: Работников, которые обрабатывают персональные данные, знакомят с требованиями закона и локальными актами
      correct: true
      why: Ознакомление таких работников или их обучение названо среди мер, которые принимает оператор.
  explanation: >-
    Статьи 18.1 и 22.1 закона о персональных данных называют меры, которые принимает оператор. Юридическое
    лицо назначает ответственного за организацию обработки, он подотчётен исполнительному органу самой
    организации. Политику в отношении обработки персональных данных публикуют или иначе открывают для всех,
    а работников знакомят с требованиями.
  refs:
    - doc: fz-152
      anchor: st-22-1
      quote: >-
        Оператор, являющийся юридическим лицом, назначает лицо, ответственное за организацию обработки
        персональных данных.
    - doc: fz-152
      anchor: st-22-1
      quote: >-
        получает указания непосредственно от исполнительного органа организации, являющейся оператором,
        и подотчетно ему
    - doc: fz-152
      anchor: st-18-1
      quote: >-
        Оператор обязан опубликовать или иным образом обеспечить неограниченный доступ к документу, определяющему
        его политику в отношении обработки персональных данных
    - doc: fz-152
      anchor: st-18-1
      quote: >-
        ознакомление работников оператора, непосредственно осуществляющих обработку персональных данных,
        с положениями законодательства Российской Федерации о персональных данных
  revision: 1
  checked: '2026-11-19'

- id: I-operator-pd-zashchita-i-utechki-005
  type: single
  difficulty: 2
  situation: >-
    Отец ученика 8 класса запросил у школы сведения об оценках сына за четверть. Классный руководитель
    предлагает просто сделать копию страниц журнала: там оценки всего класса, зато быстро.
  question: Как школа должна ответить на запрос? Выберите один вариант.
  options:
    - text: Выдать копию страниц журнала с оценками всего класса
      correct: false
      why: >-
        В сведениях, которые предоставляют субъекту, не должно быть персональных данных других людей.
        Оценки одноклассников относятся к ним.
    - text: Отказать, журнал относится к внутренним документам школы
      correct: false
      why: Субъект персональных данных и его представитель имеют право получить сведения о своих данных.
    - text: Выдать сведения об оценках сына в доступной форме, без данных других учеников
      correct: true
      why: >-
        Сведения предоставляют в доступной форме, и в них не должны содержаться персональные данные,
        относящиеся к другим субъектам.
    - text: Выдать копию журнала после того, как согласятся родители всех учеников класса
      correct: false
      why: 'Собирать согласия всего класса незачем: закон требует дать сведения о самом субъекте без чужих данных.'
  explanation: >-
    Часть 2 статьи 14 закона о персональных данных требует предоставлять субъекту сведения в доступной форме
    и так, чтобы в них не было персональных данных других людей, если нет законных оснований их раскрывать.
    Отец как представитель сына получает выписку с оценками сына, а не страницу журнала с оценками класса.
  refs:
    - doc: fz-152
      anchor: st-14
      quote: >-
        должны быть предоставлены субъекту персональных данных оператором в доступной форме, и в них не должны
        содержаться персональные данные, относящиеся к другим субъектам персональных данных
  revision: 1
  checked: '2026-11-19'
