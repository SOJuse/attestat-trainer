- id: I-operator-pd-zashchita-i-utechki-001
  type: input
  difficulty: 3
  situation: >-
    В понедельник в 10:00 учитель информатики обнаружил, что таблица с фамилиями, датами рождения
    и адресами учеников из-за ошибки в настройках была открыта всем по ссылке и её уже скачивали посторонние.
    Доступ закрыли в тот же час. В тот же день школа сообщила в уполномоченный орган по защите прав
    субъектов персональных данных об инциденте, его причинах и принятых мерах. Комиссия начала внутреннее
    расследование.
  question: >-
    Сколько часов с момента выявления инцидента даёт закон, чтобы сообщить в этот орган о результатах
    внутреннего расследования? Ответьте числом часов.
  answer: 72
  unit: часа
  explanation: >-
    По части 3.1 статьи 21 закона о персональных данных при неправомерной или случайной передаче
    (предоставлении, распространении, доступе) персональных данных, которая нарушила права субъектов,
    оператор уведомляет уполномоченный орган дважды. Сведения об инциденте, его предполагаемых причинах
    и вреде и о принятых мерах направляют в течение 24 часов, а о результатах внутреннего расследования
    и о лицах, чьи действия привели к инциденту (если такие есть), в течение 72 часов. Оба срока считают с момента выявления инцидента, а не с окончания расследования.
  refs:
    - doc: fz-152
      anchor: st-21
      quote: >-
        оператор обязан с момента выявления такого инцидента оператором, уполномоченным органом по защите
        прав субъектов персональных данных или иным заинтересованным лицом уведомить уполномоченный орган
        по защите прав субъектов персональных данных
    - doc: fz-152
      anchor: st-21
      quote: в течение семидесяти двух часов о результатах внутреннего расследования выявленного инцидента
  trap:
    kind: wording
    note: >-
      Срок 24 часа относится к первому уведомлению, которое школа уже отправила. Вопрос о втором,
      о результатах расследования.
  revision: 1
  checked: '2026-11-16'
