- id: I-cifrovaya-sreda-i-internet-001
  type: single
  difficulty: 2
  situation: >-
    Из-за карантина московская школа неделю ведёт уроки с применением дистанционных образовательных технологий.
    Учительница ведёт уроки из своей квартиры в Подмосковье, ученики подключаются из дома, один из них
    временно живёт у бабушки в Казани. Проверяющий спрашивает, где в эту неделю велась образовательная
    деятельность.
  question: Что считается местом осуществления образовательной деятельности? Выберите один вариант.
  options:
    - text: Место, где находится учительница во время урока
      correct: false
      why: Место нахождения педагога закон не учитывает, он называет место нахождения организации или её филиала.
    - text: Место нахождения каждого ученика во время урока
      correct: false
      why: Закон прямо оговаривает, что место определяется независимо от места нахождения обучающихся.
    - text: Место нахождения школы
      correct: true
      why: >-
        При дистанционных технологиях местом осуществления образовательной деятельности считается место
        нахождения организации или её филиала независимо от места нахождения обучающихся.
    - text: Место, где расположен сервер платформы, через которую идут уроки
      correct: false
      why: Расположение сервера в норме не упоминается.
  explanation: >-
    Часть 4 статьи 16 закона об образовании устанавливает: при электронном обучении и дистанционных
    образовательных технологиях местом осуществления образовательной деятельности является место нахождения
    организации или её филиала независимо от того, где находятся обучающиеся. Для московской школы это Москва.
  refs:
    - doc: fz-273
      anchor: st-16
      quote: >-
        местом осуществления образовательной деятельности является место нахождения организации, осуществляющей
        образовательную деятельность, или ее филиала независимо от места нахождения обучающихся
  revision: 1
  checked: '2026-11-19'

- id: I-cifrovaya-sreda-i-internet-002
  type: single
  difficulty: 2
  situation: >-
    Школа ведёт часть уроков по основной общеобразовательной программе дистанционно. Учитель информатики
    предлагает проводить их в удобном зарубежном сервисе видеосвязи: каждого ученика нужно там зарегистрировать
    с фамилией, классом и адресом почты, оценки тоже будут храниться в этом сервисе.
  question: Что должен ответить директор? Выберите один вариант.
  options:
    - text: Согласиться, выбор платформы для дистанционных уроков закон оставляет учителю
      correct: false
      why: >-
        Для таких программ, когда обрабатываются персональные данные обучающихся, закон прямо называет,
        что должна использовать школа.
    - text: Согласиться, если родители всех учеников не возражают
      correct: false
      why: Отсутствие возражений родителей требование закона об использовании государственных систем не отменяет.
    - text: Отказать, дистанционные технологии в основных общеобразовательных программах применять нельзя
      correct: false
      why: Применять их школа вправе, закон лишь указывает, какие системы для этого использовать.
    - text: Отказать, школа должна использовать государственные информационные системы
      correct: true
      why: >-
        При дистанционной реализации основных общеобразовательных программ с обработкой персональных данных
        обучающихся школа должна использовать государственные информационные системы и многофункциональный
        сервис обмена информацией.
  explanation: >-
    Часть 3.1 статьи 16 закона об образовании обязывает школу при реализации основных общеобразовательных
    программ с применением дистанционных технологий, предусматривающих обработку персональных данных
    обучающихся, использовать государственные информационные системы, созданные для этих программ,
    и многофункциональный сервис обмена информацией. Сторонний сервис с регистрацией учеников этому не отвечает.
  refs:
    - doc: fz-273
      anchor: st-16
      quote: >-
        должна использовать государственные информационные системы, создаваемые, модернизируемые
        и эксплуатируемые для реализации указанных образовательных программ, многофункциональный сервис
        обмена информацией
  revision: 1
  checked: '2026-11-19'

- id: I-cifrovaya-sreda-i-internet-003
  type: single
  difficulty: 2
  situation: >-
    В библиотеке школы стоят компьютеры, с которых ученики свободно выходят в интернет. Школа сама организует
    этот доступ через свою локальную сеть. Никаких мер и технических средств, которые защищали бы детей
    от вредной для них информации, школа не применяет.
  question: Кто отвечает за это по статье 6.17 КоАП? Выберите один вариант.
  options:
    - text: Школа как лицо, которое организует доступ в интернет в месте, доступном для детей
      correct: true
      why: >-
        Часть 2 статьи 6.17 КоАП наказывает лицо, организующее доступ к информации в сети в местах, доступных
        для детей, за неприменение мер и средств защиты детей от вредной информации.
    - text: Оператор связи, с которым у школы заключён письменный договор об услугах связи
      correct: false
      why: Операторы связи, оказывающие услуги по письменным договорам, из этой нормы прямо исключены.
    - text: Родители учеников, которые не контролируют детей
      correct: false
      why: Норма называет лицо, организующее доступ к информации в местах, доступных для детей, а это школа.
    - text: Никто, пока кто-то из учеников не откроет запрещённый сайт
      correct: false
      why: Ответственность наступает за само неприменение мер и средств защиты, а не за последствия.
  explanation: >-
    Часть 2 статьи 6.17 КоАП устанавливает ответственность лица, которое организует доступ к информации
    в сети «Интернет» в местах, доступных для детей, и не применяет административные и организационные меры,
    технические и программно-аппаратные средства защиты детей от вредной информации. Операторы связи,
    работающие по письменным договорам, из этого правила исключены. Доступ в библиотеке организует школа.
  refs:
    - doc: koap-rf
      anchor: st-6-17
      quote: >-
        в местах, доступных для детей, административных и организационных мер, технических, программно-аппаратных
        средств защиты детей от информации, причиняющей вред их здоровью и (или) развитию
  revision: 1
  checked: '2026-11-19'

- id: I-cifrovaya-sreda-i-internet-004
  type: multiple
  difficulty: 2
  situation: >-
    Школа ведёт электронный журнал и переводит общение с родителями в цифровую среду. На собрании родители
    шестиклассников спрашивают директора, какие права у них есть по статье 44 закона об образовании.
  question: Какие права родителей эта статья называет? Отметьте все верные варианты.
  options:
    - text: Знакомиться с оценками успеваемости своих детей
      correct: true
      why: Это право названо в пункте 4 части 3 статьи 44.
    - text: Знакомиться с содержанием образования и методами обучения и воспитания
      correct: true
      why: Содержание образования, методы обучения и воспитания названы в том же пункте 4.
    - text: Исправлять оценки ребёнка в электронном журнале, если они кажутся несправедливыми
      correct: false
      why: Такого права статья 44 не даёт, родители вправе знакомиться с оценками, а не менять их.
    - text: Участвовать в управлении школой в форме, которую определяет её устав
      correct: true
      why: Участие в управлении организацией в форме, определяемой уставом, названо в пункте 7 части 3 статьи 44.
    - text: Выбирать, какой учитель будет вести уроки в классе ребёнка
      correct: false
      why: Права выбирать учителя для класса статья 44 родителям не даёт.
  explanation: >-
    Часть 3 статьи 44 закона об образовании даёт родителям несовершеннолетних обучающихся право знакомиться
    с содержанием образования, методами обучения и воспитания и с оценками успеваемости своих детей,
    а также участвовать в управлении организацией в форме, определяемой уставом. Школа должна обеспечить
    эти права и в электронном журнале.
  refs:
    - doc: fz-273
      anchor: st-44
      quote: >-
        знакомиться с содержанием образования, используемыми методами обучения и воспитания, образовательными
        технологиями, а также с оценками успеваемости своих детей
    - doc: fz-273
      anchor: st-44
      quote: >-
        принимать участие в управлении организацией, осуществляющей образовательную деятельность, в форме,
        определяемой уставом этой организации
  revision: 1
  checked: '2026-11-19'

- id: I-cifrovaya-sreda-i-internet-005
  type: multiple
  difficulty: 2
  situation: >-
    Школа собирается постоянно вести часть занятий с применением электронного обучения и дистанционных
    образовательных технологий. На совещании звучат разные мнения о том, что об этом говорит закон
    об образовании.
  question: Какие мнения соответствуют закону? Отметьте все верные варианты.
  options:
    - text: Школа вправе применять электронное обучение и дистанционные технологии в порядке, который установило Правительство
      correct: true
      why: Так сказано в части 2 статьи 16 закона об образовании.
    - text: В школе должны быть созданы условия для работы электронной информационно-образовательной среды
      correct: true
      why: >-
        При реализации программ с применением электронного обучения должны быть созданы условия для
        функционирования электронной информационно-образовательной среды.
    - text: Применять дистанционные технологии школа может только с письменного разрешения учредителя
      correct: false
      why: Разрешения учредителя статья 16 не требует, право применять такие технологии принадлежит самой школе.
    - text: Школа обеспечивает защиту сведений, которые составляют охраняемую законом тайну
      correct: true
      why: Эта обязанность названа в части 5 статьи 16 закона об образовании.
    - text: Дистанционные технологии допустимы в дополнительном образовании, но не в основных программах
      correct: false
      why: Статья 16 говорит о реализации образовательных программ вообще и отдельно упоминает основные общеобразовательные.
  explanation: >-
    Статья 16 закона об образовании разрешает организациям применять электронное обучение и дистанционные
    образовательные технологии в порядке, установленном Правительством. Для этого нужны условия для работы
    электронной информационно-образовательной среды, а школа обязана защищать сведения, составляющие
    охраняемую законом тайну. Ни разрешения учредителя, ни запрета для основных программ в статье нет.
  refs:
    - doc: fz-273
      anchor: st-16
      quote: >-
        вправе применять электронное обучение, дистанционные образовательные технологии при реализации
        образовательных программ в порядке, установленном Правительством Российской Федерации
    - doc: fz-273
      anchor: st-16
      quote: >-
        должны быть созданы условия для функционирования электронной информационно-образовательной среды
    - doc: fz-273
      anchor: st-16
      quote: >-
        обеспечивает защиту сведений, составляющих государственную или иную охраняемую законом тайну
  revision: 1
  checked: '2026-11-19'
