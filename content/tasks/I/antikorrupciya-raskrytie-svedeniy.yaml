- id: I-antikorrupciya-raskrytie-svedeniy-001
  type: single
  difficulty: 3
  situation: >-
    Школа принимает на должность заведующего хозяйством человека, который полтора года назад уволился
    с муниципальной службы. Его прежняя должность входит в перечень, установленный нормативными правовыми
    актами. Вопросами управления школой он на службе не занимался. При приёме он сообщил школе о последнем
    месте службы.
  question: Что обязана сделать школа как работодатель? Выберите один вариант.
  options:
    - text: В десятидневный срок сообщить о заключении договора по последнему месту его службы
      correct: true
      why: >-
        Работодатель при заключении трудового договора с таким гражданином в течение двух лет после его
        увольнения со службы обязан в десятидневный срок сообщить об этом по последнему месту службы.
    - text: Ничего не сообщать, раз управление школой в его служебные обязанности не входило
      correct: false
      why: >-
        От этого зависит, нужно ли согласие комиссии. Обязанность работодателя сообщить о договоре
        по последнему месту службы с этим условием не связана.
    - text: Ничего не сообщать, сообщить о новой работе обязан сам работник
      correct: false
      why: >-
        Работник сообщает работодателю сведения о последнем месте службы. Сообщить о договоре представителю
        нанимателя обязан работодатель.
    - text: Сообщить о заключении договора по последнему месту его службы после испытательного срока
      correct: false
      why: Срок считают от заключения договора, и он десятидневный. С испытанием закон его не связывает.
  explanation: >-
    Статья 64.1 Трудового кодекса обязывает работодателя, который заключил трудовой договор с бывшим
    государственным или муниципальным служащим из перечня в течение двух лет после его увольнения со службы,
    в десятидневный срок сообщить об этом представителю нанимателя по последнему месту службы. Согласие
    комиссии нужно, только если функции управления организацией входили в его служебные обязанности,
    но на обязанность сообщить это не влияет.
  refs:
    - doc: tk-rf
      anchor: st-64-1
      quote: >-
        обязан в десятидневный срок сообщать о заключении такого договора представителю нанимателя (работодателю)
        государственного или муниципального служащего по последнему месту его службы
  trap:
    kind: wording
    note: >-
      Управление школой в его обязанности не входило, и кажется, что правила о бывших служащих не действуют.
      Но от этого зависит согласие комиссии, а сообщить о договоре работодатель обязан в любом случае.
  revision: 1
  checked: '2026-11-19'

- id: I-antikorrupciya-raskrytie-svedeniy-002
  type: multiple
  difficulty: 2
  situation: >-
    Заместитель директора государственной школы Москвы участвует в конкурсе на должность директора другой
    государственной школы города. Кадровик учредителя объясняет ей особенности, которые Трудовой кодекс
    устанавливает для руководителей государственных учреждений.
  question: Какие объяснения кадровика верны? Отметьте все верные варианты.
  options:
    - text: Трудовой договор с ней заключат на основе типовой формы, которую утверждает Правительство
      correct: true
      why: >-
        Трудовой договор с руководителем государственного учреждения заключается на основе типовой формы,
        утверждаемой Правительством Российской Федерации.
    - text: Сведения о доходах, имуществе и обязательствах имущественного характера она представит при поступлении на должность
      correct: true
      why: Лицо, поступающее на должность руководителя государственного учреждения, обязано представлять такие сведения.
    - text: После назначения представлять сведения о доходах ей больше не придётся
      correct: false
      why: Обязанность лежит и на поступающем на должность, и на действующем руководителе учреждения.
    - text: Порядок представления сведений для неё утверждён нормативным правовым актом Москвы как субъекта Федерации
      correct: true
      why: >-
        Руководитель государственного учреждения субъекта представляет сведения в порядке, утверждаемом
        нормативным правовым актом субъекта Российской Федерации.
    - text: Порядок представления сведений каждая школа утверждает своим локальным актом
      correct: false
      why: Порядок утверждает публичная власть соответствующего уровня, а не само учреждение.
  explanation: >-
    Статья 281.1 Трудового кодекса требует заключать трудовой договор с руководителем государственного
    учреждения на основе типовой формы, утверждённой Правительством. И кандидат на должность, и действующий
    руководитель обязаны представлять сведения о доходах, имуществе и обязательствах имущественного характера.
    Для учреждений субъекта порядок утверждает нормативный правовой акт субъекта.
  refs:
    - doc: tk-rf
      anchor: st-281-1
      quote: >-
        заключается на основе типовой формы трудового договора, утверждаемой Правительством Российской Федерации
    - doc: tk-rf
      anchor: st-281-1
      quote: >-
        Лицо, поступающее на должность руководителя государственного (муниципального) учреждения (при поступлении
        на работу), и руководитель государственного (муниципального) учреждения обязаны представлять сведения
        о доходах, об имуществе и обязательствах имущественного характера
    - doc: tk-rf
      anchor: st-281-1
      quote: >-
        руководителем государственного учреждения субъекта Российской Федерации - в порядке, утверждаемом
        нормативным правовым актом субъекта Российской Федерации
  revision: 1
  checked: '2026-11-19'

- id: I-antikorrupciya-raskrytie-svedeniy-003
  type: multiple
  difficulty: 2
  situation: >-
    Учредитель запросил у государственной школы сведения для размещения в интернете информации о заработной
    плате руководства. Директор и главный бухгалтер обсуждают, что именно и где будет опубликовано.
  question: Что из этого соответствует Трудовому кодексу? Отметьте все верные варианты.
  options:
    - text: Публикуют среднемесячную заработную плату директора, его заместителей и главного бухгалтера за календарный год
      correct: true
      why: >-
        Размещается информация о рассчитываемой за календарный год среднемесячной заработной плате
        руководителей, их заместителей и главных бухгалтеров.
    - text: По решению учредителя эту информацию могут разместить на сайте самой школы
      correct: true
      why: По решению органа, осуществляющего функции учредителя, информация может размещаться на сайте учреждения.
    - text: Рядом с суммой указывают личный телефон и адрес каждого, чтобы граждане могли задать вопросы
      correct: false
      why: >-
        В составе этой информации запрещено указывать данные, позволяющие определить место жительства,
        почтовый адрес, телефон и иные индивидуальные средства коммуникации.
    - text: В той же публикации приводят заработную плату каждого учителя школы поимённо
      correct: false
      why: Статья 349.5 говорит о руководителях, их заместителях и главных бухгалтерах, а не обо всех работниках.
    - text: Указывать в публикации адрес места жительства директора запрещено
      correct: true
      why: Данные, позволяющие определить место жительства, в составе размещаемой информации указывать запрещено.
  explanation: >-
    Статья 349.5 Трудового кодекса предусматривает размещение в интернете информации о среднемесячной
    заработной плате руководителей, их заместителей и главных бухгалтеров государственных и муниципальных
    учреждений, рассчитанной за календарный год. Обычно её размещает учредитель, а по его решению она может
    появиться и на сайте учреждения. Адреса, телефоны и другие личные контакты указывать запрещено.
  refs:
    - doc: tk-rf
      anchor: st-349-5
      quote: >-
        Информация о рассчитываемой за календарный год среднемесячной заработной плате руководителей,
        их заместителей и главных бухгалтеров
    - doc: tk-rf
      anchor: st-349-5
      quote: >-
        размещаться в информационно-телекоммуникационной сети "Интернет" на официальных сайтах указанных фондов,
        учреждений, предприятий
    - doc: tk-rf
      anchor: st-349-5
      quote: >-
        запрещается указывать данные, позволяющие определить место жительства, почтовый адрес, телефон и иные
        индивидуальные средства коммуникации лиц, указанных в части первой настоящей статьи
  revision: 1
  checked: '2026-11-19'

- id: I-antikorrupciya-raskrytie-svedeniy-004
  type: single
  difficulty: 2
  situation: >-
    Учитель математики за плату занимается после уроков с тремя учениками своего же класса и сам выставляет
    им четвертные оценки. Родители остальных учеников пожаловались директору: по их словам, тем, кто платит,
    оценки ставят мягче.
  question: Как закон об образовании оценивает такие занятия? Выберите один вариант.
  options:
    - text: Учитель вправе вести их без ограничений, это его личное время
      correct: false
      why: >-
        Ограничение есть: платные образовательные услуги обучающимся своей организации запрещены,
        если это приводит к конфликту интересов.
    - text: Учитель не вправе оказывать платные услуги ученикам своей школы, если это приводит к конфликту интересов
      correct: true
      why: >-
        Педагогический работник не вправе оказывать платные образовательные услуги обучающимся в данной
        организации, если это приводит к конфликту интересов педагогического работника.
    - text: Учитель не вправе оказывать платные образовательные услуги никому, пока работает в школе
      correct: false
      why: Запрет касается обучающихся в той же организации и только при конфликте интересов.
    - text: Учитель вправе вести их, если директор письменно разрешил
      correct: false
      why: Разрешение директора в норме не названо и конфликт интересов не устраняет.
  explanation: >-
    Часть 2 статьи 48 закона об образовании запрещает педагогическому работнику оказывать платные
    образовательные услуги обучающимся в той же организации, если это приводит к конфликту интересов.
    Учитель берёт плату с учеников, которым сам ставит оценки, и это как раз такой конфликт.
  refs:
    - doc: fz-273
      anchor: st-48
      quote: >-
        не вправе оказывать платные образовательные услуги обучающимся в данной организации, если это приводит
        к конфликту интересов педагогического работника
  revision: 1
  checked: '2026-11-19'

- id: I-antikorrupciya-raskrytie-svedeniy-005
  type: input
  difficulty: 1
  situation: >-
    Кадровик школы проверяет документы кандидата, который раньше работал на государственной гражданской
    службе на должности из установленного перечня. Нужно понять, действуют ли ещё для него особые условия
    заключения трудового договора.
  question: >-
    В течение скольких лет после увольнения со службы действуют эти условия? Ответ в годах.
  answer: 2
  unit: года
  explanation: >-
    Статья 64.1 Трудового кодекса связывает особые условия заключения трудового договора с бывшими
    государственными и муниципальными служащими со сроком в два года после увольнения со службы. В этот срок
    гражданин сообщает работодателю о последнем месте службы, а работодатель уведомляет прежнего нанимателя.
  refs:
    - doc: tk-rf
      anchor: st-64-1
      quote: >-
        в течение двух лет после увольнения с государственной или муниципальной службы обязаны при заключении
        трудовых договоров сообщать работодателю сведения о последнем месте службы
  revision: 1
  checked: '2026-11-19'
