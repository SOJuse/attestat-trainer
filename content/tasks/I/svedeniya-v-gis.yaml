- id: I-svedeniya-v-gis-001
  type: input
  difficulty: 2
  situation: >-
    25 июня школа выдала выпускникам 11 класса аттестаты о среднем общем образовании. Ответственный
    за федеральный реестр сведений о документах об образовании спрашивает директора, сколько у него времени,
    чтобы внести сведения об этих аттестатах.
  question: >-
    В течение скольких рабочих дней со дня выдачи аттестатов сведения о них нужно внести в реестр?
    Ответ в рабочих днях.
  answer: 3
  unit: рабочих дня
  explanation: >-
    По пункту 6 Правил формирования и ведения федерального реестра сведения о документах об образовании,
    выдаваемых лицам, освоившим программы основного общего и среднего общего образования, вносят в систему
    в течение 3 рабочих дней со дня выдачи документов.
  refs:
    - doc: pp-rf-825
      anchor: pril-2-p-6
      quote: >-
        лицам, освоившим образовательные программы основного общего, среднего общего, среднего профессионального
        образования, а также основные программы профессионального обучения, подлежат внесению в информационную
        систему в течение 3 рабочих дней со дня выдачи указанных документов
  revision: 1
  checked: '2026-11-19'

- id: I-svedeniya-v-gis-002
  type: single
  difficulty: 3
  situation: >-
    У школы есть лицензия на дополнительное профессиональное образование. В марте она провела курсы повышения
    квалификации для учителей района и выдала им удостоверения. Сведения об этих документах нужно внести
    в федеральный реестр сведений о документах об образовании.
  question: В какой срок со дня выдачи удостоверений это нужно сделать? Выберите один вариант.
  options:
    - text: В течение 3 рабочих дней
      correct: false
      why: >-
        Три рабочих дня установлены для документов об основном общем, среднем общем и среднем профессиональном
        образовании и о профессиональном обучении.
    - text: В течение 60 календарных дней
      correct: false
      why: Шестьдесят дней названы для совместных образовательных организаций, школа к ним не относится.
    - text: До конца календарного года, в котором выданы удостоверения
      correct: false
      why: Такого срока Правила не содержат.
    - text: В течение 30 календарных дней
      correct: true
      why: >-
        Сведения о документах, выдаваемых лицам, освоившим иные образовательные программы, вносят в течение
        30 календарных дней со дня выдачи.
  explanation: >-
    Пункт 6 Правил формирования и ведения федерального реестра различает документы по уровню программы.
    Для аттестатов, дипломов о среднем профессиональном образовании и документов о профессиональном обучении
    срок 3 рабочих дня. Для документов по иным программам, к которым относится дополнительное профессиональное
    образование, срок 30 календарных дней со дня выдачи.
  refs:
    - doc: pp-rf-825
      anchor: pril-2-p-6
      quote: >-
        лицам, освоившим иные образовательные программы, подлежат внесению в информационную систему в течение
        30 календарных дней со дня выдачи указанных документов
  trap:
    kind: wording
    note: >-
      Удостоверение выдала школа, и рука тянется к школьному сроку в три рабочих дня. Но срок зависит
      от программы, а не от того, кто выдал документ.
  revision: 1
  checked: '2026-11-19'

- id: I-svedeniya-v-gis-003
  type: multiple
  difficulty: 2
  situation: >-
    Новый заместитель директора принимает дела по федеральному реестру сведений о документах об образовании
    и проверяет, что он о нём знает.
  question: Какие утверждения о реестре верны? Отметьте все верные варианты.
  options:
    - text: Сведения о документах об образовании хранятся в реестре 50 лет
      correct: true
      why: Срок хранения сведений, внесённых в систему, составляет 50 лет.
    - text: Сведения о своём аттестате вносит в реестр сам выпускник через портал государственных услуг
      correct: false
      why: Сведения представляют органы и организации, которые выдали документы об образовании.
    - text: Полноту, достоверность и актуальность сведений обеспечивают органы и организации, которые их вносят
      correct: true
      why: Так сказано в пункте 11 Правил формирования и ведения реестра.
    - text: Формирование и ведение реестра организует федеральный орган по контролю и надзору в сфере образования
      correct: true
      why: Это прямо записано в части 9 статьи 98 закона об образовании.
    - text: Сведения в реестр вносят, когда их запросит работодатель выпускника
      correct: false
      why: Сведения вносят в установленный срок со дня выдачи документа, запрос работодателя для этого не нужен.
  explanation: >-
    Федеральный реестр сведений о документах об образовании ведут по статье 98 закона об образовании
    и Правилам, утверждённым Правительством. Его формирование и ведение организует федеральный орган
    по контролю и надзору в сфере образования. Сведения представляют те, кто выдал документы, они же отвечают
    за полноту, достоверность и актуальность. Срок хранения сведений о документах об образовании 50 лет.
  refs:
    - doc: pp-rf-825
      anchor: pril-2-p-12
      quote: Срок хранения сведений, внесенных в информационную систему, составляет 50 лет
    - doc: pp-rf-825
      anchor: pril-2-p-11
      quote: >-
        Органы и организации (в том числе учреждения, проводящие экзамен, и образовательные организации,
        проводящие экзамен) обеспечивают полноту, достоверность и актуальность сведений
    - doc: pp-rf-825
      anchor: pril-2-p-4
      quote: >-
        Представление оператору информационной системы сведений осуществляется выдавшими документы об образовании
        федеральными государственными органами
    - doc: fz-273
      anchor: st-98
      quote: >-
        формирование и ведение которой организует федеральный орган исполнительной власти, осуществляющий
        функции по контролю и надзору
  revision: 1
  checked: '2026-11-19'

- id: I-svedeniya-v-gis-004
  type: single
  difficulty: 2
  situation: >-
    Школа выдала аттестаты в июне, но сведения о них внесла в федеральный реестр только в сентябре, намного
    позже установленного срока. Орган контроля возбудил дело по статье 19.30.2 КоАП. Директор считает,
    что отвечать за это может только орган управления образованием, а не школа.
  question: Кого статья 19.30.2 КоАП позволяет наказать за нарушение сроков внесения сведений? Выберите один вариант.
  options:
    - text: И школу как организацию, и её должностное лицо
      correct: true
      why: >-
        Среди нарушителей названы организация, осуществляющая образовательную деятельность, и должностное
        лицо такой организации, а штраф установлен и для должностных, и для юридических лиц.
    - text: Должностных лиц органов управления образованием, школы и их работники под статью не подпадают
      correct: false
      why: >-
        Статья называет и организацию, осуществляющую образовательную деятельность, и должностное лицо
        такой организации.
    - text: Выпускника, который не проверил, внесены ли сведения о его аттестате
      correct: false
      why: Выпускник сведения в реестр не вносит и субъектом этого нарушения не назван.
    - text: Никого, опоздание с внесением сведений административным нарушением не считается
      correct: false
      why: Нарушение порядка или сроков внесения сведений в реестр прямо названо в части 1 статьи 19.30.2 КоАП.
  explanation: >-
    Часть 1 статьи 19.30.2 КоАП устанавливает ответственность за нарушение порядка или сроков внесения
    сведений в федеральный реестр. Среди нарушителей названы должностные лица органов управления образованием,
    организации, осуществляющие образовательную деятельность, и должностные лица таких организаций. Штраф
    предусмотрен и для должностных, и для юридических лиц.
  refs:
    - doc: koap-rf
      anchor: st-19-30-2
      quote: >-
        либо организацией, осуществляющей образовательную деятельность, или должностным лицом такой организации,
        либо государственным учреждением или должностным лицом такого учреждения порядка или сроков внесения
  revision: 1
  checked: '2026-11-19'

- id: I-svedeniya-v-gis-005
  type: single
  difficulty: 1
  situation: >-
    Мать восьмиклассника оформляет меру социальной поддержки, для которой нужно подтвердить, что сын учится
    в школе. В многофункциональном центре ей сказали, что справка не нужна: сведения об этом есть
    в государственной информационной системе.
  question: В какой системе по закону об образовании размещают сведения об отнесении граждан к категории обучающихся? Выберите один вариант.
  options:
    - text: В федеральном реестре сведений о документах об образовании
      correct: false
      why: В этом реестре учитывают выданные документы об образовании, а не то, кто сейчас учится.
    - text: В системе «Единая централизованная цифровая платформа в социальной сфере»
      correct: true
      why: >-
        Сведения об отнесении граждан к категории обучающихся по основным общеобразовательным программам
        размещаются в этой государственной информационной системе.
    - text: На официальном сайте школы в разделе о контингенте обучающихся
      correct: false
      why: На сайте школы поимённых сведений об учениках для таких целей не размещают.
    - text: В федеральной системе обеспечения проведения государственной итоговой аттестации и приёма
      correct: false
      why: Эта система служит проведению итоговой аттестации и приёму, а не подтверждению статуса обучающегося.
  explanation: >-
    Статья 98.1 закона об образовании предусматривает, что в государственной информационной системе
    «Единая централизованная цифровая платформа в социальной сфере» размещают информацию о мерах социальной
    поддержки и сведения об отнесении граждан к категории обучающихся, осваивающих основные общеобразовательные
    программы. Оттуда их получают органы, которые назначают выплаты.
  refs:
    - doc: fz-273
      anchor: st-98-1
      quote: >-
        сведения об отнесении граждан к категории обучающихся, осваивающих основные общеобразовательные программы
        или образовательные программы среднего профессионального образования
  revision: 1
  checked: '2026-11-19'
