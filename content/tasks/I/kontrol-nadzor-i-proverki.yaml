- id: I-kontrol-nadzor-i-proverki-001
  type: input
  difficulty: 1
  situation: >-
    Контрольный орган в сфере образования выявил в школе нарушение требований законодательства об образовании
    и готовит предписание об устранении нарушения. Директор хочет знать, какой самый долгий срок могут
    дать школе на исполнение.
  question: >-
    Какой наибольший срок исполнения может быть указан в таком предписании? Ответ в месяцах.
  answer: 6
  unit: месяцев
  explanation: >-
    По части 1 статьи 93.1 закона об образовании контрольный орган выдаёт предписание об устранении
    выявленного нарушения, и срок его исполнения, указанный в предписании, не может превышать шесть месяцев.
  refs:
    - doc: fz-273
      anchor: st-93-1
      quote: Указанный в предписании срок его исполнения не может превышать шесть месяцев.
  revision: 1
  checked: '2026-11-19'

- id: I-kontrol-nadzor-i-proverki-002
  type: sequence
  difficulty: 3
  situation: >-
    Школа не устранила нарушение требований законодательства об образовании ни после первого предписания
    контрольного органа, ни после повторного. Директор хочет понять, в каком порядке закон выстраивает
    меры контрольного органа.
  question: Расставьте действия контрольного органа в том порядке, в каком их предусматривает закон.
  items:
    - Выдаёт школе предписание об устранении выявленного нарушения
    - Оценивает исполнение, выдаёт предписание вновь и запрещает приём в школу
    - Приостанавливает действие лицензии школы
    - Обращается в суд с заявлением об аннулировании лицензии
  explanation: >-
    Статья 93.1 закона об образовании выстраивает меры по нарастающей. Сначала контрольный орган выдаёт
    предписание. Если оценка показала, что оно не исполнено, орган выдаёт предписание вновь, возбуждает дело
    об административном правонарушении и запрещает приём. Если не исполнено и повторное предписание, орган
    приостанавливает действие лицензии и обращается в суд с заявлением о её аннулировании.
  refs:
    - doc: fz-273
      anchor: st-93-1
      quote: >-
        вновь выдает организации, осуществляющей образовательную деятельность, уполномоченному органу
        государственной власти или органу местного самоуправления, не исполнившим данное предписание
    - doc: fz-273
      anchor: st-93-1
      quote: >-
        приостанавливает действие лицензии на осуществление образовательной деятельности этой организации
        полностью или частично и обращается в суд с заявлением об аннулировании такой лицензии
  revision: 1
  checked: '2026-11-19'

- id: I-kontrol-nadzor-i-proverki-003
  type: multiple
  difficulty: 2
  situation: >-
    Срок исполнения предписания контрольного органа в сфере образования истёк. Оценка показала, что школа
    исполнила его ненадлежащим образом. Директор готовится к последствиям.
  question: Что контрольный орган делает в этом случае? Отметьте все верные варианты.
  options:
    - text: Вновь выдаёт школе предписание об устранении нарушения
      correct: true
      why: При неисполнении или ненадлежащем исполнении предписания орган выдаёт его вновь.
    - text: Возбуждает дело об административном правонарушении
      correct: true
      why: Возбуждение дела об административном правонарушении прямо названо в части 2 статьи 93.1.
    - text: Запрещает приём в школу полностью или частично
      correct: true
      why: Орган запрещает приём в организацию полностью или частично сроком на один год.
    - text: Своим решением аннулирует лицензию школы
      correct: false
      why: >-
        Аннулирует лицензию суд, и обращаются к нему после неисполнения повторного предписания.
        На этом этапе такой меры нет.
    - text: Отстраняет директора школы от должности
      correct: false
      why: Отстранения директора школы среди мер контрольного органа статья 93.1 не называет.
  explanation: >-
    По части 2 статьи 93.1 закона об образовании, если предписание не исполнено или исполнено ненадлежащим
    образом, контрольный орган вновь выдаёт предписание, возбуждает дело об административном правонарушении
    и запрещает приём в организацию полностью или частично. До лицензии дело доходит позже, после неисполнения
    повторного предписания.
  refs:
    - doc: fz-273
      anchor: st-93-1
      quote: >-
        возбуждает дело об административном правонарушении в порядке, установленном Кодексом Российской Федерации
        об административных правонарушениях, и запрещает прием в организацию, осуществляющую образовательную
        деятельность, полностью или частично сроком на один год
  revision: 1
  checked: '2026-11-19'

- id: I-kontrol-nadzor-i-proverki-004
  type: single
  difficulty: 2
  situation: >-
    Контрольный орган запретил приём в школу на год, потому что школа не исполнила предписание. Через три
    месяца школа устранила нарушение, и контрольный орган установил, что повторное предписание исполнено.
    До конца срока запрета остаётся девять месяцев.
  question: Что будет с запретом на приём? Выберите один вариант.
  options:
    - text: Он действует до конца года, досрочно его не снимают
      correct: false
      why: Закон прямо допускает возобновление приёма до истечения срока.
    - text: Он прекращается сам, как только школа сообщит об устранении нарушения
      correct: false
      why: Нужно решение контрольного органа, одного сообщения школы недостаточно.
    - text: Его может снять только суд по иску школы
      correct: false
      why: Досрочное возобновление приёма закон относит к решению контрольного органа, а не суда.
    - text: Приём может быть возобновлён досрочно по решению контрольного органа
      correct: true
      why: >-
        Приём может быть возобновлён до истечения срока по решению контрольного органа в связи
        с установлением факта исполнения предписания.
  explanation: >-
    Часть 3 статьи 93.1 закона об образовании позволяет возобновить приём до истечения годичного срока
    по решению контрольного органа, если установлено, что повторное предписание исполнено. Решение принимает
    сам орган, а не суд, и только после того, как он установил факт исполнения.
  refs:
    - doc: fz-273
      anchor: st-93-1
      quote: >-
        может быть возобновлен до истечения срока, предусмотренного частью 2 настоящей статьи, по решению
        контрольного (надзорного) органа в сфере образования в связи с установлением факта исполнения предписания
  revision: 1
  checked: '2026-11-19'

- id: I-kontrol-nadzor-i-proverki-005
  type: multiple
  difficulty: 3
  situation: >-
    Инспекторы контрольного органа пришли в школу с выездной проверкой. Заместитель директора не пустил
    их в здание и отказался показывать документы. Из-за этого проверку провести не удалось. Раньше школу
    и её работников за такое не наказывали.
  question: Что верно об ответственности по статье 19.4.1 КоАП? Отметьте все верные варианты.
  options:
    - text: Воспрепятствование законной деятельности инспектора по проведению проверки наказуемо
      correct: true
      why: Часть 1 статьи 19.4.1 КоАП устанавливает ответственность за воспрепятствование проверке или уклонение от неё.
    - text: Раз проверку провести не удалось, применяют более строгую часть статьи
      correct: true
      why: >-
        Действия, повлёкшие невозможность проведения или завершения контрольного мероприятия, наказываются
        по части 2 более высоким штрафом.
    - text: Отвечать может не только должностное лицо, но и школа как юридическое лицо
      correct: true
      why: Штрафы в статье установлены и для должностных, и для юридических лиц.
    - text: Заместителя директора уже за этот случай могут дисквалифицировать
      correct: false
      why: >-
        Дисквалификация предусмотрена частью 3 за повторное нарушение. Здесь оно первое, поэтому возможен
        штраф.
    - text: Отвечает только работник, который не пустил инспекторов, школу не наказывают
      correct: false
      why: Статья предусматривает штраф и для юридических лиц.
  explanation: >-
    Статья 19.4.1 КоАП наказывает за воспрепятствование законной деятельности должностных лиц органа контроля
    по проведению контрольных мероприятий. Если из-за этого проверку не удалось провести или завершить,
    применяют часть 2 с более высокими штрафами для должностных и юридических лиц. Дисквалификация появляется
    только в части 3, при повторном таком нарушении.
  refs:
    - doc: koap-rf
      anchor: st-19-4-1
      quote: >-
        Действия (бездействие), предусмотренные частью 1 настоящей статьи, повлекшие невозможность проведения
        или завершения контрольного (надзорного) мероприятия
    - doc: koap-rf
      anchor: st-19-4-1
      quote: >-
        влекут наложение административного штрафа на должностных лиц в размере от пяти тысяч до десяти тысяч
        рублей; на юридических лиц - от двадцати тысяч до пятидесяти тысяч рублей
    - doc: koap-rf
      anchor: st-19-4-1
      quote: >-
        или дисквалификацию на срок от шести месяцев до одного года
  trap:
    kind: wording
    note: >-
      Дисквалификация в статье есть, но только за повторное нарушение. В условии сказано, что раньше
      за такое не наказывали.
  revision: 1
  checked: '2026-11-19'
