- id: I-otkrytost-i-otchetnost-001
  type: single
  difficulty: 1
  situation: >-
    Директор школы получил письмо: школа включена в перечень организаций, в которых в этом году пройдёт
    независимая оценка качества условий осуществления образовательной деятельности. Заместитель спрашивает,
    кто будет её проводить.
  question: Кто проводит такую оценку? Выберите один вариант.
  options:
    - text: Общественный совет по независимой оценке качества
      correct: true
      why: >-
        Независимую оценку качества условий осуществления образовательной деятельности проводят общественные
        советы по независимой оценке качества.
    - text: Орган государственного контроля (надзора) в сфере образования
      correct: false
      why: Независимую оценку проводят не органы контроля, а общественные советы по независимой оценке качества.
    - text: Учредитель школы силами своих специалистов
      correct: false
      why: Учредитель эту оценку не проводит, закон поручает её общественным советам по независимой оценке качества.
    - text: Сама школа в ходе ежегодного самообследования
      correct: false
      why: Самообследование школа проводит сама, но это другая процедура. Независимую оценку ведёт общественный совет.
  explanation: >-
    По статье 95.2 закона об образовании независимую оценку качества условий осуществления образовательной
    деятельности проводят общественные советы по независимой оценке качества. Они же определяют перечень
    организаций, в отношении которых её проводят.
  refs:
    - doc: fz-273
      anchor: st-95-2
      quote: >-
        проводится общественными советами по независимой оценке качества не чаще чем один раз в год и не реже
        чем один раз в три года в отношении одной и той же организации
  revision: 1
  checked: '2026-11-19'

- id: I-otkrytost-i-otchetnost-002
  type: input
  difficulty: 1
  situation: >-
    Школа прошла независимую оценку качества условий осуществления образовательной деятельности в 2024 году.
    Директор планирует работу и хочет понять, как долго следующей оценки может не быть.
  question: >-
    Не реже одного раза в сколько лет проводят такую оценку в отношении одной и той же организации?
    Ответ в годах.
  answer: 3
  unit: года
  explanation: >-
    Часть 6 статьи 95.2 закона об образовании устанавливает, что независимую оценку качества условий
    в отношении одной и той же организации проводят не чаще одного раза в год и не реже одного раза в три года.
  refs:
    - doc: fz-273
      anchor: st-95-2
      quote: >-
        не чаще чем один раз в год и не реже чем один раз в три года в отношении одной и той же организации
  revision: 1
  checked: '2026-11-19'

- id: I-otkrytost-i-otchetnost-003
  type: multiple
  difficulty: 2
  situation: >-
    Перед независимой оценкой качества условий осуществления образовательной деятельности директор собрал
    заместителей и попросил назвать, по каким общим критериям школу будут оценивать.
  question: Какие из названных критериев есть в законе? Отметьте все верные варианты.
  options:
    - text: Открытость и доступность информации о школе
      correct: true
      why: Этот критерий назван в части 4 статьи 95.2 первым.
    - text: Средний балл выпускников на государственной итоговой аттестации
      correct: false
      why: Оценивают условия, а не результаты обучения. Экзаменационных баллов среди общих критериев нет.
    - text: Комфортность условий, в которых идёт образовательная деятельность
      correct: true
      why: Комфортность условий названа среди общих критериев.
    - text: Доброжелательность и вежливость работников
      correct: true
      why: Доброжелательность, вежливость работников прямо названы в части 4 статьи 95.2.
    - text: Доля учителей с высшей квалификационной категорией
      correct: false
      why: Такого критерия в части 4 статьи 95.2 нет.
    - text: Доступность услуг для инвалидов
      correct: true
      why: Доступность услуг для инвалидов завершает перечень общих критериев.
  explanation: >-
    Часть 4 статьи 95.2 закона об образовании называет общие критерии независимой оценки: открытость
    и доступность информации об организации, комфортность условий, доброжелательность и вежливость работников,
    удовлетворённость условиями ведения образовательной деятельности и доступность услуг для инвалидов.
    Результаты экзаменов и категории учителей в них не входят.
  refs:
    - doc: fz-273
      anchor: st-95-2
      quote: >-
        комфортность условий, в которых осуществляется образовательная деятельность; доброжелательность,
        вежливость работников; удовлетворенность условиями ведения образовательной деятельности организаций,
        а также доступность услуг для инвалидов
  revision: 1
  checked: '2026-11-19'

- id: I-otkrytost-i-otchetnost-004
  type: single
  difficulty: 2
  situation: >-
    Независимая оценка качества условий выявила в государственной школе недостатки: на сайте нет части
    обязательных сведений, в здании нет условий для инвалидов. Утверждён план их устранения. Директор
    за год не сделал по плану ничего и считает, что оценка «общественная» и ни к чему его не обязывает.
  question: Чем это грозит директору? Выберите один вариант.
  options:
    - text: Ничем, результаты независимой оценки носят рекомендательный характер
      correct: false
      why: >-
        Закон прямо говорит об ответственности руководителей за непринятие мер по устранению выявленных
        недостатков.
    - text: Ответственностью по трудовому законодательству
      correct: true
      why: >-
        Руководители государственных и муниципальных организаций несут ответственность за непринятие мер
        по устранению недостатков, выявленных независимой оценкой, в соответствии с трудовым законодательством.
    - text: Уголовной ответственностью за халатность
      correct: false
      why: Статья 95.2 называет трудовое законодательство, об уголовной ответственности она не говорит.
    - text: Обязанностью возместить родителям моральный вред
      correct: false
      why: Такого последствия статья 95.2 не устанавливает.
  explanation: >-
    Часть 14 статьи 95.2 закона об образовании возлагает на руководителей государственных и муниципальных
    образовательных организаций ответственность за непринятие мер по устранению недостатков, выявленных
    независимой оценкой, по трудовому законодательству. Результаты оценки и выполнение плана по устранению
    недостатков включают в показатели эффективности в трудовом договоре руководителя.
  refs:
    - doc: fz-273
      anchor: st-95-2
      quote: >-
        несут ответственность за непринятие мер по устранению недостатков, выявленных в ходе независимой оценки
        качества условий осуществления образовательной деятельности организациями, в соответствии с трудовым
        законодательством
  revision: 1
  checked: '2026-11-19'

- id: I-otkrytost-i-otchetnost-005
  type: single
  difficulty: 2
  situation: >-
    Школа подготовила ежегодный отчёт о поступлении и расходовании финансовых и материальных средств
    и отчёт о результатах самообследования. Директор собирается направить оба документа учредителю.
    Председатель управляющего совета просит показать их родителям.
  question: Кому школа обязана предоставить эти отчёты? Выберите один вариант.
  options:
    - text: Учредителю, для остальных это внутренние документы школы
      correct: false
      why: 'Закон называет двух адресатов: учредителя и общественность.'
    - text: Учредителю, а родителям по письменному запросу и с его согласия
      correct: false
      why: 'Согласия учредителя закон не требует: общественность названа адресатом наравне с ним.'
    - text: Учредителю и общественности
      correct: true
      why: >-
        К компетенции образовательной организации относится предоставление учредителю и общественности
        ежегодного отчёта о поступлении и расходовании средств и отчёта о результатах самообследования.
    - text: Органу контроля в сфере образования, а учредителю по его запросу
      correct: false
      why: Орган контроля адресатом этих отчётов в пункте 3 части 3 статьи 28 не назван.
  explanation: >-
    Пункт 3 части 3 статьи 28 закона об образовании относит к компетенции образовательной организации
    предоставление учредителю и общественности ежегодного отчёта о поступлении и расходовании финансовых
    и материальных средств и отчёта о результатах самообследования. Родители и управляющий совет входят
    в общественность, поэтому школа открывает отчёты и для них.
  refs:
    - doc: fz-273
      anchor: st-28
      quote: >-
        предоставление учредителю и общественности ежегодного отчета о поступлении и расходовании финансовых
        и материальных средств, а также отчета о результатах самообследования
  revision: 1
  checked: '2026-11-19'
