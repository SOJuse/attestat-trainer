- id: R-remontnye-raboty-001
  type: single
  difficulty: 2
  situation: >-
    Летом подрядчик начинает капитальный ремонт одного крыла школы. В остальной части здания в это время
    работает администрация и идёт приём документов в первый класс. Контракт подписан, подрядчик готов завезти
    бригаду завтра.
  question: Что нужно оформить до начала работ в действующем здании? Выберите один вариант.
  options:
    - text: Акт-допуск, который подрядчик составляет сам и передаёт школе для сведения
      correct: false
      why: >-
        Акт-допуск оформляют двое: работодатель, который ведёт строительные работы, и руководитель
        организации, эксплуатирующей объект.
    - text: Акт-допуск, который оформляют подрядчик и директор школы или его полномочный представитель
      correct: true
      why: >-
        Перед началом строительного производства на территории действующего объекта работодатель
        и руководитель хозяйствующего субъекта, эксплуатирующего объект, должны оформить акт-допуск.
    - text: Ничего сверх контракта, порядок допуска бригады уже определён его условиями
      correct: false
      why: Правила требуют отдельного документа, акта-допуска, и контракт его не заменяет.
    - text: Акт-допуск, который оформляют после завершения первого этапа работ
      correct: false
      why: Акт-допуск оформляют перед началом строительного производства, а не по ходу работ.
  explanation: >-
    Пункт 17 Правил по охране труда при строительстве, реконструкции и ремонте требует: перед началом
    строительного производства на территории действующего объекта, в том числе действующего здания,
    работодатель и руководитель организации, эксплуатирующей объект, оформляют акт-допуск. Со стороны школы его подписывает директор или его полномочный представитель. Тот же пункт требует ещё наряд-допуск на работы в местах, где действуют вредные или опасные производственные факторы.
  refs:
    - doc: prikaz-883n
      anchor: pril-1-p-17
      quote: >-
        Перед началом строительного производства на территории действующего объекта (в том числе действующих административных, производственных и иных зданий) работодатель и руководитель (полномочный представитель руководителя) хозяйствующего субъекта, эксплуатирующего объект, должны оформить акт-допуск
      scan_page: 6
  revision: 1
  checked: '2026-11-19'

- id: R-remontnye-raboty-002
  type: single
  difficulty: 1
  situation: >-
    Перед учебным годом в школе нужно заменить лампы под потолком спортивного зала, работать придётся
    на высоте. Заведующий хозяйством хочет поручить это семнадцатилетнему подсобному рабочему, который
    летом работает в школе по трудовому договору.
  question: Можно ли поручить ему эту работу? Выберите один вариант.
  options:
    - text: Можно, если он пройдёт обучение безопасным методам работы на высоте
      correct: false
      why: Обучение возрастного ограничения не снимает. К работе на высоте допускают с восемнадцати лет.
    - text: Можно, к работе на высоте допускают с шестнадцати лет
      correct: false
      why: Правила называют другой возраст, восемнадцать лет. Шестнадцати лет для работы на высоте мало.
    - text: Можно, если письменное согласие дадут его родители
      correct: false
      why: Согласие родителей не заменяет требование Правил о возрасте работника.
    - text: Нельзя, к работе на высоте допускают с восемнадцати лет
      correct: true
      why: Пункт 12 Правил допускает к работе на высоте лиц, достигших возраста восемнадцати лет.
  explanation: >-
    По пункту 12 Правил по охране труда при работе на высоте к такой работе допускаются лица, достигшие
    возраста восемнадцати лет. Рабочему семнадцать, поэтому поручить ему замену ламп под потолком нельзя,
    какие бы условия ни предлагал завхоз.
  refs:
    - doc: prikaz-782n
      anchor: pril-1-p-12
      quote: К работе на высоте допускаются лица, достигшие возраста восемнадцати лет.
      scan_page: 5
  revision: 1
  checked: '2026-11-19'

- id: R-remontnye-raboty-003
  type: single
  difficulty: 2
  situation: >-
    Рабочему по обслуживанию здания предстоит чистить водостоки на крыше школы. Раньше он на высоте
    не работал. Чтобы не отрывать его от дел, заместитель директора предлагает оплатить ему онлайн-курс:
    всё обучение, включая практические занятия, проходит дистанционно.
  question: Подходит ли такое обучение? Выберите один вариант.
  options:
    - text: Подходит, форму обучения работодатель выбирает сам
      correct: false
      why: >-
        Правила ограничивают выбор: обучение в заочной форме и исключительно с использованием дистанционных
        технологий не допускается.
    - text: Не подходит, обучение исключительно с дистанционными технологиями Правила не допускают
      correct: true
      why: >-
        Обучение безопасным методам работ на высоте в заочной форме, а также исключительно с использованием
        электронного обучения и дистанционных технологий не допускается.
    - text: Подходит, если по итогам курса рабочий сдаст экзамен онлайн
      correct: false
      why: Экзамен запрета не снимает. Недопустима сама форма, в которой всё обучение идёт дистанционно.
    - text: Не подходит, обучать работам на высоте вправе только сам работодатель на рабочем месте
      correct: false
      why: >-
        Такого требования в этом пункте нет. Он запрещает заочную и полностью дистанционную форму,
        а не обучение в сторонней организации.
  explanation: >-
    Пункт 17 Правил по охране труда при работе на высоте не допускает обучение безопасным методам и приёмам
    работ в заочной форме и исключительно с использованием электронного обучения и дистанционных технологий.
    Курс, где дистанционно проходит всё, включая практику, под этот запрет подпадает.
  refs:
    - doc: prikaz-782n
      anchor: pril-1-p-17
      quote: >-
        в заочной форме, а также исключительно с использованием электронного обучения и дистанционных технологий
      scan_page: 6
    - doc: prikaz-782n
      anchor: pril-1-p-17
      quote: >-
        проведение практических занятий по освоению безопасных методов и приемов выполнения работ на высоте,
        а также прохождения стажировки в режиме самоподготовки работником не допускается
      scan_page: 6
  revision: 1
  checked: '2026-11-19'

- id: R-remontnye-raboty-004
  type: multiple
  difficulty: 3
  situation: >-
    Осенью в школе запланированы работы на высоте: ремонт карнизов и замена светильников в актовом зале.
    Заведующий хозяйством принёс директору список работников и просит решить, кого перед этим нужно обучить.
  question: >-
    Кого из них пункт 16 Правил по охране труда при работе на высоте требует обучить до начала работы?
    Отметьте все верные варианты.
  options:
    - text: Рабочего, которого допускают к работам на высоте впервые
      correct: true
      why: Работники, допускаемые к работам на высоте впервые, названы в подпункте «а» пункта 16.
    - text: Электрика, которого перевели с другой работы и который такого обучения раньше не проходил
      correct: true
      why: >-
        Подпункт «б» называет работников, переводимых с других работ, если они ранее не проходили
        соответствующего обучения.
    - text: Плотника, который обучен и последний раз работал на высоте восемь месяцев назад
      correct: false
      why: >-
        Пункт 16 называет перерыв в работе на высоте более одного года. Восемь месяцев под него не подпадают.
    - text: Кровельщика, который обучен, но не работал на высоте четырнадцать месяцев
      correct: true
      why: 'Перерыв больше года: подпункт «в» называет работников, имеющих перерыв в работе на высоте более одного года.'
    - text: Маляра, которого перевели с работы, где он работал на высоте и три месяца назад прошёл такое обучение
      correct: false
      why: >-
        Переведённых с других работ обучают, если раньше они такого обучения не проходили. Маляр его проходил, на высоте работал недавно, так что он не новичок и перерыва больше года у него нет.
  explanation: >-
    Пункт 16 Правил по охране труда при работе на высоте обязывает работодателя до начала работы обучить три
    группы работников: тех, кого допускают к работам на высоте впервые, тех, кого перевели с других работ
    и кто раньше такого обучения не проходил, и тех, у кого перерыв в работе на высоте больше года.
  refs:
    - doc: prikaz-782n
      anchor: pril-1-p-16
      quote: >-
        обязан организовать до начала проведения работы на высоте обучение безопасным методам и приемам
        выполнения работ на высоте работников
      scan_page: 5
    - doc: prikaz-782n
      anchor: pril-1-p-16
      quote: а) допускаемых к работам на высоте впервые
      scan_page: 5
    - doc: prikaz-782n
      anchor: pril-1-p-16
      quote: б) переводимых с других работ, если указанные работники ранее не проходили соответствующего обучения
      scan_page: 6
    - doc: prikaz-782n
      anchor: pril-1-p-16
      quote: в) имеющих перерыв в работе на высоте более одного года
      scan_page: 6
  trap:
    kind: wording
    note: >-
      Перерыв должен быть больше года. Восемь месяцев без работы на высоте нового обучения по этому пункту
      не требуют, четырнадцать требуют.
  revision: 1
  checked: '2026-11-19'
