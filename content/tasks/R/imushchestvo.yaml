- id: R-imushchestvo-001
  type: multiple
  difficulty: 2
  situation: >-
    Учитель информатики по неосторожности уронил школьный проектор. Проверка закончилась 10 марта: размер ущерба
    установлен, письменное объяснение учитель дал. Ремонт стоит меньше его среднего месячного заработка. Пока
    проектор чинили, школа отменила несколько платных занятий. Сегодня 17 марта. Учитель вину признаёт, просит
    не взыскивать всю сумму сразу и предлагает отдать школе такой же исправный проектор, который есть у него дома.
  question: Что директор вправе сделать? Отметьте все верные варианты.
  options:
    - text: Взыскать стоимость ремонта своим распоряжением, без обращения в суд
      correct: true
      why: >-
        Сумма не больше среднего месячного заработка, и месяц со дня установления ущерба не прошёл, поэтому
        хватает распоряжения работодателя.
    - text: Принять от учителя вместо денег равноценный исправный проектор
      correct: true
      why: С согласия работодателя работник может возместить ущерб, передав равноценное имущество.
    - text: Согласовать рассрочку по письменному обязательству учителя с датами платежей
      correct: true
      why: >-
        Рассрочка допускается по соглашению сторон, работник при этом даёт письменное обязательство с конкретными
        сроками платежей.
    - text: Взыскать с учителя ещё и доход от сорванных платных занятий
      correct: false
      why: Это неполученный доход, то есть упущенная выгода, а её с работника не взыскивают.
    - text: Отложить распоряжение о взыскании до конца учебного года
      correct: false
      why: >-
        Распоряжение можно сделать не позднее месяца со дня окончательного установления размера ущерба, к концу
        учебного года этот срок истечёт.
  explanation: >-
    Работник возмещает прямой действительный ущерб, а неполученные доходы с него не взыскивают (статья 238 ТК РФ).
    Сумму в пределах среднего месячного заработка работодатель взыскивает своим распоряжением, но не позднее месяца
    со дня окончательного установления размера ущерба (статья 248). На 17 марта этот срок не истёк. Та же статья
    позволяет рассрочку по соглашению сторон под письменное обязательство работника и, с согласия работодателя,
    возмещение равноценным имуществом.
  refs:
    - doc: tk-rf
      anchor: st-248
      quote: >-
        Взыскание с виновного работника суммы причиненного ущерба, не превышающей среднего месячного заработка,
        производится по распоряжению работодателя. Распоряжение может быть сделано не позднее одного месяца со дня
        окончательного установления работодателем размера причиненного работником ущерба.
    - doc: tk-rf
      anchor: st-248
      quote: >-
        С согласия работодателя работник может передать ему для возмещения причиненного ущерба равноценное имущество
        или исправить поврежденное имущество.
    - doc: tk-rf
      anchor: st-248
      quote: >-
        По соглашению сторон трудового договора допускается возмещение ущерба с рассрочкой платежа. В этом случае
        работник представляет работодателю письменное обязательство о возмещении ущерба с указанием конкретных сроков
        платежей.
    - doc: tk-rf
      anchor: st-238
      quote: Неполученные доходы (упущенная выгода) взысканию с работника не подлежат.
  revision: 1
  checked: '2026-11-16'

- id: R-imushchestvo-002
  type: single
  difficulty: 1
  situation: >-
    Государственная бюджетная школа заменила мебель в классах. Старые парты закреплены за школой учредителем,
    к особо ценному имуществу они не отнесены. Директор хочет продать их детскому лагерю. Сумма небольшая,
    крупной сделка не будет, заинтересованных лиц в ней нет.
  question: Как школа может распорядиться партами? Выберите один вариант.
  options:
    - text: Продать парты самостоятельно, согласие собственника не нужно
      correct: true
      why: >-
        Без согласия собственника бюджетное учреждение не распоряжается недвижимостью и особо ценным движимым
        имуществом. Остальным имуществом оно распоряжается самостоятельно.
    - text: Продать парты с согласия собственника, потому что их закрепил за школой учредитель
      correct: false
      why: >-
        Для движимого имущества согласие нужно, если оно особо ценное. То, что парты закрепил учредитель,
        само по себе согласия не требует.
    - text: Продать парты после одобрения сделки управляющим советом школы
      correct: false
      why: >-
        Статья 298 Гражданского кодекса не ставит распоряжение таким имуществом в зависимость
        от решения управляющего совета.
    - text: Продавать парты нельзя, закреплённое имущество школа может лишь вернуть учредителю
      correct: false
      why: >-
        Запрета отчуждать закреплённое имущество для бюджетного учреждения нет. Ограничение касается
        недвижимости и особо ценного движимого имущества и снимается согласием собственника.
  explanation: >-
    Пункт 3 статьи 298 Гражданского кодекса запрещает бюджетному учреждению без согласия собственника
    распоряжаться недвижимостью и особо ценным движимым имуществом, которое закрепил собственник или которое
    куплено на выделенные им средства. Остальным имуществом учреждение распоряжается самостоятельно. Парты
    движимые и к особо ценным не отнесены, поэтому школа продаёт их сама.
  refs:
    - doc: gk-rf
      anchor: st-298
      quote: >-
        Остальным имуществом, находящимся у него на праве оперативного управления, бюджетное учреждение
        вправе распоряжаться самостоятельно, если иное не установлено законом.
  revision: 1
  checked: '2026-11-19'

- id: R-imushchestvo-003
  type: multiple
  difficulty: 2
  situation: >-
    Директор государственной бюджетной школы составляет список имущества, которое школа готова сдать
    в аренду или продать. По каждой позиции он отмечает, нужно ли согласие собственника.
  question: Чем из перечисленного школа не вправе распорядиться без согласия собственника? Отметьте все верные варианты.
  options:
    - text: Гаражом, который школа купила на доходы от платных услуг
      correct: true
      why: >-
        Гараж относится к недвижимому имуществу. Недвижимостью бюджетное учреждение без согласия собственника
        не распоряжается, и источник средств на покупку этого не меняет.
    - text: Ноутбуками, которые куплены на доходы от платных услуг и не отнесены к особо ценному имуществу
      correct: false
      why: >-
        Ноутбуки движимые, к особо ценному имуществу не отнесены и куплены не на средства собственника. Таким имуществом школа распоряжается сама.
    - text: Автобусом, который закрепил за школой учредитель и который отнесён к особо ценному имуществу
      correct: true
      why: Особо ценным движимым имуществом, закреплённым собственником, без его согласия распоряжаться нельзя.
    - text: Мебелью, которую закрепил за школой учредитель и которая не отнесена к особо ценному имуществу
      correct: false
      why: >-
        Это движимое имущество, и особо ценным оно не признано. Таким имуществом школа распоряжается
        самостоятельно.
    - text: Станком, который отнесён к особо ценному имуществу и куплен на средства, выделенные на это учредителем
      correct: true
      why: >-
        Запрет охватывает и особо ценное движимое имущество, купленное на средства, которые собственник
        выделил на его приобретение.
  explanation: >-
    По пункту 3 статьи 298 Гражданского кодекса бюджетное учреждение без согласия собственника не распоряжается
    особо ценным движимым имуществом, закреплённым собственником или купленным на выделенные им средства,
    а также недвижимым имуществом. Для недвижимости источник средств не оговорён, поэтому согласие нужно
    и для гаража, купленного на собственные доходы. Остальное движимое имущество школа продаёт и сдаёт сама.
  refs:
    - doc: gk-rf
      anchor: st-298
      quote: >-
        Бюджетное учреждение без согласия собственника не вправе распоряжаться особо ценным движимым имуществом,
        закрепленным за ним собственником или приобретенным бюджетным учреждением за счет средств, выделенных
        ему собственником на приобретение такого имущества, а также недвижимым имуществом.
    - doc: gk-rf
      anchor: st-298
      quote: >-
        Доходы, полученные от такой деятельности, и приобретенное за счет этих доходов имущество поступают
        в самостоятельное распоряжение бюджетного учреждения.
  trap:
    kind: wording
    note: >-
      Гараж куплен на собственные доходы школы, и кажется, что им можно распоряжаться свободно.
      Но для недвижимости согласие собственника нужно при любом источнике средств.
  revision: 1
  checked: '2026-11-19'

- id: R-imushchestvo-004
  type: multiple
  difficulty: 3
  situation: >-
    Учредитель проверил, как школа использует имущество, и готовит решение об изъятии части этого имущества,
    чтобы передать его другим учреждениям. Директор разбирает список и по каждой позиции оценивает, законно ли
    изъятие.
  question: Какое имущество учредитель как представитель собственника вправе изъять у школы? Отметьте все верные варианты.
  options:
    - text: Автобус, который закреплён за школой учредителем и два года не используется
      correct: true
      why: Неиспользуемое имущество, закреплённое собственником за учреждением, собственник вправе изъять.
    - text: Тренажёры, которые школа купила на доходы от платных услуг и не использует
      correct: false
      why: >-
        Право изъятия касается имущества, которое закрепил собственник или которое куплено на выделенные им
        средства. Тренажёры куплены на собственные доходы школы.
    - text: Станки, которые куплены на выделенные учредителем средства и оказались для школы излишними
      correct: true
      why: >-
        Излишнее имущество, купленное на средства, которые собственник выделил на его приобретение,
        он вправе изъять.
    - text: Закреплённую учредителем мастерскую, которую школа использует не по назначению
      correct: true
      why: Использование закреплённого имущества не по назначению названо среди оснований для изъятия.
    - text: Закреплённый учредителем компьютерный класс, который занят на уроках, но нужнее соседней школе
      correct: false
      why: >-
        Класс используется по назначению и излишним не является. Нужда другого учреждения основанием
        для изъятия не названа.
  explanation: >-
    Пункт 2 статьи 296 Гражданского кодекса позволяет собственнику изъять у учреждения излишнее, неиспользуемое
    или используемое не по назначению имущество. Но только то, которое он сам закрепил за учреждением или которое
    куплено на выделенные им средства. Имущество, купленное школой на собственные доходы, под это правило
    не подпадает, как и закреплённое имущество, которое школа использует по назначению.
  refs:
    - doc: gk-rf
      anchor: st-296
      quote: >-
        Собственник имущества вправе изъять излишнее, неиспользуемое или используемое не по назначению имущество,
        закрепленное им за учреждением или казенным предприятием либо приобретенное учреждением или казенным
        предприятием за счет средств, выделенных ему собственником на приобретение этого имущества.
  trap:
    kind: wording
    note: >-
      Тренажёры тоже не используются, но куплены на доходы школы. Изъять можно неиспользуемое имущество,
      которое закрепил собственник или которое куплено на его средства.
  revision: 1
  checked: '2026-11-19'

- id: R-imushchestvo-005
  type: multiple
  difficulty: 2
  situation: >-
    Школа арендует у фирмы помещение под учебные мастерские. Фирма нашла арендатора выгоднее и хочет
    прекратить договор со школой досрочно. Директор выясняет, в каких случаях закон об образовании это допускает.
  question: В каких случаях договор аренды со школой может быть расторгнут? Отметьте все верные варианты.
  options:
    - text: Фирма предупредила школу о расторжении за три месяца
      correct: false
      why: >-
        Срок предупреждения закон об образовании основанием для расторжения не называет. Нужны согласие
        школы или решение суда.
    - text: Школа и фирма подписали соглашение о расторжении
      correct: true
      why: Соглашение сторон названо первым из двух случаев, когда расторжение допускается.
    - text: Фирма вернула школе арендную плату за оставшийся срок договора
      correct: false
      why: Возврат платы основанием для расторжения не служит. Нужны соглашение сторон или решение суда.
    - text: Суд расторг договор, потому что школа существенно нарушила его условия
      correct: true
      why: >-
        Второй случай: решение суда при существенном нарушении условий договора арендатором, то есть школой.
    - text: Расторжение по письму фирмы согласовал учредитель школы
      correct: false
      why: >-
        Соглашение о расторжении заключают стороны договора. Согласование учредителя согласия самой школы
        или решения суда не заменяет.
  explanation: >-
    Часть 4 статьи 102 закона об образовании допускает расторжение договора аренды с образовательной организацией
    в двух случаях: по соглашению сторон или по решению суда, когда арендатор существенно нарушил условия
    договора. Письмо арендодателя, срок предупреждения или возврат платы договор не прекращают.
  refs:
    - doc: fz-273
      anchor: st-102
      quote: >-
        Расторжение договора аренды с образовательной организацией допускается по соглашению сторон
        или по решению суда в случае существенного нарушения условий договора арендатором.
  revision: 1
  checked: '2026-11-19'
