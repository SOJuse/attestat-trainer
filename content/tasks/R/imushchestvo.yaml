- id: R-imushchestvo-001
  type: multiple
  difficulty: 2
  situation: >-
    Учитель информатики по неосторожности уронил школьный проектор. Проверка закончилась 10 марта: размер ущерба
    установлен, письменное объяснение учитель дал. Ремонт стоит меньше его среднего месячного заработка. Пока
    проектор чинили, школа отменила несколько платных занятий. Сегодня 17 марта. Учитель вину признаёт, просит
    не взыскивать всю сумму сразу и предлагает отдать школе такой же исправный проектор, который есть у него дома.
  question: Что директор вправе сделать? Отметьте все верные варианты.
  options:
    - text: Взыскать стоимость ремонта своим распоряжением, без обращения в суд
      correct: true
      why: >-
        Сумма не больше среднего месячного заработка, и месяц со дня установления ущерба не прошёл, поэтому
        хватает распоряжения работодателя.
    - text: Принять от учителя вместо денег равноценный исправный проектор
      correct: true
      why: С согласия работодателя работник может возместить ущерб, передав равноценное имущество.
    - text: Согласовать рассрочку по письменному обязательству учителя с датами платежей
      correct: true
      why: >-
        Рассрочка допускается по соглашению сторон, работник при этом даёт письменное обязательство с конкретными
        сроками платежей.
    - text: Взыскать с учителя ещё и доход от сорванных платных занятий
      correct: false
      why: Это неполученный доход, то есть упущенная выгода, а её с работника не взыскивают.
    - text: Отложить распоряжение о взыскании до конца учебного года
      correct: false
      why: >-
        Распоряжение можно сделать не позднее месяца со дня окончательного установления размера ущерба, к концу
        учебного года этот срок истечёт.
  explanation: >-
    Работник возмещает прямой действительный ущерб, а неполученные доходы с него не взыскивают (статья 238 ТК РФ).
    Сумму в пределах среднего месячного заработка работодатель взыскивает своим распоряжением, но не позднее месяца
    со дня окончательного установления размера ущерба (статья 248). На 17 марта этот срок не истёк. Та же статья
    позволяет рассрочку по соглашению сторон под письменное обязательство работника и, с согласия работодателя,
    возмещение равноценным имуществом.
  refs:
    - doc: tk-rf
      anchor: st-248
      quote: >-
        Взыскание с виновного работника суммы причиненного ущерба, не превышающей среднего месячного заработка,
        производится по распоряжению работодателя. Распоряжение может быть сделано не позднее одного месяца со дня
        окончательного установления работодателем размера причиненного работником ущерба.
    - doc: tk-rf
      anchor: st-248
      quote: >-
        С согласия работодателя работник может передать ему для возмещения причиненного ущерба равноценное имущество
        или исправить поврежденное имущество.
    - doc: tk-rf
      anchor: st-248
      quote: >-
        По соглашению сторон трудового договора допускается возмещение ущерба с рассрочкой платежа. В этом случае
        работник представляет работодателю письменное обязательство о возмещении ущерба с указанием конкретных сроков
        платежей.
    - doc: tk-rf
      anchor: st-238
      quote: Неполученные доходы (упущенная выгода) взысканию с работника не подлежат.
