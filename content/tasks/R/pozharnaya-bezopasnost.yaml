- id: R-pozharnaya-bezopasnost-001
  type: matching
  difficulty: 2
  situation: >-
    Образовательный комплекс занимает несколько зданий разного назначения. Для документов по пожарной
    безопасности заместитель директора определяет класс функциональной пожарной опасности каждого здания.
  question: Сопоставьте здание и его класс функциональной пожарной опасности.
  pairs:
    - left: Учебный корпус, где идут уроки с 1 по 11 класс
      right: Ф4.1
    - left: Отдельное здание дошкольных групп
      right: Ф1.1
    - left: Здание института повышения квалификации учителей
      right: Ф4.2
    - left: Отдельное здание, где работает только управление комплекса
      right: Ф4.3
  explanation: >-
    Статья 32 технического регламента о требованиях пожарной безопасности делит здания по назначению. Здания
    общеобразовательных организаций относятся к классу Ф4.1, дошкольных образовательных организаций к Ф1.1.
    Организации дополнительного профессионального образования отнесены к Ф4.2 вместе с вузами, а здания
    органов управления учреждений к Ф4.3.
  refs:
    - doc: fz-123
      anchor: st-32
      quote: >-
        а) Ф4.1 - здания общеобразовательных организаций, организаций дополнительного образования детей,
        профессиональных образовательных организаций;
    - doc: fz-123
      anchor: st-32
      quote: а) Ф1.1 - здания дошкольных образовательных организаций
    - doc: fz-123
      anchor: st-32
      quote: >-
        б) Ф4.2 - здания образовательных организаций высшего образования, организаций дополнительного
        профессионального образования;
    - doc: fz-123
      anchor: st-32
      quote: в) Ф4.3 - здания органов управления учреждений, проектно-конструкторских организаций
  revision: 1
  checked: '2026-11-19'

- id: R-pozharnaya-bezopasnost-002
  type: input
  difficulty: 1
  situation: >-
    Учредитель закрепил за школой на праве оперативного управления ещё одно здание, для которого нужна
    декларация пожарной безопасности. Директор планирует работу и хочет знать крайний срок.
  question: >-
    В течение скольких месяцев со дня приобретения права на здание школа должна разработать и представить
    декларацию пожарной безопасности? Ответ в месяцах.
  answer: 6
  unit: месяцев
  explanation: >-
    По части 5 статьи 6 технического регламента собственник объекта защиты или тот, кто владеет им на ином
    законном основании, в том числе на праве оперативного управления, должен разработать и представить
    декларацию пожарной безопасности в течение шести месяцев со дня приобретения такого права.
  refs:
    - doc: fz-123
      anchor: st-6
      quote: >-
        в течение шести месяцев со дня приобретения такого права разработать и представить в уведомительном
        порядке декларацию пожарной безопасности
  revision: 1
  checked: '2026-11-19'

- id: R-pozharnaya-bezopasnost-003
  type: single
  difficulty: 2
  situation: >-
    Декларация пожарной безопасности на здание школы составлена и зарегистрирована несколько лет назад.
    30 июня в здании завершён капитальный ремонт. Класс функциональной пожарной опасности здания не менялся.
  question: Что школа должна сделать с декларацией? Выберите один вариант.
  options:
    - text: Ничего, декларацию на здание составляют один раз
      correct: false
      why: >-
        После капитального ремонта, реконструкции или технического перевооружения закон требует
        уточнённую декларацию.
    - text: Ничего, уточнённая декларация нужна при смене класса пожарной опасности, а он прежний
      correct: false
      why: >-
        Смена класса лишь один из случаев. Вторым назван капитальный ремонт, реконструкция или техническое
        перевооружение объекта.
    - text: Представить уточнённую декларацию в течение года со дня завершения ремонта
      correct: true
      why: >-
        Уточнённую декларацию представляют в течение года со дня завершения капитального ремонта.
    - text: Представить уточнённую декларацию до возобновления занятий в здании
      correct: false
      why: >-
        Срок закон считает от завершения работ и отводит на это год. С началом занятий он его не связывает.
  explanation: >-
    Часть 3 статьи 64 технического регламента требует уточнённую декларацию пожарной безопасности в двух
    случаях: когда изменился класс функциональной пожарной опасности объекта и когда проведены капитальный
    ремонт, реконструкция или техническое перевооружение. Срок: год со дня выдачи разрешения на ввод
    в эксплуатацию или завершения работ.
  refs:
    - doc: fz-123
      anchor: st-64
      quote: >-
        представляются в случае изменения класса функциональной пожарной опасности объекта защиты либо проведения
        капитального ремонта, реконструкции или технического перевооружения объекта защиты в течение года
        со дня выдачи разрешения на ввод объекта в эксплуатацию или завершения соответствующих работ
  revision: 1
  checked: '2026-11-19'

- id: R-pozharnaya-bezopasnost-004
  type: multiple
  difficulty: 2
  situation: >-
    Перед началом учебного года директор обходит здание школы с заместителем по безопасности и сверяет
    готовность здания с техническим регламентом о требованиях пожарной безопасности.
  question: Какие утверждения соответствуют регламенту? Отметьте все верные варианты.
  options:
    - text: Люди должны беспрепятственно двигаться по эвакуационным путям и через эвакуационные выходы
      correct: true
      why: Беспрепятственное движение людей по эвакуационным путям и через выходы названо в части 2 статьи 53.
    - text: Первичными средствами пожаротушения здание обеспечивает пожарная охрана района
      correct: false
      why: >-
        Это обязанность лиц, уполномоченных владеть, пользоваться или распоряжаться зданием. Для школьного
        здания это сама школа.
    - text: Должны быть организованы оповещение и управление движением людей по эвакуационным путям
      correct: true
      why: >-
        Статья 53 требует организовать оповещение и управление движением людей, в том числе световыми
        указателями, звуковым и речевым оповещением.
    - text: Первичными средствами пожаротушения здание обеспечивает тот, кто уполномочен им владеть и пользоваться
      correct: true
      why: Так сказано в части 1 статьи 60 регламента.
    - text: Эвакуационные пути и выходы рассчитывают с учётом средств пожаротушения, которые в них есть
      correct: false
      why: >-
        Расчёт эвакуационных путей и выходов производится без учёта применяемых в них средств пожаротушения.
  explanation: >-
    Статья 53 регламента требует для безопасной эвакуации беспрепятственного движения по путям и через выходы,
    а также оповещения и управления движением людей. По статье 60 первичными средствами пожаротушения здание
    обеспечивают те, кто уполномочен им владеть, пользоваться или распоряжаться. Статья 89 уточняет: пути
    и выходы рассчитывают без учёта средств пожаротушения в них.
  refs:
    - doc: fz-123
      anchor: st-53
      quote: >-
        обеспечено беспрепятственное движение людей по эвакуационным путям и через эвакуационные выходы
    - doc: fz-123
      anchor: st-53
      quote: >-
        организованы оповещение и управление движением людей по эвакуационным путям (в том числе с использованием
        световых указателей, звукового и речевого оповещения)
    - doc: fz-123
      anchor: st-60
      quote: >-
        Здания и сооружения должны быть обеспечены первичными средствами пожаротушения лицами, уполномоченными
        владеть, пользоваться или распоряжаться зданиями и сооружениями.
    - doc: fz-123
      anchor: st-89
      quote: >-
        Расчет эвакуационных путей и выходов производится без учета применяемых в них средств пожаротушения.
  revision: 1
  checked: '2026-11-19'

- id: R-pozharnaya-bezopasnost-005
  type: single
  difficulty: 2
  situation: >-
    Здание школы построено по проекту, который прошёл экспертизу уже после вступления технического регламента
    в силу. Все обязательные требования пожарной безопасности, установленные техническими регламентами,
    и требования нормативных документов по пожарной безопасности в здании выполнены. Подрядчик предлагает
    школе заказать ещё и расчёт пожарного риска.
  question: Нужен ли школе расчёт пожарного риска? Выберите один вариант.
  options:
    - text: Не нужен, при выполнении этих требований расчёт пожарного риска не требуется
      correct: true
      why: >-
        Если выполнены обязательные требования технических регламентов и требования нормативных документов
        по пожарной безопасности, расчёт пожарного риска не требуется.
    - text: Нужен, без расчёта пожарного риска пожарная безопасность здания не считается обеспеченной
      correct: false
      why: >-
        Допустимый пожарный риск лишь одно из условий на выбор. Другое условие: выполнение требований
        нормативных документов по пожарной безопасности, и оно здесь соблюдено.
    - text: Нужен, для зданий, где находятся дети, расчёт пожарного риска обязателен
      correct: false
      why: Правила об отдельном расчёте риска для зданий с детьми в статье 6 регламента нет.
    - text: Не нужен, расчёт пожарного риска делают для зданий, введённых до вступления регламента в силу
      correct: false
      why: >-
        Наоборот: для зданий, введённых в эксплуатацию до вступления регламента в силу, расчёт тоже
        не требуется. Школе он не нужен по другой причине: требования выполнены.
  explanation: >-
    По статье 6 технического регламента пожарная безопасность считается обеспеченной, если выполнены требования
    регламента и одно из условий, например требования нормативных документов по пожарной безопасности. Часть 3
    той же статьи прямо говорит: при выполнении обязательных требований технических регламентов и требований
    нормативных документов расчёт пожарного риска не требуется.
  refs:
    - doc: fz-123
      anchor: st-6
      quote: >-
        а также для объектов защиты, которые были введены в эксплуатацию или проектная документация на которые
        была направлена на экспертизу до дня вступления в силу настоящего Федерального закона, расчет пожарного
        риска не требуется
    - doc: fz-123
      anchor: st-6
      quote: >-
        выполнены требования пожарной безопасности, содержащиеся в нормативных документах по пожарной
        безопасности, указанных в пункте 1 части 3 статьи 4 настоящего Федерального закона
  revision: 1
  checked: '2026-11-19'
