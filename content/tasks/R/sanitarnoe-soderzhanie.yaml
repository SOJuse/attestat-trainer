- id: R-sanitarnoe-soderzhanie-001
  type: multiple
  difficulty: 3
  situation: >-
    Родители спрашивают директора школы, почему в медицинском кабинете работает сотрудник поликлиники,
    а не школы, и за что в охране здоровья детей отвечает сама школа. Директор отвечает по статье 41 закона
    об образовании.
  question: Какие утверждения директора верны? Отметьте все верные варианты.
  options:
    - text: За соблюдение санитарно-эпидемиологических правил и нормативов в школе отвечает школа
      correct: true
      why: Соблюдение санитарно-эпидемиологических правил и нормативов названо среди условий, которые обеспечивает школа.
    - text: Первичную медико-санитарную помощь ученикам, пока они в школе, организует школа
      correct: false
      why: >-
        Организация первичной медико-санитарной помощи обучающимся возложена на органы исполнительной власти
        в сфере здравоохранения.
    - text: Первую помощь ученикам, пока они в школе, организует школа
      correct: true
      why: >-
        Школа обеспечивает организацию оказания первой помощи обучающимся в период их пребывания
        в организации.
    - text: Прохождение учениками медицинских осмотров и диспансеризации организует школа
      correct: false
      why: >-
        Прохождение медицинских осмотров и диспансеризации исключено из того, что школа организует сама.
    - text: За расследование и учёт несчастных случаев с учениками в школе отвечает школа
      correct: true
      why: Расследование и учёт таких несчастных случаев названы в пункте 4 части 4 статьи 41.
  explanation: >-
    По части 2 статьи 41 закона об образовании школа сама организует охрану здоровья обучающихся, кроме
    первичной медико-санитарной помощи, медицинских осмотров и диспансеризации. Первую помощь ученикам она
    организует сама. Первичную медико-санитарную помощь организуют органы здравоохранения. Школа также
    обеспечивает соблюдение санитарных правил и расследование несчастных случаев с учениками.
  refs:
    - doc: fz-273
      anchor: st-41
      quote: >-
        Организация охраны здоровья обучающихся (за исключением оказания первичной медико-санитарной помощи,
        прохождения медицинских осмотров и диспансеризации) в организациях, осуществляющих образовательную
        деятельность, осуществляется этими организациями.
    - doc: fz-273
      anchor: st-41
      quote: >-
        Организация, осуществляющая образовательную деятельность, обеспечивает организацию оказания первой
        помощи обучающимся в период их пребывания в этой организации.
    - doc: fz-273
      anchor: st-41
      quote: >-
        Организация оказания первичной медико-санитарной помощи обучающимся осуществляется органами
        исполнительной власти в сфере здравоохранения.
    - doc: fz-273
      anchor: st-41
      quote: 3) соблюдение государственных санитарно-эпидемиологических правил и нормативов;
    - doc: fz-273
      anchor: st-41
      quote: 4) расследование и учет несчастных случаев с обучающимися во время пребывания в организации, осуществляющей образовательную деятельность
  trap:
    kind: wording
    note: >-
      «Первая помощь» и «первичная медико-санитарная помощь» звучат похоже. Первую помощь организует школа,
      первичную медико-санитарную помощь организуют органы здравоохранения.
  revision: 1
  checked: '2026-11-19'

- id: R-sanitarnoe-soderzhanie-002
  type: single
  difficulty: 2
  situation: >-
    Весной школу оштрафовали по части 1 статьи 6.7 КоАП: учебная мебель в нескольких классах не отвечала
    санитарным требованиям. Осенью проверка нашла то же нарушение, и дело возбудили уже по части 2 той же
    статьи, как за повторное.
  question: Чем наказание школы по части 2 может отличаться от первого? Выберите один вариант.
  options:
    - text: Ничем, за повторное нарушение назначают такой же штраф
      correct: false
      why: Часть 2 статьи 6.7 КоАП устанавливает для юридических лиц более высокий штраф и называет ещё один вид наказания на выбор.
    - text: Вместо штрафа возможно административное приостановление деятельности школы
      correct: true
      why: >-
        За повторное нарушение юридическому лицу грозит штраф или административное приостановление
        деятельности на срок до девяноста суток. В части 1 приостановления нет.
    - text: Вместо штрафа возможна дисквалификация директора
      correct: false
      why: Дисквалификации статья 6.7 КоАП не предусматривает ни в первой, ни во второй части.
    - text: Вместо штрафа школе вынесут предупреждение
      correct: false
      why: Предупреждения в статье 6.7 КоАП нет, а за повторное нарушение наказание строже.
  explanation: >-
    Часть 1 статьи 6.7 КоАП за нарушение санитарных требований к условиям обучения и к учебной мебели
    предусматривает штраф. По части 2, за повторное нарушение, штраф для юридических лиц выше, либо вместо него назначают административное приостановление деятельности на срок до девяноста суток.
  refs:
    - doc: koap-rf
      anchor: st-6-7
      quote: >-
        на юридических лиц - от ста тысяч до ста пятидесяти тысяч рублей или административное приостановление
        деятельности на срок до девяноста суток
  revision: 1
  checked: '2026-11-19'

- id: R-sanitarnoe-soderzhanie-003
  type: single
  difficulty: 1
  situation: >-
    Первичную медико-санитарную помощь ученикам в школе оказывает городская поликлиника. Она просит выделить
    под медицинский кабинет помещение, которое отвечает требованиям для такой помощи. Заместитель директора
    предлагает сдать кабинет поликлинике в аренду.
  question: На каких условиях школа предоставляет помещение? Выберите один вариант.
  options:
    - text: Безвозмездно, это обязанность школы
      correct: true
      why: >-
        Школа обязана предоставить медицинской организации безвозмездно помещение, соответствующее условиям
        и требованиям для оказания первичной медико-санитарной помощи.
    - text: В аренду по льготной ставке
      correct: false
      why: Закон требует предоставить помещение безвозмездно, льготная аренда этому не отвечает.
    - text: В аренду, если на это согласится учредитель
      correct: false
      why: Согласие учредителя не превращает безвозмездное предоставление в платное.
    - text: Школа помещение предоставлять не обязана, кабинет оборудует поликлиника у себя
      correct: false
      why: >-
        Если помощь оказывают в школе, обязанность предоставить для этого помещение закон возлагает на школу.
  explanation: >-
    Часть 3 статьи 41 закона об образовании устанавливает: когда первичную медико-санитарную помощь
    обучающимся оказывают в образовательной организации, эта организация обязана безвозмездно предоставить
    медицинской организации помещение, соответствующее условиям и требованиям для оказания такой помощи.
  refs:
    - doc: fz-273
      anchor: st-41
      quote: >-
        обязана предоставить безвозмездно медицинской организации помещение, соответствующее условиям
        и требованиям для оказания указанной помощи
  revision: 1
  checked: '2026-11-19'

- id: R-sanitarnoe-soderzhanie-004
  type: single
  difficulty: 1
  situation: >-
    В сентябре учитель физической культуры составляет списки учеников, которых можно допустить к занятиям.
    Часть родителей принесла записки от руки: «Ребёнок здоров, заниматься может». Учитель спрашивает
    директора, на что опираться.
  question: На каком основании учеников допускают к занятиям физической культурой? Выберите один вариант.
  options:
    - text: На основании письменного заявления родителей о том, что ребёнок здоров
      correct: false
      why: >-
        Закон называет другой источник: сведения из заключения медицинской организации по результатам
        профилактических медицинских осмотров.
    - text: На основании заключения психолого-медико-педагогической комиссии
      correct: false
      why: Комиссию часть 7 статьи 41 не называет. Допуск даёт заключение медицинской организации по итогам профилактических осмотров.
    - text: На основании заключения медицинской организации после профилактического осмотра
      correct: true
      why: >-
        К занятиям физической культурой допускают на основании сведений, содержащихся в заключении
        медицинской организации, выданном по результатам профилактических медицинских осмотров.
    - text: На основании справки школьного медицинского работника, выданной в день занятия
      correct: false
      why: Закон связывает допуск с заключением по результатам профилактических осмотров, а не с разовой справкой.
  explanation: >-
    Часть 7 статьи 41 закона об образовании допускает обучающихся к занятиям физической культурой на основании
    сведений из заключения медицинской организации, которое выдано по результатам профилактических медицинских
    осмотров. Записка родителей такое заключение не заменяет.
  refs:
    - doc: fz-273
      anchor: st-41
      quote: >-
        До занятий физической культурой допускаются обучающиеся на основании сведений, содержащихся в заключении
        медицинской организации, выданном по результатам проведенных профилактических медицинских осмотров
        обучающихся
  revision: 1
  checked: '2026-11-19'
