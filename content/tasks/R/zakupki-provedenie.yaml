- id: R-zakupki-provedenie-001
  type: sequence
  difficulty: 2
  situation: >-
    Школа провела электронный аукцион на поставку интерактивных панелей, протокол подведения итогов размещён
    в единой информационной системе (ЕИС). В извещении установлено обеспечение исполнения контракта. Победитель
    готов заключить контракт, но предупредил: если характеристики товара в проекте контракта не совпадут
    с его заявкой, он заявит о разногласиях. Так и вышло.
  question: Расположите действия школы и победителя в том порядке, который предусматривает закон.
  items:
    - Школа размещает в ЕИС и на электронной площадке проект контракта без своей подписи
    - Победитель размещает протокол разногласий к проекту контракта
    - Школа размещает новый проект контракта, учтя разногласия или указав причины отказа их учесть
    - Победитель подписывает проект контракта и размещает документ об обеспечении исполнения
    - Школа подписывает контракт и размещает его в ЕИС, с этого дня контракт заключён
  explanation: >-
    Порядок задаёт статья 51 Закона № 44-ФЗ. Не позднее двух рабочих дней после размещения протокола школа
    размещает проект контракта без своей подписи, а победитель в течение пяти рабочих дней либо подписывает его,
    либо размещает протокол разногласий. Получив протокол разногласий, школа за два рабочих дня размещает новый
    проект, учтя разногласия или объяснив, почему не учла. Затем у победителя один рабочий день, чтобы подписать
    проект и разместить обеспечение, а контракт считается заключённым в день, когда школа разместит в ЕИС
    подписанный ею контракт (не ранее десяти дней с даты размещения в ЕИС протокола подведения итогов).
  refs:
    - doc: fz-44
      anchor: st-51
      quote: >-
        формирует с использованием единой информационной системы и размещает в единой информационной системе (без
        размещения на официальном сайте) и на электронной площадке (с использованием единой информационной системы)
        без своей подписи проект контракта с учетом информации, содержащейся в протоколе разногласий
    - doc: fz-44
      anchor: st-51
      quote: >-
        Контракт считается заключенным в день размещения контракта, подписанного усиленной электронной подписью лица,
        имеющего право действовать от имени заказчика, в единой информационной системе.
  revision: 1
  checked: '2026-11-16'

- id: R-zakupki-provedenie-002
  type: single
  difficulty: 2
  situation: >-
    Совокупный годовой объём закупок школы около сорока миллионов рублей, контрактной службы в школе нет.
    Директор хочет поручить закупки заведующему хозяйством. У того среднее профессиональное образование,
    обучения в сфере закупок он не проходил.
  question: Как директору поступить? Выберите один вариант.
  options:
    - text: Назначить его контрактным управляющим сразу, требований к образованию управляющего закон не содержит
      correct: false
      why: >-
        Требование есть: контрактный управляющий должен иметь высшее образование или дополнительное
        профессиональное образование в сфере закупок.
    - text: Назначить его контрактным управляющим после того, как он получит дополнительное профессиональное образование в сфере закупок
      correct: true
      why: >-
        При объёме закупок до ста миллионов рублей и без контрактной службы заказчик назначает контрактного
        управляющего. Высшего образования у завхоза нет, значит, нужно дополнительное профессиональное
        образование в сфере закупок.
    - text: Отказаться от назначения, контрактным управляющим может быть работник с высшим образованием
      correct: false
      why: >-
        Высшее образование не единственный путь. Закон допускает и дополнительное профессиональное
        образование в сфере закупок.
    - text: Никого не назначать, при таком объёме закупок функции управляющего выполняет комиссия по закупкам
      correct: false
      why: >-
        Комиссия определяет поставщиков. Ответственного за закупки, включая исполнение контрактов,
        заказчик без контрактной службы обязан назначить отдельно.
  explanation: >-
    По части 2 статьи 38 закона о контрактной системе заказчик, у которого годовой объём закупок не превышает
    ста миллионов рублей и нет контрактной службы, назначает контрактного управляющего. Часть 6 той же статьи
    требует от него высшего образования или дополнительного профессионального образования в сфере закупок.
    Завхозу достаточно пройти такое обучение, после этого его можно назначить.
  refs:
    - doc: fz-44
      anchor: st-38
      quote: >-
        заказчик назначает должностное лицо, ответственное за осуществление закупки или нескольких закупок,
        включая исполнение каждого контракта (далее - контрактный управляющий)
    - doc: fz-44
      anchor: st-38
      quote: >-
        Работники контрактной службы, контрактный управляющий должны иметь высшее образование или дополнительное
        профессиональное образование в сфере закупок.
  revision: 1
  checked: '2026-11-19'

- id: R-zakupki-provedenie-003
  type: multiple
  difficulty: 2
  situation: >-
    Школа готовит электронный аукцион на поставку учебного оборудования. Директор подписывает приказ о создании
    комиссии по осуществлению закупок и сверяет его с законом.
  question: Какие правила о комиссии верны? Отметьте все верные варианты.
  options:
    - text: В комиссии должно быть не меньше трёх человек
      correct: true
      why: Часть 3 статьи 39 закона требует, чтобы число членов комиссии было не менее чем три человека.
    - text: Решение о создании комиссии принимают до начала проведения закупки
      correct: true
      why: Так сказано в части 2 статьи 39. Тогда же определяют состав, порядок работы и председателя.
    - text: Член комиссии на время отпуска может передать свои полномочия другому работнику школы
      correct: false
      why: >-
        Делегирование членами комиссии своих полномочий иным лицам не допускается. Заменить члена комиссии
        может заказчик своим решением.
    - text: Комиссия правомочна, если в заседании участвует не менее половины её членов
      correct: true
      why: Часть 8 статьи 39 называет порог в пятьдесят процентов общего числа членов комиссии.
    - text: Такую же комиссию создают и для закупки у единственного поставщика
      correct: false
      why: >-
        Комиссию создают для определения поставщиков, а закупку у единственного поставщика часть 1 статьи 39
        из этого правила исключает.
  explanation: >-
    Статья 39 закона о контрактной системе обязывает заказчика создать комиссию для определения поставщиков,
    кроме закупки у единственного поставщика. Решение принимают до начала закупки, в комиссии не меньше трёх
    человек, а заседание правомочно при участии не менее половины членов. Передавать свои полномочия другим
    лицам члены комиссии не вправе.
  refs:
    - doc: fz-44
      anchor: st-39
      quote: >-
        Для определения поставщиков (подрядчиков, исполнителей), за исключением осуществления закупки
        у единственного поставщика (подрядчика, исполнителя), заказчик создает комиссию по осуществлению закупок
    - doc: fz-44
      anchor: st-39
      quote: Решение о создании комиссии принимается заказчиком до начала проведения закупки.
    - doc: fz-44
      anchor: st-39
      quote: Число членов комиссии должно быть не менее чем три человека.
    - doc: fz-44
      anchor: st-39
      quote: >-
        Комиссия правомочна осуществлять свои функции, если в заседании комиссии участвует не менее чем пятьдесят
        процентов общего числа ее членов.
    - doc: fz-44
      anchor: st-39
      quote: Делегирование членами комиссии своих полномочий иным лицам не допускается.
  revision: 1
  checked: '2026-11-19'

- id: R-zakupki-provedenie-004
  type: single
  difficulty: 3
  situation: >-
    Школа проводит электронный аукцион на обслуживание вентиляции. Заявки уже поданы. Выяснилось, что один
    из пяти членов комиссии по закупкам, заместитель директора, по совместительству работает инженером
    в фирме, которая подала заявку. Сам он считает, что это не помешает ему голосовать честно.
  question: Что обязан сделать директор? Выберите один вариант.
  options:
    - text: Оставить его в комиссии, если он письменно сообщит о своей работе в этой фирме
      correct: false
      why: >-
        Сообщить заказчику о таком обстоятельстве член комиссии обязан, но остаться в комиссии после этого
        он не может.
    - text: Оставить его в комиссии, но не допускать к голосованию по заявке этой фирмы
      correct: false
      why: >-
        Закон не предусматривает частичного участия. Человек, состоящий в трудовых отношениях с организацией,
        подавшей заявку, членом комиссии быть не может.
    - text: Отклонить заявку этой фирмы, а состав комиссии оставить прежним
      correct: false
      why: >-
        Статья 39 требует заменить такого члена комиссии. Отклонения заявки по этой причине она
        не предусматривает.
    - text: Незамедлительно заменить его в комиссии другим человеком
      correct: true
      why: >-
        Тот, кто состоит в трудовых отношениях с организацией, подавшей заявку, не может быть членом комиссии.
        Заказчик обязан незамедлительно заменить его другим лицом.
  explanation: >-
    Часть 6 статьи 39 закона о контрактной системе не допускает в комиссию людей, которые состоят в трудовых
    отношениях с организациями, подавшими заявки. Работа по совместительству тоже трудовые отношения. По части 7
    заказчик, выявив такого человека в составе комиссии, обязан незамедлительно заменить его другим, кто этим
    требованиям соответствует.
  refs:
    - doc: fz-44
      anchor: st-39
      quote: >-
        либо состоящие в трудовых отношениях с организациями или физическими лицами, подавшими данные заявки
    - doc: fz-44
      anchor: st-39
      quote: >-
        заказчик, принявший решение о создании комиссии, обязан незамедлительно заменить их другими физическими
        лицами, соответствующими требованиям, предусмотренным положениями части 6 настоящей статьи
  trap:
    kind: wording
    note: >-
      В фирме он работает по совместительству, а не по основному месту. Это всё равно трудовые отношения
      с организацией, подавшей заявку.
  revision: 1
  checked: '2026-11-19'

- id: R-zakupki-provedenie-005
  type: input
  difficulty: 1
  situation: >-
    Контрактный управляющий школы планирует закупки на год и считает, какую их часть нужно провести среди
    субъектов малого предпринимательства и социально ориентированных некоммерческих организаций.
  question: >-
    Какую наименьшую долю совокупного годового объёма закупок школа обязана закупить у таких участников?
    Ответ в процентах.
  answer: 25
  unit: '%'
  explanation: >-
    Часть 1 статьи 30 закона о контрактной системе обязывает заказчиков закупать у субъектов малого
    предпринимательства и социально ориентированных некоммерческих организаций не менее двадцати пяти процентов
    совокупного годового объёма закупок. Этот объём считают с исключениями, которые перечислены в части 1.1
    той же статьи.
  refs:
    - doc: fz-44
      anchor: st-30
      quote: >-
        в объеме не менее чем двадцать пять процентов совокупного годового объема закупок, рассчитанного
        с учетом части 1.1 настоящей статьи
  revision: 1
  checked: '2026-11-19'

- id: R-zakupki-provedenie-006
  type: single
  difficulty: 2
  situation: >-
    В марте в актовом зале школы сломался проектор, новый нужен к выпускному. В плане-графике закупок такой
    позиции нет. Директор просит контрактного управляющего сегодня же разместить извещение об электронном
    запросе котировок.
  question: Как должен действовать контрактный управляющий? Выберите один вариант.
  options:
    - text: Внести закупку в план-график и разместить извещение не раньше чем через день после этого
      correct: true
      why: >-
        Закупку, которой нет в плане-графике, провести нельзя. Изменение в план-график вносят не позднее
        чем за один день до дня размещения извещения.
    - text: Разместить извещение сегодня, а план-график исправить до заключения контракта
      correct: false
      why: >-
        Порядок обратный: изменение в план-график должно появиться не позднее чем за один день до дня
        размещения извещения.
    - text: Разместить извещение сегодня, запрос котировок в план-график включать не нужно
      correct: false
      why: >-
        Правило о плане-графике исключений для запроса котировок не делает: закупки, не предусмотренные
        планом-графиком, не могут быть осуществлены.
    - text: Отложить закупку до следующего года, утверждённый план-график в течение года не меняют
      correct: false
      why: >-
        Планы-графики подлежат изменению при необходимости. Закон ограничивает только срок: не позднее
        чем за день до размещения извещения.
  explanation: >-
    По части 1 статьи 16 закона о контрактной системе закупки, не предусмотренные планами-графиками, не могут
    быть осуществлены. Часть 9 той же статьи разрешает вносить изменения в план-график не позднее чем за один
    день до дня размещения извещения о закупке. Поэтому сначала меняют план-график, а извещение размещают
    не раньше следующего дня.
  refs:
    - doc: fz-44
      anchor: st-16
      quote: Закупки, не предусмотренные планами-графиками, не могут быть осуществлены.
    - doc: fz-44
      anchor: st-16
      quote: >-
        изменений в план-график может осуществляться не позднее чем за один день до дня размещения в единой
        информационной системе извещения об осуществлении соответствующей закупки
  revision: 1
  checked: '2026-11-19'
