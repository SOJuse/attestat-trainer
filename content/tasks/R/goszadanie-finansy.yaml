- id: R-goszadanie-finansy-001
  type: single
  difficulty: 1
  situation: >-
    Школа работает как государственное бюджетное учреждение. В октябре учредитель сообщил директору,
    что до конца года субсидию на выполнение государственного задания уменьшат. Показатели самого задания
    при этом остаются прежними.
  question: Что директору нужно знать о таком уменьшении? Выберите один вариант.
  options:
    - text: Учредитель вправе уменьшить субсидию в любое время, задание при этом менять не обязательно
      correct: false
      why: >-
        Закон связывает уменьшение субсидии в течение срока выполнения задания с изменением самого задания.
        Свободы уменьшать её отдельно от задания у учредителя нет.
    - text: Уменьшить субсидию можно, если школа согласится покрыть разницу доходами от платных услуг и аренды
      correct: false
      why: >-
        Согласие школы и её доходы от платных услуг условием уменьшения не названы. Условие одно:
        соответствующее изменение задания.
    - text: Уменьшить субсидию в течение срока выполнения задания можно, если соответственно изменено само задание
      correct: true
      why: >-
        Так сказано в пункте 3 статьи 9.2 закона о некоммерческих организациях: объём субсидии уменьшают
        только при соответствующем изменении задания.
    - text: Уменьшить субсидию можно со следующего финансового года, в текущем году она не меняется
      correct: false
      why: >-
        Запрета менять субсидию до конца года нет. Её можно уменьшить и в текущем году, но вместе
        с заданием.
  explanation: >-
    По пункту 3 статьи 9.2 закона о некоммерческих организациях объём субсидии на выполнение государственного
    задания в течение срока его выполнения уменьшают только при соответствующем изменении задания. Здесь
    показатели задания остаются прежними, значит, уменьшать субсидию нельзя.
  refs:
    - doc: fz-7
      anchor: st-9-2
      quote: >-
        Уменьшение объема субсидии, предоставленной на выполнение государственного (муниципального) задания,
        в течение срока его выполнения осуществляется только при соответствующем изменении государственного
        (муниципального) задания.
  revision: 1
  checked: '2026-11-19'

- id: R-goszadanie-finansy-002
  type: single
  difficulty: 2
  situation: >-
    Школа работает как государственное бюджетное учреждение. К концу года на её счёте скопились доходы
    от платных кружков. Главный бухгалтер предлагает положить эти деньги на трёхмесячный депозит в банке,
    чтобы получить проценты и потратить их на оборудование. Федерального закона, который разрешал бы школе
    такие вклады, нет.
  question: Как должен поступить директор? Выберите один вариант.
  options:
    - text: Отказаться от депозита, бюджетной школе он запрещён
      correct: true
      why: >-
        Пункт 14 статьи 9.2 запрещает бюджетным учреждениям размещать денежные средства на депозитах
        в кредитных организациях. Исключение может сделать федеральный закон, а его нет.
    - text: Разместить деньги на депозите, ведь это доходы от платных услуг, а не субсидия
      correct: false
      why: >-
        Запрет относится к денежным средствам учреждения вообще. Источник денег, субсидия или собственные
        доходы, в норме не различается.
    - text: Разместить деньги на депозите, получив на это согласие учредителя
      correct: false
      why: >-
        Согласие учредителя запрет не снимает. Исключения из него могут устанавливать только
        федеральные законы.
    - text: Разместить деньги на депозите, если сумма не достигает размера крупной сделки
      correct: false
      why: >-
        Размер суммы значения не имеет: запрет на депозиты не связан с правилами о крупных сделках.
  explanation: >-
    Пункт 14 статьи 9.2 закона о некоммерческих организациях не разрешает бюджетным учреждениям размещать
    денежные средства на депозитах в кредитных организациях, если иное не предусмотрено федеральными
    законами. Ни источник денег, ни согласие учредителя, ни размер суммы исключением не служат. Поэтому
    директор от депозита отказывается.
  refs:
    - doc: fz-7
      anchor: st-9-2
      quote: >-
        Бюджетные учреждения не вправе размещать денежные средства на депозитах в кредитных организациях,
        а также совершать сделки с ценными бумагами, если иное не предусмотрено федеральными законами.
  trap:
    kind: wording
    note: >-
      Деньги заработаны самой школой, и кажется, что ими можно распоряжаться свободнее, чем субсидией.
      Запрет на депозиты источник денег не различает.
  revision: 1
  checked: '2026-11-19'

- id: R-goszadanie-finansy-003
  type: single
  difficulty: 2
  situation: >-
    Государственная бюджетная школа с согласия учредителя сдала в аренду спортивной секции пристройку
    со спортивным залом. Пристройка закреплена за школой учредителем. Директор готовит расчёты к следующему
    году и выясняет, как аренда скажется на финансировании.
  question: Что будет с финансовым обеспечением содержания пристройки? Выберите один вариант.
  options:
    - text: Учредитель продолжит финансировать её содержание, ведь аренда оформлена с его согласия
      correct: false
      why: >-
        Согласие учредителя нужно, чтобы сдать недвижимость в аренду. Финансировать содержание сданного
        имущества оно его не обязывает, закон говорит обратное.
    - text: Учредитель продолжит финансировать её содержание, а арендную плату школа перечислит в бюджет
      correct: false
      why: >-
        Статья 9.2 не обязывает перечислять арендную плату в бюджет, а финансирование содержания
        сданного в аренду имущества прекращает.
    - text: Учредитель уменьшит финансирование содержания пристройки на сумму полученной арендной платы
      correct: false
      why: >-
        Норма не связывает финансирование с размером арендной платы. Содержание сданного в аренду
        имущества учредитель не финансирует совсем.
    - text: Учредитель содержание пристройки финансировать не будет, пока она сдана в аренду
      correct: true
      why: >-
        При сдаче в аренду с согласия учредителя закреплённой за школой недвижимости финансовое обеспечение
        содержания такого имущества учредитель не осуществляет.
  explanation: >-
    Субсидия на выполнение задания учитывает расходы на содержание недвижимости, закреплённой за школой.
    Но пункт 6 статьи 9.2 закона о некоммерческих организациях делает исключение: если такое имущество
    с согласия учредителя сдано в аренду, его содержание учредитель не финансирует. Расходы на пристройку
    директору нужно закладывать в арендную плату или покрывать другими доходами школы.
  refs:
    - doc: fz-7
      anchor: st-9-2
      quote: >-
        В случае сдачи в аренду с согласия учредителя недвижимого имущества и особо ценного движимого
        имущества, закрепленного за бюджетным учреждением, финансовое обеспечение содержания такого имущества
        учредителем не осуществляется.
  revision: 1
  checked: '2026-11-19'

- id: R-goszadanie-finansy-004
  type: multiple
  difficulty: 2
  situation: >-
    Директор государственной бюджетной школы хочет увеличить собственные доходы школы. На совещании
    заместители предложили несколько шагов. Государственное задание школа выполняет полностью.
  question: Что из предложенного школа вправе сделать? Отметьте все верные варианты.
  options:
    - text: Сверх задания оказывать за плату услуги, которые относятся к основным видам деятельности по уставу
      correct: true
      why: >-
        Пункт 4 статьи 9.2 разрешает бюджетному учреждению сверх задания оказывать за плату услуги,
        относящиеся к его основным видам деятельности, предусмотренным уставом.
    - text: Одну и ту же платную услугу оказывать разным заказчикам на разных условиях
      correct: false
      why: >-
        Платные услуги сверх задания оказывают на одинаковых условиях, если речь об одних и тех же услугах.
    - text: Вести деятельность, которая не относится к основной, но указана в уставе и служит целям создания школы
      correct: true
      why: >-
        Иные виды деятельности допустимы, если служат целям, ради которых учреждение создано, соответствуют
        этим целям и указаны в уставе.
    - text: Своим приказом установить порядок, по которому определяется плата за такие услуги
      correct: false
      why: >-
        Порядок определения платы устанавливает орган, который осуществляет функции и полномочия
        учредителя, если федеральный закон не предусматривает иного.
    - text: Вести не указанную в уставе деятельность, если доход от неё пойдёт на уставные цели
      correct: false
      why: >-
        Направить доход на уставные цели недостаточно. Сама деятельность должна быть указана в уставе.
  explanation: >-
    Пункт 4 статьи 9.2 закона о некоммерческих организациях позволяет бюджетному учреждению сверх задания
    оказывать платные услуги по основным видам деятельности, причём на одинаковых условиях для одних и тех же
    услуг. Порядок определения платы устанавливает учредитель. Неосновную деятельность школа ведёт, только
    если она служит целям создания школы и указана в уставе.
  refs:
    - doc: fz-7
      anchor: st-9-2
      quote: >-
        для граждан и юридических лиц за плату и на одинаковых при оказании одних и тех же услуг условиях.
        Порядок определения указанной платы устанавливается соответствующим органом, осуществляющим функции
        и полномочия учредителя
    - doc: fz-7
      anchor: st-9-2
      quote: >-
        Бюджетное учреждение вправе осуществлять иные виды деятельности, не являющиеся основными видами
        деятельности, лишь постольку, поскольку это служит достижению целей, ради которых оно создано,
        и соответствующие указанным целям, при условии, что такая деятельность указана в его уставе.
  revision: 1
  checked: '2026-11-19'

- id: R-goszadanie-finansy-005
  type: multiple
  difficulty: 3
  situation: >-
    Государственная бюджетная школа получила из бюджета города целевую субсидию на ремонт кровли. Соглашение
    о субсидии называет только эту цель. Ремонт обошёлся дешевле, и на остаток директор купил мебель
    в учительскую. Проверка это выявила. Признаков преступления в действиях директора нет.
  question: Что из этого верно? Отметьте все верные варианты.
  options:
    - text: Нарушения нет, потому что мебель куплена для нужд самой школы
      correct: false
      why: >-
        Статья 15.14 КоАП говорит о целях, которые определены соглашением или иным документом
        о предоставлении средств. Польза для школы эти цели не заменяет.
    - text: Это нецелевое использование бюджетных средств, хотя деньги потрачены на школу
      correct: true
      why: >-
        Средства, полученные из бюджета, направлены на цель, которой нет в соглашении о субсидии.
        Статья 15.14 КоАП называет это нецелевым использованием.
    - text: Директору как должностному лицу грозит штраф или дисквалификация
      correct: true
      why: Для должностных лиц статья 15.14 КоАП предусматривает штраф или дисквалификацию.
    - text: Отвечать будет школа как юридическое лицо, директора к ответственности не привлекут
      correct: false
      why: >-
        Статья 15.14 КоАП называет и должностных, и юридических лиц. Ответственность школы директора
        от наказания не освобождает.
    - text: Штраф для школы рассчитают от суммы, потраченной не по назначению
      correct: true
      why: >-
        Штраф для юридических лиц установлен в процентах от суммы бюджетных средств, использованных
        не по целевому назначению.
  explanation: >-
    Статья 15.14 КоАП признаёт нецелевым использованием направление средств, полученных из бюджета, на цели,
    не соответствующие тем, что определены соглашением или иным документом о предоставлении этих средств.
    Соглашение называет только ремонт кровли, поэтому покупка мебели на остаток подпадает под эту статью,
    хотя мебель нужна школе. Наказывают и должностное лицо (штраф или дисквалификация), и юридическое лицо:
    его штраф считают в процентах от суммы, использованной не по назначению.
  refs:
    - doc: koap-rf
      anchor: st-15-14
      quote: >-
        или в направлении средств, полученных из бюджета бюджетной системы Российской Федерации, на цели,
        не соответствующие целям, определенным договором (соглашением) либо иным документом, являющимся
        правовым основанием предоставления указанных средств
    - doc: koap-rf
      anchor: st-15-14
      quote: >-
        влечет наложение административного штрафа на должностных лиц в размере от двадцати тысяч до пятидесяти
        тысяч рублей или дисквалификацию на срок от одного года до трех лет
    - doc: koap-rf
      anchor: st-15-14
      quote: >-
        на юридических лиц - от 5 до 25 процентов суммы средств, полученных из бюджета бюджетной системы
        Российской Федерации, использованных не по целевому назначению
  trap:
    kind: wording
    note: >-
      Мебель куплена для школы, и это выглядит как разумная экономия. Но цель субсидии определяет
      соглашение, а в нём назван только ремонт кровли.
  revision: 1
  checked: '2026-11-19'

- id: R-goszadanie-finansy-006
  type: matching
  difficulty: 3
  situation: >-
    Директор читает лекцию для резерва руководителей о том, чем учреждения разных типов отвечают по своим
    долгам перед поставщиками. Слушатели просят свести правила Гражданского кодекса в короткую таблицу.
  question: Сопоставьте тип учреждения и правило о том, чем оно отвечает по своим обязательствам.
  pairs:
    - left: Казённое учреждение
      right: Отвечает деньгами, которые есть в его распоряжении, а если их не хватит, отвечает собственник имущества
    - left: Бюджетное учреждение
      right: Отвечает имуществом, кроме особо ценного от собственника и любой недвижимости, на какие бы средства её ни купили
    - left: Автономное учреждение
      right: Отвечает имуществом, в том числе недвижимостью, если она куплена на собственные доходы
  explanation: >-
    Статья 123.22 Гражданского кодекса разводит три типа учреждений. Казённое отвечает денежными средствами,
    а при их недостаточности субсидиарно отвечает собственник. Бюджетное отвечает всем имуществом, кроме
    особо ценного движимого, полученного от собственника или купленного на его средства, и кроме недвижимости
    независимо от источника. У автономного из-под взыскания выведены только недвижимость и особо ценное
    имущество, закреплённые собственником или купленные на выделенные им средства.
  refs:
    - doc: gk-rf
      anchor: st-123-22
      quote: >-
        Казенное учреждение отвечает по своим обязательствам находящимися в его распоряжении денежными
        средствами. При недостаточности денежных средств субсидиарную ответственность по обязательствам
        казенного учреждения несет собственник его имущества.
    - doc: gk-rf
      anchor: st-123-22
      quote: >-
        а также недвижимого имущества независимо от того, по каким основаниям оно поступило в оперативное
        управление бюджетного учреждения и за счет каких средств оно приобретено
    - doc: gk-rf
      anchor: st-123-22
      quote: >-
        за исключением недвижимого имущества и особо ценного движимого имущества, закрепленных за автономным
        учреждением собственником этого имущества или приобретенных автономным учреждением за счет средств,
        выделенных собственником его имущества
  revision: 1
  checked: '2026-11-19'
