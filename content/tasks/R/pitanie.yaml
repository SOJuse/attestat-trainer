- id: R-pitanie-001
  type: single
  difficulty: 1
  situation: >-
    Исполнитель по контракту на питание предлагает государственной школе новый бесплатный завтрак для учеников
    1–4 классов: бутерброд с сыром, творожный сырок и горячий чай. Другого бесплатного питания в этот день
    у начальных классов нет.
  question: Отвечает ли такой завтрак требованию закона о бесплатном горячем питании? Выберите один вариант.
  options:
    - text: Отвечает, горячий чай делает питание горячим
      correct: false
      why: >-
        Закон требует горячего блюда и прямо оговаривает, что горячий напиток в счёт не идёт.
    - text: Отвечает, если с таким завтраком согласится большинство родителей
      correct: false
      why: Согласие родителей требование закона к составу бесплатного горячего питания не меняет.
    - text: Не отвечает, в бесплатном питании должно быть горячее блюдо, а чай им не считается
      correct: true
      why: >-
        Бесплатное горячее питание начальных классов предусматривает наличие горячего блюда, не считая
        горячего напитка. В предложенном завтраке горячий только чай.
    - text: Не отвечает, бесплатно кормить начальные классы нужно не меньше двух раз в учебный день
      correct: false
      why: Закон требует бесплатного горячего питания не менее одного раза в день, а не двух.
  explanation: >-
    По части 2.1 статьи 37 закона об образовании учеников начальных классов государственных и муниципальных
    школ не менее одного раза в день обеспечивают бесплатным горячим питанием, в котором есть горячее блюдо,
    не считая горячего напитка. В предложенном завтраке горячего блюда нет, поэтому требование не выполнено.
  refs:
    - doc: fz-273
      anchor: st-37
      quote: >-
        не менее одного раза в день бесплатным горячим питанием, предусматривающим наличие горячего блюда,
        не считая горячего напитка
  revision: 1
  checked: '2026-11-19'

- id: R-pitanie-002
  type: multiple
  difficulty: 2
  situation: >-
    Питание в государственной школе по контракту ведёт комбинат питания. На родительском собрании директора
    спрашивают, кто по закону за что отвечает в школьном питании.
  question: Какие ответы директора будут верными? Отметьте все верные варианты.
  options:
    - text: Организация питания учеников возложена на школу
      correct: true
      why: >-
        Часть 1 статьи 37 закона об образовании возлагает организацию питания обучающихся на организации,
        осуществляющие образовательную деятельность.
    - text: Раз питание ведёт комбинат, организация питания по закону возложена на него, а не на школу
      correct: false
      why: >-
        Контракт с исполнителем обязанность со школы не снимает: закон возлагает организацию питания
        на образовательную организацию.
    - text: Расписание занятий должно давать перерыв, которого хватает для питания
      correct: true
      why: Расписание занятий должно предусматривать перерыв достаточной продолжительности для питания обучающихся.
    - text: Бесплатным горячим питанием учеников начальных классов обеспечивает учредитель школы
      correct: true
      why: >-
        По части 2.1 статьи 37 обучающиеся по программам начального общего образования обеспечиваются
        бесплатным горячим питанием учредителями государственных и муниципальных школ.
    - text: Бесплатное горячее питание статья 37 гарантирует ученикам всех классов, с первого по одиннадцатый
      correct: false
      why: >-
        Статья 37 гарантирует бесплатное горячее питание обучающимся по программам начального общего
        образования. Для остальных случаи и порядок устанавливают власти региона.
  explanation: >-
    Статья 37 закона об образовании возлагает организацию питания на саму школу и требует, чтобы в расписании
    был достаточный перерыв для еды. Бесплатное горячее питание она гарантирует ученикам начальных классов,
    и обеспечивает его учредитель. Питание остальных за счёт бюджета региона идёт в случаях и в порядке,
    которые установили органы власти субъекта.
  refs:
    - doc: fz-273
      anchor: st-37
      quote: >-
        Организация питания обучающихся возлагается на организации, осуществляющие образовательную деятельность.
    - doc: fz-273
      anchor: st-37
      quote: >-
        Расписание занятий должно предусматривать перерыв достаточной продолжительности для питания обучающихся.
    - doc: fz-273
      anchor: st-37
      quote: >-
        Обучающиеся по образовательным программам начального общего образования в государственных и муниципальных
        образовательных организациях обеспечиваются учредителями таких организаций
    - doc: fz-273
      anchor: st-37
      quote: >-
        осуществляется в случаях и в порядке, которые установлены органами государственной власти субъектов
        Российской Федерации
  revision: 1
  checked: '2026-11-19'

- id: R-pitanie-003
  type: single
  difficulty: 2
  situation: >-
    Школа заключила контракт на услуги питания, в него включены типовые условия, утверждённые Правительством.
    Исполнитель разработал одно общее меню основного питания для всех учеников с 1 по 11 класс, сам его
    утвердил и прислал директору для сведения.
  question: Что в действиях исполнителя не соответствует типовым условиям контракта? Выберите один вариант.
  options:
    - text: Ничего, меню основного питания исполнитель разрабатывает и утверждает сам
      correct: false
      why: >-
        Разрабатывает меню действительно исполнитель, но утверждает он его по согласованию с заказчиком
        и для каждой возрастной группы детей.
    - text: Меню должна была разработать и утвердить школа, а исполнитель только готовит по нему
      correct: false
      why: Типовые условия относят разработку и утверждение меню к обязанностям исполнителя.
    - text: Меню должен был утвердить учредитель школы
      correct: false
      why: Учредителя типовые условия здесь не называют. Меню утверждает исполнитель по согласованию с заказчиком.
    - text: Меню утверждают по согласованию со школой и для каждой возрастной группы детей
      correct: true
      why: >-
        Исполнитель обязан по согласованию с заказчиком утверждать меню основного питания для каждой
        возрастной группы детей. Он не согласовал меню и сделал его общим.
  explanation: >-
    Пункт 4 типовых условий контрактов на услуги питания обязывает исполнителя разрабатывать меню основного
    питания и утверждать его по согласованию с заказчиком для каждой возрастной группы детей. Исполнитель
    нарушил это дважды: не согласовал меню со школой и сделал одно меню на все возрасты.
  refs:
    - doc: pp-rf-498
      anchor: pril-1-p-4
      quote: >-
        по согласованию с заказчиком утверждать для каждой возрастной группы детей меню основного
        (организованного) питания
  revision: 1
  checked: '2026-11-19'

- id: R-pitanie-004
  type: single
  difficulty: 2
  situation: >-
    В школе учатся трое детей, которым по медицинским показаниям нужно диетическое питание. Родители домашнюю
    еду в школу не приносят и просят кормить детей в столовой. Питание по контракту с типовыми условиями
    ведёт комбинат питания.
  question: Как должно появиться меню для этих детей? Выберите один вариант.
  options:
    - text: Индивидуальное меню разрабатывает диетолог, утверждает его комбинат по согласованию со школой
      correct: true
      why: >-
        Исполнитель обязан утверждать по согласованию с заказчиком индивидуальное меню, разработанное
        специалистом-диетологом, если среди учеников есть дети, которым нужно лечебное и диетическое питание.
    - text: Индивидуальное меню составляют родители вместе с лечащим врачом, комбинат обязан готовить по нему
      correct: false
      why: >-
        Типовые условия называют разработчиком специалиста-диетолога. Родители упомянуты только там,
        где дети едят принесённые из дома блюда.
    - text: Индивидуальное меню разрабатывает и утверждает школьная медицинская сестра
      correct: false
      why: Меню разрабатывает специалист-диетолог, а утверждает исполнитель по согласованию с заказчиком.
    - text: Отдельное меню не нужно, такие дети едят в школе домашние блюда от родителей
      correct: false
      why: >-
        Домашние блюда от родителей названы как исключение. Здесь родители еду не приносят, значит,
        индивидуальное меню обязательно.
  explanation: >-
    Пункт 6 типовых условий контрактов на услуги питания обязывает исполнителя утверждать по согласованию
    с заказчиком индивидуальное меню для детей, которым нужно лечебное и диетическое питание. Разрабатывает
    такое меню специалист-диетолог. Исключение сделано для случая, когда дети едят готовые домашние блюда,
    предоставленные родителями, но здесь его нет.
  refs:
    - doc: pp-rf-498
      anchor: pril-1-p-6
      quote: >-
        Утверждать по согласованию с заказчиком разработанное специалистом-диетологом индивидуальное меню
        для детей, нуждающихся в лечебном и диетическом питании
    - doc: pp-rf-498
      anchor: pril-1-p-6
      quote: >-
        осуществляется употребление готовых домашних блюд, предоставленных родителями
  revision: 1
  checked: '2026-11-19'

- id: R-pitanie-005
  type: input
  difficulty: 1
  situation: >-
    Проверка нашла в столовой школы нарушения санитарно-эпидемиологических требований к организации питания.
    Столовую школа ведёт сама. Дело по статье 6.6 КоАП возбуждено против школы как юридического лица, и директор
    выясняет, на какой срок суд может приостановить работу столовой.
  question: >-
    На какой наибольший срок статья 6.6 КоАП позволяет приостановить деятельность юридического лица?
    Ответ в сутках.
  answer: 90
  unit: суток
  explanation: >-
    За нарушение санитарно-эпидемиологических требований к организации питания статья 6.6 КоАП предусматривает
    для юридических лиц штраф или административное приостановление деятельности на срок до девяноста суток.
  refs:
    - doc: koap-rf
      anchor: st-6-6
      quote: >-
        на юридических лиц - от тридцати тысяч до пятидесяти тысяч рублей или административное приостановление
        деятельности на срок до девяноста суток
  revision: 1
  checked: '2026-11-19'
