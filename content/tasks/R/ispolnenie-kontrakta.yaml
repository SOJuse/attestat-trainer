- id: R-ispolnenie-kontrakta-001
  type: input
  difficulty: 3
  situation: >-
    Школа по итогам электронного аукциона заключает контракт на ремонт кровли. Приёмку будут оформлять документом
    о приёмке в единой информационной системе. Финансовый орган сообщил, что расчёты по этому контракту по закону
    подлежат казначейскому сопровождению. Контрактный управляющий готовит проект контракта и спрашивает директора,
    какой срок оплаты в него вписать.
  question: >-
    Какой наибольший срок оплаты может предусмотреть такой контракт, если считать с даты подписания школой
    документа о приёмке? Ответ дайте числом в рабочих днях.
  answer: 10
  unit: рабочих дней
  explanation: >-
    Часть 13.1 статьи 34 Закона № 44-ФЗ ограничивает срок оплаты по контракту, заключённому по итогам определения
    поставщика: по общему правилу не более семи рабочих дней с даты подписания заказчиком документа о приёмке.
    Если расчёты по контракту подлежат казначейскому сопровождению, действует исключение: срок оплаты не более
    десяти рабочих дней. Приёмка в ЕИС ответ не меняет, она лишь исключает другое основание для десяти дней.
  refs:
    - doc: fz-44
      anchor: st-34
      quote: >-
        в соответствии с законодательством Российской Федерации расчеты по контракту или расчеты по контракту в части
        выплаты аванса подлежат казначейскому сопровождению, при этом срок оплаты должен составлять не более десяти
        рабочих дней с даты подписания документа о приемке
    - doc: fz-44
      anchor: st-34
      quote: а с 1 мая 2022 года не более семи рабочих дней с даты подписания заказчиком документа о приемке
  trap:
    kind: wording
    note: >-
      Общий срок оплаты в семь рабочих дней известен всем, а условие о казначейском сопровождении легко пропустить.
      Оно и меняет ответ на десять.
  revision: 1
  checked: '2026-11-16'

- id: R-ispolnenie-kontrakta-002
  type: single
  difficulty: 2
  situation: >-
    По контракту подрядчик должен был отремонтировать спортивный зал к 20 августа. Школа обязалась освободить
    зал и передать его подрядчику 1 июля, но передала 20 июля. Подрядчик закончил работы 5 сентября. Школа
    направила ему требование об уплате пени за просрочку.
  question: Должен ли подрядчик платить пеню? Выберите один вариант.
  options:
    - text: Должен, срок окончания работ в контракте не менялся, значит, просрочка есть
      correct: false
      why: >-
        Просрочка сама по себе не решает дело. Закон освобождает сторону от неустойки, если она докажет,
        что нарушение произошло по вине другой стороны.
    - text: Не должен, если докажет, что просрочка произошла по вине школы
      correct: true
      why: >-
        Сторона освобождается от уплаты неустойки, если докажет, что неисполнение обязательства произошло
        вследствие непреодолимой силы или по вине другой стороны.
    - text: Должен, от пени освобождает лишь непреодолимая сила, а её здесь не было
      correct: false
      why: >-
        Непреодолимая сила не единственное основание. Вторым закон называет вину другой стороны контракта.
    - text: Не должен, пеню с подрядчика взыскивают, когда контракт расторгнут
      correct: false
      why: >-
        Пеня начисляется за каждый день просрочки и с расторжением контракта не связана. Освободить от неё
        может вина школы, а не то, что контракт действует.
  explanation: >-
    По части 9 статьи 34 закона о контрактной системе сторона освобождается от уплаты неустойки, если докажет,
    что обязательство не исполнено вследствие непреодолимой силы или по вине другой стороны. Школа на 19 дней
    задержала передачу зала. Если подрядчик докажет, что опоздал из-за этого, пеню он не платит.
  refs:
    - doc: fz-44
      anchor: st-34
      quote: >-
        Сторона освобождается от уплаты неустойки (штрафа, пени), если докажет, что неисполнение или
        ненадлежащее исполнение обязательства, предусмотренного контрактом, произошло вследствие непреодолимой
        силы или по вине другой стороны.
  revision: 1
  checked: '2026-11-19'

- id: R-ispolnenie-kontrakta-003
  type: single
  difficulty: 3
  situation: >-
    Поставщик в срок привёз школе только половину компьютеров. Контракт разрешает школе односторонний отказ,
    и директор принял такое решение, экспертизу при этом не проводили. Через шесть дней после того, как
    поставщик был надлежаще уведомлён о решении, он привёз остальные компьютеры. Раньше условий контракта
    он не нарушал.
  question: Как школа должна поступить со своим решением об одностороннем отказе? Выберите один вариант.
  options:
    - text: Школа вправе отменить решение, но может и оставить его в силе
      correct: false
      why: >-
        Закон говорит «обязан отменить», а не «вправе». Выбора у заказчика нет, если нарушение устранено
        в десятидневный срок и оно не повторное.
    - text: Школа обязана отменить решение, потому что оно ещё не вступило в силу, а нарушение устранено
      correct: true
      why: >-
        Решение вступает в силу через десять дней с даты надлежащего уведомления. Если за это время нарушение
        устранено, заказчик обязан отменить не вступившее в силу решение.
    - text: Отменять нечего, контракт расторгнут с даты, когда директор принял решение
      correct: false
      why: >-
        Контракт считается расторгнутым через десять дней с даты надлежащего уведомления поставщика,
        а не с даты решения.
    - text: Школа отменяет решение, если поставщик дополнительно уплатит штраф
      correct: false
      why: >-
        Условием отмены закон называет устранение нарушения и компенсацию затрат на экспертизу, если она
        проводилась. Уплаты штрафа среди условий нет.
  explanation: >-
    По части 13 статьи 95 закона о контрактной системе решение заказчика об одностороннем отказе вступает
    в силу через десять дней с даты надлежащего уведомления поставщика. Часть 14 обязывает заказчика отменить
    не вступившее в силу решение, если за эти десять дней нарушение устранено и компенсированы затраты
    на экспертизу. Поставщик устранил нарушение на шестой день, экспертизы не было, нарушение у него первое,
    поэтому школа решение отменяет.
  refs:
    - doc: fz-44
      anchor: st-95
      quote: >-
        Решение заказчика об одностороннем отказе от исполнения контракта вступает в силу и контракт считается
        расторгнутым через десять дней с даты надлежащего уведомления заказчиком поставщика (подрядчика,
        исполнителя) об одностороннем отказе от исполнения контракта.
    - doc: fz-44
      anchor: st-95
      quote: >-
        Заказчик обязан отменить не вступившее в силу решение об одностороннем отказе от исполнения контракта,
        если в течение десятидневного срока с даты надлежащего уведомления поставщика (подрядчика, исполнителя)
        о принятом решении
  trap:
    kind: wording
    note: >-
      Отменить решение школа не «вправе», а «обязана», если нарушение устранено в десятидневный срок
      и оно у поставщика не повторное.
  revision: 1
  checked: '2026-11-19'

- id: R-ispolnenie-kontrakta-004
  type: multiple
  difficulty: 2
  situation: >-
    Школа принимает партию учебной мебели по контракту. Директор и контрактный управляющий обсуждают,
    как организовать приёмку.
  question: Что из этого верно? Отметьте все верные варианты.
  options:
    - text: Школа обязана провести экспертизу поставленной мебели
      correct: true
      why: >-
        Для проверки результатов на соответствие условиям контракта заказчик обязан провести экспертизу.
    - text: Экспертизу школа может провести своими силами, без внешних экспертов
      correct: true
      why: >-
        Экспертиза может проводиться заказчиком своими силами. Привлечение экспертов и экспертных
        организаций названо как возможность.
    - text: Приёмочную комиссию школа обязана создать для каждой приёмки
      correct: false
      why: Приёмочная комиссия может создаваться по решению заказчика. Обязанности создавать её закон не вводит.
    - text: Если школа создаёт приёмочную комиссию, в ней должно быть не меньше пяти человек
      correct: true
      why: Приёмочная комиссия состоит не менее чем из пяти человек.
    - text: Экспертиза нужна, если у школы есть претензии к качеству мебели, без претензий её не проводят
      correct: false
      why: >-
        Обязанность провести экспертизу не зависит от претензий: она нужна для проверки любых результатов
        на соответствие условиям контракта.
  explanation: >-
    Часть 3 статьи 94 закона о контрактной системе обязывает заказчика провести экспертизу результатов
    контракта и разрешает сделать это своими силами. Приёмочная комиссия по части 6 создаётся по решению
    заказчика, то есть не обязательна. Но если её создали, в ней не меньше пяти человек.
  refs:
    - doc: fz-44
      anchor: st-94
      quote: >-
        Для проверки предоставленных поставщиком (подрядчиком, исполнителем) результатов, предусмотренных
        контрактом, в части их соответствия условиям контракта заказчик обязан провести экспертизу.
    - doc: fz-44
      anchor: st-94
      quote: >-
        Экспертиза результатов, предусмотренных контрактом, может проводиться заказчиком своими силами
        или к ее проведению могут привлекаться эксперты, экспертные организации
    - doc: fz-44
      anchor: st-94
      quote: >-
        может создаваться приемочная комиссия, которая состоит не менее чем из пяти человек
  revision: 1
  checked: '2026-11-19'

- id: R-ispolnenie-kontrakta-005
  type: single
  difficulty: 2
  situation: >-
    Подрядчик по контракту на ремонт крыльца третий месяц не приступает к работам. Директор хочет принять
    решение об одностороннем отказе от исполнения контракта. Юрист проверил текст: условия о праве сторон
    на односторонний отказ в контракте нет. Подрядчик расторгать контракт добровольно не согласен.
  question: Как школа может расторгнуть контракт? Выберите один вариант.
  options:
    - text: Принять решение об одностороннем отказе, существенное нарушение даёт на это право и без условия в контракте
      correct: false
      why: >-
        Закон о контрактной системе разрешает заказчику односторонний отказ по основаниям Гражданского кодекса
        при условии, что это было предусмотрено контрактом.
    - text: Обратиться в суд, односторонний отказ школе недоступен, потому что не предусмотрен контрактом
      correct: true
      why: >-
        Контракт расторгают по соглашению сторон, по решению суда или односторонним отказом. Отказ контрактом
        не предусмотрен, соглашения нет, остаётся суд.
    - text: Принять решение об одностороннем отказе после согласования с учредителем
      correct: false
      why: >-
        Согласование учредителя условие контракта не заменяет. Право заказчика на односторонний отказ
        должно быть предусмотрено самим контрактом.
    - text: Считать контракт прекращённым, раз подрядчик три месяца не приступает к работам
      correct: false
      why: >-
        Сам собой контракт не прекращается. Закон называет три пути расторжения: соглашение сторон, решение
        суда и односторонний отказ.
  explanation: >-
    По части 8 статьи 95 закона о контрактной системе контракт расторгают по соглашению сторон, по решению суда
    или в случае одностороннего отказа стороны. Часть 9 разрешает заказчику односторонний отказ по основаниям
    Гражданского кодекса, если это было предусмотрено контрактом. Такого условия в контракте нет, подрядчик
    на расторжение не согласен, поэтому школе нужно идти в суд.
  refs:
    - doc: fz-44
      anchor: st-95
      quote: >-
        Расторжение контракта допускается по соглашению сторон, по решению суда, в случае одностороннего отказа
        стороны контракта от исполнения контракта в соответствии с гражданским законодательством.
    - doc: fz-44
      anchor: st-95
      quote: >-
        по основаниям, предусмотренным Гражданским кодексом Российской Федерации для одностороннего отказа
        от исполнения отдельных видов обязательств, при условии, если это было предусмотрено контрактом
  revision: 1
  checked: '2026-11-19'

- id: R-ispolnenie-kontrakta-006
  type: matching
  difficulty: 3
  situation: >-
    Контрактный управляющий готовит для директора памятку о неустойке по контрактам школы. Все контракты
    дешевле трёх миллионов рублей и заключены на общих условиях, особых правил о штрафах к ним не применяют.
  question: Сопоставьте нарушение и то, как закон определяет неустойку за него.
  pairs:
    - left: Поставщик привёз парты на девять дней позже срока
      right: Пеня за каждый день от цены контракта за вычетом того, что уже исполнено
    - left: Школа оплатила принятые парты на двадцать дней позже срока
      right: Пеня за каждый день от суммы, которая не уплачена в срок
    - left: Поставщик привёз парты вовремя, но ненадлежащего качества
      right: Штраф в процентах от цены контракта
    - left: Школа платит вовремя, но не выполнила другое своё обязательство по контракту
      right: Штраф в твёрдой сумме, названной в рублях
  explanation: >-
    За просрочку закон о контрактной системе назначает пеню, за остальные нарушения штраф. Пеню поставщика
    считают от цены контракта, уменьшенной на сумму фактически исполненного, а пеню заказчика от не уплаченной
    в срок суммы (части 5 и 7 статьи 34). Штраф поставщику за нарушение, не связанное с просрочкой, Правила
    определяют в процентах от цены контракта, а штраф заказчику в твёрдой сумме.
  refs:
    - doc: fz-44
      anchor: st-34
      quote: >-
        от цены контракта (отдельного этапа исполнения контракта), уменьшенной на сумму, пропорциональную объему
        обязательств, предусмотренных контрактом (соответствующим отдельным этапом исполнения контракта)
        и фактически исполненных поставщиком (подрядчиком, исполнителем)
    - doc: fz-44
      anchor: st-34
      quote: >-
        Такая пеня устанавливается контрактом в размере одной трехсотой действующей на дату уплаты пеней ключевой
        ставки Центрального банка Российской Федерации от не уплаченной в срок суммы.
    - doc: pp-rf-1042
      anchor: pril-1-p-3
      quote: >-
        а) 10 процентов цены контракта (этапа) в случае, если цена контракта (этапа) не превышает 3 млн. рублей;
    - doc: pp-rf-1042
      anchor: pril-1-p-9
      quote: >-
        а) 1000 рублей, если цена контракта не превышает 3 млн. рублей (включительно);
  revision: 1
  checked: '2026-11-19'
