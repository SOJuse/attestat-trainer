- id: R-platnye-uslugi-001
  type: single
  difficulty: 1
  situation: >-
    В сентябре школа заключила с родителями договоры на платный курс «Подготовка к школе» на весь учебный год.
    В январе выросли зарплаты педагогов, и главный бухгалтер предлагает поднять цену курса на 15 % по всем
    действующим договорам, чтобы покрыть эти расходы.
  question: Что директору ответить бухгалтеру? Выберите один вариант.
  options:
    - text: Поднять цену на 15 % можно, если известить родителей за месяц
      correct: false
      why: >-
        Извещение не снимает запрета. После заключения договора стоимость поднимать нельзя, кроме поправки на инфляцию.
    - text: Поднять цену на 15 % можно, если родители подпишут допсоглашение
      correct: false
      why: >-
        Правила не делают исключения для согласия заказчика, запрет на увеличение стоимости действует и при допсоглашении.
    - text: Поднять цену можно только с учётом инфляции, заложенной в федеральном бюджете
      correct: true
      why: >-
        Это единственное исключение из запрета: уровень инфляции, предусмотренный основными характеристиками
        федерального бюджета.
    - text: Поднять цену можно только на рост зарплат, подтверждённый расчётом
      correct: false
      why: >-
        Рост расходов школы не входит в исключение. Норма связывает допустимое повышение только с инфляцией
        из основных характеристик федерального бюджета.
    - text: Менять цену по заключённому договору нельзя ни в какую сторону
      correct: false
      why: >-
        Правила допускают и повышение с учётом инфляции, и снижение стоимости, если школа покроет разницу
        собственными средствами.
  explanation: >-
    Пункт 9 Правил оказания платных образовательных услуг запрещает увеличивать стоимость услуг после заключения
    договора. Исключение одно: увеличение с учётом уровня инфляции, предусмотренного основными характеристиками
    федерального бюджета. Рост зарплат педагогов таким основанием не служит, поэтому поднять цену на 15 % нельзя
    ни приказом, ни по допсоглашению. Снизить цену школа вправе, если покроет недостающую стоимость собственными
    средствами (пункт 8).
  refs:
    - doc: pp-rf-1441
      anchor: pril-1-p-9
      quote: >-
        Увеличение стоимости платных образовательных услуг после заключения договора не допускается, за исключением
        увеличения стоимости указанных услуг с учетом уровня инфляции, предусмотренного основными характеристиками
        федерального бюджета
    - doc: pp-rf-1441
      anchor: pril-1-p-8
      quote: >-
        Исполнитель вправе снизить стоимость платных образовательных услуг по договору с учетом покрытия недостающей
        стоимости платных образовательных услуг за счет собственных средств исполнителя
  revision: 1
  checked: '2026-11-16'
