- id: R-platnye-uslugi-001
  type: single
  difficulty: 1
  situation: >-
    В сентябре школа заключила с родителями договоры на платный курс «Подготовка к школе» на весь учебный год.
    В январе выросли зарплаты педагогов, и главный бухгалтер предлагает поднять цену курса на 15 % по всем
    действующим договорам, чтобы покрыть эти расходы.
  question: Что директору ответить бухгалтеру? Выберите один вариант.
  options:
    - text: Поднять цену на 15 % можно, если известить родителей за месяц
      correct: false
      why: >-
        Извещение не снимает запрета. После заключения договора стоимость поднимать нельзя, кроме поправки на инфляцию.
    - text: Поднять цену на 15 % можно, если родители подпишут допсоглашение
      correct: false
      why: >-
        Правила не делают исключения для согласия заказчика, запрет на увеличение стоимости действует и при допсоглашении.
    - text: Поднять цену можно только с учётом инфляции, заложенной в федеральном бюджете
      correct: true
      why: >-
        Это единственное исключение из запрета: уровень инфляции, предусмотренный основными характеристиками
        федерального бюджета.
    - text: Поднять цену можно только на рост зарплат, подтверждённый расчётом
      correct: false
      why: >-
        Рост расходов школы не входит в исключение. Норма связывает допустимое повышение только с инфляцией
        из основных характеристик федерального бюджета.
    - text: Менять цену по заключённому договору нельзя ни в какую сторону
      correct: false
      why: >-
        Правила допускают и повышение с учётом инфляции, и снижение стоимости, если школа покроет разницу
        собственными средствами.
  explanation: >-
    Пункт 9 Правил оказания платных образовательных услуг запрещает увеличивать стоимость услуг после заключения
    договора. Исключение одно: увеличение с учётом уровня инфляции, предусмотренного основными характеристиками
    федерального бюджета. Рост зарплат педагогов таким основанием не служит, поэтому поднять цену на 15 % нельзя
    ни приказом, ни по допсоглашению. Снизить цену школа вправе, если покроет недостающую стоимость собственными
    средствами (пункт 8).
  refs:
    - doc: pp-rf-1441
      anchor: pril-1-p-9
      quote: >-
        Увеличение стоимости платных образовательных услуг после заключения договора не допускается, за исключением
        увеличения стоимости указанных услуг с учетом уровня инфляции, предусмотренного основными характеристиками
        федерального бюджета
    - doc: pp-rf-1441
      anchor: pril-1-p-8
      quote: >-
        Исполнитель вправе снизить стоимость платных образовательных услуг по договору с учетом покрытия недостающей
        стоимости платных образовательных услуг за счет собственных средств исполнителя
  revision: 1
  checked: '2026-11-16'

- id: R-platnye-uslugi-002
  type: single
  difficulty: 2
  situation: >-
    В государственной школе второй иностранный язык входит в учебный план 7 класса и финансируется
    по государственному заданию. С сентября учителю не хватало часов, и эти уроки вели как платный курс:
    родители по договорам внесли в кассу школы плату за первую четверть. Новый директор обнаружил это в ноябре.
  question: Что директор обязан сделать с полученными деньгами? Выберите один вариант.
  options:
    - text: Вернуть деньги родителям, которые оплатили эти уроки
      correct: true
      why: >-
        Платные услуги нельзя оказывать вместо деятельности, которая финансируется из бюджета. Средства,
        полученные за такие услуги, возвращают тем, кто их оплатил.
    - text: Оставить деньги школе, если родители подписали договоры добровольно
      correct: false
      why: >-
        Добровольность договора запрет не снимает. Закон требует вернуть средства оплатившим лицам
        и исключения для согласия родителей не делает.
    - text: Перечислить деньги в бюджет города, из которого финансируется задание
      correct: false
      why: 'Закон называет получателя прямо: средства возвращают лицам, оплатившим услуги, а не бюджету.'
    - text: Зачесть деньги в счёт других платных курсов, которые посещают эти дети
      correct: false
      why: >-
        Зачёта закон не предусматривает. Средства должны быть возвращены тем, кто их внёс.
  explanation: >-
    Часть 2 статьи 101 закона об образовании запрещает оказывать платные образовательные услуги вместо
    образовательной деятельности, которая финансируется из бюджета. Уроки второго языка входят в учебный план
    и оплачены государственным заданием, брать за них плату было нельзя. Та же норма определяет судьбу денег:
    их возвращают лицам, оплатившим услуги.
  refs:
    - doc: fz-273
      anchor: st-101
      quote: >-
        Средства, полученные организациями, осуществляющими образовательную деятельность, при оказании таких
        платных образовательных услуг, возвращаются оплатившим эти услуги лицам.
    - doc: pp-rf-1441
      anchor: pril-1-p-3
      quote: >-
        Платные образовательные услуги не могут быть оказаны вместо образовательной деятельности, финансовое
        обеспечение которой осуществляется за счет бюджетных ассигнований федерального бюджета, бюджетов
        субъектов Российской Федерации, местных бюджетов.
  revision: 1
  checked: '2026-11-19'

- id: R-platnye-uslugi-003
  type: multiple
  difficulty: 2
  situation: >-
    По договору школа должна была провести 30 занятий платного курса по робототехнике. Из-за болезни педагога
    провели 24, учебный год закончился. Недостаток несущественный. Отец ученика пришёл к директору с претензией
    и спрашивает, чего он вправе требовать.
  question: Что из этого верно? Отметьте все верные варианты.
  options:
    - text: Он вправе потребовать провести недостающие занятия бесплатно
      correct: true
      why: Безвозмездное оказание образовательных услуг названо первым среди требований заказчика при недостатке услуг.
    - text: Он вправе потребовать соразмерно уменьшить стоимость оказанных услуг
      correct: true
      why: Соразмерное уменьшение стоимости оказанных услуг прямо названо в пункте 18 Правил.
    - text: Каким способом ответить на претензию, выбирает школа как исполнитель
      correct: false
      why: >-
        Выбор принадлежит заказчику: пункт 18 Правил говорит, что он вправе потребовать по своему выбору.
    - text: Он вправе потребовать возместить его расходы на то, чтобы устранить недостаток с помощью третьих лиц
      correct: true
      why: >-
        Возмещение расходов на устранение недостатков своими силами или третьими лицами названо
        в подпункте «в» пункта 18 Правил.
    - text: Требования он может предъявить, если недостаток окажется существенным
      correct: false
      why: >-
        Пункт 18 Правил говорит о любом недостатке услуг, в том числе об оказании их не в полном объёме.
        Существенным недостаток для этого быть не должен.
  explanation: >-
    Оказание услуг не в полном объёме считается недостатком платных образовательных услуг. По пункту 18 Правил
    заказчик при обнаружении недостатка вправе по своему выбору потребовать безвозмездного оказания услуг,
    соразмерного уменьшения стоимости или возмещения своих расходов на устранение недостатков. Выбирает
    заказчик, а не школа, и существенность недостатка для этих требований не нужна.
  refs:
    - doc: pp-rf-1441
      anchor: pril-1-p-18
      quote: >-
        При обнаружении недостатка платных образовательных услуг, в том числе оказания их не в полном объеме,
        предусмотренном образовательными программами (частью образовательной программы), заказчик вправе
        по своему выбору потребовать:
    - doc: pp-rf-1441
      anchor: pril-1-p-18
      quote: >-
        возмещения понесенных им расходов по устранению недостатков оказанных платных образовательных услуг
        своими силами или третьими лицами
  revision: 1
  checked: '2026-11-19'

- id: R-platnye-uslugi-004
  type: multiple
  difficulty: 3
  situation: >-
    Школа ведёт платные кружки по дополнительным общеразвивающим программам. Заместитель директора принёс
    список договоров, которые он предлагает расторгнуть в одностороннем порядке по инициативе школы,
    и по каждому назвал причину.
  question: По каким из этих причин школа вправе расторгнуть договор в одностороннем порядке? Отметьте все верные варианты.
  options:
    - text: Родители третий месяц не вносят плату за кружок
      correct: true
      why: Просрочка оплаты стоимости платных образовательных услуг названа в подпункте «г» пункта 22 Правил.
    - text: Ученик плохо усваивает программу кружка и не выполняет учебный план
      correct: false
      why: >-
        Невыполнение обязанностей по освоению программы и учебного плана названо основанием для обучающихся
        по профессиональным образовательным программам. Кружок идёт по общеразвивающей программе.
    - text: Шестнадцатилетнего ученика отчислили из школы в порядке дисциплинарного взыскания
      correct: true
      why: >-
        Отчисление как мера дисциплинарного взыскания, применённая к обучающемуся, достигшему 15 лет,
        названо в подпункте «а» пункта 22 Правил.
    - text: Родители отказались от дополнительного платного модуля, который школа предложила к кружку
      correct: false
      why: >-
        Такого основания в пункте 22 Правил нет. Отказ от дополнительных услуг не может менять даже объём
        и условия услуг по прежнему договору.
    - text: Ученик своими действиями сделал надлежащее оказание услуг невозможным
      correct: true
      why: >-
        Невозможность надлежащего исполнения обязательств вследствие действий или бездействия обучающегося
        названа в подпункте «д» пункта 22 Правил.
  explanation: >-
    Пункт 22 Правил оказания платных образовательных услуг перечисляет случаи, когда исполнитель расторгает
    договор в одностороннем порядке. Среди них отчисление обучающегося, достигшего 15 лет, как дисциплинарное
    взыскание, просрочка оплаты и невозможность исполнения из-за действий обучающегося. Плохое освоение программы
    названо только для профессиональных образовательных программ, к кружку оно не относится. Отказа от новых
    платных услуг в перечне нет.
  refs:
    - doc: pp-rf-1441
      anchor: pril-1-p-22
      quote: >-
        применение к обучающемуся, достигшему возраста 15 лет, отчисления как меры дисциплинарного взыскания
    - doc: pp-rf-1441
      anchor: pril-1-p-22
      quote: >-
        невыполнение обучающимся по профессиональной образовательной программе обязанностей по добросовестному
        освоению такой образовательной программы и выполнению учебного плана
    - doc: pp-rf-1441
      anchor: pril-1-p-22
      quote: >-
        невозможность надлежащего исполнения обязательств по оказанию платных образовательных услуг вследствие
        действий (бездействия) обучающегося
    - doc: pp-rf-1441
      anchor: pril-1-p-22
      quote: "г) просрочка оплаты стоимости платных образовательных услуг;"
  trap:
    kind: wording
    note: >-
      Невыполнение учебного плана в перечне есть, но только для профессиональных образовательных программ.
      Кружок по общеразвивающей программе под это основание не подпадает.
  revision: 1
  checked: '2026-11-19'

- id: R-platnye-uslugi-005
  type: single
  difficulty: 1
  situation: >-
    Третьеклассник по договору с родителями ходит в школе на платный курс английского языка. В январе школа
    предложила к курсу дополнительный платный разговорный клуб. Родители отказались. Руководитель курса
    предлагает директору сократить этому ученику число занятий по основному курсу, раз семья не взяла клуб.
  question: Как должен поступить директор? Выберите один вариант.
  options:
    - text: Оставить число занятий, но поднять плату до цены для тех, кто не берёт клуб
      correct: false
      why: >-
        Отказ от клуба не может быть причиной изменения условий прежнего договора, а цена входит в условия. К тому же стоимость после заключения договора повышать нельзя, кроме поправки на инфляцию.
    - text: Сократить занятия и пропорционально снизить плату за курс
      correct: false
      why: >-
        Снижение платы не делает сокращение законным: причиной изменения объёма услуг отказ от новых услуг
        быть не может.
    - text: Оставить занятия в прежнем объёме и на прежних условиях
      correct: true
      why: >-
        Отказ заказчика от дополнительных платных услуг не может быть причиной изменения объёма и условий
        услуг, которые ему уже оказывают по ранее заключённому договору.
    - text: Сократить занятия, если это разрешает локальный акт школы о платных услугах
      correct: false
      why: Локальный акт школы не может отменить запрет, установленный Правилами.
  explanation: >-
    Пункт 6 Правил оказания платных образовательных услуг защищает заказчика, который не хочет покупать
    новые услуги: его отказ не может быть причиной изменения объёма и условий услуг по ранее заключённому
    договору. Поэтому основной курс ученик продолжает посещать в прежнем объёме.
  refs:
    - doc: pp-rf-1441
      anchor: pril-1-p-6
      quote: >-
        не может быть причиной изменения объема и условий уже предоставляемых ему исполнителем образовательных
        услуг по ранее заключенному договору
    - doc: pp-rf-1441
      anchor: pril-1-p-9
      quote: Увеличение стоимости платных образовательных услуг после заключения договора не допускается
  revision: 1
  checked: '2026-11-19'

- id: R-platnye-uslugi-006
  type: single
  difficulty: 2
  situation: >-
    Директор школы хочет снизить стоимость платных кружков для детей из многодетных семей. Недостающую часть
    стоимости школа готова покрыть доходами от аренды. Заместитель говорит, что достаточно устного распоряжения
    бухгалтерии.
  question: Что нужно, чтобы снижение стоимости было оформлено по правилам? Выберите один вариант.
  options:
    - text: Получить согласие учредителя на каждый договор со сниженной стоимостью
      correct: false
      why: >-
        Правила такого согласия не требуют. Школа снижает стоимость сама, покрывая разницу собственными
        средствами.
    - text: Принять локальный акт об основаниях и порядке снижения и довести его до заказчиков и учеников
      correct: true
      why: >-
        Пункт 8 Правил требует, чтобы основания и порядок снижения стоимости были установлены локальным
        нормативным актом и доведены до сведения заказчика и обучающегося.
    - text: Ничего, снижать стоимость школа не вправе, цена должна быть одинаковой для всех заказчиков услуги
      correct: false
      why: >-
        Пункт 8 Правил прямо разрешает исполнителю снизить стоимость по договору, если недостающую часть
        он покроет собственными средствами.
    - text: Дождаться решения общего собрания родителей, которые платят полную стоимость
      correct: false
      why: Решения собрания родителей Правила не требуют, им нужен локальный нормативный акт школы.
  explanation: >-
    Пункт 8 Правил оказания платных образовательных услуг позволяет школе снизить стоимость услуг по договору,
    покрыв недостающую часть собственными средствами, в том числе доходами от приносящей доход деятельности.
    Условие одно: основания и порядок снижения устанавливают локальным нормативным актом и доводят до сведения
    заказчика и обучающегося. Устного распоряжения для этого мало.
  refs:
    - doc: pp-rf-1441
      anchor: pril-1-p-8
      quote: >-
        Основания и порядок снижения стоимости платных образовательных услуг устанавливаются локальным
        нормативным актом и доводятся до сведения заказчика и обучающегося.
  revision: 1
  checked: '2026-11-19'

- id: R-platnye-uslugi-007
  type: multiple
  difficulty: 2
  situation: >-
    Школа открывает платный кружок и готовит форму договора с родителями. Директор проверяет предложения
    заместителя по Правилам оказания платных образовательных услуг.
  question: Какие из предложений соответствуют Правилам? Отметьте все верные варианты.
  options:
    - text: Заключать договор в простой письменной форме
      correct: true
      why: Пункт 13 Правил требует заключать договор в простой письменной форме.
    - text: Указать в договоре полную стоимость услуг и порядок их оплаты
      correct: true
      why: Полная стоимость образовательных услуг и порядок их оплаты названы в подпункте «з» пункта 13 Правил.
    - text: Следить, чтобы сведения в договоре совпадали с информацией на сайте школы на дату его заключения
      correct: true
      why: >-
        Сведения в договоре должны соответствовать информации, размещённой на официальном сайте на дату
        заключения договора.
    - text: Включить условие, что заказчик не вправе требовать уменьшения стоимости, если школа провела не все занятия
      correct: false
      why: >-
        Право требовать соразмерного уменьшения стоимости даёт пункт 18 Правил. Условие, которое его отнимает, снижает гарантии и по пункту 14 не применяется, даже если включено в договор.
    - text: Заключать договор устно, если оплату подтверждает чек
      correct: false
      why: 'Устной формы Правила не допускают: договор заключается в простой письменной форме.'
  explanation: >-
    Пункт 13 Правил оказания платных образовательных услуг требует простой письменной формы договора
    и называет его обязательные сведения, среди них полную стоимость услуг и порядок оплаты. По пункту 16
    сведения договора должны соответствовать информации на сайте на дату заключения. Пункт 14 лишает силы
    условия, которые ограничивают права обучающихся или снижают их гарантии.
