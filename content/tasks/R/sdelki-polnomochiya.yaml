- id: R-sdelki-polnomochiya-001
  type: input
  difficulty: 1
  situation: >-
    Государственная бюджетная школа собирается купить оборудование для столовой. Директор проверяет,
    не окажется ли сделка крупной. Устав школы меньшего размера крупной сделки, чем в законе, не устанавливает.
  question: >-
    Сколько процентов балансовой стоимости активов школы должна превысить цена сделки, чтобы сделка считалась
    крупной? Ответ в процентах.
  answer: 10
  unit: '%'
  explanation: >-
    По пункту 13 статьи 9.2 закона о некоммерческих организациях крупной считается сделка бюджетного
    учреждения, цена которой превышает 10 процентов балансовой стоимости его активов по данным бухгалтерской
    отчётности на последнюю отчётную дату. Устав может установить меньший размер, но здесь он этого не делает.
  refs:
    - doc: fz-7
      anchor: st-9-2
      quote: >-
        превышает 10 процентов балансовой стоимости активов бюджетного учреждения, определяемой по данным
        его бухгалтерской отчетности на последнюю отчетную дату, если уставом бюджетного учреждения
        не предусмотрен меньший размер крупной сделки
  revision: 1
  checked: '2026-11-19'

- id: R-sdelki-polnomochiya-002
  type: single
  difficulty: 2
  situation: >-
    Директор государственной бюджетной школы заключил договор, который по закону считается крупной сделкой,
    и не получил предварительного согласия учредителя. Оборудование по договору оказалось негодным, школа
    понесла убытки. Ни школа, ни учредитель оспаривать сделку в суде не стали.
  question: Что из этого следует для директора? Выберите один вариант.
  options:
    - text: Он возместит убытки школе, если суд сначала признает сделку недействительной
      correct: false
      why: >-
        Закон прямо говорит, что руководитель отвечает независимо от того, признана ли сделка
        недействительной.
    - text: Он отвечает перед школой в размере причинённых ей убытков, хотя сделку никто не оспорил
      correct: true
      why: >-
        Руководитель бюджетного учреждения отвечает перед ним в размере убытков от крупной сделки,
        совершённой без согласия учредителя, и недействительность сделки для этого не нужна.
    - text: Он убытки не возмещает, по обязательствам из договора отвечает само учреждение
      correct: false
      why: >-
        Учреждение отвечает перед другой стороной договора. Перед самим учреждением за убытки от такой
        сделки отвечает его руководитель.
    - text: Он возместит убытки бюджету города, а не школе
      correct: false
      why: Закон называет ответственность руководителя перед бюджетным учреждением, а не перед бюджетом.
  explanation: >-
    Пункт 13 статьи 9.2 закона о некоммерческих организациях разрешает бюджетному учреждению совершать крупную
    сделку только с предварительного согласия учредителя. Если согласия не было, руководитель отвечает перед
    учреждением в размере убытков, причинённых сделкой, и это не зависит от того, признана ли сделка
    недействительной. Поэтому отсутствие иска о недействительности директора не защищает.
  refs:
    - doc: fz-7
      anchor: st-9-2
      quote: >-
        Руководитель бюджетного учреждения несет перед бюджетным учреждением ответственность в размере убытков,
        причиненных бюджетному учреждению в результате совершения крупной сделки с нарушением требований
        абзаца первого настоящего пункта, независимо от того, была ли эта сделка признана недействительной.
  revision: 1
  checked: '2026-11-19'

- id: R-sdelki-polnomochiya-003
  type: multiple
  difficulty: 3
  situation: >-
    Государственная бюджетная школа выбирает подрядчика для обслуживания компьютерных классов. Одна из фирм
    принадлежит в том числе заместителю директора школы: он её участник. Директор считает предложение этой
    фирмы лучшим и готов подписать договор.
  question: Что из этого верно? Отметьте все верные варианты.
  options:
    - text: Заместитель обязан сообщить о своей заинтересованности учредителю до решения о заключении сделки
      correct: true
      why: >-
        Заместитель руководителя, который участвует в организации-поставщике, признаётся заинтересованным
        лицом. В бюджетном учреждении о заинтересованности сообщают органу учредителя.
    - text: Заместителю достаточно сообщить о заинтересованности директору школы
      correct: false
      why: >-
        Для бюджетного учреждения закон называет адресата прямо: орган, который осуществляет функции
        и полномочия учредителя. Директор его не заменяет.
    - text: Сделку должен одобрить учредитель школы
      correct: true
      why: Сделку с заинтересованностью в бюджетном учреждении одобряет орган учредителя.
    - text: Сделку без одобрения суд может признать недействительной
      correct: true
      why: >-
        Сделка с заинтересованностью, совершённая с нарушением этих требований, может быть признана судом
        недействительной.
    - text: Сделка без одобрения ничтожна с момента заключения, решение суда для этого не нужно
      correct: false
      why: >-
        Закон говорит, что такая сделка может быть признана недействительной судом. Сама по себе, без решения
        суда, она недействительной не становится.
  explanation: >-
    Статья 27 закона о некоммерческих организациях относит к заинтересованным лицам руководителя и его
    заместителя, если они участники организации, которая поставляет учреждению товары или услуги.
    Заинтересованное лицо сообщает об этом до решения о сделке, а сама сделка требует одобрения. В бюджетном
    учреждении и то и другое адресовано органу учредителя. Сделку, совершённую с нарушением, суд может
    признать недействительной.
  refs:
    - doc: fz-7
      anchor: st-27
      quote: >-
        если указанные лица состоят с этими организациями или гражданами в трудовых отношениях, являются
        участниками, кредиторами этих организаций
    - doc: fz-7
      anchor: st-27
      quote: >-
        оно обязано сообщить о своей заинтересованности органу управления некоммерческой организацией
        или органу надзора за ее деятельностью до момента принятия решения о заключении сделки (в бюджетном
        учреждении - соответствующему органу, осуществляющему функции и полномочия учредителя)
    - doc: fz-7
      anchor: st-27
      quote: >-
        сделка должна быть одобрена органом управления некоммерческой организацией или органом надзора
        за ее деятельностью (в бюджетном учреждении - соответствующим органом, осуществляющим функции
        и полномочия учредителя)
    - doc: fz-7
      anchor: st-27
      quote: >-
        Сделка, в совершении которой имеется заинтересованность и которая совершена с нарушением требований
        настоящей статьи, если иное не предусмотрено настоящим Федеральным законом, может быть признана судом
        недействительной.
  revision: 1
  checked: '2026-11-19'

- id: R-sdelki-polnomochiya-004
  type: single
  difficulty: 2
  situation: >-
    Директор школы 10 марта 2025 года выдал заместителю доверенность на подписание актов приёмки товаров.
    Дата выдачи в доверенности стоит, а срок действия не указан. Доверенность директор не отменял.
    20 апреля 2026 года заместитель подписал по ней акт приёмки мебели.
  question: Действовала ли доверенность в день подписания акта? Выберите один вариант.
  options:
    - text: Действовала, доверенность без срока сохраняет силу до отмены
      correct: false
      why: >-
        До отмены сохраняет силу только нотариальная доверенность для действий за границей.
        Для обычной доверенности без срока правило другое.
    - text: Действовала, доверенность без срока сохраняет силу три года
      correct: false
      why: Три года в статье 186 Гражданского кодекса не названы. Срок для доверенности без указания срока короче.
    - text: Не действовала, доверенность без срока сохраняет силу год со дня совершения
      correct: true
      why: >-
        Если срок в доверенности не указан, она сохраняет силу в течение года со дня её совершения.
        Год истёк 10 марта 2026 года.
    - text: Не действовала с самого начала, доверенность без срока ничтожна
      correct: false
      why: >-
        Ничтожна доверенность, в которой нет даты её совершения. Отсутствие срока её не порочит,
        а только ограничивает действие.
  explanation: >-
    По пункту 1 статьи 186 Гражданского кодекса доверенность, в которой не указан срок действия, сохраняет
    силу в течение года со дня её совершения. Доверенность выдана 10 марта 2025 года, значит, к 20 апреля
    2026 года она уже не действовала. Ничтожной была бы доверенность без даты совершения, но дата здесь стоит.
  refs:
    - doc: gk-rf
      anchor: st-186
      quote: >-
        Если в доверенности не указан срок ее действия, она сохраняет силу в течение года со дня
        ее совершения.
    - doc: gk-rf
      anchor: st-186
      quote: Доверенность, в которой не указана дата ее совершения, ничтожна.
    - doc: gk-rf
      anchor: st-186
      quote: >-
        Удостоверенная нотариусом доверенность, предназначенная для совершения действий за границей
        и не содержащая указание о сроке ее действия, сохраняет силу до ее отмены лицом, выдавшим доверенность.
  trap:
    kind: wording
    note: >-
      В доверенности нет срока, но есть дата. Ничтожной её делает отсутствие даты, а отсутствие срока
      только ограничивает действие годом.
  revision: 1
  checked: '2026-11-19'

- id: R-sdelki-polnomochiya-005
  type: multiple
  difficulty: 2
  situation: >-
    Новый директор школы спрашивает юриста, чем он рискует лично, если своими решениями причинит школе
    ущерб или убытки. Юрист перечисляет правила Трудового и Гражданского кодексов.
  question: Какие из утверждений юриста верны? Отметьте все верные варианты.
  options:
    - text: Как и остальные работники, директор отвечает за ущерб в пределах среднего месячного заработка
      correct: false
      why: >-
        Для руководителя организации статья 277 Трудового кодекса устанавливает полную материальную
        ответственность за прямой действительный ущерб.
    - text: За прямой действительный ущерб школе директор несёт полную материальную ответственность
      correct: true
      why: Так сказано в части первой статьи 277 Трудового кодекса.
    - text: Убытки с него взыщут, если будет доказано, что он действовал недобросовестно или неразумно
      correct: true
      why: >-
        Статья 53.1 Гражданского кодекса возлагает на лицо, выступающее от имени юридического лица,
        ответственность, если доказано, что оно действовало недобросовестно или неразумно.
    - text: Требовать возмещения убытков может сама школа, учредитель такого права не имеет
      correct: false
      why: >-
        Убытки возмещаются по требованию юридического лица или его учредителей, которые выступают
        в интересах юридического лица.
    - text: Соглашение, которое снимает с него ответственность за недобросовестные действия, ничтожно
      correct: true
      why: >-
        Пункт 5 статьи 53.1 Гражданского кодекса называет ничтожным соглашение об устранении или ограничении
        ответственности за совершение недобросовестных действий.
  explanation: >-
    Статья 277 Трудового кодекса возлагает на руководителя полную материальную ответственность за прямой
    действительный ущерб организации. По статье 53.1 Гражданского кодекса он возмещает убытки по требованию
    юридического лица или его учредителей, если доказано, что он действовал недобросовестно или неразумно.
    Договориться об освобождении от ответственности за недобросовестные действия нельзя: такое соглашение
    ничтожно.
  refs:
    - doc: tk-rf
      anchor: st-277
      quote: >-
        Руководитель организации несет полную материальную ответственность за прямой действительный ущерб,
        причиненный организации.
    - doc: gk-rf
      anchor: st-53-1
      quote: >-
        обязано возместить по требованию юридического лица, его учредителей (участников), выступающих
        в интересах юридического лица, убытки, причиненные по его вине юридическому лицу
    - doc: gk-rf
      anchor: st-53-1
      quote: >-
        несет ответственность, если будет доказано, что при осуществлении своих прав и исполнении своих
        обязанностей оно действовало недобросовестно или неразумно
    - doc: gk-rf
      anchor: st-53-1
      quote: >-
        Соглашение об устранении или ограничении ответственности лиц, указанных в пунктах 1 и 2 настоящей
        статьи, за совершение недобросовестных действий
  revision: 1
  checked: '2026-11-19'

- id: R-sdelki-polnomochiya-006
  type: single
  difficulty: 2
  situation: >-
    Государственная бюджетная школа продала фирме списанное оборудование. Сделка была крупной, а предварительного
    согласия учредителя директор не получил. Учредитель подал иск о признании сделки недействительной. В суде
    не удалось доказать, что фирма знала или должна была знать об отсутствии согласия.
  question: Какое решение примет суд? Выберите один вариант.
  options:
    - text: Признает сделку недействительной, потому что согласия учредителя не было
      correct: false
      why: >-
        Одного отсутствия согласия мало. Нужно ещё доказать, что другая сторона знала или должна была
        знать о нём.
    - text: Откажет в иске, потому что оспаривать такую сделку вправе школа, но не учредитель
      correct: false
      why: Иск о признании такой сделки недействительной может подать и учреждение, и его учредитель.
    - text: Прекратит дело, потому что сделка без согласия ничтожна и без решения суда
      correct: false
      why: >-
        Закон говорит, что такая сделка может быть признана недействительной по иску. Значит, она оспорима,
        а не ничтожна.
    - text: Откажет в иске, потому что осведомлённость фирмы об отсутствии согласия не доказана
      correct: true
      why: >-
        Крупную сделку без согласия учредителя признают недействительной, если доказано, что другая сторона
        знала или должна была знать об отсутствии согласия. Здесь это не доказано.
  explanation: >-
    По пункту 13 статьи 9.2 закона о некоммерческих организациях крупная сделка бюджетного учреждения
    без предварительного согласия учредителя может быть признана недействительной по иску учреждения или
    учредителя. Условие: доказано, что другая сторона знала или должна была знать об отсутствии согласия.
    Раз это не доказано, суд в иске откажет.
  refs:
    - doc: fz-7
      anchor: st-9-2
      quote: >-
        может быть признана недействительной по иску бюджетного учреждения или его учредителя, если будет
        доказано, что другая сторона в сделке знала или должна была знать об отсутствии предварительного
        согласия учредителя бюджетного учреждения
  revision: 1
  checked: '2026-11-19'
