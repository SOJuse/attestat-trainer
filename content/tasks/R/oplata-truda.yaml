- id: R-oplata-truda-001
  type: matching
  difficulty: 3
  situation: >-
    В школу пришёл новый бухгалтер-расчётчик. В ближайший месяц учитель уходит в отпуск, лаборант хочет получать
    зарплату в другом банке, у завхоза закрылся электронный больничный, а директор обновляет правила внутреннего
    трудового распорядка. Бухгалтер составляет таблицу предельных сроков и для каждого отмечает, от какого события
    идёт отсчёт.
  question: Сопоставьте каждое действие с предельным сроком, который установлен законом.
  pairs:
    - left: Оплата отпуска учителю (отсчёт до первого дня отпуска)
      right: Не позднее чем за 3 дня
    - left: Письменное сообщение лаборанта о новом банке (отсчёт до дня выплаты зарплаты)
      right: Не позднее чем за 15 календарных дней
    - left: День выплаты зарплаты в правилах распорядка (отсчёт от окончания периода, за который она начислена)
      right: Не позднее 15 календарных дней
    - left: Передача школой в Социальный фонд сведений о закрытом электронном больничном (отсчёт от получения данных о нём)
      right: Не позднее 3 рабочих дней
    - left: Назначение и выплата пособия Социальным фондом (отсчёт от получения сведений от школы)
      right: Не позднее 10 рабочих дней
  explanation: >-
    Сроки по зарплате и отпуску задаёт статья 136 ТК РФ: отпуск оплачивают не позднее чем за три дня до его начала,
    о смене банка работник сообщает не позднее чем за 15 календарных дней до дня выплаты, а день выплаты в правилах
    распорядка ставят не позднее 15 календарных дней после окончания периода. Сведения о закрытом электронном
    больничном школа передаёт страховщику не позднее трёх рабочих дней со дня получения данных (часть 8 статьи 13
    Закона № 255-ФЗ). Социальный фонд назначает и выплачивает пособие в срок не более 10 рабочих дней со дня
    получения сведений (часть 1 статьи 15).
  refs:
    - doc: tk-rf
      anchor: st-136
      quote: Оплата отпуска производится не позднее чем за три дня до его начала.
    - doc: tk-rf
      anchor: st-136
      quote: >-
        сообщив в письменной форме работодателю об изменении реквизитов для перевода заработной платы не позднее чем
        за пятнадцать календарных дней до дня выплаты заработной платы
    - doc: tk-rf
      anchor: st-136
      quote: >-
        Конкретная дата выплаты заработной платы устанавливается правилами внутреннего трудового распорядка,
        коллективным договором или трудовым договором не позднее 15 календарных дней со дня окончания периода,
        за который она начислена.
    - doc: fz-255
      anchor: st-13
      quote: >-
        Страхователи не позднее трех рабочих дней со дня получения данных о закрытом листке нетрудоспособности,
        сформированном в форме электронного документа, передают в информационную систему страховщика
    - doc: fz-255
      anchor: st-15
      quote: >-
        Страховщик назначает и выплачивает пособия по временной нетрудоспособности, по беременности и родам,
        ежемесячное пособие по уходу за ребенком в срок, не превышающий 10 рабочих дней со дня представления
        страхователем или застрахованным лицом сведений и документов
  trap:
    kind: wording
    note: >-
      Срок «за 15 календарных дней до» и срок «не позднее 15 календарных дней после» различаются только направлением
      отсчёта, а «за три дня» до отпуска легко спутать с тремя рабочими днями на передачу сведений о больничном.
  revision: 1
  checked: '2026-11-16'
