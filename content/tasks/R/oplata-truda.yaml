- id: R-oplata-truda-001
  type: matching
  difficulty: 3
  situation: >-
    В школу пришёл новый бухгалтер-расчётчик. В ближайший месяц учитель уходит в отпуск, лаборант хочет получать
    зарплату в другом банке, у завхоза закрылся электронный больничный, а директор обновляет правила внутреннего
    трудового распорядка. Бухгалтер составляет таблицу предельных сроков и для каждого отмечает, от какого события
    идёт отсчёт.
  question: Сопоставьте каждое действие с предельным сроком, который установлен законом.
  pairs:
    - left: Оплата отпуска учителю (отсчёт до первого дня отпуска)
      right: Не позднее чем за 3 дня
    - left: Письменное сообщение лаборанта о новом банке (отсчёт до дня выплаты зарплаты)
      right: Не позднее чем за 15 календарных дней
    - left: День выплаты зарплаты в правилах распорядка (отсчёт от окончания периода, за который она начислена)
      right: Не позднее 15 календарных дней
    - left: Передача школой в Социальный фонд сведений о закрытом электронном больничном (отсчёт от получения данных о нём)
      right: Не позднее 3 рабочих дней
    - left: Назначение и выплата пособия Социальным фондом (отсчёт от получения сведений от школы)
      right: Не позднее 10 рабочих дней
  explanation: >-
    Сроки по зарплате и отпуску задаёт статья 136 ТК РФ: отпуск оплачивают не позднее чем за три дня до его начала,
    о смене банка работник сообщает не позднее чем за 15 календарных дней до дня выплаты, а день выплаты в правилах
    распорядка ставят не позднее 15 календарных дней после окончания периода. Сведения о закрытом электронном
    больничном школа передаёт страховщику не позднее трёх рабочих дней со дня получения данных (часть 8 статьи 13
    Закона № 255-ФЗ). Социальный фонд назначает и выплачивает пособие в срок не более 10 рабочих дней со дня
    получения сведений (часть 1 статьи 15).
  refs:
    - doc: tk-rf
      anchor: st-136
      quote: Оплата отпуска производится не позднее чем за три дня до его начала.
    - doc: tk-rf
      anchor: st-136
      quote: >-
        сообщив в письменной форме работодателю об изменении реквизитов для перевода заработной платы не позднее чем
        за пятнадцать календарных дней до дня выплаты заработной платы
    - doc: tk-rf
      anchor: st-136
      quote: >-
        Конкретная дата выплаты заработной платы устанавливается правилами внутреннего трудового распорядка,
        коллективным договором или трудовым договором не позднее 15 календарных дней со дня окончания периода,
        за который она начислена.
    - doc: fz-255
      anchor: st-13
      quote: >-
        Страхователи не позднее трех рабочих дней со дня получения данных о закрытом листке нетрудоспособности,
        сформированном в форме электронного документа, передают в информационную систему страховщика
    - doc: fz-255
      anchor: st-15
      quote: >-
        Страховщик назначает и выплачивает пособия по временной нетрудоспособности, по беременности и родам,
        ежемесячное пособие по уходу за ребенком в срок, не превышающий 10 рабочих дней со дня представления
        страхователем или застрахованным лицом сведений и документов
  trap:
    kind: wording
    note: >-
      Срок «за 15 календарных дней до» и срок «не позднее 15 календарных дней после» различаются только направлением
      отсчёта, а «за три дня» до отпуска легко спутать с тремя рабочими днями на передачу сведений о больничном.
  revision: 1
  checked: '2026-11-16'

- id: R-oplata-truda-002
  type: multiple
  difficulty: 2
  situation: >-
    Директор государственной школы пересматривает положение об оплате труда и трудовые договоры. Заместитель
    по экономике принёс список предложений, и директор проверяет каждое по Трудовому кодексу.
  question: Какие утверждения верны? Отметьте все верные варианты.
  options:
    - text: Систему премирования устанавливают коллективным договором, соглашениями или локальными нормативными актами
      correct: true
      why: >-
        Системы оплаты труда, включая системы премирования, устанавливаются коллективными договорами,
        соглашениями, локальными нормативными актами.
    - text: Локальный акт о системе оплаты труда директор принимает с учётом мнения представительного органа работников
      correct: true
      why: Так требует часть пятая статьи 135 Трудового кодекса.
    - text: С согласия учителя в его трудовом договоре можно записать условия оплаты хуже, чем в положении об оплате труда
      correct: false
      why: >-
        Условия оплаты труда по трудовому договору не могут быть ухудшены по сравнению с локальными
        нормативными актами. Согласие работника этого не меняет.
    - text: Размер доплаты за совмещение должностей устанавливают по соглашению сторон трудового договора
      correct: true
      why: >-
        Статья 151 Трудового кодекса оставляет размер доплаты соглашению сторон с учётом содержания
        и объёма дополнительной работы.
    - text: Размер доплаты за совмещение должностей директор определяет приказом без согласования с работником
      correct: false
      why: Размер доплаты устанавливается по соглашению сторон, а не решением одного работодателя.
  explanation: >-
    Статья 135 Трудового кодекса относит системы оплаты труда и премирования к коллективным договорам,
    соглашениям и локальным нормативным актам, причём локальные акты принимают с учётом мнения представительного
    органа работников. Трудовой договор не может ухудшать условия оплаты по сравнению с ними. Доплату
    за совмещение по статье 151 стороны определяют соглашением.
  refs:
    - doc: tk-rf
      anchor: st-135
      quote: >-
        системы доплат и надбавок стимулирующего характера и системы премирования, устанавливаются коллективными
        договорами, соглашениями, локальными нормативными актами
    - doc: tk-rf
      anchor: st-135
      quote: >-
        Локальные нормативные акты, устанавливающие системы оплаты труда, принимаются работодателем с учетом
        мнения представительного органа работников.
    - doc: tk-rf
      anchor: st-135
      quote: >-
        Условия оплаты труда, определенные трудовым договором, не могут быть ухудшены по сравнению с установленными
        трудовым законодательством и иными нормативными правовыми актами, содержащими нормы трудового права,
        коллективным договором, соглашениями, локальными нормативными актами.
    - doc: tk-rf
      anchor: st-151
      quote: >-
        Размер доплаты устанавливается по соглашению сторон трудового договора с учетом содержания и (или) объема
        дополнительной работы
  revision: 1
  checked: '2026-11-19'

- id: R-oplata-truda-003
  type: single
  difficulty: 2
  situation: >-
    Учредитель запросил у государственной школы расчёт соотношения среднемесячной зарплаты директора
    и среднемесячной зарплаты работников школы за календарный год. Бухгалтер спрашивает директора, чью
    зарплату включать в расчёт средней зарплаты работников.
  question: Как посчитать среднемесячную зарплату работников для этого соотношения? Выберите один вариант.
  options:
    - text: По всем работникам школы, включая директора, всех его заместителей и главного бухгалтера
      correct: false
      why: >-
        Статья 145 Трудового кодекса прямо исключает из расчёта зарплату руководителя, его заместителей
        и главного бухгалтера.
    - text: По всем работникам школы, кроме директора
      correct: false
      why: Кроме руководителя, из расчёта исключают его заместителей и главного бухгалтера.
    - text: По всем работникам школы, кроме директора, его заместителей и главного бухгалтера
      correct: true
      why: >-
        Среднемесячную зарплату работников считают без учёта зарплаты соответствующего руководителя,
        его заместителей и главного бухгалтера.
    - text: По педагогическим работникам школы, остальных в расчёт не берут
      correct: false
      why: >-
        Статья 145 говорит о работниках учреждения, а не только о педагогах. Исключены трое: руководитель,
        его заместители и главный бухгалтер.
  explanation: >-
    Часть вторая статьи 145 Трудового кодекса вводит предельный уровень соотношения среднемесячной зарплаты
    руководителя, его заместителей и главного бухгалтера государственного учреждения и среднемесячной зарплаты
    работников. Зарплату работников для этого считают без учёта зарплаты руководителя, заместителей и главного
    бухгалтера.
  refs:
    - doc: tk-rf
      anchor: st-145
      quote: >-
        формируемой за счет всех источников финансового обеспечения и рассчитываемой за календарный год,
        и среднемесячной заработной платы работников таких фондов, учреждений, предприятий (без учета заработной
        платы соответствующего руководителя, его заместителей, главного бухгалтера)
  revision: 1
  checked: '2026-11-19'

- id: R-oplata-truda-004
  type: multiple
  difficulty: 1
  situation: >-
    В проекте трудового договора с лаборантом кадровик записал: «Должностной оклад 30 000 рублей в месяц,
    в оклад включены надбавка за вредные условия труда и ежемесячная премия». Директор сверяет формулировку
    с Трудовым кодексом.
  question: Что из этого верно об окладе? Отметьте все верные варианты.
  options:
    - text: Оклад определяют без учёта компенсационных и стимулирующих выплат
      correct: true
      why: >-
        Оклад по статье 129 Трудового кодекса есть фиксированный размер оплаты труда за календарный месяц
        без учёта компенсационных, стимулирующих и социальных выплат.
    - text: Оклад устанавливают за календарный месяц
      correct: true
      why: Оклад закон определяет как фиксированный размер оплаты труда за календарный месяц.
    - text: Оклад и есть вся заработная плата работника за месяц
      correct: false
      why: >-
        Заработная плата шире оклада: кроме вознаграждения за труд, в неё входят компенсационные
        и стимулирующие выплаты.
    - text: В оклад можно включить премию, но не надбавку за вредные условия труда
      correct: false
      why: Премия относится к стимулирующим выплатам, а оклад определяют без учёта и их тоже.
  explanation: >-
    Статья 129 Трудового кодекса определяет оклад как фиксированный размер оплаты труда за исполнение
    должностных обязанностей за календарный месяц без учёта компенсационных, стимулирующих и социальных выплат.
    Надбавка за вредные условия относится к компенсационным выплатам, премия к стимулирующим. В договоре
    их называют отдельно от оклада.
  refs:
    - doc: tk-rf
      anchor: st-129
      quote: >-
        Оклад (должностной оклад) - фиксированный размер оплаты труда работника за исполнение трудовых
        (должностных) обязанностей определенной сложности за календарный месяц без учета компенсационных,
        стимулирующих и социальных выплат.
  revision: 1
  checked: '2026-11-19'

- id: R-oplata-truda-005
  type: single
  difficulty: 2
  situation: >-
    Учитель был на больничном. Бухгалтер школы по ошибке передал в Социальный фонд завышенные сведения
    о его заработке, и фонд выплатил учителю пособие больше положенного. Сам учитель никаких сведений
    не подавал и об ошибке не знал.
  question: Кто по закону о социальном страховании возмещает фонду излишне выплаченную сумму? Выберите один вариант.
  options:
    - text: Учитель, потому что лишние деньги получил он
      correct: false
      why: >-
        Закон возлагает возмещение на страхователя, который представил недостоверные сведения. Учитель
        сведений не подавал.
    - text: Школа, потому что сведения представила она
      correct: true
      why: >-
        Страхователь обязан возмещать страховщику суммы излишне понесённых расходов на выплату страхового
        обеспечения, если представил недостоверные или неполные сведения.
    - text: Никто, счётная ошибка относится к рискам самого фонда
      correct: false
      why: >-
        Ошибку допустил не фонд, а страхователь, представивший сведения. На этот случай закон прямо
        называет обязанность возместить расходы.
    - text: Бухгалтер школы лично, потому что ошибку допустил он
      correct: false
      why: >-
        Перед фондом отвечает страхователь, то есть школа. Бухгалтер может отвечать перед школой
        по правилам трудового права, но это другой вопрос.
  explanation: >-
    Пункт 6.1 части 2 статьи 4.1 закона об обязательном социальном страховании обязывает страхователя
    возмещать страховщику излишне понесённые расходы на выплату страхового обеспечения, если страхователь
    представил недостоверные или неполные сведения. Страхователь здесь школа, поэтому возмещает она.
  refs:
    - doc: fz-255
      anchor: st-4-1
      quote: >-
        возмещать страховщику суммы излишне понесенных им расходов на выплату страхового обеспечения
        застрахованным лицам в случае, если страхователем представлены недостоверные и (или) неполные сведения
  revision: 1
  checked: '2026-11-19'
