- id: P-prava-i-distsiplina-001
  type: sequence
  difficulty: 2
  situation: >-
    Девятикласснику 15 лет, основного общего образования у него пока нет. С сентября он несколько раз грубо
    нарушил правила внутреннего распорядка и срывает уроки одноклассникам. Взысканий к нему ещё не применяли.
    Директор допускает, что дело может дойти до отчисления, и заранее выстраивает порядок действий.
  question: Расположите шаги в том порядке, которого требует закон.
  items:
    - Применить замечание или выговор и меры педагогического воздействия
    - Учесть мнение родителей и получить согласие КДН на отчисление
    - Издать приказ об отчислении как мере дисциплинарного взыскания
    - Сразу сообщить об отчислении в орган управления образованием
    - Органу управления и родителям в течение месяца устроить подростка на учёбу
  explanation: >-
    Статья 43 разрешает отчислить несовершеннолетнего, достигшего 15 лет, за неоднократные проступки только
    тогда, когда другие взыскания и меры педагогического воздействия не дали результата. Основного общего
    образования у ученика нет, поэтому решение принимают с учётом мнения родителей и с согласия КДН.
    После приказа школа незамедлительно сообщает об отчислении в орган управления образованием, а он вместе
    с родителями не позднее чем через месяц принимает меры, чтобы подросток продолжил учиться.
  refs:
    - doc: fz-273
      anchor: st-43
      quote: Отчисление несовершеннолетнего обучающегося применяется, если иные меры дисциплинарного взыскания и меры педагогического воздействия не дали результата
    - doc: fz-273
      anchor: st-43
      quote: принимается с учетом мнения его родителей (законных представителей) и с согласия комиссии по делам несовершеннолетних и защите их прав
    - doc: fz-273
      anchor: st-43
      quote: незамедлительно обязана проинформировать об отчислении несовершеннолетнего обучающегося в качестве меры дисциплинарного взыскания орган местного самоуправления, осуществляющий управление в сфере образования
    - doc: fz-273
      anchor: st-43
      quote: не позднее чем в месячный срок принимают меры, обеспечивающие получение несовершеннолетним обучающимся общего образования
  revision: 1
  checked: '2026-11-16'
