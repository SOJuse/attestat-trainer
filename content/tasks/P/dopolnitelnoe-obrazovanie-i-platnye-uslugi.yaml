- id: P-dopolnitelnoe-obrazovanie-i-platnye-uslugi-001
  type: multiple
  difficulty: 2
  situation: >-
    Школа ведёт платный кружок робототехники по дополнительной общеразвивающей программе для учеников
    с пятого по седьмой класс. В договорах с родителями основания расторжения записаны так же, как в Правилах
    оказания платных образовательных услуг. К декабрю у руководителя кружка накопилось несколько проблем
    с разными семьями, и он просит директора разорвать с ними договоры.
  question: В каких случаях школа вправе расторгнуть договор в одностороннем порядке? Отметьте все верные варианты.
  options:
    - text: Родители шестиклассника второй месяц не вносят плату по договору
      correct: true
      why: Просрочка оплаты прямо названа в Правилах среди оснований, по которым исполнитель сам расторгает договор.
    - text: Семиклассник так срывает занятия, что заниматься с ним по программе невозможно
      correct: true
      why: Если надлежащее исполнение договора стало невозможным из-за действий самого ученика, исполнитель вправе договор расторгнуть.
    - text: Шестиклассник ходит на все занятия, но плохо осваивает программу кружка
      correct: false
      why: Невыполнение обязанностей по освоению программы даёт такое право только на профессиональных программах, а кружок общеразвивающий.
    - text: Родители отказались от второго платного курса, который предложила школа
      correct: false
      why: Отказ от дополнительно предложенной услуги не может менять объём и условия услуг по уже заключённому договору.
    - text: Семикласснику объявили выговор за грубость руководителю кружка
      correct: false
      why: Из дисциплинарных мер основанием служит только отчисление ученика, достигшего 15 лет, а выговор договор не прекращает.
  explanation: >-
    Случаи, когда исполнитель может сам расторгнуть договор, перечислены в пункте 22 Правил оказания платных
    образовательных услуг. Для кружка по общеразвивающей программе подходят два из них: просрочка оплаты
    и невозможность исполнить договор из-за действий ученика. Невыполнение учебного плана служит основанием
    только на профессиональных программах, а из дисциплинарных мер в перечне есть лишь отчисление ученика,
    достигшего 15 лет.
  refs:
    - doc: pp-rf-1441
      anchor: pril-1-p-22
      quote: просрочка оплаты стоимости платных образовательных услуг; д) невозможность надлежащего исполнения обязательств по оказанию платных образовательных услуг вследствие действий (бездействия) обучающегося
    - doc: pp-rf-1441
      anchor: pril-1-p-22
      quote: применение к обучающемуся, достигшему возраста 15 лет, отчисления как меры дисциплинарного взыскания; б) невыполнение обучающимся по профессиональной образовательной программе обязанностей по добросовестному освоению такой образовательной программы
    - doc: pp-rf-1441
      anchor: pril-1-p-6
      quote: Отказ заказчика от предлагаемых ему исполнителем дополнительных платных образовательных услуг, не предусмотренных в ранее заключенном сторонами договором, не может быть причиной изменения объема и условий
  trap:
    kind: wording
    note: Основание о невыполнении обязанностей по освоению программы относится только к профессиональным программам, а кружок ведётся по общеразвивающей.
