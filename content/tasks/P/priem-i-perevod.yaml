- id: P-priem-i-perevod-001
  type: single
  difficulty: 1
  situation: >-
    В конце августа в московскую государственную школу пришла мама одиннадцатилетнего мальчика. Семья с российским
    гражданством переехала из другого региона и живёт в районе, за которым эта школа не закреплена. Сын должен пойти в пятый класс,
    в обычных пятых классах школы есть свободные места. Заместитель директора предлагает отказать, потому что
    школа в первую очередь для детей со своей территории.
  question: Как должна поступить школа? Выберите один вариант.
  options:
    - text: "Принять: пока в школе есть свободные места, отказать она не вправе"
      correct: true
      why: "Свободные места есть, у мальчика российское гражданство, класс обычный: других оснований для отказа закон не даёт."
    - text: "Отказать: школа обязана принимать только детей с закреплённой за ней территории"
      correct: false
      why: Закреплённая территория гарантирует приём детям, которые на ней живут, но не даёт права отказывать остальным при свободных местах.
    - text: "Отказать: сначала семья должна получить направление в управлении образования"
      correct: false
      why: По направлению органа управления принимают в дошкольные группы, а в школьный класс родители обращаются туда, только когда мест нет.
    - text: "Принять, если ребёнок пройдёт индивидуальный отбор по основным предметам"
      correct: false
      why: Индивидуальный отбор допускается для углублённого изучения предметов или профильного обучения по закону субъекта, а класс здесь обычный.
    - text: "Принять только с разрешения учредителя: семья живёт вне закреплённой территории"
      correct: false
      why: Разрешение учредителя закон связывает с приёмом в первый класс раньше или позже установленного возраста, а не с местом жительства.
  explanation: >-
    По части 4 статьи 67 отказать в приёме в государственную школу можно, только если нет свободных мест
    или иностранный гражданин не выполнил условия приёма из статьи 78. Индивидуальный отбор и конкурс
    по частям 5 и 6 здесь ни при чём: класс обычный. Закреплённая территория
    обязывает школу принять детей, которые на ней живут, но не позволяет отказывать остальным. У мальчика российское
    гражданство, места в пятом классе есть, значит, его нужно принять.
  refs:
    - doc: fz-273
      anchor: st-67
      quote: В приеме в государственную или муниципальную образовательную организацию может быть отказано только по причине отсутствия в ней свободных мест
    - doc: fz-273
      anchor: st-67
      quote: должны обеспечивать также прием в образовательную организацию граждан, имеющих право на получение общего образования соответствующего уровня и проживающих на территории, за которой закреплена указанная образовательная организация
  revision: 1
  checked: '2026-11-16'
