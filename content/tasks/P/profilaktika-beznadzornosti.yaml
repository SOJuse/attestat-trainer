- id: P-profilaktika-beznadzornosti-001
  type: matching
  difficulty: 3
  situation: >-
    Осенью в школе проходит социально-психологическое тестирование для раннего выявления потребления наркотиков.
    Одновременно комиссия по делам несовершеннолетних решает вопрос о наставнике для восьмиклассника 14 лет,
    который совершил правонарушение до возраста, с которого наступает административная ответственность.
    Социальный педагог составляет памятку для классных
    руководителей: чьё согласие нужно в каждом случае.
  question: Сопоставьте случай и согласие, которое для него требуется по закону.
  pairs:
    - left: Тестирование восьмиклассника, которому 14 лет
      right: Согласие одного из родителей
    - left: Тестирование девятиклассника, которому уже 15 лет
      right: Согласие самого ученика
    - left: Назначение наставника восьмикласснику 14 лет
      right: Согласие ученика и его родителей
    - left: Посещение наставником этого восьмиклассника дома
      right: Согласие родителей или самого ученика
  explanation: >-
    Для тестирования решает возраст: ученик, достигший 15 лет, даёт письменное согласие сам, а за младшего
    письменное согласие даёт один из родителей. Наставничество регулирует статья 8.2 закона № 120-ФЗ:
    наставника назначает КДН с согласия и подростка, и его родителей. Для посещения подростка дома
    наставнику достаточно согласия родителей или согласия самого подростка, если ему исполнилось 14 лет.
  refs:
    - doc: fz-120-n16
      anchor: st-53-4
      quote: проводится при наличии информированного согласия в письменной форме обучающихся, достигших возраста пятнадцати лет, либо информированного согласия в письменной форме одного из родителей или иного законного представителя обучающихся, не достигших возраста пятнадцати лет
    - doc: fz-120
      anchor: st-8-2
      quote: Назначение наставника и (или) организации, указанных в пункте 1 настоящей статьи, осуществляется комиссией по делам несовершеннолетних и защите их прав с согласия несовершеннолетнего и его родителей или иных законных представителей
    - doc: fz-120
      anchor: st-8-2
      quote: с согласия родителей или иных законных представителей несовершеннолетнего или с согласия несовершеннолетнего, достигшего возраста четырнадцати лет, посещать несовершеннолетнего по месту, где он постоянно или преимущественно проживает
  trap:
    kind: wording
    note: Пороги разные. Для тестирования ученик сам соглашается с 15 лет, для визитов наставника его согласия хватает с 14 лет. Назначение наставника требует согласия обоих, посещение дома требует согласия одного из них.
  revision: 1
  checked: '2026-11-16'
